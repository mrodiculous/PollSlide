/* Re-open the question for another go. Deliberately does NOT pre-fill the previous
 * answer: re-picking is the point, and a pre-filled form invites a stray tap that
 * re-submits the same answer and burns a try. */
async function startRetake() {
  answered = false;
  answerStartTime = Date.now();
  focusResetForQuestion();
  _wagerPick = 1; _wagerLocked = (GAME_MODE !== 'wager');
  await refreshModeState();
  showQuestion(questionData);
  if (LANG !== DECK_LANG) { try { await _syncTranslatedDom(); } catch (e) {} }
}

// ════════════════════════════════════════════════════════════════════════════
// SURVEY MODE — answer the whole set as one async form (SurveySlide).
// Responses write to the SAME per-question buckets as live polls
// (sessions/SESSION/responses/q{idx}_stable_SESSION/participantId), so the
// presenter's existing report & tally aggregate them with zero extra work.
// ════════════════════════════════════════════════════════════════════════════
let surveyQuestions = [];
let _setTranslating = false; // a background set-translation is in flight (guards re-entry)
let surveyAnswers   = {};   // { qIndex: answerValue }
let formIsQuiz      = false; // graded (QuizSlide assignment) vs ungraded (SurveySlide)
let formProduct     = 'survey'; // survey | quiz | study (from quiz_builder/<code>/productType)
const SURVEY_LETTERS = ['A','B','C','D','E','F','G','H'];

async function loadSurvey() {
  _currentRenderer = loadSurvey;
  render(`<div class="spinner"></div><p class="center" style="color:var(--muted);font-size:13px;">${t('loading','Loading…')}</p>`);
  let qs = [];
  try {
    const snap = await db.ref(`quiz_builder/${SESSION}/questions`).get();
    qs = snap.exists() ? (snap.val() || []) : [];
  } catch(e) { qs = []; }
  // Firebase may return an object if keys are sparse — normalize to array.
  surveyQuestions = Array.isArray(qs) ? qs.filter(Boolean) : Object.values(qs).filter(Boolean);
  _modeQuestions = surveyQuestions;

  // What product is this? (Presenter publishes productType to quiz_builder.)
  try {
    const ptSnap = await db.ref(`quiz_builder/${SESSION}/productType`).get();
    formProduct = ptSnap.exists() ? ptSnap.val() : 'survey';
  } catch(e) { formProduct = 'survey'; }
  formIsQuiz = formProduct === 'quiz';

  // Translate the whole set into the viewer's language (display-only; indices unchanged).
  // Batched and in the BACKGROUND: this used to await one model call per question, so
  // a 10-question form was 10 sequential round-trips before anything appeared. The form
  // paints in the deck language and upgrades in place. Because translateQuestions()
  // mutates the question objects, anything rendered later (study cards, a re-render)
  // picks up the translation with no extra work.
  if (LANG !== DECK_LANG && !_setTranslating) {
    _setTranslating = true;
    translateQuestions(surveyQuestions)
      .catch(() => {})
      .then(() => {
        _setTranslating = false;
        // Only redraw a form nobody has started filling in.
        if (document.getElementById('surveyCard0') && surveyUntouched()) showSurveyForm();
      });
  }

  if (surveyQuestions.length === 0) {
    const noun = formProduct === 'study' ? 'study set' : formProduct;
    render(`
      ${logoMarkup()}
      <div style="text-align:center;padding:10px 0 20px;">
        <div style="font-size:40px;margin-bottom:12px;">${formProduct==='study'?'📚':'📋'}</div>
        <h1 style="margin-bottom:8px;">Nothing here yet</h1>
        <p class="subtitle">This ${noun} has no ${formProduct==='study'?'cards':'questions'} yet.<br>Check back shortly.</p>
      </div>`);
    return;
  }

  // StudySlide: a study set is reviewed repeatedly (spaced repetition), not "submitted".
  if (formProduct === 'study') { showStudyHome(); return; }

  // Already submitted? If this participant has a response in ANY question bucket, treat
  // the survey as completed (one submission per person).
  try {
    const respSnap = await db.ref(`sessions/${SESSION}/responses`).get();
    if (respSnap.exists()) {
      const byQ = respSnap.val();
      const done = Object.values(byQ).some(bucket => bucket && typeof bucket === 'object' && bucket[participantId]);
      if (done) { showSurveyDone(true); return; }
    }
  } catch(e) { /* if the check fails, let them answer */ }

  showSurveyForm();
}

function logoMarkup() {
  return `<div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="22" height="22" style="flex-shrink:0;"><rect width="100" height="100" rx="22" fill="#0d0d18"/><rect x="18" y="58" width="16" height="24" rx="4" fill="#ff6584"/><rect x="42" y="42" width="16" height="40" rx="4" fill="#f7b731"/><rect x="66" y="22" width="16" height="60" rx="4" fill="#6c63ff"/><polygon points="72,32 72,40 78,36" fill="rgba(255,255,255,0.8)"/></svg>PollSlide</div>`;
}

function surveyQuestionBody(q, idx) {
  const isMulti  = q.type === 'multiple_choice_multi';
  const isText   = q.type === 'free_text';
  const isRating = q.type === 'rating';
  if (isText) {
    return `<textarea id="sq${idx}_txt" placeholder="${t('typeAnswer','Type your answer…')}" oninput="surveyAnswers[${idx}]=this.value.trim()" style="margin-bottom:0;"></textarea>`;
  }
  if (isRating) {
    const max = q.ratingMax || 5;
    const labels = q.ratingLabels || {};
    return `
      <div class="rating-wrap">
        ${Array.from({length:max},(_,i)=>`<button type="button" class="r-btn" id="sq${idx}_r${i+1}" onclick="surveyPickRating(${idx},${i+1})">${i+1}</button>`).join('')}
      </div>
      ${labels.low||labels.high ? `<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);"><span>${esc(labels.low)}</span><span>${esc(labels.high)}</span></div>` : ''}`;
  }
  // single or multi choice
  return `
    ${isMulti ? `<p class="multi-hint">${t('selectAll','✓ Select all that apply')}</p>` : ''}
    <div class="options-grid">
      ${(q.options||[]).map((opt,i) => {
        const hasImg = opt.img && opt.img.trim();
        return `<button type="button" class="option ${hasImg?'has-img':''}" id="sq${idx}_opt${i}" onclick="surveyPickOption(${idx},${i},${isMulti})">
          <span class="opt-letter">${SURVEY_LETTERS[i]}</span>
          ${hasImg?mediaTag(opt.img, opt.videoOpts, 'opt-img'):''}
          <span>${esc(opt.text)}</span>
        </button>`;
      }).join('')}
    </div>`;
}

function showSurveyForm() {
  const cards = surveyQuestions.map((q, idx) => `
    <div class="survey-card" id="surveyCard${idx}">
      <div class="survey-qnum">${idx+1}</div>
      ${mediaTag(q.image, q.videoOpts, 'q-image')}
      <div class="q-text" style="font-size:18px;margin-bottom:14px;">${esc(q.text)}</div>
      ${surveyQuestionBody(q, idx)}
    </div>`).join('');

  render(`
    ${logoMarkup()}
    <h1 style="margin-bottom:4px;">${surveyQuestions.length} question${surveyQuestions.length!==1?'s':''}</h1>
    <p class="subtitle">${formIsQuiz
      ? 'Answer all you can, then submit to see your score.'
      : 'Answer at your own pace, then submit. You can skip any question.'}</p>
    <div id="surveyForm">${cards}</div>
    <button class="btn btn-primary" id="surveySubmitBtn" onclick="submitSurvey()" style="margin-top:6px;">${formIsQuiz ? t('submitQuiz','Submit & See Score') : t('submitSurvey','Submit Survey')}</button>
    <p id="surveyErr" style="color:var(--accent2);font-size:13px;margin-top:10px;text-align:center;"></p>
  `);
}

function surveyPickOption(idx, i, isMulti) {
  if (isMulti) {
    const cur = new Set(Array.isArray(surveyAnswers[idx]) ? surveyAnswers[idx] : []);
    if (cur.has(i)) { cur.delete(i); document.getElementById(`sq${idx}_opt${i}`).classList.remove('selected'); }
    else { cur.add(i); document.getElementById(`sq${idx}_opt${i}`).classList.add('selected'); }
    surveyAnswers[idx] = Array.from(cur);
  } else {
    (surveyQuestions[idx].options||[]).forEach((_,j) => document.getElementById(`sq${idx}_opt${j}`)?.classList.remove('selected'));
    document.getElementById(`sq${idx}_opt${i}`).classList.add('selected');
    surveyAnswers[idx] = [i];
  }
}

function surveyPickRating(idx, val) {
  const max = surveyQuestions[idx].ratingMax || 5;
  for (let n=1;n<=max;n++) document.getElementById(`sq${idx}_r${n}`)?.classList.toggle('selected', n===val);
  surveyAnswers[idx] = val;
}

function surveyComputeCorrect(q, answer) {
  if (!(q.type === 'multiple_choice' || q.type === 'multiple_choice_multi')) return null;
  if (q.correctAnswer === null || q.correctAnswer === undefined) return null; // ungraded (survey)
  if (q.type === 'multiple_choice') {
    const a = Array.isArray(answer) ? answer[0] : answer;
    return Number(a) === Number(q.correctAnswer);   // coerce: correctAnswer may be a string from Firebase
  }
  const correctSet = new Set(Array.isArray(q.correctAnswer) ? q.correctAnswer.map(Number) : [Number(q.correctAnswer)]);
  const givenArr   = Array.isArray(answer) ? answer.map(Number) : [];
  const wrongPicked   = givenArr.filter(a => !correctSet.has(a)).length;
  const correctPicked = givenArr.filter(a => correctSet.has(a)).length;
  if (correctSet.size === 0) return null;
  if (wrongPicked > 0) return false;
  if (correctPicked === correctSet.size) return true;
  return parseFloat((correctPicked / correctSet.size).toFixed(4));
}

function surveyIsAnswered(idx) {
  const a = surveyAnswers[idx];
  if (a === undefined || a === null) return false;
  if (Array.isArray(a)) return a.length > 0;
  if (typeof a === 'string') return a.trim().length > 0;
  return true; // number (rating)
}

// Nobody has started filling the form in. Guards the background-translation
// redraw — surveyAnswers is written on every keystroke (see the textarea's
// oninput), so this is an honest read of whether anything would be lost.
function surveyUntouched() {
  try { return !surveyQuestions.some((_, i) => surveyIsAnswered(i)); }
  catch(e) { return false; }
}

async function submitSurvey() {
  if (submitting) return;
  // Require at least one answer so we don't store an empty submission.
  const answeredCount = surveyQuestions.reduce((n,_,idx) => n + (surveyIsAnswered(idx) ? 1 : 0), 0);
  if (answeredCount === 0) {
    document.getElementById('surveyErr').textContent = 'Please answer at least one question before submitting.';
    return;
  }
  submitting = true;
  const btn = document.getElementById('surveySubmitBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Submitting…'; }

  const submittedAt = Date.now();
  const writes = [];
  surveyQuestions.forEach((q, idx) => {
    if (!surveyIsAnswered(idx)) return; // skip blanks
    let answer      = surveyAnswers[idx];
    if (q.type === 'free_text' && typeof answer === 'string') answer = moderateText(answer);
    const stableQId = PSQid.bucket(q, idx, SESSION);
    const isCorrect = surveyComputeCorrect(q, answer);
    writes.push(
      db.ref(`sessions/${SESSION}/responses/${stableQId}/${participantId}`).set({
        participantId,
        name: participantName,
        team: participantTeam || null,   // team play: every response carries the team name
        answer: (answer === null || answer === undefined) ? '__none__' : JSON.stringify(answer),
        elapsed: 0,
        isCorrect,
        submittedAt
      })
    );
  });

  try {
    await Promise.all(writes);
    if (formIsQuiz) showQuizScore(); else showSurveyDone(false);
  } catch(e) {
    submitting = false;
    if (btn) { btn.disabled = false; btn.textContent = formIsQuiz ? t('submitQuiz','Submit & See Score') : t('submitSurvey','Submit Survey'); }
    document.getElementById('surveyErr').textContent = 'Could not submit — check your connection and try again.';
  }
}

function showSurveyDone(already) {
  render(`
    ${logoMarkup()}
    <div style="text-align:center;padding:14px 0 20px;">
      <div style="font-size:46px;margin-bottom:12px;">✓</div>
      <h1 style="margin-bottom:8px;">${already ? 'Already submitted' : t('thankYou','Thank you!')}</h1>
      <p class="subtitle">${already ? 'You\'ve already completed this ' + (formIsQuiz?'quiz':'survey') + '.' : t('recorded','Your responses have been recorded.')}</p>
    </div>
  `);
}

// ─── QUIZ SCORE (gamified, shareable — the QuizSlide payoff) ──────────────────
function answerLabel(q, answer) {
  if (answer === undefined || answer === null) return `<span style="opacity:0.6;">${t('skipped','(skipped)')}</span>`;
  if (q.type === 'multiple_choice' || q.type === 'multiple_choice_multi') {
    const arr = Array.isArray(answer) ? answer : [answer];
    return arr.map(i => SURVEY_LETTERS[i] + '. ' + ((q.options||[])[i]?.text || '')).join(', ') || t('skipped','(skipped)');
  }
  if (q.type === 'rating') return String(answer);
  return String(answer);
}
function correctLabel(q) {
  const ca = q.correctAnswer;
  if (ca === null || ca === undefined) return '';
  const arr = Array.isArray(ca) ? ca : [ca];
  return arr.map(i => SURVEY_LETTERS[i] + '. ' + ((q.options||[])[Number(i)]?.text || '')).join(', ');
}

function showQuizScore() {
  // Grade only the gradable (choice) questions that have a correct answer set.
  let gradable = 0, earned = 0;
  const rows = surveyQuestions.map((q, idx) => {
    const ans = surveyAnswers[idx];
    const score = surveyComputeCorrect(q, ans); // true / false / 0..1 / null
    const isGradable = score !== null;
    if (isGradable) { gradable++; earned += (score === true ? 1 : (typeof score === 'number' ? score : 0)); }
    const state = !isGradable ? 'na' : (score === true ? 'right' : (score === false || score === 0 ? 'wrong' : 'partial'));
    const icon  = state==='right' ? '✓' : state==='wrong' ? '✗' : state==='partial' ? '◐' : '•';
    const color = state==='right' ? 'var(--accent3,#22c55e)' : state==='wrong' ? 'var(--accent2)' : state==='partial' ? 'var(--accent4)' : 'var(--muted)';
    const showCorrect = (state==='wrong' || state==='partial');
    return `
      <div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);text-align:left;">
        <div style="color:${color};font-weight:800;font-size:16px;flex-shrink:0;width:18px;">${icon}</div>
        <div style="min-width:0;flex:1;">
          <div style="font-size:13px;font-weight:600;margin-bottom:2px;">${idx+1}. ${esc(q.text)}</div>
          ${isGradable ? `<div style="font-size:12px;color:var(--muted);">${t('yourAnswer','Your answer')}: ${answerLabel(q, ans)}</div>` : `<div style="font-size:12px;color:var(--muted);">${answerLabel(q, ans)}</div>`}
          ${showCorrect ? `<div style="font-size:12px;color:var(--accent3,#22c55e);">${t('correctWas','Correct')}: ${correctLabel(q)}</div>` : ''}
        </div>
      </div>`;
  }).join('');

  const pct = gradable ? Math.round((earned / gradable) * 100) : 0;
  const display = gradable ? `${(Math.round(earned*10)/10)} / ${gradable}` : '—';
  const headline = !gradable ? 'Submitted!' :
                   pct >= 80 ? '🏆 Excellent!' :
                   pct >= 50 ? '👏 Nice work!' : '💪 Keep practicing!';
  const ring = gradable ? `
    <div style="position:relative;width:120px;height:120px;margin:0 auto 14px;">
      <svg viewBox="0 0 36 36" style="width:120px;height:120px;transform:rotate(-90deg);">
        <circle cx="18" cy="18" r="16" fill="none" stroke="var(--surface3)" stroke-width="3"/>
        <circle cx="18" cy="18" r="16" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"
                stroke-dasharray="100.5" stroke-dashoffset="${(100.5*(1-pct/100)).toFixed(1)}"/>
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:30px;line-height:1;">${pct}%</div>
        <div style="font-size:11px;color:var(--muted);">${display}</div>
      </div>
    </div>` : '<div style="font-size:46px;margin-bottom:12px;">✓</div>';

  window._quizSharePct = pct; window._quizShareScore = display;
  render(`
    ${logoMarkup()}
    <div style="text-align:center;padding:6px 0 8px;">
      ${ring}
      <h1 style="margin-bottom:4px;">${headline}</h1>
      ${gradable ? `<p class="subtitle">You scored <strong style="color:var(--text);">${display}</strong> correct.</p>` : `<p class="subtitle">Your answers were recorded.</p>`}
    </div>
    ${gradable ? `<button class="btn btn-primary" onclick="shareQuizScore()" style="width:100%;justify-content:center;margin-bottom:14px;">📣 Share my score</button>` : ''}
    <div style="text-align:left;">${rows}</div>
  `);
}

function shareQuizScore() {
  const text = `I scored ${window._quizShareScore} (${window._quizSharePct}%) on this quiz! Try it: ${location.href}`;
  if (navigator.share) {
    navigator.share({ text }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(text).then(()=> toast(t('resultCopied','Result copied — paste it anywhere!'), 'success')).catch(()=>{});
  }
}

// ════════════════════════════════════════════════════════════════════════════
// STUDYSLIDE — spaced-repetition flashcards (Anki/Quizlet-class), client-side.
// SRS state lives in localStorage per device+set (no login needed). Forward-
// thinking extras: text-to-speech, daily streak, and "add next review to
// calendar" for re-engagement. The killer growth flow (quiz→study set) is
// generated on the presenter side.
// ════════════════════════════════════════════════════════════════════════════
let studyCards = [];      // [{front, back, idx}]
let studyQueue = [];      // indices still to review this session
let studyReviewed = 0;    // cards completed this session
let studyFlipped = false;

// A card's front/back from any question type (flashcard, or derive from a Q+answer).
function cardFront(q) {
  if (q.type === 'flashcard') return q.front || q.text || '';
  return q.text || '';
}
function cardBack(q) {
  if (q.type === 'flashcard') return q.back || '';
  if ((q.type === 'multiple_choice' || q.type === 'multiple_choice_multi') &&
      q.correctAnswer !== null && q.correctAnswer !== undefined) {
    const arr = Array.isArray(q.correctAnswer) ? q.correctAnswer : [q.correctAnswer];
    return arr.map(i => (q.options||[])[Number(i)]?.text || '').filter(Boolean).join(', ');
  }
  if (q.options && q.options.length) return q.options.map(o=>o.text).filter(Boolean).join(' · ');
  return '(no answer set)';
}

// ── SRS state (localStorage) ──
function srsLoad() { try { return JSON.parse(localStorage.getItem(`ql_srs_${SESSION}`) || '{}'); } catch(e) { return {}; } }
function srsSave(s) { try { localStorage.setItem(`ql_srs_${SESSION}`, JSON.stringify(s)); } catch(e) {} studyCloudPush(); }

// ── CROSS-DEVICE SYNC (signed-in only) ───────────────────────────────────────
// Studying deliberately needs NO login — a student scans a QR and goes. But someone
// who bought PollSlide and is revising their own material wants their progress on
// both phone and laptop. So: if a Firebase auth session already exists on this origin
// (the presenter signs in on the same domain, so "📚 Study now" arrives authenticated),
// we mirror progress to users/<uid>/study/<code>. Otherwise nothing changes at all.
//
// Design notes:
//  • localStorage stays the source of truth for READS, so all 20+ existing call sites
//    remain synchronous and instant — the cloud is a background mirror, never a blocker.
//  • The auth SDK is loaded LAZILY, only when the study surface opens. answer.html is
//    the page 30 phones load in a room; the poll/quiz path must not pay for this.
//  • No database-rules change: users/$uid is already owner-read/write.
let _studyUid = null, _cloudTimer = null, _cloudReady = false;

function _loadScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`)) return res();
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('load failed'));
    document.head.appendChild(s);
  });
}
// Resolve the signed-in user, if there is one. Never throws, never blocks study.
async function studyAuthUid() {
  if (_cloudReady) return _studyUid;
  _cloudReady = true;
  try {
    await _loadScript('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js');
    if (!firebase.auth) return null;
    _studyUid = await new Promise(res => {
      const un = firebase.auth().onAuthStateChanged(u => { un(); res(u ? u.uid : null); });
      setTimeout(() => res(null), 3000);          // never hang the study screen on auth
    });
  } catch (e) { _studyUid = null; }
  return _studyUid;
}

// Merge rule: keep the MORE ADVANCED record on each side, so syncing can only ever move
// you forward. Losing a week of revision because a stale device wrote last would be far
// worse than briefly over-counting.
function mergeStudyState(local, cloud) {
  local = local || {}; cloud = cloud || {};
  const out = { srs: {}, streak: null, best: 0 };
  const ls = local.srs || {}, cs = cloud.srs || {};
  new Set([...Object.keys(ls), ...Object.keys(cs)]).forEach(k => {
    const a = ls[k], b = cs[k];
    if (!a) { out.srs[k] = b; return; }
    if (!b) { out.srs[k] = a; return; }
    // More reps wins; on a tie the longer interval (better retention) wins.
    out.srs[k] = (b.reps > a.reps || (b.reps === a.reps && (b.interval || 0) > (a.interval || 0))) ? b : a;
  });
  const a = local.streak, b = cloud.streak;
  out.streak = (!a) ? b : (!b) ? a : ((b.count || 0) > (a.count || 0) ? b : a);
  out.best = Math.max(local.best || 0, cloud.best || 0);
  return out;
}

function _localStudyState() {
  return { srs: srsLoad(), streak: _readStreak(), best: bestClockScore() };
}
function _writeStudyState(st) {
  try {
    localStorage.setItem(`ql_srs_${SESSION}`, JSON.stringify(st.srs || {}));
    if (st.streak) localStorage.setItem(STREAK_KEY, JSON.stringify(st.streak));
    if (st.best) localStorage.setItem(`ql_clockbest_${SESSION}`, String(st.best));
  } catch(e) {}
}

// Pull cloud state and merge it in. Returns true if anything changed (so the caller
// can repaint). Silent no-op when signed out or offline.
async function studyCloudPull() {
  const uid = await studyAuthUid();
  if (!uid || !SESSION) return false;
  try {
    const snap = await db.ref(`users/${uid}/study/${SESSION}`).get();
    if (!snap.exists()) { studyCloudPush(); return false; }   // first device: seed the cloud
    const before = JSON.stringify(_localStudyState());
    const merged = mergeStudyState(_localStudyState(), snap.val() || {});
    _writeStudyState(merged);
    const changed = JSON.stringify(_localStudyState()) !== before;
    if (changed) studyCloudPush();                            // push the merged result back
    return changed;
  } catch (e) { return false; }
}
// Debounced mirror upward — study never waits on the network.
function studyCloudPush() {
  if (!_studyUid || !SESSION) return;
  clearTimeout(_cloudTimer);
  _cloudTimer = setTimeout(() => {
    try {
      const st = _localStudyState();
      db.ref(`users/${_studyUid}/study/${SESSION}`)
        .set({ srs: st.srs, streak: st.streak, best: st.best, updated: Date.now() })
        .catch(() => {});
    } catch (e) {}
  }, 1200);
}

// SM-2 lite: rating ∈ again|hard|good|easy → updated {interval(days), ease, reps, due}
function srsSchedule(st, rating) {
  st = st || { interval:0, ease:2.5, reps:0, due:0 };
  if (rating === 'again') {
    st.reps = 0; st.interval = 0; st.ease = Math.max(1.3, st.ease - 0.2);
    st.due = Date.now(); // resurface later this same session
  } else {
    st.reps++;
    if (rating === 'hard')      { st.ease = Math.max(1.3, st.ease - 0.15); st.interval = st.interval ? st.interval * 1.2 : 1; }
    else if (rating === 'good') { st.interval = st.interval ? st.interval * st.ease : 1; }
    else if (rating === 'easy') { st.ease += 0.15; st.interval = (st.interval || 1) * st.ease * 1.3; }
    st.due = Date.now() + st.interval * 86400000;
  }
  return st;
}

// ── STUDY HOME — streak, mastery, and how you want to study today ────────────
// The old flow dropped you straight into flipping cards. This gives the session a
// shape: here's your streak (don't break it), here's how much you've mastered
// (finish the bar), and here's how you want to play today.
function _studyCardsInit() {
  studyCards = surveyQuestions.map((q, idx) => ({ idx, front: cardFront(q), back: cardBack(q) }))
                              .filter(c => c.front);
}
function dueCount() {
  const srs = srsLoad(), now = Date.now();
  return studyCards.filter(c => !srs[c.idx] || (srs[c.idx].due || 0) <= now).length;
}
function showStudyHome() {
  _currentRenderer = showStudyHome;
  _studyCardsInit();
  // Signed-in? Fetch progress from the account and repaint if it moved us forward.
  // Fire-and-forget: the screen paints instantly from local state either way.
  studyCloudPull().then(changed => { if (changed && _currentRenderer === showStudyHome) showStudyHome(); }).catch(()=>{});
  if (!studyCards.length) { render(`${logoMarkup()}<p class="center" style="color:var(--muted);">This set has no cards yet.</p>`); return; }
  const m = studyMastery();
  const due = dueCount();
  const streak = studyStreakPeek();
  const best = bestClockScore();
  const modeBtn = (id, icon, name, desc, extra) => `
    <button class="btn" style="width:100%;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:12px 14px;" onclick="startStudyMode('${id}')">
      <span style="font-size:21px;line-height:1.1;flex-shrink:0;">${icon}</span>
      <span style="flex:1;min-width:0;">
        <span style="display:block;font-weight:700;font-size:14px;">${name}</span>
        <span style="display:block;font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:1px;">${desc}</span>
        ${extra ? `<span style="display:block;font-size:11px;color:var(--accent4);margin-top:3px;">${extra}</span>` : ''}
      </span>
    </button>`;
  render(`
    ${logoMarkup()}
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px;">
      <h1 style="margin:0;font-size:22px;">${t('studyTitle','Study')}</h1>
      <div style="display:inline-flex;align-items:center;gap:6px;background:rgba(247,183,49,0.14);border:1px solid rgba(247,183,49,0.35);border-radius:100px;padding:5px 12px;font-size:12.5px;font-weight:700;white-space:nowrap;">
        🔥 ${streak}<span style="color:var(--muted);font-weight:500;">${t('dayStreak','day streak')}</span>
      </div>
    </div>
    <p class="subtitle" style="margin-bottom:2px;">${due > 0
      ? `<b style="color:var(--text);">${due}</b> ${due === 1 ? t('cardDue','card due') : t('cardsDue','cards due')} ${t('rightNow','right now')}`
      : t('allCaughtUp','You\'re all caught up — study anyway to get ahead.')}</p>
    ${masteryBarHtml(m)}
    <div style="margin-top:18px;">
      ${modeBtn('classic','🎯', t('modeClassicName','Review'), t('modeClassicDesc','Flip cards and rate yourself. Spaced repetition picks what you see next.'), due > 0 ? `${due} ${t('readyNow','ready now')}` : '')}
      ${modeBtn('clock','⚡', t('modeClockName','Beat the Clock'), t('modeClockDesc','60 seconds. How many can you get right?'), best ? `${t('yourBest','Your best')}: ${best}` : '')}
      ${modeBtn('ladder','🪜', t('modeLadderName','Climb the Ladder'), t('modeLadderDesc','Ten rungs, rising stakes. Two lifelines. Bank your win or risk it.'), '')}
      ${modeBtn('board','🎲', t('modeBoardName','Pick-a-Card Board'), t('modeBoardDesc','Choose your squares game-show style — the pricier ones are the ones you keep forgetting.'), '')}
    </div>
  `);
}
function startStudyMode(mode) {
  STUDY_MODE = mode;
  if (mode === 'clock')  { startClockRound(); return; }
  if (mode === 'ladder') { startLadder(); return; }
  if (mode === 'board')  { startBoard(); return; }
  startStudySession(false);
}
let STUDY_MODE = 'classic';

function startStudySession(reviewAll) {
  studyCards = surveyQuestions.map((q, idx) => ({ idx, front: cardFront(q), back: cardBack(q) }))
                              .filter(c => c.front);
  const srs = srsLoad();
  const now = Date.now();
  // Due = new cards (no state) or cards whose due time has passed. reviewAll ignores due.
  studyQueue = studyCards
    .filter(c => reviewAll || !srs[c.idx] || (srs[c.idx].due || 0) <= now)
    .map(c => c.idx);
  // Light shuffle so order varies between sessions.
  for (let i = studyQueue.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [studyQueue[i],studyQueue[j]]=[studyQueue[j],studyQueue[i]]; }
  studyReviewed = 0;
  if (studyQueue.length === 0) { showStudyDone(true); return; }
  showStudyCard();
}

function studyCardByIdx(idx) { return studyCards.find(c => c.idx === idx); }

function showStudyCard() {
  if (studyQueue.length === 0) { showStudyDone(false); return; }
  studyFlipped = false;
  const idx = studyQueue[0];
  const card = studyCardByIdx(idx);
  const total = studyReviewed + studyQueue.length;
  const pct = total ? Math.round((studyReviewed / total) * 100) : 0;
  render(`
    ${logoMarkup()}
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <div style="flex:1;height:6px;background:var(--surface3);border-radius:100px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:var(--accent);border-radius:100px;transition:width 0.3s;"></div></div>
      <div style="font-size:12px;color:var(--muted);white-space:nowrap;">${studyReviewed}/${total}</div>
    </div>
    <div class="study-card" id="studyCard" onclick="flipStudyCard()">
      <button class="study-speak" onclick="event.stopPropagation();speakCard()" title="Read aloud" aria-label="Read aloud">🔊</button>
      <div class="study-face-label" id="studyFaceLabel">${t('tapToFlip','TAP TO FLIP')}</div>
      <div class="study-front" id="studyText">${esc(card.front)}</div>
    </div>
    <div id="studyControls">
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="flipStudyCard()">${t('showAnswer','Show Answer')}</button>
    </div>
  `);
}

function flipStudyCard() {
  if (studyFlipped) return;
  studyFlipped = true;
  const idx = studyQueue[0];
  const card = studyCardByIdx(idx);
  document.getElementById('studyText').innerHTML = card.back;
  document.getElementById('studyFaceLabel').textContent = t('answerFace','ANSWER');
  document.getElementById('studyCard').classList.add('flipped');
  document.getElementById('studyControls').innerHTML = `
    <div class="study-rate">
      <button class="study-rate-btn again" onclick="rateCard('again')">${t('again','Again')}<span>&lt;1m</span></button>
      <button class="study-rate-btn hard"  onclick="rateCard('hard')">${t('hard','Hard')}<span>1d</span></button>
      <button class="study-rate-btn good"  onclick="rateCard('good')">${t('good','Good')}<span>≈3d</span></button>
      <button class="study-rate-btn easy"  onclick="rateCard('easy')">${t('easy','Easy')}<span>≈7d</span></button>
    </div>`;
}

function rateCard(rating) {
  const idx = studyQueue.shift();
  const srs = srsLoad();
  srs[idx] = srsSchedule(srs[idx], rating);
  srsSave(srs);
  recordStudyProgress(idx, rating);   // report to the presenter's live mastery dashboard
  if (rating === 'again') studyQueue.push(idx); // re-show later this session
  else studyReviewed++;
  showStudyCard();
}

// Per-studier mastery → powers the presenter's live Study Mastery dashboard.
// Best-effort: study still works client-side even if this write is denied.
function recordStudyProgress(idx, rating) {
  if (!participantId || !SESSION) return;
  try {
    db.ref(`sessions/${SESSION}/study/${participantId}`).update({
      name: participantName || 'Anon',
      updated: Date.now(),
      [`cards/${idx}`]: rating          // again | hard | good | easy
    });
  } catch (e) {}
}

// ═══ STUDY GAME MODES ════════════════════════════════════════════════════════
// All three run on the SAME cards and feed the SAME SM-2 scheduler as Review, so
// playing a game is never "wasted" study — a right answer still schedules the card
// forward, a wrong one still brings it back. They only change the framing.
// Self-grading (you say whether you got it) is deliberate: these are recall drills,
// and free-typed answers can't be marked reliably.

// ── ⚡ BEAT THE CLOCK ── 60s time attack. Personal best per set, because "beat your
// own number" is a stronger pull than any leaderboard when you're studying alone.
let clockLeft = 0, clockScore = 0, clockTimer = null, clockQueue = [];
function bestClockScore() { try { return parseInt(localStorage.getItem(`ql_clockbest_${SESSION}`), 10) || 0; } catch(e) { return 0; } }
function saveClockScore(n) { try { if (n > bestClockScore()) localStorage.setItem(`ql_clockbest_${SESSION}`, String(n)); } catch(e) {} studyCloudPush(); }
function startClockRound() {
  _studyCardsInit();
  clockQueue = studyCards.map(c => c.idx);
  for (let i = clockQueue.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [clockQueue[i],clockQueue[j]]=[clockQueue[j],clockQueue[i]]; }
  clockScore = 0; clockLeft = 60;
  if (clockTimer) clearInterval(clockTimer);
  clockTimer = setInterval(() => {
    clockLeft--;
    const el = document.getElementById('clockLeft');
    if (el) { el.textContent = clockLeft; el.style.color = clockLeft <= 10 ? 'var(--accent2)' : ''; }
    if (clockLeft <= 0) endClockRound();
  }, 1000);
  showClockCard();
}
function showClockCard() {
  if (!clockQueue.length) { endClockRound(); return; }
  const card = studyCardByIdx(clockQueue[0]);
  studyFlipped = false;
  render(`
    ${logoMarkup()}
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div style="font-size:13px;font-weight:700;">⚡ ${t('modeClockName','Beat the Clock')}</div>

// ── 🪜 CLIMB THE LADDER ── Millionaire-style: ten rungs, two lifelines, and safe
// havens so a wrong answer never wipes you out completely. The bank/risk decision is
// what makes it tense — you're playing against your own nerve, not a clock.
const LADDER_SAFE = [3, 6];          // rungs you can't fall below once passed
let ladderRung = 0, ladderQueue = [], ladderLifelines = { fifty:true, skip:true }, ladderHidden = [];
function startLadder() {
  _studyCardsInit();

  for (let i = ladderQueue.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [ladderQueue[i],ladderQueue[j]]=[ladderQueue[j],ladderQueue[i]]; }
  ladderRung = 0; ladderLifelines = { fifty:true, skip:true };
  showLadderCard();
}
function ladderSafeFloor() { let f = 0; LADDER_SAFE.forEach(s => { if (ladderRung >= s) f = s; }); return f; }
function showLadderCard() {
  if (ladderRung >= 10 || !ladderQueue.length) { endLadder(true); return; }
  studyFlipped = false; ladderHidden = [];
  const card = studyCardByIdx(ladderQueue[0]);
  const rungs = Array.from({length:10}, (_,i) => 9-i).map(r => {
    const on = r === ladderRung, done = r < ladderRung, safe = LADDER_SAFE.includes(r+1);
    return `<div style="display:flex;align-items:center;gap:8px;padding:2px 0;font-size:11px;${on?'font-weight:800;':''}color:${on?'var(--accent4)':done?'var(--accent3)':'var(--muted)'};">
      <span style="width:18px;text-align:right;">${r+1}</span>
      <span style="flex:1;height:4px;border-radius:100px;background:${on?'var(--accent4)':done?'var(--accent3)':'var(--surface3)'};"></span>

  }).join('');
  render(`
    ${logoMarkup()}
    <div style="display:flex;gap:14px;align-items:flex-start;">
      <div style="width:74px;flex-shrink:0;">${rungs}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:700;margin-bottom:8px;">🪜 ${t('rung','Rung')} ${ladderRung+1}/10</div>
        <div class="study-card" style="min-height:120px;" onclick="flipLadder()">
          <div class="study-face-label">${t('tapToFlip','TAP TO FLIP')}</div>

            <button class="btn btn-ghost" style="flex:1;font-size:12px;" onclick="useSkip()" ${ladderLifelines.skip?'':'disabled'}>⏭ ${t('skip','Skip')}</button>
            ${ladderRung>0?`<button class="btn btn-ghost" style="flex:1;font-size:12px;color:var(--accent3);" onclick="endLadder(false,true)">💰 ${t('bank','Bank')}</button>`:''}
          </div>
        </div>
      </div>
    </div>
  `);
}
function flipLadder() {
  if (studyFlipped) return;

// ── Daily streak (habit loop) ────────────────────────────────────────────────
// GLOBAL, not per-set. The streak was previously keyed `ql_streak_<SESSION>`, which
// meant revising French on Monday and Biology on Tuesday left you with two separate
// 1-day streaks instead of a 2-day one — the exact opposite of the habit it's meant to
// build. Now one streak counts "did you study anything today", which is what actually
// keeps people coming back. Old per-set values are migrated on first run so nobody
// loses a streak they'd already earned.
const STREAK_KEY = 'ql_study_streak';
function _readStreak() {
  let s; try { s = JSON.parse(localStorage.getItem(STREAK_KEY) || 'null'); } catch(e) { s = null; }
  if (s) return s;
  // Migrate: adopt the best per-set streak this device had.
  let best = null;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || k.indexOf('ql_streak_') !== 0) continue;
      const v = JSON.parse(localStorage.getItem(k) || '{}');
      if (v && v.count && (!best || v.count > best.count)) best = { count: v.count, lastDay: v.lastDay };
    }
  } catch(e) {}
  return best || { count: 0, lastDay: null };
}
// Read-only: what's the streak right now? (Safe to call while rendering.)
function studyStreakPeek() {
  const s = _readStreak();
  const today = new Date().toDateString();
  const yest  = new Date(Date.now() - 86400000).toDateString();
  if (s.lastDay === today) return s.count || 1;
  if (s.lastDay === yest)  return (s.count || 0) + 1;   // today would extend it
  return 1;                                             // today would start a new one
}
// Call once when a study session is actually completed — this is what banks the day.
function studyStreak() {
  const s = _readStreak();
  const today = new Date().toDateString();
  const yest  = new Date(Date.now() - 86400000).toDateString();
  if (s.lastDay === today) { /* already banked today */ }
  else if (s.lastDay === yest) { s.count = (s.count || 0) + 1; s.lastDay = today; }
  else { s.count = 1; s.lastDay = today; }
  try { localStorage.setItem(STREAK_KEY, JSON.stringify(s)); } catch(e) {}
  studyCloudPush();
  return s.count || 1;
}

// ── Mastery (the collection loop) ────────────────────────────────────────────
// Turns the SM-2 state we already keep into three human buckets. People will grind to
// turn a bar green in a way they never will for "ease factor 2.35".
//   Learning  — never rated, or reset by an "again"
//   Familiar  — answered right at least once, but not yet holding for a week
//   Mastered  — surviving a review interval of a week or more
function cardStage(st) {
  if (!st || !st.reps) return 'learning';
  if ((st.interval || 0) >= 7) return 'mastered';
  return 'familiar';
}
function studyMastery() {
  const srs = srsLoad();
  const out = { learning: 0, familiar: 0, mastered: 0, total: studyCards.length };
  studyCards.forEach(c => { out[cardStage(srs[c.idx])]++; });
  out.pct = out.total ? Math.round((out.mastered / out.total) * 100) : 0;
  return out;
}
function masteryBarHtml(m) {
  const seg = (n, col) => n ? `<div style="width:${(n / m.total) * 100}%;background:${col};"></div>` : '';
  return `<div style="margin:14px 0 4px;">
      <div style="display:flex;height:9px;border-radius:100px;overflow:hidden;background:var(--surface3);">
        ${seg(m.mastered, 'linear-gradient(90deg,#43e97b,#6bffb5)')}${seg(m.familiar, '#f7b731')}${seg(m.learning, 'rgba(255,255,255,0.12)')}
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;">
        <span>🌱 ${t('stLearning','Learning')} ${m.learning}</span>
        <span>⭐ ${t('stFamiliar','Familiar')} ${m.familiar}</span>
        <span style="color:var(--accent3);">🏆 ${t('stMastered','Mastered')} ${m.mastered}</span>
      </div>
    </div>`;
}

// ── "Add next review to calendar" (re-engagement) ──
function nextDueDate() {
  const srs = srsLoad();
  const dues = studyCards.map(c => srs[c.idx]?.due).filter(d => d && d > Date.now());
  if (!dues.length) return null;
  return new Date(Math.min(...dues));
}
function addStudyToCalendar() {
  const d = nextDueDate() || new Date(Date.now()+86400000);
  const fmt = dt => dt.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const end = new Date(d.getTime()+15*60000);
  const url = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent('Review flashcards (PollSlide)')
    + '&dates=' + fmt(d) + '/' + fmt(end)
    + '&details=' + encodeURIComponent('Your next spaced-repetition review is due. ' + location.href);
  window.open(url, '_blank');
}

function renderQAList(data){
  const list = document.getElementById('qaList'); if (!list) return;
  const items = Object.entries(data).map(([id,q]) => Object.assign({id}, q)).filter(q => !q.hidden);
  items.sort((a,b) => (b.votes||0)-(a.votes||0) || (a.createdAt||0)-(b.createdAt||0));
  if (!items.length) { list.innerHTML = '<div style="color:var(--muted);font-size:13px;text-align:center;padding:14px;">No questions yet — be the first!</div>'; return; }
  list.innerHTML = items.map(q => {
    const voted = q.voters && q.voters[participantId];
    return `<div style="display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px;margin-bottom:8px;${q.answered?'opacity:0.55;':''}">
      <button onclick="upvoteQuestion('${q.id}')" ${voted?'disabled':''} style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:0;background:${voted?'var(--accent)':'var(--surface)'};border:1px solid ${voted?'var(--accent)':'var(--border)'};border-radius:8px;padding:5px 10px;cursor:${voted?'default':'pointer'};color:${voted?'#fff':'var(--text)'};font-family:inherit;">
        <span style="font-size:12px;line-height:1;">▲</span><span style="font-size:13px;font-weight:700;line-height:1.3;">${q.votes||0}</span></button>
      <div style="flex:1;min-width:0;"><div style="font-size:14px;line-height:1.4;">${escapeQa(q.text)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px;">${escapeQa(q.name||'Anonymous')}${q.answered?' · ✓ answered':''}</div></div>
    </div>`;
  }).join('');
}
// Q&A flood protection — a short cooldown + a per-session cap, so one person can't
// spam the live board. (Client-side deterrent; pair with DB rules for hard limits.)
const QA_COOLDOWN_MS = 8000, QA_MAX_PER_SESSION = 8;
async function submitQuestion(){
  const ta = document.getElementById('qaText'); const text = (ta.value||'').trim();
  const err = document.getElementById('qaErr');
  if (text.length < 3) { err.textContent = 'Type a question first.'; return; }
  const lastKey = 'ql_qa_last_' + SESSION, cntKey = 'ql_qa_count_' + SESSION;
  const last = +(localStorage.getItem(lastKey) || 0), cnt = +(localStorage.getItem(cntKey) || 0);
  const wait = QA_COOLDOWN_MS - (Date.now() - last);
  if (wait > 0) { err.textContent = 'Please wait ' + Math.ceil(wait/1000) + 's before asking again.'; return; }
  if (cnt >= QA_MAX_PER_SESSION) { err.textContent = "You've reached the question limit for this session."; return; }
  err.textContent = '';
  try {
    const ref = db.ref('sessions/' + SESSION + '/qa').push();
    await ref.set({ text: moderateText(text.slice(0,280)), name: participantName || 'Anonymous', votes: 1, voters: { [participantId]: true }, createdAt: Date.now(), answered: false });
    localStorage.setItem(lastKey, String(Date.now()));
    localStorage.setItem(cntKey, String(cnt + 1));
    ta.value = '';
  } catch(e) { err.textContent = 'Could not post — check your connection.'; }
}
async function upvoteQuestion(id){
  try {
    await db.ref('sessions/' + SESSION + '/qa/' + id).transaction(q => {
      if (!q) return q;
      q.voters = q.voters || {};
      if (q.voters[participantId]) return; // one vote per person
      q.voters[participantId] = true;
      q.votes = (q.votes||0) + 1;
      return q;
    });
  } catch(e) {}
}

// ─── BOOT (called last, after all functions defined) ─────────────────────────
// Force full reload when hash changes (new QR scanned for different question).
// In survey mode the hash never changes, so this is a no-op there.
window.addEventListener('hashchange', () => { window.location.reload(); });

bootApp();
</script>
