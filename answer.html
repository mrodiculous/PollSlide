async function joinByCode(){
  const inp = document.getElementById('joinCode');
  const err = document.getElementById('joinErr');
  const btn = document.getElementById('joinBtn');
  const code = String((inp && inp.value) || '').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if (code.length < 4) { err.textContent = t('joinShort','That code looks too short — check it and try again.'); return; }
  err.textContent = '';
  if (inp) inp.disabled = true;
  if (btn) { btn.disabled = true; btn.textContent = t('loading','Loading…'); }
  try {
    const snap = await db.ref(`quiz_builder/${code}/questions`).get();
    if (!snap.exists()) {
      if (inp) inp.disabled = false;
      if (btn) { btn.disabled = false; btn.textContent = t('joinBtn','Join →'); }
      err.textContent = t('joinNotFound','No session found with that code — double-check with your presenter.');
      return;
    }
    // Presenter mid-presentation? Join the question that's live right now.
    let dest = '#' + code;
    try {
      const cur = await db.ref(`sessions/${code}/currentQuestion`).get();
      const cq = cur.exists() ? cur.val() : null;
      if (cq && cq.status === 'active' && cq.qIndex != null && Number(cq.qIndex) >= 0)
        dest = '#' + code + '/' + Number(cq.home != null ? cq.home : cq.qIndex);   // resolved on load
    } catch(e){}
    // Remember this tab joined by code → follow the presenter when they advance.
    try { sessionStorage.setItem('ql_follow_' + code, '1'); sessionStorage.setItem('ql_join_at_' + code, String(Date.now())); } catch(e){}
    location.hash = dest;                       // hashchange listener reloads into the session
    setTimeout(() => location.reload(), 250);   // belt & braces if the listener didn't fire
  } catch(e) {
    if (inp) inp.disabled = false;
    if (btn) { btn.disabled = false; btn.textContent = t('joinBtn','Join →'); }
    err.textContent = t('joinFail','Could not check that code — check your connection.');
  }
}

// Nobody should have to rescan a QR for every question — the phone rides along
// with the presenter. Two ways to earn the follow:
//   • joined by code (no camera) — flagged at join time
//   • scanned the QR for the question that is live RIGHT NOW — the normal
//     scan-and-play case, and the one the audience actually complained about
// A QR that deliberately points at a DIFFERENT question than the live one is the
// Keynote/PowerPoint per-slide workflow (every slide carries its own question's
// QR). Those scans stay pinned — following would drag the scanner off the slide
// they're standing in front of.
// The flag is sticky once earned: once you're in the live flow, you stay in it.
let _following = false;       // one listener, however many times followLive is asked
async function followLive(forceFollow){
  if (QA_MODE || SURVEY_MODE || isNaN(Q_INDEX) || Q_INDEX < 0 || _following) return;
  let follow = false; try { follow = sessionStorage.getItem('ql_follow_' + SESSION) === '1'; } catch(e){}
  /* NEVER JUMP TO A LEFT-OVER QUESTION (2026-10-06). The follow flag lasts as long as the
     browser tab. A phone that followed an EARLIER session, then scans a QR code in the same
     tab, used to jump straight to whatever currentQuestion held — often the last question
     of a previous run (Rod, PowerPoint on the web: scanned Q1, landed on Q4). So when the
     flag comes from earlier, the question already live when this page opened is not
     followed; only a CHANGE is. Unchanged: a phone that just joined by code (it is sent to
     the live question on purpose), a phone that scanned the live question, and a scanned
     question that was deleted (forceFollow — it waits for the next one). */
  let justJoined = false; try { justJoined = (Date.now() - Number(sessionStorage.getItem('ql_join_at_' + SESSION) || 0)) < 60000; } catch(e){}
  const holdFirst = follow && !forceFollow && !justJoined;
  // A scanned code whose question isn't in the deck: ride along with the presenter
  // rather than wait on a screen that would never change.
  if (forceFollow) { follow = true; try { sessionStorage.setItem('ql_follow_' + SESSION, '1'); } catch(e){} }
  if (!follow) {
    try {
      const cur = await db.ref(`sessions/${SESSION}/currentQuestion`).get();
      const cq  = cur.exists() ? cur.val() : null;
      // Is the question this phone scanned the live one? By link number when the presenter
      // publishes one (positions differ after a reorder), else by position as before.
      if (cq && (cq.home != null ? Number(cq.home) === Q_LINK : (cq.qIndex != null && Number(cq.qIndex) === Q_INDEX))) {
        follow = true;
        try { sessionStorage.setItem('ql_follow_' + SESSION, '1'); } catch(e){}
      }
    } catch(e){}
  }
  if (!follow) return;
  _following = true;
  // Watch the whole node rather than just qIndex: currentQuestion.id IS the bucket the
  // presenter writes answers to, and guessing it from the index is exactly what broke
  // when a deck was reordered.
  let _firstFollow = true;
  db.ref(`sessions/${SESSION}/currentQuestion`).on('value', snap => {
    const cq = snap.exists() ? snap.val() : null;
    const first = _firstFollow; _firstFollow = false;
    if (!cq) return;
    if (first && holdFirst) {
      const i0 = cq.qIndex != null ? Number(cq.qIndex) : NaN;
      const sameQuestion = !!(cq.id && cq.id === STABLE_QID) || i0 === Q_INDEX;
      if (!sameQuestion) return;     // left over from before this page opened — stay on the scanned question
    }
    if (cq.id) _liveQ = cq;
    const idx = cq.qIndex != null ? Number(cq.qIndex) : NaN;
    /* The presenter MOVED the live question (qid.js / presenter syncLivePosition): same
       question, new position. Don't reload it — that would wipe a half-made selection. */
    if (!isNaN(idx) && idx >= 0 && idx !== Q_INDEX && cq.id && cq.id === STABLE_QID) {
      Q_INDEX = idx; Q_LINK = cq.home != null ? Number(cq.home) : linkForIndex(idx);
      try { history.replaceState(null, '', '#' + SESSION + '/' + Q_LINK); } catch(e){}
      return;
    }
    if (!isNaN(idx) && idx >= 0 && idx !== Q_INDEX) {
      goToQuestion(idx);   // IN-PLACE swap — no full page reload (fast + reliable on mobile)
    }
    /* We deliberately do NOT set STABLE_QID = cq.id for the current question any more.
       The bucket is derived from quiz_builder in loadQuestion (the shared source of
       truth), so a driver that publishes a positional/guessed id — the native Mac
       companion does, from the slide index alone — can never drag this phone onto a
       bucket the companion and presenter are not reading. */
  });
}

// Advance to a new live question WITHOUT reloading the page. A full reload re-inited
// Firebase, re-authed, and re-fetched everything on every advance — slow and flaky on
// phones (Rod: "taking forever, had to reload"). This swaps the question in place.
/* ── "Did I get it right?" (2026-10-07) ─────────────────────────────────────────
 * When the presenter reveals a graded question, the phone now says Correct / Partly right /
 * Not quite and shows the right answer. Before, the reveal reached everything except the
 * person who answered: they were left on "✓ Submitted!".
 *
 * READ-ONLY and additive. It listens to sessions/<code>/qstate/<bucket>/phase — the node
 * presenter.html and the PowerPoint add-in already write ('revealed', then 'post_reveal';
 * a reset writes 'live', which takes the banner away again). It never writes anything,
 * never changes how an answer is submitted, scored or bucketed, and the bucket is the same
 * STABLE_QID the answer was written to (see the session-state contract). The verdict is the
 * phone's own stored response (isCorrect was already computed on submit); a phone that
 * reloads after answering reads it back from responses/<bucket>/<participantId>. Polls,
 * surveys and questions without a correct answer are untouched: nothing is attached. */
let _rvRef = null, _rvQid = null, _rvPhase = null, _rvMine = null;
/* A reveal left over from an EARLIER run must never show (2026-10-08): qstate outlives a
 * session, so a quiz revealed last week and run again from Keynote would otherwise hand a
 * participant the answer the moment they answered. A reveal counts only if this phone SAW the
 * question go from not-revealed to revealed while it was open, or the reveal is stamped
 * (revealedAt) after this phone's own answer — the reload-after-answering case. */
let _rvSawOpen = false, _rvAt = 0;
function _rvGradable(q) {
  if (!q || (q.type !== 'multiple_choice' && q.type !== 'multiple_choice_multi')) return false;
  const c = q.correctAnswer;
  return !(c === null || c === undefined || c === '' || (Array.isArray(c) && !c.length));
}
function stopRevealWatch() {
  if (_rvRef) { try { _rvRef.off(); } catch (e) {} }
  _rvRef = null; _rvQid = null; _rvPhase = null; _rvMine = null; _rvSawOpen = false; _rvAt = 0;
  const el = document.getElementById('revealResult'); if (el) el.remove();
}
function startRevealWatch() {
  if (!SESSION || !STABLE_QID || !_rvGradable(questionData)) { stopRevealWatch(); return; }
  if (_rvRef && _rvQid === STABLE_QID) return;
  stopRevealWatch();
  const qid = _rvQid = STABLE_QID;
  try {
    _rvRef = db.ref(`sessions/${SESSION}/qstate/${qid}`);
    _rvRef.on('value', snap => {
      if (qid !== STABLE_QID) return;
      const st = snap.val() || {};
      _rvPhase = st.phase || null;
      _rvAt = Number(st.revealedAt) || 0;
      if (_rvPhase !== 'revealed' && _rvPhase !== 'post_reveal') _rvSawOpen = true;   // seen open → a later reveal is THIS run's
      renderRevealResult();
    }, () => {});
  } catch (e) { _rvRef = null; }
}
function reapplyReveal() { if (_rvPhase) renderRevealResult(); }
async function renderRevealResult() {
  const qid = STABLE_QID, q = questionData;
  const shown = (_rvPhase === 'revealed' || _rvPhase === 'post_reveal') && _rvGradable(q);
  document.querySelectorAll('.option.rv-correct, .option.rv-dim').forEach(o => o.classList.remove('rv-correct', 'rv-dim'));
  let el = document.getElementById('revealResult');
  if (!shown) { if (el) el.remove(); return; }
  let mine = _rvMine;
  if (!mine && participantId) {
    try { const s = await db.ref(`sessions/${SESSION}/responses/${qid}/${participantId}`).get(); if (s.exists()) mine = _rvMine = s.val(); } catch (e) {}
  }
  if (qid !== STABLE_QID || !(_rvPhase === 'revealed' || _rvPhase === 'post_reveal')) return;
  // Only a reveal from THIS run (see above). Otherwise show nothing at all.
  const thisRun = _rvSawOpen || (_rvAt && mine && mine.submittedAt && _rvAt >= Number(mine.submittedAt) - 5000);
  if (!thisRun) { el = document.getElementById('revealResult'); if (el) el.remove(); return; }
  const letters = ['A','B','C','D','E','F','G','H'];
  const right = (Array.isArray(q.correctAnswer) ? q.correctAnswer : [q.correctAnswer]).map(Number).filter(n => !isNaN(n));
  const answerText = right.map(i => letters[i] + '. ' + esc(((q.options || [])[i] || {}).text || '')).join(' · ');
  const v = mine ? mine.isCorrect : undefined;
  const cls = v === true ? 'rv-ok' : (typeof v === 'number' && v > 0) ? 'rv-part' : (mine ? 'rv-no' : 'submitted');
  const head = v === true ? '✓ ' + t('rvCorrect', 'Correct!')
             : (typeof v === 'number' && v > 0) ? '◐ ' + t('rvPartial', 'Partly right')
             : mine ? '✗ ' + t('rvWrong', 'Not quite') : '';
  const html = `<div id="revealResult" class="status-box ${cls}" style="margin-top:14px;" role="status" aria-live="polite">${head}` +
               `<span class="rv-ans">${t('rvAnswer', 'Answer:')} ${answerText}</span></div>`;
  el = document.getElementById('revealResult');
  if (el) el.outerHTML = html;
  else (document.getElementById('qBody') || document.getElementById('app')).insertAdjacentHTML('beforeend', html);
  // On a single-choice screen the options are still there: light up the right one.
  right.forEach(i => { const o = document.getElementById('opt' + i); if (o) o.classList.add('rv-correct'); });
  document.querySelectorAll('.option[id^="opt"]').forEach(o => { if (!o.classList.contains('rv-correct')) o.classList.add('rv-dim'); });
}

function goToQuestion(idx){
  if (idx === Q_INDEX) return;
  stopRevealWatch();
  Q_INDEX = idx;
  _linkResolved = true;       // idx is a POSITION (from currentQuestion), already resolved
  clearTimeout(_waitRetry);   // a pending re-check must not redraw this question mid-answer
  Q_LINK = linkForIndex(idx);
  focusResetForQuestion();   // per question, so a teacher sees WHICH one they left on
  STABLE_QID = (_liveQ && _liveQ.id && Number(_liveQ.qIndex) === idx)
    ? _liveQ.id
    : PSQid.bucket(null, idx, SESSION);   // legacy key until the presenter tells us
  // Clean per-question interaction state so the new question starts fresh.
  answered = false; submitting = false;
  selectedOptions = new Set();
  window._rating = null;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  // Keep the URL correct but DON'T trigger the hashchange→reload path (replaceState
  // doesn't fire hashchange), so the follow is instant.
  try { history.replaceState(null, '', '#' + SESSION + '/' + Q_LINK); } catch(e){}
  loadQuestion();
}

// ─── NAME ENTRY ───────────────────────────────────────────────────────────────
/* When the teacher assigned this deck to a class, the student picks themselves
 * from the roster instead of typing a name. That is what makes the answer carry a
 * STABLE id, so a report can follow one student across decks and across a term —
 * a typed name never could, because the same person types it differently, or from
 * a different device, or not at all.
 *
 * The roster carries first name + last initial only. Full names never leave the
 * teacher's own account: quiz_builder is public-read, and a class list of
 * children's names behind a code that is displayed on a screen is not a list we
 * are willing to publish. */
function showRosterPicker() {
  _currentRenderer = showRosterPicker;
  const rows = ROSTER.map(st =>
    `<button class="btn btn-ghost" style="width:100%;justify-content:flex-start;margin-bottom:6px;padding:11px 14px;font-size:14px;"
       onclick="pickStudent('${escapeQa(st.id)}')">${escapeQa(st.name)}</button>`).join('');
  render(`
    ${logoMarkup()}
    <h1>${t('whoAreYou','Who are you?')}</h1>
    <p class="subtitle">${CLASS_NAME ? escapeQa(CLASS_NAME) : t('pickYourName','Find your name in the list.')}</p>
    <div style="max-height:46vh;overflow-y:auto;margin-bottom:10px;">${rows}</div>
    <p style="font-size:12px;color:var(--muted);line-height:1.5;">${t('notOnList','Not on the list? Ask your teacher to add you.')}</p>`);
}

/* Picking a name is a claim, not proof. A PIN the student sets on first use stops
 * the realistic problem — a classmate tapping someone else's name — without giving
 * the teacher 30 codes to hand out. It is not proctoring, and the copy says so. */
function pickStudent(id) {
  const st = ROSTER.find(x => x.id === id);
  if (!st) return;
  _pendingStudent = st;
  showPinEntry();
}

let _pendingStudent = null;

function showPinEntry() {
  _currentRenderer = showPinEntry;
  const st = _pendingStudent; if (!st) { showRosterPicker(); return; }
  render(`
    ${logoMarkup()}
    <h1>${escapeQa(st.name)}</h1>
    <p class="subtitle">${VERIFY_MODE === 'pin'
      ? t('pinIntro','Set a 4-digit PIN the first time. You\'ll use the same one from now on.')
      : VERIFY_MODE === 'email'
        ? t('emailIntro','Enter the code your teacher emailed you.')
        : t('codeIntro','Enter the code your teacher gave you.')}</p>
    <label>${VERIFY_MODE === 'pin' ? t('yourPin','Your PIN') : t('yourCode','Your code')}</label>
    ${VERIFY_MODE === 'pin'
      ? `<input type="tel" inputmode="numeric" pattern="[0-9]*" id="pinInput" maxlength="8" autocomplete="off"
             placeholder="••••" style="letter-spacing:.4em;text-align:center;font-size:20px;" autofocus
             onkeydown="if(event.key==='Enter')submitPin()">`
      : `<input type="text" id="pinInput" maxlength="10" autocomplete="off" autocapitalize="characters"
             placeholder="XXXXXX" style="letter-spacing:.28em;text-align:center;font-size:19px;text-transform:uppercase;" autofocus
             onkeydown="if(event.key==='Enter')submitPin()">`}
    <div class="err" id="pinErr"></div>
    <button class="btn btn-primary" id="pinBtn" onclick="submitPin()">${t('continue','Continue →')}</button>
    <button class="btn btn-ghost" style="margin-top:8px;" onclick="notMe()">${t('notMe','← That\'s not me')}</button>
    <p style="font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.5;">${VERIFY_MODE === 'pin'
      ? t('pinForgot','Forgotten it? Your teacher can reset it for you.')
      : t('codeForgot','Haven\'t got a code? Ask your teacher.')}</p>`);
}

async function submitPin() {
  const st = _pendingStudent; if (!st) return;
  const pin = (document.getElementById('pinInput').value || '').trim();
  const err = document.getElementById('pinErr'), btn = document.getElementById('pinBtn');
  if (VERIFY_MODE === 'pin') {
    if (!/^\d{4,8}$/.test(pin)) { err.textContent = t('pinFormat','Use 4 to 8 digits.'); return; }
  } else if (pin.replace(/[^A-Za-z0-9]/g,'').length < 4) {
    err.textContent = t('codeFormat','That code looks too short.'); return;
  }
  btn.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/student-claim', { method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ session: SESSION, studentId: st.id, pin }) });
    const d = await r.json().catch(() => null);
    if (!r.ok) { err.textContent = (d && d.error) || t('pinFailed','Could not check that. Try again.'); btn.disabled = false; return; }
    studentId = st.id;
    participantName = st.name;
    try {
      localStorage.setItem('ql_student_' + SESSION, st.id);
      localStorage.setItem(`ql_name_${SESSION}`, st.name);
    } catch(e) {}
    joinSession(true);
  } catch(e) {
    err.textContent = t('pinOffline','No connection — check and try again.');
    btn.disabled = false;
  }
}

/* The escape. A mis-tap must be undoable by the student in the moment, not by the
 * teacher afterwards in a report. */
function notMe() {
  _pendingStudent = null;
  studentId = null;
  try { localStorage.removeItem('ql_student_' + SESSION); } catch(e) {}
  showRosterPicker();
}

function showNameEntry() {
  // A deck assigned to a class identifies people from its roster instead.
  if (ROSTER.length) { showRosterPicker(); return; }
  _currentRenderer = showNameEntry;
  render(`
    <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="22" height="22" style="flex-shrink:0;"><rect width="100" height="100" rx="22" fill="#0d0d18"/><rect x="18" y="58" width="16" height="24" rx="4" fill="#ff6584"/><rect x="42" y="42" width="16" height="40" rx="4" fill="#f7b731"/><rect x="66" y="22" width="16" height="60" rx="4" fill="#6c63ff"/><polygon points="72,32 72,40 78,36" fill="rgba(255,255,255,0.8)"/></svg>PollSlide</div>
    <h1>${t('enterName','Enter Your Name')}</h1>
    <p class="subtitle">${t('nameOnce','You only need to do this once per session.')}</p>
    <label>${t('yourName','Your Name')}</label>
    <input type="text" id="nameInput" maxlength="60" placeholder="${t('yourName','Your name')}" autofocus>
    <button class="btn btn-primary" onclick="joinSession()">${t('continue','Continue →')}</button>
    <p id="nameErr" style="color:var(--accent2);font-size:13px;margin-top:10px;text-align:center;"></p>
  `);
  document.getElementById('nameInput').addEventListener('keydown', e => { if(e.key==='Enter') joinSession(); });
}

function joinSession(fromRoster) {
  // Picked from a class roster: the name is already set and there is no name box
  // on screen to read — reading it would throw and the student would be stuck.
  if (!fromRoster) {
    const name = document.getElementById('nameInput').value.trim();
    if (!name) { document.getElementById('nameErr').textContent = t('enterNamePlease','Please enter your name.'); return; }

    participantName = moderateName(name); // cap at 60 + mask profanity / strip links in the display name
    if (!participantName) { document.getElementById('nameErr').textContent = t('enterNamePlease','Please enter your name.'); return; }
  }
  // Per-device id, still used for de-duplicating answers within a session. When the
  // deck belongs to a class, studentId is the identity that actually matters.
  participantId = 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2,5);

  // localStorage (not sessionStorage) so the name survives a new tab / fresh QR scan per question,
  // and the same person keeps ONE id across all questions → accurate cumulative quiz scoring.
  localStorage.setItem(`ql_pid_${SESSION}`,  participantId);
  localStorage.setItem(`ql_pname_${SESSION}`, participantName);

  routeAfterIdentity();   // team pick first when the presenter enabled team play
}

// ─── LOAD QUESTION ────────────────────────────────────────────────────────────
function renderWaitingForQuestion() {
  render(`<div style="text-align:center;padding:30px 0 20px;">
      <div style="font-size:40px;margin-bottom:12px;">⏳</div>
      <h1 style="margin-bottom:8px;">${t('waitingTitle','Waiting...')}</h1>
      <p class="subtitle">${t('qUnavailable','This question isn’t available right now.<br>Stay on this page — it opens as soon as your presenter shows a question.')}</p>
      <div style="background:var(--surface2);border-radius:var(--radius-sm);padding:10px 16px;font-size:13px;color:var(--muted);margin-top:12px;">
        Session <strong style="color:var(--accent4);">${SESSION}</strong></div></div>`);
}
async function loadQuestion() {
  /* Identity comes first. A student part-way through picking their name or typing
   * their PIN must not have the screen pulled out from under them by the question
   * watcher — which is exactly what happened: the PIN screen was replaced by
   * "Waiting…" before anyone could finish typing. */
  if (_pendingStudent) return;                       // typing a PIN
  if (ROSTER.length && !studentId) return;           // still choosing who they are
  _currentRenderer = loadQuestion;
  render(`<div class="spinner"></div><p class="center" style="color:var(--muted);font-size:13px;">${t('loading','Loading...')}</p>`);

  // A link number that isn't in this deck (removed, or published a moment from now) is
  // never read as a position — that would open a DIFFERENT question. Wait and re-check.
  if (!(await resolveLink())) {
    renderWaitingForQuestion();
    followLive(true);
    // Not a real position: whatever question goes live next is "different" and gets opened.
    if (Q_INDEX >= 0) Q_INDEX = -99;
    clearTimeout(_waitRetry);
    _waitRetry = setTimeout(() => { if (!_linkResolved) loadQuestion(); }, 3000);
    return;
  }
  // Load question definition from quiz_builder
  const qSnap = await db.ref(`quiz_builder/${SESSION}/questions/${Q_INDEX}`).get();
  if (!qSnap.exists()) {
    render(`
      <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="22" height="22" style="flex-shrink:0;"><rect width="100" height="100" rx="22" fill="#0d0d18"/><rect x="18" y="58" width="16" height="24" rx="4" fill="#ff6584"/><rect x="42" y="42" width="16" height="40" rx="4" fill="#f7b731"/><rect x="66" y="22" width="16" height="60" rx="4" fill="#6c63ff"/><polygon points="72,32 72,40 78,36" fill="rgba(255,255,255,0.8)"/></svg>PollSlide</div>
      <div style="text-align:center;padding:10px 0 20px;">
        <div style="font-size:40px;margin-bottom:12px;animation:gentle 2s ease-in-out infinite;">⏳</div>
        <h1 style="margin-bottom:8px;">Waiting...</h1>
        <p class="subtitle">Question ${Q_INDEX+1} isn't ready yet.<br>Stay on this page.</p>
        <div style="background:var(--surface2);border-radius:var(--radius-sm);padding:10px 16px;font-size:13px;color:var(--muted);margin-top:12px;">
          Session <strong style="color:var(--accent4);">${SESSION}</strong>
        </div>
      </div>
      <style>@keyframes gentle{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}</style>
    `);
    setTimeout(loadQuestion, 3000);
    return;
  }

  questionData = qSnap.val();

  /* Derive the response bucket from the QUESTION, the way every other surface does.
     ------------------------------------------------------------------------------
     STABLE_QID starts as the positional q<idx>_stable_<code> and used to be corrected
     ONLY by currentQuestion. That is fine while a controller is publishing — but when
     one is not, nothing ever corrected it, and the phone answered into a bucket no
     reader was watching:

       presenting from PowerPoint with the content add-in (nothing publishes
       currentQuestion, by design — one add-in object per slide must never write
       session-wide state) → phone wrote q0_stable_CODE, the slide watched
       qzabc_CODE → the answer was stored successfully and counted nowhere.

     It also made "Clear tally" look broken: resetQuestionTally (presenter.html:7147)
     removes PSQid.bucket(...) — the ID bucket — so the phone's positional answer
     survived the clear and the next scan said "You already answered this question".

     PSQid.bucket is the same pure function presenter.html, companion.html, present.html
     and the add-in all use, so this makes every surface agree. For a question with no
     id, or a legacy q<n>_stable id at index n, it returns exactly the string used
     before — so nothing moves for existing decks.

     This is now UNCONDITIONAL — it no longer defers to currentQuestion.id. A driver can
     publish a bucket that DISAGREES with quiz_builder: the native Mac companion follows
     the slide's QR and knows only the slide INDEX, so it publishes a positional
     q<idx>_stable_<code> pointer. A following phone that trusted that wrote to the
     positional bucket while the companion (targeted mode) read the real quiz_builder id —
     so a legacy-id question (positional == real) registered and a fresh 'qz…' question
     did not. That is the "answer works on one question, not the other, especially with
     the Mac companion" bug. The phone's own loaded question is the source of truth every
     other surface also reads, so deriving from it makes them agree no matter what pointer
     the driver publishes. */
  try { STABLE_QID = PSQid.bucket(questionData, Q_INDEX, SESSION); } catch (e) {}
  startRevealWatch();   // read-only: shows Correct / Not quite when the presenter reveals

  // Check if this participant already answered this question
  // Response is stored at: sessions/SESSION/responses/STABLE_QID/participantId
  const myRespSnap = await db.ref(`sessions/${SESSION}/responses/${STABLE_QID}/${participantId}`).get();
  /* How many tries have they used? The counted answer is one node; the full history
   * is another, and the history is what the limit is counted from — under a `first`
   * policy the counted answer never changes, so counting that would let someone
   * retake forever. An unreadable history falls back to "they have answered once",
   * which errs toward refusing rather than granting a free extra try. */
  _attemptsUsed = 0;
  if (myRespSnap.exists()) {
    try {
      const hist = await db.ref(`sessions/${SESSION}/attempts/${STABLE_QID}/${participantId}`).get();
      _attemptsUsed = Math.max(1, PSRetakes.attemptsUsed(hist.exists() ? hist.val() : null));
    } catch (e) { _attemptsUsed = 1; }
  }
  if (myRespSnap.exists() && !PSRetakes.canRetake(RETAKES, _attemptsUsed)) {
    answered = true;
    showAlreadyAnswered();
    return;
  }
  if (myRespSnap.exists()) {
    // They may try again — show what they said last time and what a retake is worth,
    // rather than a blank form that hides the fact they have already answered.
    answered = true;
    showRetakeOffer(myRespSnap.val());
    return;
  }

  answered = false;
  answerStartTime = Date.now();
  // Fresh per-question mode state (survival: am I out? streak: what's my run?). Classic
  // returns immediately, so the default path is unchanged.
  _wagerPick = 1; _wagerLocked = (GAME_MODE !== 'wager');
  await refreshModeState();
  // Paint NOW, in the deck's language. Translation used to be awaited here, which
  // meant the whole room stared at a blank screen for however long the model took —
  // and the better the model, the longer the stall. The viewer's language is swapped
  // in as soon as it lands, and only if they haven't started answering yet.
  showQuestion(questionData);
  if (LANG !== DECK_LANG) {
    translateQuestion(questionData)
      .then(() => { if (answerUntouched()) showQuestion(questionData); })
      .catch(() => {});
    // …and warm the REST of the deck in the background, so the next advance is
    // instant instead of another round-trip.
    prewarmDeckTranslation();
  }
}

// ─── SHOW QUESTION ────────────────────────────────────────────────────────────
function isVideoUrl(url) {
  if (!url) return false;
  const u = url.split('?')[0].toLowerCase();
  return u.endsWith('.mp4') || u.endsWith('.webm') || u.endsWith('.mov') || u.endsWith('.m4v') || u.includes('/video/');
}

function videoAttrs(opts) {
  opts = opts || { loop:true, autoplay:true, muted:true, controls:false };
  let a = 'playsinline ';
  if (opts.loop) a += 'loop ';
  if (opts.muted || opts.autoplay) a += 'muted ';   // autoplay needs muted
  if (opts.autoplay) a += 'autoplay ';
  if (opts.controls) a += 'controls ';
  return a;
}

function mediaTag(url, opts, className) {
  if (!url || !url.trim()) return '';
  if (isVideoUrl(url)) {
    return `<video class="${className}" src="${url}" ${videoAttrs(opts)}></video>`;
  }
  return `<img class="${className}" src="${url}" onerror="this.style.display='none'">`;
}

function showQuestion(q) {
  const isMulti  = q.type === 'multiple_choice_multi';
  const isText   = q.type === 'free_text';
  const isRating = q.type === 'rating';
  const letters  = ['A','B','C','D','E','F'];

  let body = '';
  if (isText) {
    body = `
      <textarea id="txtAns" placeholder="${t('typeAnswer','Type your answer here...')}"></textarea>
      <button class="btn btn-primary" onclick="submitAnswer()">${t('submitAnswer','Submit Answer')}</button>`;
  } else if (isRating) {
    const max = q.ratingMax || 5;
    const labels = q.ratingLabels || {};
    body = `
      <div class="rating-wrap" id="ratingWrap">
        ${Array.from({length:max},(_,i)=>`<button class="r-btn" id="rb${i+1}" onclick="selectRating(${i+1})">${i+1}</button>`).join('')}
      </div>
      ${labels.low||labels.high ? `<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:14px;"><span id="ratingLow">${esc(labels.low)}</span><span id="ratingHigh">${esc(labels.high)}</span></div>` : ''}
      <button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>${t('submitRating','Submit Rating')}</button>`;
  } else {
    body = `
      ${isMulti ? `<p class="multi-hint">${t('selectAll','✓ Select all that apply')}</p>` : ''}
      <div class="options-grid">
        ${(q.options||[]).map((opt,i) => {
          const hasImg = opt.img && opt.img.trim();
          return `
          <button class="option ${hasImg?'has-img':''}" id="opt${i}" onclick="toggleOpt(${i})">
            <span class="opt-letter">${letters[i]}</span>
            ${hasImg?mediaTag(opt.img, opt.videoOpts, 'opt-img'):''}
            <span>${esc(opt.text)}</span>
          </button>`;
        }).join('')}
      </div>
      ${isMulti ? `<button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>${t('submitAnswers','Submit Answers')}</button>` : ''}`;
  }

  const qImage = mediaTag(q.image, q.videoOpts, 'q-image');

  const timerHtml = (q.timer && q.timer > 0)
    ? `<div class="timer-bar" id="timerBar">
         <svg class="timer-ring" viewBox="0 0 36 36">
           <circle cx="18" cy="18" r="16" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
           <circle id="timerCircle" cx="18" cy="18" r="16" fill="none" stroke="var(--accent)" stroke-width="3"
                   stroke-dasharray="100.5" stroke-dashoffset="0" stroke-linecap="round"
                   transform="rotate(-90 18 18)"/>
         </svg>
         <div>
           <div class="timer-text" id="timerText">${q.timer}s</div>
           <div class="timer-label">to answer</div>
         </div>
       </div>` : '';

  // ── SURVIVAL: knocked out ──────────────────────────────────────────────────
  // They stay in the room as a spectator — still see every question, just can't score.
  // Deliberately dramatic, because that's the whole point of the mode.
  if (GAME_MODE === 'survival' && _survivalOut) {
    render(`
      <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="22" height="22" style="flex-shrink:0;"><rect width="100" height="100" rx="22" fill="#0d0d18"/><rect x="18" y="58" width="16" height="24" rx="4" fill="#ff6584"/><rect x="42" y="42" width="16" height="40" rx="4" fill="#f7b731"/><rect x="66" y="22" width="16" height="60" rx="4" fill="#6c63ff"/><polygon points="72,32 72,40 78,36" fill="rgba(255,255,255,0.8)"/></svg>PollSlide</div>
      <div style="text-align:center;padding:14px 0 4px;">
        <div style="font-size:54px;line-height:1;">💀</div>
        <h1 style="margin:12px 0 4px;">${t('outTitle','You\'re out!')}</h1>
        <p class="subtitle">${t('outSub','You survived')} <b style="color:var(--accent4);">${_survivedCount}</b> ${_survivedCount===1?t('outQ','question'):t('outQs','questions')}.</p>
      </div>
      <div style="background:rgba(255,101,132,0.10);border:1px solid rgba(255,101,132,0.3);border-radius:12px;padding:13px 15px;font-size:13px;color:var(--muted);line-height:1.6;text-align:center;">
        ${t('outWatch','Stay on this screen — you\'ll still see every question as it comes up.')}
        ${_aliveCount !== null ? `<div style="margin-top:7px;color:var(--text);font-weight:700;">${_aliveCount} ${t('modeStillIn','still in')}</div>` : ''}
      </div>
      <div class="q-badge" style="margin-top:16px;">${t('question','Question')} ${Q_INDEX+1}</div>
      ${qImage}
      <div class="q-text" style="opacity:0.75;">${esc(q.text)}</div>
    `);
    return;
  }

  // ── WAGER: place your bet before the options appear ────────────────────────
  const wagerGate = (GAME_MODE === 'wager' && !_wagerLocked) ? `
    <div id="qBody">
      <div style="background:rgba(167,139,250,0.10);border:1px solid rgba(167,139,250,0.32);border-radius:14px;padding:16px;">
        <div style="text-align:center;font-family:'Syne',sans-serif;font-weight:800;font-size:16px;margin-bottom:4px;">🎲 ${t('wagerTitle','How confident are you?')}</div>
        <div style="text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.5;">${t('wagerSub','Bet before you answer. Higher bets win more — but cost you if you\'re wrong.')}</div>
        ${[[1,t('wagerSafe','Safe'),t('wagerSafeNote','Win 1 · lose nothing'),'#43e97b'],
           [2,t('wagerRisky','Risky'),t('wagerRiskyNote','Win 2 · lose 1'),'#f7b731'],
           [3,t('wagerBold','Bold'),t('wagerBoldNote','Win 3 · lose 2'),'#ff6584']].map(([mult,label,note,col]) => `
          <button class="btn" style="width:100%;margin-bottom:9px;display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid ${col}55;color:var(--text);text-align:left;padding:12px 14px;" onclick="placeWager(${mult})">
            <span style="font-family:'Syne',sans-serif;font-weight:900;font-size:20px;color:${col};min-width:34px;">${mult}×</span>
            <span style="flex:1;"><span style="display:block;font-weight:700;font-size:14px;">${label}</span>
            <span style="display:block;font-size:11.5px;color:var(--muted);margin-top:1px;">${note}</span></span>
          </button>`).join('')}
      </div>
    </div>` : '';

  render(`
    <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="22" height="22" style="flex-shrink:0;"><rect width="100" height="100" rx="22" fill="#0d0d18"/><rect x="18" y="58" width="16" height="24" rx="4" fill="#ff6584"/><rect x="42" y="42" width="16" height="40" rx="4" fill="#f7b731"/><rect x="66" y="22" width="16" height="60" rx="4" fill="#6c63ff"/><polygon points="72,32 72,40 78,36" fill="rgba(255,255,255,0.8)"/></svg>PollSlide</div>
    <div class="q-badge">${t('question','Question')} ${Q_INDEX+1}</div>
    ${modeBannerHtml()}
    ${timerHtml}
    ${qImage}
    <div class="q-text">${esc(q.text)}</div>
    ${wagerGate || `<div id="qBody">${body}</div>`}
  `);

  reapplyReveal();
  // Start countdown if timer set. In wager mode the clock starts once the bet is placed,
  // so nobody loses their speed/answer window while deciding how much to risk.
  if (q.timer && q.timer > 0 && !(GAME_MODE === 'wager' && !_wagerLocked)) startTimer(q.timer);
}

// Lock in a wager, then reveal the options. Also restarts the answer clock so a slow
// bet never counts against them (matters in speed-scored rounds).
function placeWager(mult) {
  _wagerPick = (mult >= 1 && mult <= 3) ? mult : 1;
  _wagerLocked = true;
  answerStartTime = Date.now();
  showQuestion(questionData);
}

// ─── COUNTDOWN TIMER ──────────────────────────────────────────────────────────
let timerInterval = null;
function startTimer(seconds) {
  const total = seconds;
  // Count down from when the question actually opened, not from "now". showQuestion()
  // can run more than once for the same question (translations arriving), and a naive
  // reset would silently hand that person a fresh full timer while everyone else's
  // kept running. Also makes the clock honest about time spent loading.
  const elapsed = Math.max(0, Math.floor((Date.now() - (answerStartTime || Date.now())) / 1000));
  let remaining = Math.max(0, seconds - elapsed);
  const circle = document.getElementById('timerCircle');
  const text   = document.getElementById('timerText');
  const circumference = 100.5;
  if (text) text.textContent = remaining + 's';   // paint the true value before the first tick

  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    remaining--;
    if (text) {
      text.textContent = remaining + 's';
      if (remaining <= 5) text.classList.add('warn');
    }
    if (circle) {
      const offset = circumference * (1 - remaining / total);
      circle.style.strokeDashoffset = offset;
      if (remaining <= 5) circle.style.stroke = 'var(--accent2)';
    }
    if (remaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      if (!answered) {
        // Time's up — lock the question
        answered = true;
        const qb = document.getElementById('qBody');
        if (qb) {
          document.querySelectorAll('.option, .r-btn, #txtAns, #submitBtn').forEach(el => {
            el.style.pointerEvents = 'none'; el.style.opacity = '0.5';
          });
          qb.insertAdjacentHTML('afterbegin', '<div class="expired-box">⏱ Time\'s up! Answering is now closed.</div>');
        }
      }
    }
  }, 1000);
}

// ─── INTERACTION ──────────────────────────────────────────────────────────────
function toggleOpt(i) {
  if (answered) return;
  const isMulti = questionData.type === 'multiple_choice_multi';
  if (!isMulti) {
    selectedOptions.clear(); selectedOptions.add(i);
    document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
    document.getElementById(`opt${i}`).classList.add('selected');
    document.querySelectorAll('.option').forEach(el => el.style.pointerEvents = 'none');
    answered = true;
    submitToDb([i]);
    document.getElementById('qBody').insertAdjacentHTML('beforeend',
      '<div class="status-box submitted" style="margin-top:14px;">' + t('submitted','✓ Submitted!') + '</div>');
    reapplyReveal();
  } else {
    if (selectedOptions.has(i)) { selectedOptions.delete(i); document.getElementById(`opt${i}`).classList.remove('selected'); }
    else { selectedOptions.add(i); document.getElementById(`opt${i}`).classList.add('selected'); }
    const sb = document.getElementById('submitBtn');
    if (sb) sb.disabled = selectedOptions.size === 0;
  }
}

function selectRating(val) {
  document.querySelectorAll('.r-btn').forEach((b,i) => b.classList.toggle('sel', i+1 <= val));
  window._rating = val;
  const sb = document.getElementById('submitBtn');
  if (sb) sb.disabled = false;
}

function submitAnswer() {
  if (answered) return;
  answered = true;
  let answer;
  const q = questionData;
  if (q.type === 'free_text')            answer = moderateText(document.getElementById('txtAns')?.value?.trim() || '');
  else if (q.type === 'rating')          answer = window._rating || null;
  else if (q.type === 'multiple_choice_multi') answer = Array.from(selectedOptions);
  submitToDb(answer);
  document.getElementById('qBody').innerHTML =
    '<div class="status-box submitted">' + t('submitted','✓ Submitted!') + '</div>' + submittedModeNoteHtml();
  reapplyReveal();
}

// A line of mode flavour right after answering, so the phone feels part of the game
// instead of just a form. Classic shows nothing extra.
function submittedModeNoteHtml() {
  const wrap = (html) => `<div style="text-align:center;font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.6;">${html}</div>`;
  if (GAME_MODE === 'speed') {
    const secs = ((Date.now() - (answerStartTime || Date.now())) / 1000).toFixed(1);
    return wrap(`⚡ ${t('speedLocked','Locked in at')} <b style="color:#38d9f5;">${secs}s</b>`);
  }
  if (GAME_MODE === 'streak' && _streakCount > 0) return wrap(`🔥 ${t('streakRiding','Riding a streak of')} <b style="color:#f7b731;">${_streakCount}</b>`);
  if (GAME_MODE === 'survival') return wrap(`💀 ${t('survivalHold','Get it right to stay in…')}`);
  if (GAME_MODE === 'wager')   return wrap(`🎲 ${t('wagerPlaced','You bet')} <b style="color:#a78bfa;">${_wagerPick}×</b>`);
  return '';
}

async function submitToDb(answer) {
  if (submitting) return; // prevent double-submit
  submitting = true;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  const elapsed = Date.now() - (answerStartTime || Date.now());
  const q = questionData;
  let isCorrect = null;

  if ((q.type === 'multiple_choice' || q.type === 'multiple_choice_multi') &&
      q.correctAnswer !== null && q.correctAnswer !== undefined) {
    if (q.type === 'multiple_choice') {
      const a = Array.isArray(answer) ? answer[0] : answer;
      // Coerce both sides — correctAnswer can round-trip through Firebase as a string
      // (e.g. "0"), and strict === would then score a correct answer as wrong.
      isCorrect = Number(a) === Number(q.correctAnswer);
    } else {
      // Partial credit: each correct selection earns a fraction; no bonus for wrong picks
      const correctSet = new Set(Array.isArray(q.correctAnswer) ? q.correctAnswer.map(Number) : [Number(q.correctAnswer)]);
      const givenArr   = Array.isArray(answer) ? answer.map(Number) : [];
      const wrongPicked    = givenArr.filter(a => !correctSet.has(a)).length;
      const correctPicked  = givenArr.filter(a => correctSet.has(a)).length;
      if (correctSet.size === 0) {
        isCorrect = null;
      } else if (wrongPicked > 0) {
        isCorrect = false;                                         // wrong answer chosen = 0
      } else if (correctPicked === correctSet.size) {
        isCorrect = true;                                          // all correct, none wrong = 100%
      } else {
        isCorrect = parseFloat((correctPicked / correctSet.size).toFixed(4)); // partial 0<x<1
      }
    }
  }

  // ── Free-tier participant cap ──
  // The presenter publishes a maxParticipants ceiling for the session (0 = unlimited).
  // Count unique participants already in this session; if at the cap and this is a
  // NEW participant, turn them away gracefully. Existing participants always get through.
  try {
    const metaSnap = await db.ref(`sessions/${SESSION}/meta/maxParticipants`).get();
    const cap = metaSnap.exists() ? Number(metaSnap.val()) : 0;
    if (cap > 0) {
      const allSnap = await db.ref(`sessions/${SESSION}/responses`).get();
      const ids = new Set();
      if (allSnap.exists()) {
        const byQ = allSnap.val();
        Object.values(byQ).forEach(qResp => {
          if (qResp && typeof qResp === 'object') Object.keys(qResp).forEach(pid => ids.add(pid));
        });
      }
      const alreadyCounted = ids.has(participantId);
      if (!alreadyCounted && ids.size >= cap) {
        showSessionFull();
        return;
      }
    }
  } catch(e) { /* if the check fails, don't block the answer */ }

  /* `attempt` and `record` are declared OUT HERE, not inside the try. They were
     inside it, which meant the catch — the whole point of which is to queue `record`
     — could not see it: a const is scoped to its block, so the catch threw a
     ReferenceError, the inner handler swallowed it, and the offline queue silently
     never received anything. Everything looked fine right up until the wifi failed. */
  const attempt = _attemptsUsed + 1;
  _rvMine = { isCorrect, submittedAt: Date.now() };   // the phone's own verdict, so a reveal shows it without waiting for the write
  const record = {
      participantId,
      name: participantName,
      team: participantTeam || null,   // team play: every response carries the team name
      wager: (GAME_MODE === 'wager') ? _wagerPick : null,   // wager mode: what they bet
      answer: answer === null || answer === undefined ? '__none__' : JSON.stringify(answer),
      elapsed,
      isCorrect,
      submittedAt: Date.now(),
      // Which try this was. 1 on a deck without retakes, which is every deck by
      // default — so an existing report reads exactly as it always has.
      attempt,
      // Stable across devices and sessions when the deck belongs to a class.
      // Absent for an open session, where a typed name is all there is.
      ...(studentId ? { studentId } : {}),
      // Only when the presenter turned it on for this deck. Absent means not
      // watched — which must read differently from "watched and never left".
      ...(FOCUS_TRACK ? focusSnapshot() : {}),
  };

  // Store response (submitting flag prevents double-taps on slow connections)
  try {
    /* `responses/…` means THE ANSWER THAT COUNTS and nothing else — that is what
     * lets the leaderboard, the report, the recap and the CSV stay untouched by this
     * whole feature. On a first answer it is simply written. On a retake the teacher's
     * policy decides whether this attempt replaces it. */
    const countedRef = db.ref(`sessions/${SESSION}/responses/${STABLE_QID}/${participantId}`);
    let counted = true;
    if (attempt > 1) {
      let current = null;
      try { const s = await countedRef.get(); current = s.exists() ? s.val() : null; } catch (e) {}
      counted = PSRetakes.shouldReplace(RETAKES.counts, current, record);
    }
    if (counted) await countedRef.set(record);

    /* The history. Written AFTER the counted answer, and never allowed to fail the
     * submission: if this write is denied the student has still answered, and losing
     * a history row is better than telling them their answer did not save. It is also
     * why the attempt count is floored at 1 when the history cannot be read. */
    if (RETAKES.allowed) {
      db.ref(`sessions/${SESSION}/attempts/${STABLE_QID}/${participantId}/${attempt}`)
        .set({ ...record, counted }).catch(() => {});
    }
    _attemptsUsed = attempt;
  } catch(e) {
    /* The answer is NOT lost. It goes in the queue with the time they tapped, retries
       on its own, and survives this page being closed. The student is told it is
       saved — otherwise they re-tap, which is how one answer becomes three. */
    try {
      _queue = PSQueue.enqueue(_queue, {
        session: SESSION, qid: STABLE_QID, pid: participantId, record,
      }, Date.now());
      PSQueue.save(_queue);
      queueBanner('saved');
      scheduleFlush();
      submitting = false;
      /* No "✓ Submitted!" here — the caller already showed it and set `answered`
         before awaiting this. The banner is the only extra thing the student needs:
         that it is saved and will send itself. */
      _attemptsUsed = attempt;
    } catch (queueErr) {
      // Queueing itself failed (storage disabled in a locked-down browser). Now, and
      // only now, is the old message the truth.
      submitting = false;
      toast(t('submitFailed', 'Could not submit — check your connection and try again.'), 'danger');
    }
  }
}

/* They have answered, and the teacher allows another go. Show what they said, say
 * plainly whether trying again can actually change their grade, and let them choose.
 *
 * Saying which attempt counts is not optional politeness. Under a `first` policy a
 * retake cannot help them — offering "Try again" without that sentence would be
 * inviting a student to waste their time on a promise the deck will not keep. */
/* The same sentence PSRetakes.describePolicy writes for the teacher, but built from
 * the phone's own dictionary. describePolicy is English — it is written for the
 * presenter, and the presenter is one person who chose the setting. This is read by a
 * roomful of students on their own phones, and telling a student in a language they
 * don't read which attempt will be graded is telling them nothing. */
function retakeRuleText() {
  const p = RETAKES;
  const tries = p.max === 2
    ? t('retakeTwice', 'twice')
    : t('retakeNTimes', 'up to {n} times').replace('{n}', p.max);
  const key = p.counts === 'best' ? 'retakeBest' : p.counts === 'last' ? 'retakeLast' : 'retakeFirst';
  const fallback = {
    retakeBest:  'You can answer {tries}. Your best try is the one that counts.',
    retakeLast:  'You can answer {tries}. Your last try is the one that counts.',
    retakeFirst: 'You can answer {tries}, but your first answer is the one that counts.',
  }[key];
  return t(key, fallback).replace('{tries}', tries);
}

function showRetakeOffer(prev) {
  const left  = PSRetakes.attemptsLeft(RETAKES, _attemptsUsed);
  const rule  = retakeRuleText();
  const said  = prev && prev.answer !== undefined ? answerLabel(questionData, prev.answer) : '';
  const tries = left === 1
    ? t('oneTryLeft', 'One more try.')
    : t('triesLeft', '{n} more tries.').replace('{n}', left);
  render(`
