<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PollSlide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131c;
    --surface2: #1c1c2e;
    --border: rgba(255,255,255,0.07);
    --accent: #6c63ff;
    --accent2: #ff6584;
    --accent3: #43e97b;
    --accent4: #f7b731;
    --text: #f0f0fa;
    --muted: #8888aa;
    --radius: 16px;
    --radius-sm: 10px;
  }
  body.light {
    --bg: #f4f5fa;
    --surface: #ffffff;
    --surface2: #eef0f6;
    --border: rgba(0,0,0,0.1);
    --text: #1a1a2e;
    --muted: #6b6b8a;
  }
  body.light::before, body.light::after { opacity:0.4; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; margin:0; padding:0; }
  body::before { content:''; position:fixed; top:-40%; left:-20%; width:80vw; height:80vw; background:radial-gradient(circle,rgba(108,99,255,0.12) 0%,transparent 70%); pointer-events:none; z-index:0; }
  body::after  { content:''; position:fixed; bottom:-30%; right:-10%; width:60vw; height:60vw; background:radial-gradient(circle,rgba(255,101,132,0.08) 0%,transparent 70%); pointer-events:none; z-index:0; }

  /* Fixed centered — independent of LearnWorlds page wrappers */
  #app {
    position: fixed !important;
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%) !important;
    z-index: 99999 !important;
    width: calc(100% - 40px) !important;
    max-width: 480px !important;
    max-height: 90vh !important;
    overflow-y: auto !important;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 30px;
  }
  @media (max-width: 480px) {
    #app { padding: 22px 18px; width: calc(100% - 24px) !important; }
    h1 { font-size: 21px; }
  }
  /* Small theme toggle pinned top-right of card */
  .theme-mini { position:absolute; top:14px; right:14px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; width:30px; height:30px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; z-index:2; }

  .logo { font-family:'Syne',sans-serif; font-size:11px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:var(--accent); margin-bottom:22px; display:flex; align-items:center; gap:7px; }
  .logo-dot { width:7px; height:7px; background:var(--accent); border-radius:50%; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.3)} }
  @keyframes slideUp { from{opacity:0;transform:translateY(22px) translateX(-50%)} to{opacity:1;transform:translateY(-50%) translateX(-50%)} }

  h1 { font-family:'Syne',sans-serif; font-size:clamp(19px,5vw,25px); font-weight:800; line-height:1.25; margin-bottom:6px; }
  .subtitle { color:var(--muted); font-size:14px; margin-bottom:22px; line-height:1.5; }

  label { display:block; font-size:11px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  input[type="text"] { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:13px 15px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:16px; outline:none; transition:border-color 0.2s; margin-bottom:16px; }
  input[type="text"]:focus { border-color:var(--accent); }
  input[type="text"]::placeholder { color:var(--muted); }

  .btn { width:100%; padding:13px 20px; border:none; border-radius:var(--radius-sm); font-family:'Syne',sans-serif; font-size:14px; font-weight:700; letter-spacing:0.05em; cursor:pointer; transition:all 0.2s; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:hover { background:#7c74ff; }
  .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }

  .q-badge { display:inline-flex; align-items:center; font-family:'Syne',sans-serif; font-size:11px; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; background:rgba(108,99,255,0.15); color:var(--accent); padding:4px 12px; border-radius:100px; border:1px solid rgba(108,99,255,0.25); margin-bottom:16px; }
  .q-text { font-family:'Syne',sans-serif; font-size:clamp(15px,4vw,19px); font-weight:800; line-height:1.4; margin-bottom:20px; }

  .options-grid { display:flex; flex-direction:column; gap:9px; margin-bottom:18px; }
  .option { background:var(--surface2); border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:12px 15px; cursor:pointer; display:flex; align-items:center; gap:12px; transition:all 0.18s; font-size:14px; text-align:left; color:var(--text); width:100%; }
  .option:hover:not([disabled]) { border-color:var(--accent); background:rgba(108,99,255,0.08); }
  .option.selected { border-color:var(--accent); background:rgba(108,99,255,0.15); }
  .option.correct  { border-color:var(--accent3); background:rgba(67,233,123,0.12); color:var(--accent3); pointer-events:none; }
  .option.wrong    { border-color:var(--accent2); background:rgba(255,101,132,0.12); color:var(--accent2); pointer-events:none; }
  .option.neutral  { pointer-events:none; opacity:0.6; }
  .opt-letter { width:28px; height:28px; border-radius:7px; background:var(--surface); border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; font-weight:700; font-size:11px; flex-shrink:0; transition:all 0.18s; }
  .option.selected .opt-letter { background:var(--accent); border-color:var(--accent); color:#fff; }
  .option.correct  .opt-letter { background:var(--accent3); border-color:var(--accent3); color:#000; }
  .option.wrong    .opt-letter { background:var(--accent2); border-color:var(--accent2); color:#fff; }

  textarea { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:13px 15px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; outline:none; resize:vertical; min-height:90px; transition:border-color 0.2s; margin-bottom:18px; }
  textarea:focus { border-color:var(--accent); }
  textarea::placeholder { color:var(--muted); }

  .rating-wrap { display:flex; gap:7px; margin-bottom:18px; flex-wrap:wrap; }
  .r-btn { flex:1; min-width:36px; aspect-ratio:1; background:var(--surface2); border:1.5px solid var(--border); border-radius:var(--radius-sm); color:var(--text); font-family:'Syne',sans-serif; font-weight:700; font-size:15px; cursor:pointer; transition:all 0.18s; display:flex; align-items:center; justify-content:center; }
  .r-btn:hover { border-color:var(--accent); }
  .r-btn.sel { border-color:var(--accent); background:var(--accent); color:#fff; }

  .multi-hint { font-size:12px; color:var(--accent); margin-bottom:10px; font-weight:500; }

  .status-box { border-radius:var(--radius-sm); padding:14px; text-align:center; font-weight:500; font-size:14px; margin-bottom:16px; }
  .status-box.submitted { background:rgba(67,233,123,0.08); border:1px solid rgba(67,233,123,0.2); color:var(--accent3); }
  .status-box.closed    { background:rgba(247,183,49,0.08);  border:1px solid rgba(247,183,49,0.2);  color:var(--accent4); }
  .status-box.error     { background:rgba(255,101,132,0.08); border:1px solid rgba(255,101,132,0.2); color:var(--accent2); }

  .spinner { width:28px; height:28px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 14px; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .center { text-align:center; }
  /* Question image */
  .q-image { width:100%; max-height:340px; object-fit:contain; border-radius:14px; margin-bottom:18px; border:1px solid var(--border); background:#000; display:block; }
  /* Option images */
  .option { position:relative; }
  .opt-img { width:42px; height:42px; border-radius:8px; object-fit:cover; flex-shrink:0; }
  video.q-image { width:100%; max-height:380px; object-fit:contain; background:#000; border-radius:14px; }
  video.opt-img { width:42px; height:42px; border-radius:8px; object-fit:cover; flex-shrink:0; }
  .option.has-img { padding:8px 12px; }
  /* Countdown timer */
  .timer-bar { display:flex; align-items:center; gap:10px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 14px; margin-bottom:16px; }
  .timer-ring { width:34px; height:34px; flex-shrink:0; }
  .timer-text { font-family:'Syne',sans-serif; font-weight:700; font-size:15px; }
  .timer-text.warn { color:var(--accent2); }
  .timer-label { font-size:12px; color:var(--muted); }
  .expired-box { background:rgba(247,183,49,0.1); border:1px solid rgba(247,183,49,0.25); color:var(--accent4); border-radius:var(--radius-sm); padding:14px; text-align:center; font-weight:500; font-size:14px; margin-bottom:14px; }
  /* Survey (async whole-form) mode */
  .survey-card { position:relative; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); padding:18px 16px 16px; margin-bottom:14px; }
  .survey-qnum { position:absolute; top:-11px; left:14px; width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff; font-family:'Syne',sans-serif; font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center; }
  .survey-card .options-grid { margin-bottom:0; }
  .survey-card .rating-wrap { margin-bottom:8px; }
</style>

<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBPncI0e-LlIgLvTcq76O1Kdq2jXJ6DiME",
  authDomain: "echonest-live-survey.firebaseapp.com",
  databaseURL: "https://echonest-live-survey-default-rtdb.firebaseio.com",
  projectId: "echonest-live-survey",
  storageBucket: "echonest-live-survey.firebasestorage.app",
  messagingSenderId: "285529140046",
  appId: "1:285529140046:web:983c1ee8000a2ca8f80c1f",
  measurementId: "G-NWQY4YLNRC"
};

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

// ─── URL PARSING ─────────────────────────────────────────────────────────────
// QR uses hash: echonest.at/index#SESSIONCODE/0
// Fallback: ?session=CODE&q=0
function parseLocation() {
  const hash = window.location.hash.replace('#','').trim();
  if (hash) {
    // "#SESSION/0" → single question (poll/quiz live).  "#SESSION" → whole-form (survey).
    const parts = hash.split('/');
    return { session: parts[0].toUpperCase(), qIndex: parts.length > 1 ? parseInt(parts[1] || '-1') : -1 };
  }
  const params = new URLSearchParams(window.location.search);
  return {
    session: (params.get('session') || '').toUpperCase().trim(),
    qIndex:  parseInt(params.get('q') || '-1')
  };
}
const { session: SESSION, qIndex: Q_INDEX } = parseLocation();
// No question index → answer the whole set as one async form (SurveySlide / quiz homework).
const SURVEY_MODE = !!SESSION && (isNaN(Q_INDEX) || Q_INDEX < 0);

// ─── STATE ────────────────────────────────────────────────────────────────────
// participantId is unique per person per SESSION (stored in sessionStorage)
// It is NOT stored in Firebase participants node — only in per-question responses
let participantId   = null;
let participantName = null;
let questionData    = null;
let answered        = false;
let submitting      = false; // prevent double-submit on slow connections
let selectedOptions = new Set();
let answerStartTime = null;

// stableQId is the Firebase key for this question's response bucket
// Path: sessions/SESSION/responses/STABLE_QID/PARTICIPANT_ID
const STABLE_QID = `q${Q_INDEX}_stable_${SESSION}`;

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(html) { document.getElementById('app').innerHTML = html; }

// ─── BOOT ─────────────────────────────────────────────────────────────────────
function bootApp() {
  if (!SESSION) {
    render(`
      <a href="https://pollslide.com" class="logo" style="text-decoration:none;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="22" height="22" style="flex-shrink:0;"><rect width="100" height="100" rx="22" fill="#0d0d18"/><rect x="18" y="58" width="16" height="24" rx="4" fill="#ff6584"/><rect x="42" y="42" width="16" height="40" rx="4" fill="#f7b731"/><rect x="66" y="22" width="16" height="60" rx="4" fill="#6c63ff"/><polygon points="72,32 72,40 78,36" fill="rgba(255,255,255,0.8)"/></svg>PollSlide</a>
      <div class="status-box error">Invalid link. Please scan the correct QR code.</div>
      <p class="center" style="color:var(--muted);font-size:13px;">Ask the presenter for the right QR code.</p>
    `);
    return;
  }

  // Restore identity from sessionStorage if available
  const storedId   = sessionStorage.getItem(`ql_pid_${SESSION}`);
  const storedName = sessionStorage.getItem(`ql_pname_${SESSION}`);
  if (storedId && storedName && storedName !== 'null' && storedName !== 'undefined') {
    participantId   = storedId;
    participantName = storedName;
    SURVEY_MODE ? loadSurvey() : loadQuestion();
  } else {
    showNameEntry();
  }
}

// ─── NAME ENTRY ───────────────────────────────────────────────────────────────
function showNameEntry() {
  render(`
    <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="22" height="22" style="flex-shrink:0;"><rect width="100" height="100" rx="22" fill="#0d0d18"/><rect x="18" y="58" width="16" height="24" rx="4" fill="#ff6584"/><rect x="42" y="42" width="16" height="40" rx="4" fill="#f7b731"/><rect x="66" y="22" width="16" height="60" rx="4" fill="#6c63ff"/><polygon points="72,32 72,40 78,36" fill="rgba(255,255,255,0.8)"/></svg>PollSlide</div>
    <h1>Enter Your Name</h1>
    <p class="subtitle">You only need to do this once per session.</p>
    <label>Your Name</label>
    <input type="text" id="nameInput" maxlength="60" placeholder="Your name" maxlength="30" autofocus>
    <button class="btn btn-primary" onclick="joinSession()">Continue →</button>
    <p id="nameErr" style="color:var(--accent2);font-size:13px;margin-top:10px;text-align:center;"></p>
  `);
  document.getElementById('nameInput').addEventListener('keydown', e => { if(e.key==='Enter') joinSession(); });
}

function joinSession() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { document.getElementById('nameErr').textContent = 'Please enter your name.'; return; }

  participantName = name.slice(0, 60); // cap at 60 chars — prevents DB abuse
  // Generate a unique ID for this person in this session
  participantId = 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2,5);

  sessionStorage.setItem(`ql_pid_${SESSION}`,  participantId);
  sessionStorage.setItem(`ql_pname_${SESSION}`, participantName);

  SURVEY_MODE ? loadSurvey() : loadQuestion();
}

// ─── LOAD QUESTION ────────────────────────────────────────────────────────────
async function loadQuestion() {
  render(`<div class="spinner"></div><p class="center" style="color:var(--muted);font-size:13px;">Loading...</p>`);

  // Load question definition from quiz_builder
  const qSnap = await db.ref(`quiz_builder/${SESSION}/questions/${Q_INDEX}`).get();
  if (!qSnap.exists()) {
    render(`
      <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="22" height="22" style="flex-shrink:0;"><rect width="100" height="100" rx="22" fill="#0d0d18"/><rect x="18" y="58" width="16" height="24" rx="4" fill="#ff6584"/><rect x="42" y="42" width="16" height="40" rx="4" fill="#f7b731"/><rect x="66" y="22" width="16" height="60" rx="4" fill="#6c63ff"/><polygon points="72,32 72,40 78,36" fill="rgba(255,255,255,0.8)"/></svg>PollSlide</div>
      <div style="text-align:center;padding:10px 0 20px;">
        <div style="font-size:40px;margin-bottom:12px;animation:gentle 2s ease-in-out infinite;">⏳</div>
        <h1 style="margin-bottom:8px;">Waiting...</h1>
        <p class="subtitle">Question ${Q_INDEX+1} isn't ready yet.<br>Stay on this page.</p>
        <div style="background:var(--surface2);border-radius:var(--radius-sm);padding:10px 16px;font-size:13px;color:var(--muted);margin-top:12px;">
          Session <strong style="color:var(--accent4);">${SESSION}</strong>
        </div>
      </div>
      <style>@keyframes gentle{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}</style>
    `);
    setTimeout(loadQuestion, 3000);
    return;
  }

  questionData = qSnap.val();

  // Check if this participant already answered this question
  // Response is stored at: sessions/SESSION/responses/STABLE_QID/participantId
  const myRespSnap = await db.ref(`sessions/${SESSION}/responses/${STABLE_QID}/${participantId}`).get();
  if (myRespSnap.exists()) {
    answered = true;
    showAlreadyAnswered();
    return;
  }

  answered = false;
  answerStartTime = Date.now();
  showQuestion(questionData);
}

// ─── SHOW QUESTION ────────────────────────────────────────────────────────────
function isVideoUrl(url) {
  if (!url) return false;
  const u = url.split('?')[0].toLowerCase();
  return u.endsWith('.mp4') || u.endsWith('.webm') || u.endsWith('.mov') || u.endsWith('.m4v') || u.includes('/video/');
}

function videoAttrs(opts) {
  opts = opts || { loop:true, autoplay:true, muted:true, controls:false };
  let a = 'playsinline ';
  if (opts.loop) a += 'loop ';
  if (opts.muted || opts.autoplay) a += 'muted ';   // autoplay needs muted
  if (opts.autoplay) a += 'autoplay ';
  if (opts.controls) a += 'controls ';
  return a;
}

function mediaTag(url, opts, className) {
  if (!url || !url.trim()) return '';
  if (isVideoUrl(url)) {
    return `<video class="${className}" src="${url}" ${videoAttrs(opts)}></video>`;
  }
  return `<img class="${className}" src="${url}" onerror="this.style.display='none'">`;
}

function showQuestion(q) {
  const isMulti  = q.type === 'multiple_choice_multi';
  const isText   = q.type === 'free_text';
  const isRating = q.type === 'rating';
  const letters  = ['A','B','C','D','E','F'];

  let body = '';
  if (isText) {
    body = `
      <textarea id="txtAns" placeholder="Type your answer here..."></textarea>
      <button class="btn btn-primary" onclick="submitAnswer()">Submit Answer</button>`;
  } else if (isRating) {
    const max = q.ratingMax || 5;
    const labels = q.ratingLabels || {};
    body = `
      <div class="rating-wrap" id="ratingWrap">
        ${Array.from({length:max},(_,i)=>`<button class="r-btn" id="rb${i+1}" onclick="selectRating(${i+1})">${i+1}</button>`).join('')}
      </div>
      ${labels.low||labels.high ? `<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:14px;"><span>${labels.low||''}</span><span>${labels.high||''}</span></div>` : ''}
      <button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>Submit Rating</button>`;
  } else {
    body = `
      ${isMulti ? '<p class="multi-hint">✓ Select all that apply</p>' : ''}
      <div class="options-grid">
        ${(q.options||[]).map((opt,i) => {
          const hasImg = opt.img && opt.img.trim();
          return `
          <button class="option ${hasImg?'has-img':''}" id="opt${i}" onclick="toggleOpt(${i})">
            <span class="opt-letter">${letters[i]}</span>
            ${hasImg?mediaTag(opt.img, opt.videoOpts, 'opt-img'):''}
            <span>${opt.text||''}</span>
          </button>`;
        }).join('')}
      </div>
      ${isMulti ? `<button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>Submit Answers</button>` : ''}`;
  }

  const qImage = mediaTag(q.image, q.videoOpts, 'q-image');

  const timerHtml = (q.timer && q.timer > 0)
    ? `<div class="timer-bar" id="timerBar">
         <svg class="timer-ring" viewBox="0 0 36 36">
           <circle cx="18" cy="18" r="16" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
           <circle id="timerCircle" cx="18" cy="18" r="16" fill="none" stroke="var(--accent)" stroke-width="3"
                   stroke-dasharray="100.5" stroke-dashoffset="0" stroke-linecap="round"
                   transform="rotate(-90 18 18)"/>
         </svg>
         <div>
           <div class="timer-text" id="timerText">${q.timer}s</div>
           <div class="timer-label">to answer</div>
         </div>
       </div>` : '';

  render(`
    <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="22" height="22" style="flex-shrink:0;"><rect width="100" height="100" rx="22" fill="#0d0d18"/><rect x="18" y="58" width="16" height="24" rx="4" fill="#ff6584"/><rect x="42" y="42" width="16" height="40" rx="4" fill="#f7b731"/><rect x="66" y="22" width="16" height="60" rx="4" fill="#6c63ff"/><polygon points="72,32 72,40 78,36" fill="rgba(255,255,255,0.8)"/></svg>PollSlide</div>
    <div class="q-badge">Question ${Q_INDEX+1}</div>
    ${timerHtml}
    ${qImage}
    <div class="q-text">${q.text}</div>
    <div id="qBody">${body}</div>
  `);

  // Start countdown if timer set
  if (q.timer && q.timer > 0) startTimer(q.timer);
}

// ─── COUNTDOWN TIMER ──────────────────────────────────────────────────────────
let timerInterval = null;
function startTimer(seconds) {
  const total = seconds;
  let remaining = seconds;
  const circle = document.getElementById('timerCircle');
  const text   = document.getElementById('timerText');
  const circumference = 100.5;

  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    remaining--;
    if (text) {
      text.textContent = remaining + 's';
      if (remaining <= 5) text.classList.add('warn');
    }
    if (circle) {
      const offset = circumference * (1 - remaining / total);
      circle.style.strokeDashoffset = offset;
      if (remaining <= 5) circle.style.stroke = 'var(--accent2)';
    }
    if (remaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      if (!answered) {
        // Time's up — lock the question
        answered = true;
        const qb = document.getElementById('qBody');
        if (qb) {
          document.querySelectorAll('.option, .r-btn, #txtAns, #submitBtn').forEach(el => {
            el.style.pointerEvents = 'none'; el.style.opacity = '0.5';
          });
          qb.insertAdjacentHTML('afterbegin', '<div class="expired-box">⏱ Time\'s up! Answering is now closed.</div>');
        }
      }
    }
  }, 1000);
}

// ─── INTERACTION ──────────────────────────────────────────────────────────────
function toggleOpt(i) {
  if (answered) return;
  const isMulti = questionData.type === 'multiple_choice_multi';
  if (!isMulti) {
    selectedOptions.clear(); selectedOptions.add(i);
    document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
    document.getElementById(`opt${i}`).classList.add('selected');
    document.querySelectorAll('.option').forEach(el => el.style.pointerEvents = 'none');
    answered = true;
    submitToDb([i]);
    document.getElementById('qBody').insertAdjacentHTML('beforeend',
      '<div class="status-box submitted" style="margin-top:14px;">✓ Submitted!</div>');
  } else {
    if (selectedOptions.has(i)) { selectedOptions.delete(i); document.getElementById(`opt${i}`).classList.remove('selected'); }
    else { selectedOptions.add(i); document.getElementById(`opt${i}`).classList.add('selected'); }
    const sb = document.getElementById('submitBtn');
    if (sb) sb.disabled = selectedOptions.size === 0;
  }
}

function selectRating(val) {
  document.querySelectorAll('.r-btn').forEach((b,i) => b.classList.toggle('sel', i+1 <= val));
  window._rating = val;
  const sb = document.getElementById('submitBtn');
  if (sb) sb.disabled = false;
}

function submitAnswer() {
  if (answered) return;
  answered = true;
  let answer;
  const q = questionData;
  if (q.type === 'free_text')            answer = document.getElementById('txtAns')?.value?.trim() || '';
  else if (q.type === 'rating')          answer = window._rating || null;
  else if (q.type === 'multiple_choice_multi') answer = Array.from(selectedOptions);
  submitToDb(answer);
  document.getElementById('qBody').innerHTML =
    '<div class="status-box submitted">✓ Submitted!</div>';
}

async function submitToDb(answer) {
  if (submitting) return; // prevent double-submit
  submitting = true;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  const elapsed = Date.now() - (answerStartTime || Date.now());
  const q = questionData;
  let isCorrect = null;

  if ((q.type === 'multiple_choice' || q.type === 'multiple_choice_multi') &&
      q.correctAnswer !== null && q.correctAnswer !== undefined) {
    if (q.type === 'multiple_choice') {
      const a = Array.isArray(answer) ? answer[0] : answer;
      isCorrect = a === q.correctAnswer;
    } else {
      // Partial credit: each correct selection earns a fraction; no bonus for wrong picks
      const correctSet = new Set(Array.isArray(q.correctAnswer) ? q.correctAnswer.map(Number) : [Number(q.correctAnswer)]);
      const givenArr   = Array.isArray(answer) ? answer.map(Number) : [];
      const wrongPicked    = givenArr.filter(a => !correctSet.has(a)).length;
      const correctPicked  = givenArr.filter(a => correctSet.has(a)).length;
      if (correctSet.size === 0) {
        isCorrect = null;
      } else if (wrongPicked > 0) {
        isCorrect = false;                                         // wrong answer chosen = 0
      } else if (correctPicked === correctSet.size) {
        isCorrect = true;                                          // all correct, none wrong = 100%
      } else {
        isCorrect = parseFloat((correctPicked / correctSet.size).toFixed(4)); // partial 0<x<1
      }
    }
  }

  // ── Free-tier participant cap ──
  // The presenter publishes a maxParticipants ceiling for the session (0 = unlimited).
  // Count unique participants already in this session; if at the cap and this is a
  // NEW participant, turn them away gracefully. Existing participants always get through.
  try {
    const metaSnap = await db.ref(`sessions/${SESSION}/meta/maxParticipants`).get();
    const cap = metaSnap.exists() ? Number(metaSnap.val()) : 0;
    if (cap > 0) {
      const allSnap = await db.ref(`sessions/${SESSION}/responses`).get();
      const ids = new Set();
      if (allSnap.exists()) {
        const byQ = allSnap.val();
        Object.values(byQ).forEach(qResp => {
          if (qResp && typeof qResp === 'object') Object.keys(qResp).forEach(pid => ids.add(pid));
        });
      }
      const alreadyCounted = ids.has(participantId);
      if (!alreadyCounted && ids.size >= cap) {
        showSessionFull();
        return;
      }
    }
  } catch(e) { /* if the check fails, don't block the answer */ }

  // Store response (submitting flag prevents double-taps on slow connections)
  try {
    await db.ref(`sessions/${SESSION}/responses/${STABLE_QID}/${participantId}`).set({
      participantId,
      name: participantName,
      answer: answer === null || answer === undefined ? '__none__' : JSON.stringify(answer),
      elapsed,
      isCorrect,
      submittedAt: Date.now()
    });
  } catch(e) {
    submitting = false;
    toast('Could not submit — check your connection and try again.', 'danger');
  }
}

function showSessionFull() {
  render(`
    <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="22" height="22" style="flex-shrink:0;"><rect width="100" height="100" rx="22" fill="#0d0d18"/><rect x="18" y="58" width="16" height="24" rx="4" fill="#ff6584"/><rect x="42" y="42" width="16" height="40" rx="4" fill="#f7b731"/><rect x="66" y="22" width="16" height="60" rx="4" fill="#6c63ff"/><polygon points="72,32 72,40 78,36" fill="rgba(255,255,255,0.8)"/></svg>PollSlide</div>
    <div class="status-box" style="background:rgba(247,183,49,0.14);color:var(--accent4);border:1px solid rgba(247,183,49,0.3);">
      This poll is full
    </div>
    <p class="center" style="color:var(--muted);font-size:13px;margin-top:8px;">
      The presenter's plan has reached its participant limit for this session.
    </p>
  `);
}

// ─── SCREENS ─────────────────────────────────────────────────────────────────
function showAlreadyAnswered() {
  render(`
    <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="22" height="22" style="flex-shrink:0;"><rect width="100" height="100" rx="22" fill="#0d0d18"/><rect x="18" y="58" width="16" height="24" rx="4" fill="#ff6584"/><rect x="42" y="42" width="16" height="40" rx="4" fill="#f7b731"/><rect x="66" y="22" width="16" height="60" rx="4" fill="#6c63ff"/><polygon points="72,32 72,40 78,36" fill="rgba(255,255,255,0.8)"/></svg>PollSlide</div>
    <div class="status-box submitted">✓ You already answered this question!</div>
    <p class="center" style="color:var(--muted);font-size:13px;margin-top:8px;">
      Scan the next question's QR when the presenter moves on.
    </p>
  `);
}

// ════════════════════════════════════════════════════════════════════════════
// SURVEY MODE — answer the whole set as one async form (SurveySlide).
// Responses write to the SAME per-question buckets as live polls
// (sessions/SESSION/responses/q{idx}_stable_SESSION/participantId), so the
// presenter's existing report & tally aggregate them with zero extra work.
// ════════════════════════════════════════════════════════════════════════════
let surveyQuestions = [];
let surveyAnswers   = {};   // { qIndex: answerValue }
const SURVEY_LETTERS = ['A','B','C','D','E','F','G','H'];

async function loadSurvey() {
  render(`<div class="spinner"></div><p class="center" style="color:var(--muted);font-size:13px;">Loading…</p>`);
  let qs = [];
  try {
    const snap = await db.ref(`quiz_builder/${SESSION}/questions`).get();
    qs = snap.exists() ? (snap.val() || []) : [];
  } catch(e) { qs = []; }
  // Firebase may return an object if keys are sparse — normalize to array.
  surveyQuestions = Array.isArray(qs) ? qs.filter(Boolean) : Object.values(qs).filter(Boolean);

  if (surveyQuestions.length === 0) {
    render(`
      ${logoMarkup()}
      <div style="text-align:center;padding:10px 0 20px;">
        <div style="font-size:40px;margin-bottom:12px;">📋</div>
        <h1 style="margin-bottom:8px;">Nothing here yet</h1>
        <p class="subtitle">This survey has no questions yet.<br>Check back shortly.</p>
      </div>`);
    return;
  }

  // Already submitted? If this participant has a response in ANY question bucket, treat
  // the survey as completed (one submission per person).
  try {
    const respSnap = await db.ref(`sessions/${SESSION}/responses`).get();
    if (respSnap.exists()) {
      const byQ = respSnap.val();
      const done = Object.values(byQ).some(bucket => bucket && typeof bucket === 'object' && bucket[participantId]);
      if (done) { showSurveyDone(true); return; }
    }
  } catch(e) { /* if the check fails, let them answer */ }

  showSurveyForm();
}

function logoMarkup() {
  return `<div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="22" height="22" style="flex-shrink:0;"><rect width="100" height="100" rx="22" fill="#0d0d18"/><rect x="18" y="58" width="16" height="24" rx="4" fill="#ff6584"/><rect x="42" y="42" width="16" height="40" rx="4" fill="#f7b731"/><rect x="66" y="22" width="16" height="60" rx="4" fill="#6c63ff"/><polygon points="72,32 72,40 78,36" fill="rgba(255,255,255,0.8)"/></svg>PollSlide</div>`;
}

function surveyQuestionBody(q, idx) {
  const isMulti  = q.type === 'multiple_choice_multi';
  const isText   = q.type === 'free_text';
  const isRating = q.type === 'rating';
  if (isText) {
    return `<textarea id="sq${idx}_txt" placeholder="Type your answer…" oninput="surveyAnswers[${idx}]=this.value.trim()" style="margin-bottom:0;"></textarea>`;
  }
  if (isRating) {
    const max = q.ratingMax || 5;
    const labels = q.ratingLabels || {};
    return `
      <div class="rating-wrap">
        ${Array.from({length:max},(_,i)=>`<button type="button" class="r-btn" id="sq${idx}_r${i+1}" onclick="surveyPickRating(${idx},${i+1})">${i+1}</button>`).join('')}
      </div>
      ${labels.low||labels.high ? `<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);"><span>${labels.low||''}</span><span>${labels.high||''}</span></div>` : ''}`;
  }
  // single or multi choice
  return `
    ${isMulti ? '<p class="multi-hint">✓ Select all that apply</p>' : ''}
    <div class="options-grid">
      ${(q.options||[]).map((opt,i) => {
        const hasImg = opt.img && opt.img.trim();
        return `<button type="button" class="option ${hasImg?'has-img':''}" id="sq${idx}_opt${i}" onclick="surveyPickOption(${idx},${i},${isMulti})">
          <span class="opt-letter">${SURVEY_LETTERS[i]}</span>
          ${hasImg?mediaTag(opt.img, opt.videoOpts, 'opt-img'):''}
          <span>${opt.text||''}</span>
        </button>`;
      }).join('')}
    </div>`;
}

function showSurveyForm() {
  const cards = surveyQuestions.map((q, idx) => `
    <div class="survey-card" id="surveyCard${idx}">
      <div class="survey-qnum">${idx+1}</div>
      ${mediaTag(q.image, q.videoOpts, 'q-image')}
      <div class="q-text" style="font-size:18px;margin-bottom:14px;">${q.text || ''}</div>
      ${surveyQuestionBody(q, idx)}
    </div>`).join('');

  render(`
    ${logoMarkup()}
    <h1 style="margin-bottom:4px;">${surveyQuestions.length} question${surveyQuestions.length!==1?'s':''}</h1>
    <p class="subtitle">Answer at your own pace, then submit. You can skip any question.</p>
    <div id="surveyForm">${cards}</div>
    <button class="btn btn-primary" id="surveySubmitBtn" onclick="submitSurvey()" style="margin-top:6px;">Submit Survey</button>
    <p id="surveyErr" style="color:var(--accent2);font-size:13px;margin-top:10px;text-align:center;"></p>
  `);
}

function surveyPickOption(idx, i, isMulti) {
  if (isMulti) {
    const cur = new Set(Array.isArray(surveyAnswers[idx]) ? surveyAnswers[idx] : []);
    if (cur.has(i)) { cur.delete(i); document.getElementById(`sq${idx}_opt${i}`).classList.remove('selected'); }
    else { cur.add(i); document.getElementById(`sq${idx}_opt${i}`).classList.add('selected'); }
    surveyAnswers[idx] = Array.from(cur);
  } else {
    (surveyQuestions[idx].options||[]).forEach((_,j) => document.getElementById(`sq${idx}_opt${j}`)?.classList.remove('selected'));
    document.getElementById(`sq${idx}_opt${i}`).classList.add('selected');
    surveyAnswers[idx] = [i];
  }
}

function surveyPickRating(idx, val) {
  const max = surveyQuestions[idx].ratingMax || 5;
  for (let n=1;n<=max;n++) document.getElementById(`sq${idx}_r${n}`)?.classList.toggle('selected', n===val);
  surveyAnswers[idx] = val;
}

function surveyComputeCorrect(q, answer) {
  if (!(q.type === 'multiple_choice' || q.type === 'multiple_choice_multi')) return null;
  if (q.correctAnswer === null || q.correctAnswer === undefined) return null; // ungraded (survey)
  if (q.type === 'multiple_choice') {
    const a = Array.isArray(answer) ? answer[0] : answer;
    return a === q.correctAnswer;
  }
  const correctSet = new Set(Array.isArray(q.correctAnswer) ? q.correctAnswer.map(Number) : [Number(q.correctAnswer)]);
  const givenArr   = Array.isArray(answer) ? answer.map(Number) : [];
  const wrongPicked   = givenArr.filter(a => !correctSet.has(a)).length;
  const correctPicked = givenArr.filter(a => correctSet.has(a)).length;
  if (correctSet.size === 0) return null;
  if (wrongPicked > 0) return false;
  if (correctPicked === correctSet.size) return true;
  return parseFloat((correctPicked / correctSet.size).toFixed(4));
}

function surveyIsAnswered(idx) {
  const a = surveyAnswers[idx];
  if (a === undefined || a === null) return false;
  if (Array.isArray(a)) return a.length > 0;
  if (typeof a === 'string') return a.trim().length > 0;
  return true; // number (rating)
}

async function submitSurvey() {
  if (submitting) return;
  // Require at least one answer so we don't store an empty submission.
  const answeredCount = surveyQuestions.reduce((n,_,idx) => n + (surveyIsAnswered(idx) ? 1 : 0), 0);
  if (answeredCount === 0) {
    document.getElementById('surveyErr').textContent = 'Please answer at least one question before submitting.';
    return;
  }
  submitting = true;
  const btn = document.getElementById('surveySubmitBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Submitting…'; }

  const submittedAt = Date.now();
  const writes = [];
  surveyQuestions.forEach((q, idx) => {
    if (!surveyIsAnswered(idx)) return; // skip blanks
    const answer    = surveyAnswers[idx];
    const stableQId = `q${idx}_stable_${SESSION}`;
    const isCorrect = surveyComputeCorrect(q, answer);
    writes.push(
      db.ref(`sessions/${SESSION}/responses/${stableQId}/${participantId}`).set({
        participantId,
        name: participantName,
        answer: (answer === null || answer === undefined) ? '__none__' : JSON.stringify(answer),
        elapsed: 0,
        isCorrect,
        submittedAt
      })
    );
  });

  try {
    await Promise.all(writes);
    showSurveyDone(false);
  } catch(e) {
    submitting = false;
    if (btn) { btn.disabled = false; btn.textContent = 'Submit Survey'; }
    document.getElementById('surveyErr').textContent = 'Could not submit — check your connection and try again.';
  }
}

function showSurveyDone(already) {
  render(`
    ${logoMarkup()}
    <div style="text-align:center;padding:14px 0 20px;">
      <div style="font-size:46px;margin-bottom:12px;">✓</div>
      <h1 style="margin-bottom:8px;">${already ? 'Already submitted' : 'Thank you!'}</h1>
      <p class="subtitle">${already ? 'You\'ve already completed this survey.' : 'Your responses have been recorded.'}</p>
    </div>
  `);
}

// ─── BOOT (called last, after all functions defined) ─────────────────────────
// Force full reload when hash changes (new QR scanned for different question).
// In survey mode the hash never changes, so this is a no-op there.
window.addEventListener('hashchange', () => { window.location.reload(); });

bootApp();
</script>
