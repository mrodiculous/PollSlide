<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131c;
    --surface2: #1c1c2e;
    --border: rgba(255,255,255,0.07);
    --accent: #6c63ff;
    --accent2: #ff6584;
    --accent3: #43e97b;
    --accent4: #f7b731;
    --text: #f0f0fa;
    --muted: #8888aa;
    --radius: 16px;
    --radius-sm: 10px;
  }
  body.light {
    --bg: #f4f5fa;
    --surface: #ffffff;
    --surface2: #eef0f6;
    --border: rgba(0,0,0,0.1);
    --text: #1a1a2e;
    --muted: #6b6b8a;
  }
  body.light::before, body.light::after { opacity:0.4; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; margin:0; padding:0; }
  body::before { content:''; position:fixed; top:-40%; left:-20%; width:80vw; height:80vw; background:radial-gradient(circle,rgba(108,99,255,0.12) 0%,transparent 70%); pointer-events:none; z-index:0; }
  body::after  { content:''; position:fixed; bottom:-30%; right:-10%; width:60vw; height:60vw; background:radial-gradient(circle,rgba(255,101,132,0.08) 0%,transparent 70%); pointer-events:none; z-index:0; }

  /* Fixed centered — independent of LearnWorlds page wrappers */
  #app {
    position: fixed !important;
    top: 50% !important;
    left: 50% !important;
    transform: translate(-50%, -50%) !important;
    z-index: 99999 !important;
    width: calc(100% - 40px) !important;
    max-width: 480px !important;
    max-height: 90vh !important;
    overflow-y: auto !important;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 30px;
  }
  @media (max-width: 480px) {
    #app { padding: 22px 18px; width: calc(100% - 24px) !important; }
    h1 { font-size: 21px; }
  }
  /* Small theme toggle pinned top-right of card */
  .theme-mini { position:absolute; top:14px; right:14px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; width:30px; height:30px; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; z-index:2; }

  .logo { font-family:'Syne',sans-serif; font-size:11px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:var(--accent); margin-bottom:22px; display:flex; align-items:center; gap:7px; }
  .logo-dot { width:7px; height:7px; background:var(--accent); border-radius:50%; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.3)} }
  @keyframes slideUp { from{opacity:0;transform:translateY(22px) translateX(-50%)} to{opacity:1;transform:translateY(-50%) translateX(-50%)} }

  h1 { font-family:'Syne',sans-serif; font-size:clamp(19px,5vw,25px); font-weight:800; line-height:1.25; margin-bottom:6px; }
  .subtitle { color:var(--muted); font-size:14px; margin-bottom:22px; line-height:1.5; }

  label { display:block; font-size:11px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  input[type="text"] { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:13px 15px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:16px; outline:none; transition:border-color 0.2s; margin-bottom:16px; }
  input[type="text"]:focus { border-color:var(--accent); }
  input[type="text"]::placeholder { color:var(--muted); }

  .btn { width:100%; padding:13px 20px; border:none; border-radius:var(--radius-sm); font-family:'Syne',sans-serif; font-size:14px; font-weight:700; letter-spacing:0.05em; cursor:pointer; transition:all 0.2s; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:hover { background:#7c74ff; }
  .btn-primary:disabled { opacity:0.5; cursor:not-allowed; }

  .q-badge { display:inline-flex; align-items:center; font-family:'Syne',sans-serif; font-size:11px; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; background:rgba(108,99,255,0.15); color:var(--accent); padding:4px 12px; border-radius:100px; border:1px solid rgba(108,99,255,0.25); margin-bottom:16px; }
  .q-text { font-family:'Syne',sans-serif; font-size:clamp(15px,4vw,19px); font-weight:800; line-height:1.4; margin-bottom:20px; }

  .options-grid { display:flex; flex-direction:column; gap:9px; margin-bottom:18px; }
  .option { background:var(--surface2); border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:12px 15px; cursor:pointer; display:flex; align-items:center; gap:12px; transition:all 0.18s; font-size:14px; text-align:left; color:var(--text); width:100%; }
  .option:hover:not([disabled]) { border-color:var(--accent); background:rgba(108,99,255,0.08); }
  .option.selected { border-color:var(--accent); background:rgba(108,99,255,0.15); }
  .option.correct  { border-color:var(--accent3); background:rgba(67,233,123,0.12); color:var(--accent3); pointer-events:none; }
  .option.wrong    { border-color:var(--accent2); background:rgba(255,101,132,0.12); color:var(--accent2); pointer-events:none; }
  .option.neutral  { pointer-events:none; opacity:0.6; }
  .opt-letter { width:28px; height:28px; border-radius:7px; background:var(--surface); border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; font-weight:700; font-size:11px; flex-shrink:0; transition:all 0.18s; }
  .option.selected .opt-letter { background:var(--accent); border-color:var(--accent); color:#fff; }
  .option.correct  .opt-letter { background:var(--accent3); border-color:var(--accent3); color:#000; }
  .option.wrong    .opt-letter { background:var(--accent2); border-color:var(--accent2); color:#fff; }

  textarea { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:13px 15px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; outline:none; resize:vertical; min-height:90px; transition:border-color 0.2s; margin-bottom:18px; }

  .r-btn:hover { border-color:var(--accent); }
  .r-btn.sel { border-color:var(--accent); background:var(--accent); color:#fff; }

  .multi-hint { font-size:12px; color:var(--accent); margin-bottom:10px; font-weight:500; }

  .status-box.error     { background:rgba(255,101,132,0.08); border:1px solid rgba(255,101,132,0.2); color:var(--accent2); }

  .center { text-align:center; }

  .q-image { width:100%; max-height:340px; object-fit:contain; border-radius:14px; margin-bottom:18px; border:1px solid var(--border); background:#000; display:block; }

  .option { position:relative; }
  .opt-img { width:42px; height:42px; border-radius:8px; object-fit:cover; flex-shrink:0; }
  video.q-image { width:100%; max-height:380px; object-fit:contain; background:#000; border-radius:14px; }
  video.opt-img { width:42px; height:42px; border-radius:8px; object-fit:cover; flex-shrink:0; }
  .option.has-img { padding:8px 12px; }
  /* Countdown timer */
  .timer-bar { display:flex; align-items:center; gap:10px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 14px; margin-bottom:16px; }
  .timer-ring { width:34px; height:34px; flex-shrink:0; }
  .timer-text { font-family:'Syne',sans-serif; font-weight:700; font-size:15px; }
  .timer-text.warn { color:var(--accent2); }
  .timer-label { font-size:12px; color:var(--muted); }
  .expired-box { background:rgba(247,183,49,0.1); border:1px solid rgba(247,183,49,0.25); color:var(--accent4); border-radius:var(--radius-sm); padding:14px; text-align:center; font-weight:500; font-size:14px; margin-bottom:14px; }
  /* Survey (async whole-form) mode */
  .survey-card { position:relative; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); padding:18px 16px 16px; margin-bottom:14px; }
  .survey-qnum { position:absolute; top:-11px; left:14px; width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff; font-family:'Syne',sans-serif; font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center; }
  .survey-card .options-grid { margin-bottom:0; }
  .survey-card .rating-wrap { margin-bottom:8px; }
  /* StudySlide flashcards */
  .study-card { position:relative; background:var(--surface2); border:1.5px solid var(--border); border-radius:var(--radius); min-height:210px; display:flex; align-items:center; justify-content:center; text-align:center; padding:30px 22px; cursor:pointer; margin-bottom:14px; transition:border-color 0.2s, transform 0.1s; }
  .study-card:active { transform:scale(0.99); }
  .study-card.flipped { border-color:var(--accent); }
  .study-front { font-family:'Syne',sans-serif; font-weight:800; font-size:clamp(18px,5vw,24px); line-height:1.35; }
  .study-face-label { position:absolute; top:12px; left:0; right:0; text-align:center; font-size:10px; letter-spacing:0.18em; font-weight:700; color:var(--muted); text-transform:uppercase; }

  .study-rate-btn:hover { transform:translateY(-1px); }
  .study-rate-btn.again:hover { border-color:var(--accent2); }
  .study-rate-btn.hard:hover  { border-color:var(--accent4); }
  .study-rate-btn.good:hover  { border-color:var(--accent); }
  .study-rate-btn.easy:hover  { border-color:var(--accent3,#22c55e); }
  /* Accessibility (WCAG 2.1 AA): keyboard focus visibility + reduced motion */
  :focus-visible { outline:3px solid var(--accent,#6c63ff); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important; }
  }

// ─── URL PARSING ─────────────────────────────────────────────────────────────
// QR uses hash: echonest.at/index#SESSIONCODE/0
// Fallback: ?session=CODE&q=0
function parseLocation() {
  const hash = window.location.hash.replace('#','').trim();
  if (hash) {
    // "#SESSION/0" → single question.  "#SESSION/qa" → audience Q&A.  "#SESSION" → whole-form.
    const parts = hash.split('/');
    if (parts.length > 1 && String(parts[1]).toLowerCase() === 'qa') return { session: parts[0].toUpperCase(), qIndex:-1, qa:true };
    return { session: parts[0].toUpperCase(), qIndex: parts.length > 1 ? parseInt(parts[1] || '-1') : -1 };
  }
  const params = new URLSearchParams(window.location.search);
  return {
    session: (params.get('session') || '').toUpperCase().trim(),
    qIndex:  parseInt(params.get('q') || '-1'),
    qa: params.get('qa') === '1'
  };
}

const QA_MODE = !!SESSION && !!QA_FLAG;
// No question index (and not Q&A) → answer the whole set as one async form.

// ── Always-on profanity mask for open text (free-text answers + Q&A) ──
// Curated, word-boundary matched (avoids the "Scunthorpe" problem), masked with
// asterisks. Keeps every open-text surface classroom-safe with zero API cost.
const _BADWORDS = ['fuck','shit','bitch','asshole','arsehole','bastard','cunt','slut','whore','dick','piss','cock','pussy','nigger','faggot','retard','wanker','bollocks','prick','douche','motherfucker','jackass'];
const _BAD_RE = new RegExp('\\b(' + _BADWORDS.join('|') + ')(s|es|ing|ed|er|in|ah)?\\b', 'gi');
// Safety: mask profanity AND strip links (spam/phishing) from anything the audience
// submits and we may project on a big screen.
const _URL_RE = /\b(?:https?:\/\/|www\.)\S+/gi;
function moderateText(s){
  return String(s==null?'':s)
    .replace(_URL_RE, '[link removed]')
    .replace(_BAD_RE, m => '*'.repeat(m.length));
}
// Lighter pass for display names: mask profanity, drop URLs, collapse whitespace.
function moderateName(s){
  return String(s==null?'':s).replace(_URL_RE, '').replace(_BAD_RE, m => '*'.repeat(m.length))
    .replace(/\s+/g,' ').trim().slice(0,60);
}

  if (typeof syncOrigToggle === 'function') syncOrigToggle();

function t(key, fallback){ return (I18N[LANG] && I18N[LANG][key]) || fallback; }

// ── Live audience translation ───────────────────────────────────────────────
// LANG = the language THIS viewer reads in (chrome + content). DECK_LANG = the
// language the presenter authored in (the source). When they differ, question
// text + options are translated on the fly via /api/translate. Display-only —
// answers are submitted by option INDEX, so translation never changes the data.
let DECK_LANG = 'en';
const LANGUAGES = { en:'English', es:'Español', de:'Deutsch', fr:'Français', pt:'Português', it:'Italiano', nl:'Nederlands', ja:'日本語', zh:'中文', ar:'العربية', hi:'हिन्दी' };
let _currentRenderer = null;       // re-runs the active screen when the viewer switches language
// Question-level cache — the key includes the WHOLE source question, so a short option
// ("Orange") translated in one question's context is never reused in another where the
// context (and therefore the right sense) differs.
const _transQCache = {};           // key: "src>tgt:"+JSON(apiQuestion) -> translated apiQuestion

// Turn a captured source view (_viewFromFields) into the compact object the API
// translates as ONE unit: the stem travels WITH its options so the model can pick the
// right sense of each answer. Empty option slots are kept (as '') so answer INDICES
// line up end-to-end — answers submit by index, never by text.
function _apiQFromOrig(o){
  if (!o) return null;
  const q = {};
  if (o.text)  q.stem  = o.text;
  if (o.front) q.front = o.front;
  if (o.back)  q.back  = o.back;
  if (o.low)   q.low   = o.low;
  if (o.high)  q.high  = o.high;
  const opts = (o.opts || []).map(x => x == null ? '' : String(x));
  if (opts.length) q.options = opts;
  const hasText = q.stem || q.front || q.back || q.low || q.high;
  const hasOpt  = opts.some(x => x.trim());
  return (hasText || hasOpt) ? q : null;
}

// Fold one translated api-question back into q._trans, field by field. Any field the
// model left out (or a failed/passthrough call) keeps the deck-language source, so a
// partial translation degrades gracefully instead of blanking a field.
function _writeTransFromApi(q, out){
  const o = q._orig, d = (out && typeof out === 'object') ? out : {};
  q._trans = {
    text:  o.text  ? (d.stem  != null ? String(d.stem)  : o.text ) : o.text,
    front: o.front ? (d.front != null ? String(d.front) : o.front) : o.front,
    back:  o.back  ? (d.back  != null ? String(d.back)  : o.back ) : o.back,
    low:   o.low   ? (d.low   != null ? String(d.low)   : o.low  ) : o.low,
    high:  o.high  ? (d.high  != null ? String(d.high)  : o.high ) : o.high,
    opts:  (o.opts || []).map((x, i) => {
      if (!x) return x;
      const arr = Array.isArray(d.options) ? d.options : [];
      return arr[i] != null ? String(arr[i]) : x;
    }),
  };
}

// POST a batch of api-questions to /api/translate and return the translated ones in the
// same order. Cached per source-question, and NEVER throws — on any failure it returns
// the originals so the audience is never blocked on a translation.
async function _translateApiQuestions(apiQs){
  const out = new Array(apiQs.length);
  const need = [], needIdx = [];
  apiQs.forEach((qq, i) => {
    const k = DECK_LANG + '>' + LANG + ':' + JSON.stringify(qq);
    if (_transQCache[k] != null) out[i] = _transQCache[k];
    else { need.push(qq); needIdx.push(i); }
  });
  if (need.length){
    try {
      const r = await fetch('/api/translate', { method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ questions: need, target: LANG, source: DECK_LANG, session: SESSION || '' }) });
      const d = await r.json().catch(() => null);
      const arr = (d && Array.isArray(d.questions)) ? d.questions : [];
      need.forEach((qq, j) => {
        const v = (arr[j] && typeof arr[j] === 'object') ? arr[j] : qq;   // passthrough on any miss
        _transQCache[DECK_LANG + '>' + LANG + ':' + JSON.stringify(qq)] = v;
        out[needIdx[j]] = v;
      });
    } catch(e){ need.forEach((qq, j) => { out[needIdx[j]] = qq; }); }  // never block the audience on a failure
  }
  return out;
}

// ── "See original" support ───────────────────────────────────────────────────
// Translation used to overwrite the question in place, which threw the source text
// away — so there was nothing to show if a viewer wanted the original (the way X /
// Instagram / YouTube all let you). Now every translated question keeps BOTH views:
//   q._orig  = the deck-language source (captured once, before the first translate)
//   q._trans = the viewer-language translation
// The live fields (q.text / q.options[i].text / …) always hold whichever the viewer
// is currently looking at, so nothing downstream had to change.
let _showOriginal = false;   // true = viewer chose "See original" (show DECK_LANG source)

function _viewFromFields(q){
  const labels = q.ratingLabels || {};
  return { text:q.text, front:q.front, back:q.back, low:labels.low, high:labels.high,
           opts:(q.options||[]).map(o => o.text) };
}
function _applyView(q, v){
  if (!q || !v) return;
  const labels = q.ratingLabels || {};
  if (q.text  && v.text  != null) q.text  = v.text;
  if (q.front && v.front != null) q.front = v.front;
  if (q.back  && v.back  != null) q.back  = v.back;
  if (labels.low  && v.low  != null) labels.low  = v.low;
  if (labels.high && v.high != null) labels.high = v.high;
  (q.options||[]).forEach((o,i) => { if (v.opts && v.opts[i] != null) o.text = v.opts[i]; });
}
// Is there a MEANINGFUL translation to toggle to? (A failed/passthrough translation
// returns the originals unchanged — no point offering "See original" then.)
function _hasTranslation(q){
  if (!q || !q._orig || !q._trans) return false;
  if (q._orig.text !== q._trans.text) return true;
  if (q._orig.front !== q._trans.front || q._orig.back !== q._trans.back) return true;
  return (q._orig.opts||[]).some((o,i) => o !== (q._trans.opts||[])[i]);
}

// Translate a question as ONE unit (stem + its options together), keeping both views
// (see above). Covers every content field a card can carry: question text, flashcard
// front AND back (the back is the study answer — it must follow the viewer's language
// too), and the rating scale's end labels. One API round-trip per question.
async function translateQuestion(q){
  if (!q || LANG === DECK_LANG) return q;
  if (!q._orig) q._orig = _viewFromFields(q);   // capture the source once
  // Presenter opted this one out (wordplay, anagrams, spelling / "which word…" Qs):
  // keep it verbatim in the deck language for everyone — no prompt can translate those.
  if (q.noTranslate){ _writeTransFromApi(q, {}); _applyView(q, q._orig); return q; }
  const apiQ = _apiQFromOrig(q._orig);
  if (!apiQ) return q;
  const outs = await _translateApiQuestions([apiQ]);
  _writeTransFromApi(q, outs[0]);
  _applyView(q, _showOriginal ? q._orig : q._trans);
  return q;
}

// Translate a whole SET, still preserving each question's own context. Each question
// goes to the model as its own unit (stem + its options), but several ride in one API
// call so a 10-question form isn't 10 sequential round-trips.
async function translateQuestions(list){
  if (!Array.isArray(list) || !list.length || LANG === DECK_LANG) return;
  // Snapshot each question's source, and seed _trans from it so untranslated fields
  // (and opted-out questions) keep the original. Translations overwrite _trans, which
  // is then applied to the live fields — so "See original" (below) can swap back to
  // _orig without a re-fetch.
  list.forEach(q => {
    if (!q._orig)  q._orig  = _viewFromFields(q);
    if (!q._trans) q._trans = { text:q._orig.text, front:q._orig.front, back:q._orig.back,
                                low:q._orig.low, high:q._orig.high, opts:(q._orig.opts||[]).slice() };
  });
  // One api-question per translatable question. noTranslate questions are skipped
  // entirely — they stay in the deck language for everyone.
  const jobs = [];
  list.forEach(q => {
    if (q.noTranslate) return;
    const apiQ = _apiQFromOrig(q._orig);
    if (apiQ) jobs.push({ q, apiQ });
  });
  // A few questions per call — small enough that a structured JSON reply stays reliable
  // on the local model, and under the endpoint's per-call caps.
  const CHUNK = 8;
  for (let i = 0; i < jobs.length; i += CHUNK) {
    const batch = jobs.slice(i, i + CHUNK);
    const outs  = await _translateApiQuestions(batch.map(b => b.apiQ));
    batch.forEach((b, k) => _writeTransFromApi(b.q, outs[k]));
  }
  list.forEach(q => _applyView(q, _showOriginal ? q._orig : q._trans));
}

// ── The "See original" toggle ────────────────────────────────────────────────
// One pill (near the globe) flips the whole current screen between the translation
// and the deck-language source. It swaps the visible text IN PLACE — no re-render —
// so a selection, a half-typed answer, the timer and the submitted state all survive.
function _activeTranslatable(){
  return SURVEY_MODE ? surveyQuestions : (questionData ? [questionData] : []);
}
function toggleSeeOriginal(){
  _showOriginal = !_showOriginal;
  _activeTranslatable().forEach(q => { if (q._orig && q._trans) _applyView(q, _showOriginal ? q._orig : q._trans); });
  _syncTranslatedDom();
  syncOrigToggle();
}
// Push the (already-swapped) question objects into the live DOM without disturbing
// anything else on the card.
function _syncTranslatedDom(){
  const setText = (el, val) => { if (el && val != null) el.textContent = val; };
  if (SURVEY_MODE){
    surveyQuestions.forEach((q, idx) => {
      const card = document.getElementById('surveyCard' + idx); if (!card) return;
      setText(card.querySelector('.q-text'), q.text);
      (q.options || []).forEach((o, i) => {
        const b = document.getElementById('sq' + idx + '_opt' + i);
        if (b) setText(b.querySelector('span:last-child'), o.text || '');
      });
    });
  } else if (questionData){
    setText(document.querySelector('.q-text'), questionData.text);
    (questionData.options || []).forEach((o, i) => {
      const b = document.getElementById('opt' + i);
      if (b) setText(b.querySelector('span:last-child'), o.text || '');
    });
    const labels = questionData.ratingLabels || {};
    setText(document.getElementById('ratingLow'),  labels.low  || '');
    setText(document.getElementById('ratingHigh'), labels.high || '');
  }
}
function mountOrigToggle(){
  if (document.getElementById('seeOrigWrap')) return;
  const wrap = document.createElement('div');
  wrap.id = 'seeOrigWrap';
  wrap.style.cssText = 'position:fixed;top:47px;right:10px;z-index:9999;display:none;';
  const btn = document.createElement('button');
  btn.id = 'seeOrigBtn';
  btn.style.cssText = 'background:rgba(13,13,24,0.92);color:#cfcff5;border:1px solid rgba(255,255,255,0.22);border-radius:9px;padding:5px 11px;font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap;';
  btn.addEventListener('click', toggleSeeOriginal);
  wrap.appendChild(btn);
  document.body.appendChild(wrap);
}
// Show the pill only on a question screen that actually has a translation to toggle.
// The `.q-text` check quietly hides it on the name / join / thank-you screens.
function syncOrigToggle(){
  const wrap = document.getElementById('seeOrigWrap');
  const btn  = document.getElementById('seeOrigBtn');
  if (!wrap || !btn) return;
  const onQuestionScreen = !!document.querySelector('.q-text');
  const show = onQuestionScreen && LANG !== DECK_LANG && _activeTranslatable().some(_hasTranslation);
  wrap.style.display = show ? 'block' : 'none';
  btn.textContent = _showOriginal ? ('↩ ' + t('seeTranslation', 'See translation'))
                                   : ('🌐 ' + t('seeOriginal', 'See original'));
}

// Has this person started answering? Translations arriving must never redraw the
// screen out from under a finger — that would wipe a selection or a half-typed answer.
function answerUntouched(){
  if (answered || submitting) return false;
  if (selectedOptions && selectedOptions.size) return false;
  if (window._rating) return false;
  const ta = document.getElementById('txtAns');
  if (ta && String(ta.value || '').trim()) return false;
  return true;
}

// Fixed globe selector — lives outside #app so render() never wipes it.
function mountLangSelector(){
  if (document.getElementById('viewerLangWrap')) { const s=document.getElementById('viewerLangSel'); if(s) s.value=LANG; return; }
  const wrap = document.createElement('div');
  wrap.id = 'viewerLangWrap';
  wrap.style.cssText = 'position:fixed;top:10px;right:10px;z-index:9999;';
  const sel = document.createElement('select');
  sel.id = 'viewerLangSel';
  sel.setAttribute('aria-label','Choose your language');
  sel.style.cssText = 'background:rgba(13,13,24,0.92);color:#fff;border:1px solid rgba(255,255,255,0.22);border-radius:9px;padding:6px 9px;font-size:13px;font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;';
  Object.keys(LANGUAGES).forEach(code => {
    const o = document.createElement('option'); o.value = code; o.textContent = '🌐 ' + LANGUAGES[code];
    if (code === LANG) o.selected = true; sel.appendChild(o);
  });
  sel.addEventListener('change', () => setViewerLang(sel.value));
  wrap.appendChild(sel); document.body.appendChild(wrap);
  mountOrigToggle();   // the "See original" pill sits just below the globe
}
function setViewerLang(code){
  if (!LANGUAGES[code]) return;
  LANG = code; try { localStorage.setItem('ql_viewer_lang', code); } catch(e){}
  _showOriginal = false;   // picking a language means "show me this language", not the source
  if (typeof _currentRenderer === 'function') _currentRenderer();
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
async function bootApp() {
  // Pick the viewer's chrome language early — the join screen needs it too.
  let saved = null; try { saved = localStorage.getItem('ql_viewer_lang'); } catch(e){}
  const navL = (navigator.language || 'en').slice(0,2).toLowerCase();
  LANG = (saved && LANGUAGES[saved]) ? saved : (LANGUAGES[navL] ? navL : 'en');

  // No session in the URL → laptop/desktop users without a camera land here.
  // Give them a join-by-code screen instead of a dead end.
  if (!SESSION) { showJoinByCode(); return; }

  // Load the deck's (source) language first.
  try { const s = await db.ref(`quiz_builder/${SESSION}/language`).get(); if (s.exists() && s.val()) DECK_LANG = String(s.val()); } catch(e) {}

  // The viewer reads in: their saved choice → their browser language (if supported) → the deck language.
  LANG = (saved && LANGUAGES[saved]) ? saved : (LANGUAGES[navL] ? navL : DECK_LANG);
  mountLangSelector();
  followLive();  // code-joiners hop along when the presenter advances the live question

  // Restore identity from localStorage (persists across tabs / fresh QR scans within the same presentation)
  const storedId   = localStorage.getItem(`ql_pid_${SESSION}`);
  const storedName = localStorage.getItem(`ql_pname_${SESSION}`);
  if (storedId && storedName && storedName !== 'null' && storedName !== 'undefined') {
    participantId   = storedId;
    participantName = storedName;
    QA_MODE ? loadQA() : SURVEY_MODE ? loadSurvey() : loadQuestion();
  } else {
    showNameEntry();
  }
}

// ─── JOIN BY CODE (no camera needed) ─────────────────────────────────────────
// Laptop/desktop participants can't scan a QR. They open the answer page with no
// session in the URL, type the code shown next to the presenter's QR, and get
// routed exactly like a scan would: live question if one is running, otherwise
// the whole set as a self-paced form (survey / quiz / study).
function showJoinByCode(errMsg){
  render(`
    <a href="https://pollslide.com" class="logo" style="text-decoration:none;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="22" height="22" style="flex-shrink:0;"><rect width="100" height="100" rx="22" fill="#0d0d18"/><rect x="18" y="58" width="16" height="24" rx="4" fill="#ff6584"/><rect x="42" y="42" width="16" height="40" rx="4" fill="#f7b731"/><rect x="66" y="22" width="16" height="60" rx="4" fill="#6c63ff"/><polygon points="72,32 72,40 78,36" fill="rgba(255,255,255,0.8)"/></svg>PollSlide</a>
    <div style="text-align:center;padding:8px 0 4px;">
      <div style="font-size:40px;margin-bottom:10px;">🎟️</div>
      <h1 style="margin-bottom:6px;">${t('joinTitle','Join a session')}</h1>
      <p class="subtitle">${t('joinSub','Type the session code shown next to the QR code.')}</p>
    </div>
    <input type="text" id="joinCode" maxlength="10" placeholder="ABC1234" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="${t('joinSub','Type the session code shown next to the QR code.')}"
           style="text-transform:uppercase;text-align:center;letter-spacing:0.18em;font-weight:700;font-size:20px;" autofocus>
    <button class="btn btn-primary" id="joinBtn" onclick="joinByCode()" style="width:100%;justify-content:center;">${t('joinBtn','Join →')}</button>
    <p id="joinErr" style="color:var(--accent2);font-size:13px;min-height:16px;text-align:center;margin-top:10px;">${errMsg||''}</p>
  `);
  const inp = document.getElementById('joinCode');
  if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') joinByCode(); });
}

async function joinByCode(){
  const inp = document.getElementById('joinCode');
  const err = document.getElementById('joinErr');
  const btn = document.getElementById('joinBtn');
  const code = String((inp && inp.value) || '').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if (code.length < 4) { err.textContent = t('joinShort','That code looks too short — check it and try again.'); return; }
  err.textContent = '';
  if (inp) inp.disabled = true;
  if (btn) { btn.disabled = true; btn.textContent = t('loading','Loading…'); }
  try {
    const snap = await db.ref(`quiz_builder/${code}/questions`).get();
    if (!snap.exists()) {
      if (inp) inp.disabled = false;
      if (btn) { btn.disabled = false; btn.textContent = t('joinBtn','Join →'); }
      err.textContent = t('joinNotFound','No session found with that code — double-check with your presenter.');
      return;
    }
    // Presenter mid-presentation? Join the question that's live right now.
    let dest = '#' + code;
    try {
      const cur = await db.ref(`sessions/${code}/currentQuestion`).get();
      const cq = cur.exists() ? cur.val() : null;
      if (cq && cq.status === 'active' && cq.qIndex != null && Number(cq.qIndex) >= 0) dest = '#' + code + '/' + Number(cq.qIndex);
    } catch(e){}
    // Remember this tab joined by code → follow the presenter when they advance.
    try { sessionStorage.setItem('ql_follow_' + code, '1'); } catch(e){}
    location.hash = dest;                       // hashchange listener reloads into the session
    setTimeout(() => location.reload(), 250);   // belt & braces if the listener didn't fire
  } catch(e) {
    if (inp) inp.disabled = false;
    if (btn) { btn.disabled = false; btn.textContent = t('joinBtn','Join →'); }
    err.textContent = t('joinFail','Could not check that code — check your connection.');
  }
}

// Nobody should have to rescan a QR for every question — the phone rides along
// with the presenter. Two ways to earn the follow:
//   • joined by code (no camera) — flagged at join time
//   • scanned the QR for the question that is live RIGHT NOW — the normal
//     scan-and-play case, and the one the audience actually complained about
// A QR that deliberately points at a DIFFERENT question than the live one is the
// Keynote/PowerPoint per-slide workflow (every slide carries its own question's
// QR). Those scans stay pinned — following would drag the scanner off the slide
// they're standing in front of.
// The flag is sticky once earned: once you're in the live flow, you stay in it.
async function followLive(){
  if (QA_MODE || SURVEY_MODE || isNaN(Q_INDEX) || Q_INDEX < 0) return;
  let follow = false; try { follow = sessionStorage.getItem('ql_follow_' + SESSION) === '1'; } catch(e){}
  if (!follow) {
    try {
      const cur = await db.ref(`sessions/${SESSION}/currentQuestion`).get();
      const cq  = cur.exists() ? cur.val() : null;
      if (cq && cq.qIndex != null && Number(cq.qIndex) === Q_INDEX) {
        follow = true;
        try { sessionStorage.setItem('ql_follow_' + SESSION, '1'); } catch(e){}
      }
    } catch(e){}
  }
  if (!follow) return;
  db.ref(`sessions/${SESSION}/currentQuestion/qIndex`).on('value', snap => {
    const idx = snap.exists() ? Number(snap.val()) : NaN;
    if (!isNaN(idx) && idx >= 0 && idx !== Q_INDEX) {
      goToQuestion(idx);   // IN-PLACE swap — no full page reload (fast + reliable on mobile)
    }
  });
}

// Advance to a new live question WITHOUT reloading the page. A full reload re-inited
// Firebase, re-authed, and re-fetched everything on every advance — slow and flaky on
// phones (Rod: "taking forever, had to reload"). This swaps the question in place.
function goToQuestion(idx){
  if (idx === Q_INDEX) return;
  Q_INDEX = idx;
  STABLE_QID = `q${idx}_stable_${SESSION}`;
  // Clean per-question interaction state so the new question starts fresh.
  answered = false; submitting = false;
  selectedOptions = new Set();
  window._rating = null;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  // Keep the URL correct but DON'T trigger the hashchange→reload path (replaceState
  // doesn't fire hashchange), so the follow is instant.
  try { history.replaceState(null, '', '#' + SESSION + '/' + idx); } catch(e){}
  loadQuestion();
}

  if (!qSnap.exists()) {
    render(`

      <div style="text-align:center;padding:10px 0 20px;">
        <div style="font-size:40px;margin-bottom:12px;animation:gentle 2s ease-in-out infinite;">⏳</div>
        <h1 style="margin-bottom:8px;">Waiting...</h1>
        <p class="subtitle">Question ${Q_INDEX+1} isn't ready yet.<br>Stay on this page.</p>
        <div style="background:var(--surface2);border-radius:var(--radius-sm);padding:10px 16px;font-size:13px;color:var(--muted);margin-top:12px;">
          Session <strong style="color:var(--accent4);">${SESSION}</strong>
        </div>
      </div>
      <style>@keyframes gentle{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}</style>
    `);
    setTimeout(loadQuestion, 3000);
    return;
  }

  questionData = qSnap.val();

  // Check if this participant already answered this question
  // Response is stored at: sessions/SESSION/responses/STABLE_QID/participantId
  const myRespSnap = await db.ref(`sessions/${SESSION}/responses/${STABLE_QID}/${participantId}`).get();
  if (myRespSnap.exists()) {
    answered = true;
    showAlreadyAnswered();
    return;
  }

  answered = false;
  answerStartTime = Date.now();
  // Paint NOW, in the deck's language. Translation used to be awaited here, which
  // meant the whole room stared at a blank screen for however long the model took —
  // and the better the model, the longer the stall. The viewer's language is swapped
  // in as soon as it lands, and only if they haven't started answering yet.
  showQuestion(questionData);
  if (LANG !== DECK_LANG) {
    translateQuestion(questionData)
      .then(() => { if (answerUntouched()) showQuestion(questionData); })
      .catch(() => {});

}

// ─── SHOW QUESTION ────────────────────────────────────────────────────────────
function isVideoUrl(url) {
  if (!url) return false;
  const u = url.split('?')[0].toLowerCase();
  return u.endsWith('.mp4') || u.endsWith('.webm') || u.endsWith('.mov') || u.endsWith('.m4v') || u.includes('/video/');
}

function videoAttrs(opts) {
  opts = opts || { loop:true, autoplay:true, muted:true, controls:false };
  let a = 'playsinline ';
  if (opts.loop) a += 'loop ';
  if (opts.muted || opts.autoplay) a += 'muted ';   // autoplay needs muted
  if (opts.autoplay) a += 'autoplay ';
  if (opts.controls) a += 'controls ';
  return a;
}

function mediaTag(url, opts, className) {
  if (!url || !url.trim()) return '';
  if (isVideoUrl(url)) {
    return `<video class="${className}" src="${url}" ${videoAttrs(opts)}></video>`;
  }
  return `<img class="${className}" src="${url}" onerror="this.style.display='none'">`;
}

function showQuestion(q) {
  const isMulti  = q.type === 'multiple_choice_multi';

      <button class="btn btn-primary" onclick="submitAnswer()">${t('submitAnswer','Submit Answer')}</button>`;
  } else if (isRating) {
    const max = q.ratingMax || 5;
    const labels = q.ratingLabels || {};
    body = `
      <div class="rating-wrap" id="ratingWrap">
        ${Array.from({length:max},(_,i)=>`<button class="r-btn" id="rb${i+1}" onclick="selectRating(${i+1})">${i+1}</button>`).join('')}
      </div>
      ${labels.low||labels.high ? `<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:14px;"><span id="ratingLow">${labels.low||''}</span><span id="ratingHigh">${labels.high||''}</span></div>` : ''}
      <button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>${t('submitRating','Submit Rating')}</button>`;
  } else {
    body = `
      ${isMulti ? `<p class="multi-hint">${t('selectAll','✓ Select all that apply')}</p>` : ''}
      <div class="options-grid">
        ${(q.options||[]).map((opt,i) => {
          const hasImg = opt.img && opt.img.trim();
          return `
          <button class="option ${hasImg?'has-img':''}" id="opt${i}" onclick="toggleOpt(${i})">
            <span class="opt-letter">${letters[i]}</span>
            ${hasImg?mediaTag(opt.img, opt.videoOpts, 'opt-img'):''}
            <span>${opt.text||''}</span>
          </button>`;
        }).join('')}
      </div>
      ${isMulti ? `<button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()" disabled>${t('submitAnswers','Submit Answers')}</button>` : ''}`;
  }

  const qImage = mediaTag(q.image, q.videoOpts, 'q-image');

  const timerHtml = (q.timer && q.timer > 0)
    ? `<div class="timer-bar" id="timerBar">
         <svg class="timer-ring" viewBox="0 0 36 36">
           <circle cx="18" cy="18" r="16" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
           <circle id="timerCircle" cx="18" cy="18" r="16" fill="none" stroke="var(--accent)" stroke-width="3"
                   stroke-dasharray="100.5" stroke-dashoffset="0" stroke-linecap="round"
                   transform="rotate(-90 18 18)"/>
         </svg>
         <div>
           <div class="timer-text" id="timerText">${q.timer}s</div>
           <div class="timer-label">to answer</div>
         </div>
       </div>` : '';

  render(`
    <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="22" height="22" style="flex-shrink:0;"><rect width="100" height="100" rx="22" fill="#0d0d18"/><rect x="18" y="58" width="16" height="24" rx="4" fill="#ff6584"/><rect x="42" y="42" width="16" height="40" rx="4" fill="#f7b731"/><rect x="66" y="22" width="16" height="60" rx="4" fill="#6c63ff"/><polygon points="72,32 72,40 78,36" fill="rgba(255,255,255,0.8)"/></svg>PollSlide</div>
    <div class="q-badge">${t('question','Question')} ${Q_INDEX+1}</div>
    ${timerHtml}
    ${qImage}
    <div class="q-text">${q.text}</div>

  `);

  // Start countdown if timer set
  if (q.timer && q.timer > 0) startTimer(q.timer);
}

// ─── COUNTDOWN TIMER ──────────────────────────────────────────────────────────
let timerInterval = null;
function startTimer(seconds) {
  const total = seconds;
  // Count down from when the question actually opened, not from "now". showQuestion()
  // can run more than once for the same question (translations arriving), and a naive
  // reset would silently hand that person a fresh full timer while everyone else's
  // kept running. Also makes the clock honest about time spent loading.
  const elapsed = Math.max(0, Math.floor((Date.now() - (answerStartTime || Date.now())) / 1000));
  let remaining = Math.max(0, seconds - elapsed);
  const circle = document.getElementById('timerCircle');
  const text   = document.getElementById('timerText');
  const circumference = 100.5;
  if (text) text.textContent = remaining + 's';   // paint the true value before the first tick

  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    remaining--;
    if (text) {
      text.textContent = remaining + 's';
      if (remaining <= 5) text.classList.add('warn');
    }
    if (circle) {
      const offset = circumference * (1 - remaining / total);
      circle.style.strokeDashoffset = offset;
      if (remaining <= 5) circle.style.stroke = 'var(--accent2)';
    }
    if (remaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      if (!answered) {
        // Time's up — lock the question
        answered = true;
        const qb = document.getElementById('qBody');
        if (qb) {
          document.querySelectorAll('.option, .r-btn, #txtAns, #submitBtn').forEach(el => {
            el.style.pointerEvents = 'none'; el.style.opacity = '0.5';
          });
          qb.insertAdjacentHTML('afterbegin', '<div class="expired-box">⏱ Time\'s up! Answering is now closed.</div>');
        }
      }
    }
  }, 1000);
}

// ─── INTERACTION ──────────────────────────────────────────────────────────────
function toggleOpt(i) {
  if (answered) return;
  const isMulti = questionData.type === 'multiple_choice_multi';
  if (!isMulti) {
    selectedOptions.clear(); selectedOptions.add(i);
    document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
    document.getElementById(`opt${i}`).classList.add('selected');
    document.querySelectorAll('.option').forEach(el => el.style.pointerEvents = 'none');
    answered = true;
    submitToDb([i]);
    document.getElementById('qBody').insertAdjacentHTML('beforeend',
      '<div class="status-box submitted" style="margin-top:14px;">' + t('submitted','✓ Submitted!') + '</div>');
  } else {
    if (selectedOptions.has(i)) { selectedOptions.delete(i); document.getElementById(`opt${i}`).classList.remove('selected'); }
    else { selectedOptions.add(i); document.getElementById(`opt${i}`).classList.add('selected'); }
    const sb = document.getElementById('submitBtn');
    if (sb) sb.disabled = selectedOptions.size === 0;
  }
}

function selectRating(val) {
  document.querySelectorAll('.r-btn').forEach((b,i) => b.classList.toggle('sel', i+1 <= val));
  window._rating = val;
  const sb = document.getElementById('submitBtn');
  if (sb) sb.disabled = false;
}

function submitAnswer() {
  if (answered) return;
  answered = true;
  let answer;
  const q = questionData;
  if (q.type === 'free_text')            answer = moderateText(document.getElementById('txtAns')?.value?.trim() || '');
  else if (q.type === 'rating')          answer = window._rating || null;
  else if (q.type === 'multiple_choice_multi') answer = Array.from(selectedOptions);
  submitToDb(answer);
  document.getElementById('qBody').innerHTML =
    '<div class="status-box submitted">' + t('submitted','✓ Submitted!') + '</div>';
}

async function submitToDb(answer) {
  if (submitting) return; // prevent double-submit
  submitting = true;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  const elapsed = Date.now() - (answerStartTime || Date.now());
  const q = questionData;
  let isCorrect = null;

  if ((q.type === 'multiple_choice' || q.type === 'multiple_choice_multi') &&
      q.correctAnswer !== null && q.correctAnswer !== undefined) {
    if (q.type === 'multiple_choice') {
      const a = Array.isArray(answer) ? answer[0] : answer;
      // Coerce both sides — correctAnswer can round-trip through Firebase as a string
      // (e.g. "0"), and strict === would then score a correct answer as wrong.
      isCorrect = Number(a) === Number(q.correctAnswer);
    } else {
      // Partial credit: each correct selection earns a fraction; no bonus for wrong picks
      const correctSet = new Set(Array.isArray(q.correctAnswer) ? q.correctAnswer.map(Number) : [Number(q.correctAnswer)]);
      const givenArr   = Array.isArray(answer) ? answer.map(Number) : [];
      const wrongPicked    = givenArr.filter(a => !correctSet.has(a)).length;
      const correctPicked  = givenArr.filter(a => correctSet.has(a)).length;
      if (correctSet.size === 0) {
        isCorrect = null;
      } else if (wrongPicked > 0) {
        isCorrect = false;                                         // wrong answer chosen = 0
      } else if (correctPicked === correctSet.size) {
        isCorrect = true;                                          // all correct, none wrong = 100%
      } else {
        isCorrect = parseFloat((correctPicked / correctSet.size).toFixed(4)); // partial 0<x<1
      }
    }
  }

  // ── Free-tier participant cap ──
  // The presenter publishes a maxParticipants ceiling for the session (0 = unlimited).
  // Count unique participants already in this session; if at the cap and this is a
  // NEW participant, turn them away gracefully. Existing participants always get through.
  try {
    const metaSnap = await db.ref(`sessions/${SESSION}/meta/maxParticipants`).get();
    const cap = metaSnap.exists() ? Number(metaSnap.val()) : 0;
    if (cap > 0) {
      const allSnap = await db.ref(`sessions/${SESSION}/responses`).get();
      const ids = new Set();
      if (allSnap.exists()) {
        const byQ = allSnap.val();
        Object.values(byQ).forEach(qResp => {
          if (qResp && typeof qResp === 'object') Object.keys(qResp).forEach(pid => ids.add(pid));
        });
      }
      const alreadyCounted = ids.has(participantId);
      if (!alreadyCounted && ids.size >= cap) {
        showSessionFull();
        return;
      }
    }
  } catch(e) { /* if the check fails, don't block the answer */ }

  // Store response (submitting flag prevents double-taps on slow connections)
  try {
    await db.ref(`sessions/${SESSION}/responses/${STABLE_QID}/${participantId}`).set({
      participantId,
      name: participantName,
      answer: answer === null || answer === undefined ? '__none__' : JSON.stringify(answer),
      elapsed,
      isCorrect,
      submittedAt: Date.now()
    });
  } catch(e) {
    submitting = false;
    toast('Could not submit — check your connection and try again.', 'danger');
  }
}

// ════════════════════════════════════════════════════════════════════════════
// SURVEY MODE — answer the whole set as one async form (SurveySlide).
// Responses write to the SAME per-question buckets as live polls
// (sessions/SESSION/responses/q{idx}_stable_SESSION/participantId), so the
// presenter's existing report & tally aggregate them with zero extra work.
// ════════════════════════════════════════════════════════════════════════════
let surveyQuestions = [];
let _setTranslating = false; // a background set-translation is in flight (guards re-entry)
let surveyAnswers   = {};   // { qIndex: answerValue }
let formIsQuiz      = false; // graded (QuizSlide assignment) vs ungraded (SurveySlide)
let formProduct     = 'survey'; // survey | quiz | study (from quiz_builder/<code>/productType)
const SURVEY_LETTERS = ['A','B','C','D','E','F','G','H'];

async function loadSurvey() {
  _currentRenderer = loadSurvey;
  render(`<div class="spinner"></div><p class="center" style="color:var(--muted);font-size:13px;">${t('loading','Loading…')}</p>`);
  let qs = [];
  try {
    const snap = await db.ref(`quiz_builder/${SESSION}/questions`).get();
    qs = snap.exists() ? (snap.val() || []) : [];
  } catch(e) { qs = []; }
  // Firebase may return an object if keys are sparse — normalize to array.
  surveyQuestions = Array.isArray(qs) ? qs.filter(Boolean) : Object.values(qs).filter(Boolean);

  // What product is this? (Presenter publishes productType to quiz_builder.)
  try {
    const ptSnap = await db.ref(`quiz_builder/${SESSION}/productType`).get();
    formProduct = ptSnap.exists() ? ptSnap.val() : 'survey';
  } catch(e) { formProduct = 'survey'; }
  formIsQuiz = formProduct === 'quiz';

  // Translate the whole set into the viewer's language (display-only; indices unchanged).
  // Batched and in the BACKGROUND: this used to await one model call per question, so
  // a 10-question form was 10 sequential round-trips before anything appeared. The form
  // paints in the deck language and upgrades in place. Because translateQuestions()
  // mutates the question objects, anything rendered later (study cards, a re-render)
  // picks up the translation with no extra work.
  if (LANG !== DECK_LANG && !_setTranslating) {
    _setTranslating = true;
    translateQuestions(surveyQuestions)
      .catch(() => {})
      .then(() => {
        _setTranslating = false;
        // Only redraw a form nobody has started filling in.
        if (document.getElementById('surveyCard0') && surveyUntouched()) showSurveyForm();
      });
  }

  if (surveyQuestions.length === 0) {
    const noun = formProduct === 'study' ? 'study set' : formProduct;
    render(`
      ${logoMarkup()}
      <div style="text-align:center;padding:10px 0 20px;">
        <div style="font-size:40px;margin-bottom:12px;">${formProduct==='study'?'📚':'📋'}</div>
        <h1 style="margin-bottom:8px;">Nothing here yet</h1>
        <p class="subtitle">This ${noun} has no ${formProduct==='study'?'cards':'questions'} yet.<br>Check back shortly.</p>
      </div>`);
    return;
  }

  // StudySlide: a study set is reviewed repeatedly (spaced repetition), not "submitted".
  if (formProduct === 'study') { startStudySession(); return; }

  // Already submitted? If this participant has a response in ANY question bucket, treat
  // the survey as completed (one submission per person).
  try {
    const respSnap = await db.ref(`sessions/${SESSION}/responses`).get();
    if (respSnap.exists()) {
      const byQ = respSnap.val();
      const done = Object.values(byQ).some(bucket => bucket && typeof bucket === 'object' && bucket[participantId]);
      if (done) { showSurveyDone(true); return; }
    }
  } catch(e) { /* if the check fails, let them answer */ }

  showSurveyForm();
}

function logoMarkup() {
  return `<div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="22" height="22" style="flex-shrink:0;"><rect width="100" height="100" rx="22" fill="#0d0d18"/><rect x="18" y="58" width="16" height="24" rx="4" fill="#ff6584"/><rect x="42" y="42" width="16" height="40" rx="4" fill="#f7b731"/><rect x="66" y="22" width="16" height="60" rx="4" fill="#6c63ff"/><polygon points="72,32 72,40 78,36" fill="rgba(255,255,255,0.8)"/></svg>PollSlide</div>`;
}

function surveyQuestionBody(q, idx) {
  const isMulti  = q.type === 'multiple_choice_multi';
  const isText   = q.type === 'free_text';
  const isRating = q.type === 'rating';
  if (isText) {
    return `<textarea id="sq${idx}_txt" placeholder="${t('typeAnswer','Type your answer…')}" oninput="surveyAnswers[${idx}]=this.value.trim()" style="margin-bottom:0;"></textarea>`;
  }
  if (isRating) {
    const max = q.ratingMax || 5;
    const labels = q.ratingLabels || {};
    return `
      <div class="rating-wrap">
        ${Array.from({length:max},(_,i)=>`<button type="button" class="r-btn" id="sq${idx}_r${i+1}" onclick="surveyPickRating(${idx},${i+1})">${i+1}</button>`).join('')}
      </div>
      ${labels.low||labels.high ? `<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);"><span>${labels.low||''}</span><span>${labels.high||''}</span></div>` : ''}`;
  }
  // single or multi choice
  return `
    ${isMulti ? `<p class="multi-hint">${t('selectAll','✓ Select all that apply')}</p>` : ''}
    <div class="options-grid">
      ${(q.options||[]).map((opt,i) => {
        const hasImg = opt.img && opt.img.trim();
        return `<button type="button" class="option ${hasImg?'has-img':''}" id="sq${idx}_opt${i}" onclick="surveyPickOption(${idx},${i},${isMulti})">
          <span class="opt-letter">${SURVEY_LETTERS[i]}</span>
          ${hasImg?mediaTag(opt.img, opt.videoOpts, 'opt-img'):''}
          <span>${opt.text||''}</span>
        </button>`;
      }).join('')}
    </div>`;
}

function showSurveyForm() {
  const cards = surveyQuestions.map((q, idx) => `
    <div class="survey-card" id="surveyCard${idx}">
      <div class="survey-qnum">${idx+1}</div>
      ${mediaTag(q.image, q.videoOpts, 'q-image')}
      <div class="q-text" style="font-size:18px;margin-bottom:14px;">${q.text || ''}</div>
      ${surveyQuestionBody(q, idx)}
    </div>`).join('');

  render(`
    ${logoMarkup()}
    <h1 style="margin-bottom:4px;">${surveyQuestions.length} question${surveyQuestions.length!==1?'s':''}</h1>
    <p class="subtitle">${formIsQuiz
      ? 'Answer all you can, then submit to see your score.'
      : 'Answer at your own pace, then submit. You can skip any question.'}</p>
    <div id="surveyForm">${cards}</div>
    <button class="btn btn-primary" id="surveySubmitBtn" onclick="submitSurvey()" style="margin-top:6px;">${formIsQuiz ? t('submitQuiz','Submit & See Score') : t('submitSurvey','Submit Survey')}</button>
    <p id="surveyErr" style="color:var(--accent2);font-size:13px;margin-top:10px;text-align:center;"></p>
  `);
}

function surveyPickOption(idx, i, isMulti) {
  if (isMulti) {
    const cur = new Set(Array.isArray(surveyAnswers[idx]) ? surveyAnswers[idx] : []);
    if (cur.has(i)) { cur.delete(i); document.getElementById(`sq${idx}_opt${i}`).classList.remove('selected'); }
    else { cur.add(i); document.getElementById(`sq${idx}_opt${i}`).classList.add('selected'); }
    surveyAnswers[idx] = Array.from(cur);
  } else {
    (surveyQuestions[idx].options||[]).forEach((_,j) => document.getElementById(`sq${idx}_opt${j}`)?.classList.remove('selected'));
    document.getElementById(`sq${idx}_opt${i}`).classList.add('selected');
    surveyAnswers[idx] = [i];
  }
}

function surveyPickRating(idx, val) {
  const max = surveyQuestions[idx].ratingMax || 5;
  for (let n=1;n<=max;n++) document.getElementById(`sq${idx}_r${n}`)?.classList.toggle('selected', n===val);
  surveyAnswers[idx] = val;
}

function surveyComputeCorrect(q, answer) {
  if (!(q.type === 'multiple_choice' || q.type === 'multiple_choice_multi')) return null;
  if (q.correctAnswer === null || q.correctAnswer === undefined) return null; // ungraded (survey)
  if (q.type === 'multiple_choice') {
    const a = Array.isArray(answer) ? answer[0] : answer;
    return Number(a) === Number(q.correctAnswer);   // coerce: correctAnswer may be a string from Firebase
  }
  const correctSet = new Set(Array.isArray(q.correctAnswer) ? q.correctAnswer.map(Number) : [Number(q.correctAnswer)]);
  const givenArr   = Array.isArray(answer) ? answer.map(Number) : [];
  const wrongPicked   = givenArr.filter(a => !correctSet.has(a)).length;
  const correctPicked = givenArr.filter(a => correctSet.has(a)).length;
  if (correctSet.size === 0) return null;
  if (wrongPicked > 0) return false;
  if (correctPicked === correctSet.size) return true;
  return parseFloat((correctPicked / correctSet.size).toFixed(4));
}

function surveyIsAnswered(idx) {
  const a = surveyAnswers[idx];
  if (a === undefined || a === null) return false;
  if (Array.isArray(a)) return a.length > 0;
  if (typeof a === 'string') return a.trim().length > 0;
  return true; // number (rating)
}

// Nobody has started filling the form in. Guards the background-translation
// redraw — surveyAnswers is written on every keystroke (see the textarea's
// oninput), so this is an honest read of whether anything would be lost.
function surveyUntouched() {
  try { return !surveyQuestions.some((_, i) => surveyIsAnswered(i)); }
  catch(e) { return false; }
}

async function submitSurvey() {
  if (submitting) return;
  // Require at least one answer so we don't store an empty submission.
  const answeredCount = surveyQuestions.reduce((n,_,idx) => n + (surveyIsAnswered(idx) ? 1 : 0), 0);
  if (answeredCount === 0) {
    document.getElementById('surveyErr').textContent = 'Please answer at least one question before submitting.';
    return;
  }
  submitting = true;
  const btn = document.getElementById('surveySubmitBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Submitting…'; }

  const submittedAt = Date.now();
  const writes = [];
  surveyQuestions.forEach((q, idx) => {
    if (!surveyIsAnswered(idx)) return; // skip blanks
    let answer      = surveyAnswers[idx];
    if (q.type === 'free_text' && typeof answer === 'string') answer = moderateText(answer);
    const stableQId = `q${idx}_stable_${SESSION}`;
    const isCorrect = surveyComputeCorrect(q, answer);
    writes.push(
      db.ref(`sessions/${SESSION}/responses/${stableQId}/${participantId}`).set({
        participantId,
        name: participantName,
        answer: (answer === null || answer === undefined) ? '__none__' : JSON.stringify(answer),
        elapsed: 0,
        isCorrect,
        submittedAt
      })
    );
  });

  try {
    await Promise.all(writes);
    if (formIsQuiz) showQuizScore(); else showSurveyDone(false);
  } catch(e) {
    submitting = false;
    if (btn) { btn.disabled = false; btn.textContent = formIsQuiz ? t('submitQuiz','Submit & See Score') : t('submitSurvey','Submit Survey'); }
    document.getElementById('surveyErr').textContent = 'Could not submit — check your connection and try again.';
  }
}

function showSurveyDone(already) {
  render(`
    ${logoMarkup()}
    <div style="text-align:center;padding:14px 0 20px;">
      <div style="font-size:46px;margin-bottom:12px;">✓</div>
      <h1 style="margin-bottom:8px;">${already ? 'Already submitted' : t('thankYou','Thank you!')}</h1>
      <p class="subtitle">${already ? 'You\'ve already completed this ' + (formIsQuiz?'quiz':'survey') + '.' : t('recorded','Your responses have been recorded.')}</p>
    </div>
  `);
}

// ─── QUIZ SCORE (gamified, shareable — the QuizSlide payoff) ──────────────────
function answerLabel(q, answer) {
  if (answer === undefined || answer === null) return `<span style="opacity:0.6;">${t('skipped','(skipped)')}</span>`;
  if (q.type === 'multiple_choice' || q.type === 'multiple_choice_multi') {
    const arr = Array.isArray(answer) ? answer : [answer];
    return arr.map(i => SURVEY_LETTERS[i] + '. ' + ((q.options||[])[i]?.text || '')).join(', ') || t('skipped','(skipped)');
  }
  if (q.type === 'rating') return String(answer);
  return String(answer);
}
function correctLabel(q) {
  const ca = q.correctAnswer;
  if (ca === null || ca === undefined) return '';
  const arr = Array.isArray(ca) ? ca : [ca];
  return arr.map(i => SURVEY_LETTERS[i] + '. ' + ((q.options||[])[Number(i)]?.text || '')).join(', ');
}

function showQuizScore() {
  // Grade only the gradable (choice) questions that have a correct answer set.
  let gradable = 0, earned = 0;
  const rows = surveyQuestions.map((q, idx) => {
    const ans = surveyAnswers[idx];
    const score = surveyComputeCorrect(q, ans); // true / false / 0..1 / null
    const isGradable = score !== null;
    if (isGradable) { gradable++; earned += (score === true ? 1 : (typeof score === 'number' ? score : 0)); }
    const state = !isGradable ? 'na' : (score === true ? 'right' : (score === false || score === 0 ? 'wrong' : 'partial'));
    const icon  = state==='right' ? '✓' : state==='wrong' ? '✗' : state==='partial' ? '◐' : '•';
    const color = state==='right' ? 'var(--accent3,#22c55e)' : state==='wrong' ? 'var(--accent2)' : state==='partial' ? 'var(--accent4)' : 'var(--muted)';
    const showCorrect = (state==='wrong' || state==='partial');
    return `
      <div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);text-align:left;">
        <div style="color:${color};font-weight:800;font-size:16px;flex-shrink:0;width:18px;">${icon}</div>
        <div style="min-width:0;flex:1;">
          <div style="font-size:13px;font-weight:600;margin-bottom:2px;">${idx+1}. ${q.text||''}</div>
          ${isGradable ? `<div style="font-size:12px;color:var(--muted);">${t('yourAnswer','Your answer')}: ${answerLabel(q, ans)}</div>` : `<div style="font-size:12px;color:var(--muted);">${answerLabel(q, ans)}</div>`}
          ${showCorrect ? `<div style="font-size:12px;color:var(--accent3,#22c55e);">${t('correctWas','Correct')}: ${correctLabel(q)}</div>` : ''}
        </div>
      </div>`;
  }).join('');

  const pct = gradable ? Math.round((earned / gradable) * 100) : 0;
  const display = gradable ? `${(Math.round(earned*10)/10)} / ${gradable}` : '—';
  const headline = !gradable ? 'Submitted!' :
                   pct >= 80 ? '🏆 Excellent!' :
                   pct >= 50 ? '👏 Nice work!' : '💪 Keep practicing!';
  const ring = gradable ? `
    <div style="position:relative;width:120px;height:120px;margin:0 auto 14px;">
      <svg viewBox="0 0 36 36" style="width:120px;height:120px;transform:rotate(-90deg);">
        <circle cx="18" cy="18" r="16" fill="none" stroke="var(--surface3)" stroke-width="3"/>
        <circle cx="18" cy="18" r="16" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"
                stroke-dasharray="100.5" stroke-dashoffset="${(100.5*(1-pct/100)).toFixed(1)}"/>
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:30px;line-height:1;">${pct}%</div>
        <div style="font-size:11px;color:var(--muted);">${display}</div>
      </div>
    </div>` : '<div style="font-size:46px;margin-bottom:12px;">✓</div>';

  window._quizSharePct = pct; window._quizShareScore = display;
  render(`
    ${logoMarkup()}
    <div style="text-align:center;padding:6px 0 8px;">
      ${ring}
      <h1 style="margin-bottom:4px;">${headline}</h1>
      ${gradable ? `<p class="subtitle">You scored <strong style="color:var(--text);">${display}</strong> correct.</p>` : `<p class="subtitle">Your answers were recorded.</p>`}
    </div>
    ${gradable ? `<button class="btn btn-primary" onclick="shareQuizScore()" style="width:100%;justify-content:center;margin-bottom:14px;">📣 Share my score</button>` : ''}
    <div style="text-align:left;">${rows}</div>
  `);
}

function shareQuizScore() {
  const text = `I scored ${window._quizShareScore} (${window._quizSharePct}%) on this quiz! Try it: ${location.href}`;
  if (navigator.share) {
    navigator.share({ text }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(text).then(()=> toast('Result copied — paste it anywhere!', 'success')).catch(()=>{});
  }
}

// ════════════════════════════════════════════════════════════════════════════
// STUDYSLIDE — spaced-repetition flashcards (Anki/Quizlet-class), client-side.
// SRS state lives in localStorage per device+set (no login needed). Forward-
// thinking extras: text-to-speech, daily streak, and "add next review to
// calendar" for re-engagement. The killer growth flow (quiz→study set) is
// generated on the presenter side.
// ════════════════════════════════════════════════════════════════════════════
let studyCards = [];      // [{front, back, idx}]
let studyQueue = [];      // indices still to review this session
let studyReviewed = 0;    // cards completed this session
let studyFlipped = false;

// A card's front/back from any question type (flashcard, or derive from a Q+answer).
function cardFront(q) {
  if (q.type === 'flashcard') return q.front || q.text || '';
  return q.text || '';
}
function cardBack(q) {
  if (q.type === 'flashcard') return q.back || '';
  if ((q.type === 'multiple_choice' || q.type === 'multiple_choice_multi') &&
      q.correctAnswer !== null && q.correctAnswer !== undefined) {
    const arr = Array.isArray(q.correctAnswer) ? q.correctAnswer : [q.correctAnswer];
    return arr.map(i => (q.options||[])[Number(i)]?.text || '').filter(Boolean).join(', ');
  }
  if (q.options && q.options.length) return q.options.map(o=>o.text).filter(Boolean).join(' · ');
  return '(no answer set)';
}

// ── SRS state (localStorage) ──
function srsLoad() { try { return JSON.parse(localStorage.getItem(`ql_srs_${SESSION}`) || '{}'); } catch(e) { return {}; } }
function srsSave(s) { try { localStorage.setItem(`ql_srs_${SESSION}`, JSON.stringify(s)); } catch(e) {} }

// SM-2 lite: rating ∈ again|hard|good|easy → updated {interval(days), ease, reps, due}
function srsSchedule(st, rating) {
  st = st || { interval:0, ease:2.5, reps:0, due:0 };
  if (rating === 'again') {
    st.reps = 0; st.interval = 0; st.ease = Math.max(1.3, st.ease - 0.2);
    st.due = Date.now(); // resurface later this same session
  } else {
    st.reps++;
    if (rating === 'hard')      { st.ease = Math.max(1.3, st.ease - 0.15); st.interval = st.interval ? st.interval * 1.2 : 1; }
    else if (rating === 'good') { st.interval = st.interval ? st.interval * st.ease : 1; }
    else if (rating === 'easy') { st.ease += 0.15; st.interval = (st.interval || 1) * st.ease * 1.3; }
    st.due = Date.now() + st.interval * 86400000;
  }
  return st;
}

function startStudySession(reviewAll) {
  studyCards = surveyQuestions.map((q, idx) => ({ idx, front: cardFront(q), back: cardBack(q) }))
                              .filter(c => c.front);
  const srs = srsLoad();
  const now = Date.now();
  // Due = new cards (no state) or cards whose due time has passed. reviewAll ignores due.
  studyQueue = studyCards
    .filter(c => reviewAll || !srs[c.idx] || (srs[c.idx].due || 0) <= now)
    .map(c => c.idx);
  // Light shuffle so order varies between sessions.
  for (let i = studyQueue.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [studyQueue[i],studyQueue[j]]=[studyQueue[j],studyQueue[i]]; }
  studyReviewed = 0;
  if (studyQueue.length === 0) { showStudyDone(true); return; }
  showStudyCard();
}

function studyCardByIdx(idx) { return studyCards.find(c => c.idx === idx); }

function showStudyCard() {
  if (studyQueue.length === 0) { showStudyDone(false); return; }
  studyFlipped = false;
  const idx = studyQueue[0];
  const card = studyCardByIdx(idx);
  const total = studyReviewed + studyQueue.length;
  const pct = total ? Math.round((studyReviewed / total) * 100) : 0;
  render(`
    ${logoMarkup()}
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <div style="flex:1;height:6px;background:var(--surface3);border-radius:100px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:var(--accent);border-radius:100px;transition:width 0.3s;"></div></div>
      <div style="font-size:12px;color:var(--muted);white-space:nowrap;">${studyReviewed}/${total}</div>
    </div>
    <div class="study-card" id="studyCard" onclick="flipStudyCard()">
      <button class="study-speak" onclick="event.stopPropagation();speakCard()" title="Read aloud" aria-label="Read aloud">🔊</button>
      <div class="study-face-label" id="studyFaceLabel">${t('tapToFlip','TAP TO FLIP')}</div>
      <div class="study-front" id="studyText">${card.front}</div>
    </div>
    <div id="studyControls">
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="flipStudyCard()">${t('showAnswer','Show Answer')}</button>
    </div>
  `);
}

function flipStudyCard() {
  if (studyFlipped) return;
  studyFlipped = true;
  const idx = studyQueue[0];
  const card = studyCardByIdx(idx);
  document.getElementById('studyText').innerHTML = card.back;
  document.getElementById('studyFaceLabel').textContent = t('answerFace','ANSWER');
  document.getElementById('studyCard').classList.add('flipped');
  document.getElementById('studyControls').innerHTML = `
    <div class="study-rate">
      <button class="study-rate-btn again" onclick="rateCard('again')">${t('again','Again')}<span>&lt;1m</span></button>
      <button class="study-rate-btn hard"  onclick="rateCard('hard')">${t('hard','Hard')}<span>1d</span></button>
      <button class="study-rate-btn good"  onclick="rateCard('good')">${t('good','Good')}<span>≈3d</span></button>
      <button class="study-rate-btn easy"  onclick="rateCard('easy')">${t('easy','Easy')}<span>≈7d</span></button>
    </div>`;
}

function rateCard(rating) {
  const idx = studyQueue.shift();
  const srs = srsLoad();
  srs[idx] = srsSchedule(srs[idx], rating);
  srsSave(srs);
  recordStudyProgress(idx, rating);   // report to the presenter's live mastery dashboard
  if (rating === 'again') studyQueue.push(idx); // re-show later this session
  else studyReviewed++;
  showStudyCard();
}

// Per-studier mastery → powers the presenter's live Study Mastery dashboard.
// Best-effort: study still works client-side even if this write is denied.
function recordStudyProgress(idx, rating) {
  if (!participantId || !SESSION) return;
  try {
    db.ref(`sessions/${SESSION}/study/${participantId}`).update({
      name: participantName || 'Anon',
      updated: Date.now(),
      [`cards/${idx}`]: rating          // again | hard | good | easy
    });
  } catch (e) {}
}

function speakCard() {
  try {
    if (!('speechSynthesis' in window)) return;
    const txt = document.getElementById('studyText')?.textContent || '';
    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance(txt));
  } catch(e) {}
}

// ── Daily streak (habit loop) ──
function studyStreak() {
  let s; try { s = JSON.parse(localStorage.getItem(`ql_streak_${SESSION}`) || '{}'); } catch(e) { s = {}; }
  const today = new Date().toDateString();
  const yest  = new Date(Date.now()-86400000).toDateString();
  if (s.lastDay === today) { /* already counted today */ }
  else if (s.lastDay === yest) { s.count = (s.count||0)+1; s.lastDay = today; }
  else { s.count = 1; s.lastDay = today; }
  try { localStorage.setItem(`ql_streak_${SESSION}`, JSON.stringify(s)); } catch(e) {}
  return s.count || 1;
}

// ── "Add next review to calendar" (re-engagement) ──
function nextDueDate() {
  const srs = srsLoad();
  const dues = studyCards.map(c => srs[c.idx]?.due).filter(d => d && d > Date.now());
  if (!dues.length) return null;
  return new Date(Math.min(...dues));
}
function addStudyToCalendar() {
  const d = nextDueDate() || new Date(Date.now()+86400000);
  const fmt = dt => dt.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const end = new Date(d.getTime()+15*60000);
  const url = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent('Review flashcards (PollSlide)')
    + '&dates=' + fmt(d) + '/' + fmt(end)
    + '&details=' + encodeURIComponent('Your next spaced-repetition review is due. ' + location.href);
  window.open(url, '_blank');
}

function showStudyDone(nothingDue) {
  const streak = studyStreak();
  const due = nextDueDate();
  const dueTxt = due ? `Next review ${due.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}` : 'All caught up!';
  render(`
    ${logoMarkup()}
    <div style="text-align:center;padding:8px 0 6px;">
      <div style="font-size:46px;margin-bottom:8px;">${nothingDue?'✅':'🎉'}</div>
      <h1 style="margin-bottom:6px;">${nothingDue?'Nothing due right now':'Session complete!'}</h1>
      <p class="subtitle">${nothingDue?'You\'re all caught up — come back later for your next review.':`You reviewed <strong style="color:var(--text);">${studyReviewed}</strong> card${studyReviewed!==1?'s':''}.`}</p>
      <div style="display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:8px 16px;margin:14px 0;">
        <span style="font-size:18px;">🔥</span><span style="font-weight:700;">${streak}-day streak</span>
      </div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:16px;">${dueTxt}</div>
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-bottom:8px;" onclick="addStudyToCalendar()">📅 Remind me to review</button>
    <button class="btn btn-ghost" style="width:100%;justify-content:center;" onclick="startStudySession(true)">🔁 Study all again</button>
  `);
}

// ════════════════════════════════════════════════════════════════════════════
// AUDIENCE Q&A — ask questions + upvote (Slido-style). Lives at #SESSION/qa.
// Stored at sessions/SESSION/qa/<id> = {text,name,votes,voters,createdAt,answered}.
// ════════════════════════════════════════════════════════════════════════════
let qaRef = null;
function escapeQa(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function loadQA(){
  _currentRenderer = loadQA;
  render(`
    ${logoMarkup()}
    <h1 style="margin-bottom:4px;">${t('qaTitle','Audience Q&amp;A')}</h1>
    <p class="subtitle">${t('qaSub','Ask the speaker a question — or upvote the ones you most want answered.')}</p>
    <textarea id="qaText" maxlength="280" placeholder="${t('typeQuestion','Type your question…')}" style="min-height:70px;"></textarea>
    <button class="btn btn-primary" onclick="submitQuestion()" style="margin-bottom:6px;">${t('ask','Ask')}</button>
    <p id="qaErr" style="color:var(--accent2);font-size:13px;min-height:16px;margin:0 0 8px;"></p>
    <div id="qaList"></div>
  `);
  if (qaRef) qaRef.off();
  qaRef = db.ref('sessions/' + SESSION + '/qa');
  qaRef.on('value', snap => renderQAList(snap.exists() ? (snap.val()||{}) : {}));
}
function renderQAList(data){
  const list = document.getElementById('qaList'); if (!list) return;
  const items = Object.entries(data).map(([id,q]) => Object.assign({id}, q)).filter(q => !q.hidden);
  items.sort((a,b) => (b.votes||0)-(a.votes||0) || (a.createdAt||0)-(b.createdAt||0));
  if (!items.length) { list.innerHTML = '<div style="color:var(--muted);font-size:13px;text-align:center;padding:14px;">No questions yet — be the first!</div>'; return; }
  list.innerHTML = items.map(q => {
    const voted = q.voters && q.voters[participantId];
    return `<div style="display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px;margin-bottom:8px;${q.answered?'opacity:0.55;':''}">
      <button onclick="upvoteQuestion('${q.id}')" ${voted?'disabled':''} style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:0;background:${voted?'var(--accent)':'var(--surface)'};border:1px solid ${voted?'var(--accent)':'var(--border)'};border-radius:8px;padding:5px 10px;cursor:${voted?'default':'pointer'};color:${voted?'#fff':'var(--text)'};font-family:inherit;">
        <span style="font-size:12px;line-height:1;">▲</span><span style="font-size:13px;font-weight:700;line-height:1.3;">${q.votes||0}</span></button>
      <div style="flex:1;min-width:0;"><div style="font-size:14px;line-height:1.4;">${escapeQa(q.text)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px;">${escapeQa(q.name||'Anonymous')}${q.answered?' · ✓ answered':''}</div></div>
    </div>`;
  }).join('');
}
// Q&A flood protection — a short cooldown + a per-session cap, so one person can't
// spam the live board. (Client-side deterrent; pair with DB rules for hard limits.)
const QA_COOLDOWN_MS = 8000, QA_MAX_PER_SESSION = 8;
async function submitQuestion(){
  const ta = document.getElementById('qaText'); const text = (ta.value||'').trim();
  const err = document.getElementById('qaErr');
  if (text.length < 3) { err.textContent = 'Type a question first.'; return; }
  const lastKey = 'ql_qa_last_' + SESSION, cntKey = 'ql_qa_count_' + SESSION;
  const last = +(localStorage.getItem(lastKey) || 0), cnt = +(localStorage.getItem(cntKey) || 0);
  const wait = QA_COOLDOWN_MS - (Date.now() - last);
  if (wait > 0) { err.textContent = 'Please wait ' + Math.ceil(wait/1000) + 's before asking again.'; return; }
  if (cnt >= QA_MAX_PER_SESSION) { err.textContent = "You've reached the question limit for this session."; return; }
  err.textContent = '';
  try {
    const ref = db.ref('sessions/' + SESSION + '/qa').push();
    await ref.set({ text: moderateText(text.slice(0,280)), name: participantName || 'Anonymous', votes: 1, voters: { [participantId]: true }, createdAt: Date.now(), answered: false });
    localStorage.setItem(lastKey, String(Date.now()));
    localStorage.setItem(cntKey, String(cnt + 1));
    ta.value = '';
  } catch(e) { err.textContent = 'Could not post — check your connection.'; }
}
async function upvoteQuestion(id){
  try {
    await db.ref('sessions/' + SESSION + '/qa/' + id).transaction(q => {
      if (!q) return q;
      q.voters = q.voters || {};
      if (q.voters[participantId]) return; // one vote per person
      q.voters[participantId] = true;
      q.votes = (q.votes||0) + 1;
      return q;
    });
  } catch(e) {}
}

// ─── BOOT (called last, after all functions defined) ─────────────────────────
// Force full reload when hash changes (new QR scanned for different question).
// In survey mode the hash never changes, so this is a no-op there.
window.addEventListener('hashchange', () => { window.location.reload(); });

bootApp();
</script>
