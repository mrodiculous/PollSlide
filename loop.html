<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LoopSlide Studio — PollSlide</title>
<link rel="icon" href="/icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0b15; --surface:#13131f; --surface2:#1b1b2c; --surface3:#23233a; --border:#2a2a45; --text:#ececff; --muted:#9090b8;
          --accent:#6c63ff; --accent2:#ff6584; --accent3:#43e97b; --accent4:#f7b731; --radius:14px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',system-ui,sans-serif; min-height:100vh; }
  header { display:flex; align-items:center; gap:14px; padding:14px 22px; border-bottom:1px solid var(--border); position:sticky; top:0; background:rgba(11,11,21,.92); backdrop-filter:blur(8px); z-index:5; }
  .logo { font-family:'Syne',sans-serif; font-weight:800; font-size:19px; display:flex; align-items:center; gap:9px; }
  .logo .mk { width:26px; height:26px; border-radius:7px; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; font-size:14px; }
  header a.back { color:var(--muted); text-decoration:none; font-size:13px; margin-left:auto; }
  #langBox select { width:auto; padding:5px 8px; font-size:12px; }
  main { max-width:1100px; margin:0 auto; padding:24px 20px 80px; }
  h1 { font-family:'Syne',sans-serif; font-size:26px; margin-bottom:6px; }
  h2 { font-family:'Syne',sans-serif; font-size:18px; margin-bottom:12px; }
  .sub { color:var(--muted); font-size:14px; line-height:1.55; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
  .loopcard { cursor:pointer; transition:border-color .15s, transform .15s; }
  .loopcard:hover { border-color:var(--accent); transform:translateY(-2px); }
  .btn { display:inline-flex; align-items:center; gap:6px; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:9px 14px; font:600 13px 'DM Sans',sans-serif; cursor:pointer; text-decoration:none; }
  .btn:hover { border-color:var(--accent); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.green { background:rgba(67,233,123,.14); border-color:rgba(67,233,123,.5); color:var(--accent3); }
  .btn.danger { color:var(--accent2); }
  .btn.sm { padding:6px 10px; font-size:12px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  label.f { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:10px 0 5px; }
  input, select, textarea { width:100%; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:9px; padding:9px 11px; font:500 14px 'DM Sans',sans-serif; }
  textarea { min-height:60px; resize:vertical; }
  input[type=color] { padding:2px; height:38px; }
  input[type=checkbox], input[type=radio] { width:auto; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .cols3 { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .set { border-left:3px solid var(--accent); }
  .item { background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:12px; margin:10px 0; }
  .item.ad { border-left:3px solid var(--accent4); }
  .item .hd { display:flex; align-items:center; gap:8px; margin-bottom:8px; font-weight:700; font-size:13px; }
  .item .hd .sp { margin-left:auto; display:flex; gap:4px; }
  .opt { display:flex; gap:8px; align-items:center; margin:6px 0; }
  .opt input[type=text] { flex:1; }
  .pill { font-size:11px; font-weight:700; padding:3px 9px; border-radius:100px; background:var(--surface3); color:var(--muted); }
  .pill.live { background:rgba(67,233,123,.15); color:var(--accent3); }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--surface2); border:1px solid var(--border); border-left:4px solid var(--accent); padding:12px 18px; border-radius:10px; font-weight:600; z-index:50; max-width:90vw; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:16px; z-index:40; }
  .modal .card { max-width:560px; width:100%; max-height:84vh; overflow:auto; margin:0; }
  .deck { display:flex; align-items:center; gap:10px; padding:10px; border-radius:10px; cursor:pointer; }
  .deck:hover { background:var(--surface2); }
  .note { font-size:12.5px; color:var(--muted); line-height:1.5; }
  .emo { background:var(--surface3); border:1px solid var(--border); border-radius:8px; padding:6px 8px; cursor:pointer; font-size:15px; flex-shrink:0; }
  #emoPal { position:fixed; z-index:60; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:8px; display:grid; grid-template-columns:repeat(10,1fr); gap:2px; width:340px; max-width:92vw; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  #emoPal button { background:none; border:0; font-size:20px; padding:4px; border-radius:6px; cursor:pointer; }
  #emoPal button:hover { background:var(--surface3); }
  .oimgIn { max-width:190px; }
  .gifgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:8px 0; }
  .gifgrid img { width:100%; height:86px; object-fit:cover; border-radius:8px; cursor:pointer; border:2px solid transparent; }
  .gifgrid img:hover { border-color:var(--accent); }
  .mediaRow { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .sticky { position:sticky; top:62px; z-index:4; background:var(--bg); padding:10px 0; }
  @media (max-width:720px){ .cols,.cols3{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <div class="logo"><span class="mk">🔁</span>LoopSlide <span class="pill">Studio</span></div>
  <a class="back" href="/presenter">← Back to PollSlide</a>
  <span id="langBox"></span>
</header>
<main id="root"><div class="sub">Loading…</div></main>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="/ps-env.js?v=717fca7b"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="/gifs.js?v=ed7add18"></script>
<script src="/loop-i18n.js?v=659ae400"></script>
<script src="/loop-engine.js?v=8cbfc46c"></script>
<script>
/* LoopSlide Studio — build, publish and run loops for public screens.
 * Data:  users/<uid>/loops/<CODE>   { name, def (draft), publishedAt, updatedAt }  — private
 *        loops/<CODE>               { ownerUid, def, banned, updatedAt }            — public
 * Import/export speaks PollSlide's own deck format (users/<uid>/presentations), so a
 * round can come from — or go back to — any PollSlide product. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBPncI0e-LlIgLvTcq76O1Kdq2jXJ6DiME",
  authDomain: "echonest-live-survey.firebaseapp.com",
  databaseURL: "https://echonest-live-survey-default-rtdb.firebaseio.com",
  projectId: "echonest-live-survey",
  storageBucket: "echonest-live-survey.firebasestorage.app",
  messagingSenderId: "285529140046",
  appId: "1:285529140046:web:983c1ee8000a2ca8f80c1f",
  measurementId: "G-NWQY4YLNRC"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database(), auth = firebase.auth(), storage = firebase.storage();
const E = window.LoopEngine, I = window.LoopI18n;
/* The Studio speaks the language the user chose in PollSlide (ps_ui_lang, shared with the
   presenter), else the browser's. Static copy is translated by exact match as it renders
   (LoopI18n.observe); sentences with numbers or names go through T() with placeholders.
   Anything the user typed is marked data-noi18n and never touched. */
const T = I.t;
I.set(I.stored('ps_ui_lang') || I.nav());
I.observe(document.body);
document.getElementById('langBox').appendChild(I.picker(I.get(), l => { try { localStorage.setItem('ps_ui_lang', l); } catch (e) {} location.reload(); }));
const LANG_OPTS = sel => E.LANGS.map(l => `<option value="${l}" data-noi18n ${l === sel ? 'selected' : ''}>${I.NAMES[l]}</option>`).join('');
const APP = (window.PS_ENV && PS_ENV.appOrigin) || location.origin;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const uid6 = () => Math.random().toString(36).slice(2, 8);
const PRODUCT_ICON = { poll:'🗳️', survey:'📋', quiz:'🏆', study:'📚', present:'🎬' };
const PRODUCT_NAME = { poll:'PollSlide', survey:'SurveySlide', quiz:'QuizSlide', study:'StudySlide' };
/* What each plan includes. loops = loops you can keep; slides = questions + cards (sponsor
   and media cards count) in ONE loop; screens = TVs paired at once; players = players per
   leaderboard (0 = unlimited). Enterprise is set per deal, so it is unlimited here.
   Published loops, paired screens and the player cap are ALSO enforced by the database
   rules (loop_slots, tv_slots, loops/$code/cap), so they hold even if this page is bypassed. */
const LOOP_PLANS = {
  free:       { name: 'Free',       loops: 1,        slides: 10,       screens: 1,        players: 25 },
  pro:        { name: 'Pro',        loops: 5,        slides: 20,       screens: 3,        players: 0 },
  team_small: { name: 'Team Small', loops: 20,       slides: 40,       screens: 10,       players: 0 },
  team_large: { name: 'Team Large', loops: 80,       slides: 150,      screens: 40,       players: 0 },
  enterprise: { name: 'Enterprise', loops: Infinity, slides: Infinity, screens: Infinity, players: 0 },
};
function planOf() {
  const t = tier === 'team' ? 'team_small' : tier === 'white' ? 'team_large' : tier;
  return LOOP_PLANS[t] || LOOP_PLANS.free;
}
function slideCount(def) { try { return (def.sets || []).reduce((n, s) => n + (s.items || []).length, 0); } catch (e) { return 0; } }
function limitNote(what) {
  const p = planOf();
  modal(`<h2>${esc(T('That’s the limit on {plan}', { plan: p.name }))}</h2><p class="sub" style="margin-bottom:14px;">${esc(what)}</p>
    <div class="row"><a class="btn primary" href="https://pollslide.com/pricing" target="_blank" rel="noopener">See plans</a><button class="btn" onclick="closeModal()">OK</button></div>`);
}

let user = null, tier = 'free', myLoops = {}, cur = null, curCode = null, myTvs = {};
/* A TV shows a QR that opens loop#pair=CODE — remembered here until the user is signed in. */
let pendingPair = (location.hash.match(/pair=([A-Za-z0-9]{6})/) || [])[1] || '';
if (pendingPair) pendingPair = pendingPair.toUpperCase();

function toast(m) { document.querySelectorAll('.toast').forEach(x => x.remove()); const el = document.createElement('div'); el.className = 'toast'; el.textContent = T(m); document.body.appendChild(el); setTimeout(() => el.remove(), 4200); }
function root(h) { $('root').innerHTML = h; }

auth.onAuthStateChanged(async u => {
  user = u;
  if (!u) return signInView();
  try { const t = await db.ref('users/' + u.uid + '/tier').get(); tier = t.val() || 'free'; } catch (e) {}
  db.ref('users/' + u.uid + '/tvs').on('value', s => { myTvs = s.val() || {}; if (onScreens) screensView(); });
  db.ref('users/' + u.uid + '/loops').on('value', s => {
    myLoops = s.val() || {};
    if (pendingPair) { const c = pendingPair; pendingPair = ''; history.replaceState(null, '', location.pathname); screensView(c); return; }
    if (!cur && !onScreens) listView();
  });
});

function signInView(err) {
  root(`<div class="card" style="max-width:420px;margin:40px auto;">
    <h1>Sign in to LoopSlide</h1><p class="sub" style="margin-bottom:12px;">Use your PollSlide account.</p>
    <input id="em" type="email" placeholder="Email" autocomplete="email" style="margin-bottom:8px;">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" style="margin-bottom:8px;">
    <div class="note" style="color:var(--accent2);min-height:18px;">${esc(err || '')}</div>
    <button class="btn primary" style="width:100%;justify-content:center;margin-top:6px;" onclick="doSignIn()">Sign in</button>
    <p class="note" style="margin-top:12px;">No account? <a href="/presenter" style="color:var(--accent)">Create one free in PollSlide</a>, then come back.</p></div>`);
}
function doSignIn() { auth.signInWithEmailAndPassword($('em').value.trim(), $('pw').value).catch(e => signInView(e.message)); }

// ── LIST ─────────────────────────────────────────────────────────────────────
function listView() {
  cur = null; curCode = null; onScreens = false;
  const entries = Object.entries(myLoops).sort((a, b) => (b[1].updatedAt || 0) - (a[1].updatedAt || 0));
  root(`<div class="row" style="margin-bottom:18px;"><div><h1>Your loops</h1>
      <p class="sub">A loop plays your questions on a screen, over and over. People scan the QR, play on their phones, and climb the leaderboard.</p></div>
      <span class="row" style="margin-left:auto;"><button class="btn" onclick="screensView()"><span>📺 Screens</span><span data-noi18n>${Object.keys(myTvs).length ? ' (' + Object.keys(myTvs).length + ')' : ''}</span></button>
      <button class="btn primary" onclick="newLoop()">+ New loop</button></span></div>
    ${entries.length ? `<div class="grid">${entries.map(([code, l]) => `
      <div class="card loopcard" onclick="openLoop('${esc(code)}')">
        <div class="row" style="margin-bottom:6px;"><b style="font-size:16px;" data-noi18n>${esc(l.name || T('Untitled loop'))}</b>
          <span class="pill ${l.publishedAt ? 'live' : ''}" style="margin-left:auto;">${l.publishedAt ? '● Live' : 'Draft'}</span></div>
        <div class="note">${esc(T('{n} questions · code {x}', { n: countQs(l.def), x: code }))}</div>
      </div>`).join('')}</div>`
    : `<div class="card" style="text-align:center;padding:40px 20px;"><div style="font-size:42px;margin-bottom:8px;">🔁</div>
        <h2>Make your first loop</h2><p class="sub" style="max-width:460px;margin:0 auto 16px;">Start from scratch, or import any deck you already have in PollSlide — polls, quizzes, surveys or study sets.</p>
        <button class="btn primary" onclick="newLoop()">+ New loop</button></div>`}
    <div class="card" style="margin-top:18px;"><h2>📺 Putting a loop on a TV</h2>
      <p class="sub">On the TV's web browser, go to <b>pollslide.com/tv</b>. It shows a code and a QR. Scan the QR with your phone (or click <b>📺 Screens → Add a screen</b> here and type the code), pick a loop, and the TV starts playing. After that you never touch the TV again — switch loops from here.</p>
      <p class="note" style="margin-top:8px;">No browser on your TV? A Fire TV Stick has one built in. <a href="https://pollslide.com/help#loopslide-tv" target="_blank" rel="noopener" style="color:var(--accent)">Which TVs work →</a></p></div>`);
}
function countQs(def) { try { return (def.sets || []).reduce((n, s) => n + (s.items || []).filter(i => i.type !== 'ad').length, 0); } catch (e) { return 0; } }

async function newLoop() {
  const p = planOf();
  if (Object.keys(myLoops).length >= p.loops) { limitNote(T('{plan} includes {n} loop(s). Delete one you no longer use, or upgrade for more.', { plan: p.name, n: p.loops })); return; }
  let code = E.genCode();
  for (let i = 0; i < 5; i++) { const s = await db.ref('loops/' + code).get(); if (!s.exists() && !myLoops[code]) break; code = E.genCode(); }
  const def = { name: T('New loop'), brand: { accent: '#6c63ff', title: '' }, timing: Object.assign({}, E.DEFAULT_TIMING),
    board: { reset: 'days', days: 1, size: 5, speed: true, streak: true, rejoin: false },
    tzOffsetMin: -new Date().getTimezoneOffset(),
    lang: I.get(), screenLang: 'auto', autoTranslate: true,
    extras: { reactions: true, double: true, badges: true, teams: false, teamNames: [1, 2, 3, 4, 5, 6].map(n => T('Table {n}', { n })) },
    compliance: { organiser: '', contact: user.email || '', minAge: 0, prize: '', rulesUrl: '', aiNote: false },
    sets: [{ id: 's' + uid6(), title: T('Round {n}', { n: 1 }), items: [] }] };
  await db.ref('users/' + user.uid + '/loops/' + code).set({ name: def.name, def, updatedAt: Date.now() });
  openLoop(code);
}

// ── EDITOR ───────────────────────────────────────────────────────────────────
function openLoop(code) {
  const l = myLoops[code]; if (!l) return;
  curCode = code; cur = draftShape(JSON.parse(JSON.stringify(l.def || {})));
  editorView();
}

/* The database does not store empty lists: a new loop saved as { sets:[{ items: [] }] }
   comes back with no `items` at all, and a question with blank options can come back with
   none. Every editor action assumes the lists exist, so restore them the moment a loop is
   opened — this is what made "+ Question" do nothing on a freshly created loop. */
function draftShape(d) {
  d = d && typeof d === 'object' ? d : {};
  d.brand = d.brand || {}; d.timing = d.timing || {}; d.board = d.board || {}; d.compliance = d.compliance || {};
  d.extras = d.extras || {}; d.extras.teamNames = Array.isArray(d.extras.teamNames) ? d.extras.teamNames.filter(Boolean) : Object.values(d.extras.teamNames || {});
  d.sets = Array.isArray(d.sets) ? d.sets.filter(Boolean) : Object.values(d.sets || {});
  d.sets.forEach(s => {
    s.items = Array.isArray(s.items) ? s.items.filter(Boolean) : Object.values(s.items || {});
    s.items.forEach(it => {
      if (it.type === 'ad') return;
      it.options = Array.isArray(it.options) ? it.options.map(o => o == null ? '' : o) : Object.values(it.options || {});
      while (it.options.length < 2) it.options.push('');
      if (it.optImgs && !Array.isArray(it.optImgs)) it.optImgs = Object.assign([], it.optImgs);
    });
  });
  return d;
}

function editorView() {
  const l = myLoops[curCode] || {};
  cur.compliance = cur.compliance || {};
  const b = cur.board, tm = cur.timing, comp = cur.compliance;
  const tl = E.timeline(E.normalizeLoop(cur));
  root(`<div class="sticky row">
      <button class="btn" onclick="saveDraft().then(listView)">← Loops</button>
      <b style="font-size:16px;" data-noi18n>${esc(cur.name || T('Untitled loop'))}</b><span class="pill ${l.publishedAt ? 'live' : ''}">${l.publishedAt ? '● Live' : 'Draft'}</span>
      <span class="note">${esc(T('One full loop ≈ {n} min · {a} / {b} slides', { n: Math.round(tl.length / 60000), a: slideCount(cur), b: planOf().slides === Infinity ? '∞' : planOf().slides }))}</span>
      <span style="margin-left:auto;" class="row">
        <button class="btn danger" onclick="deleteLoop()">🗑 Delete loop</button>
        <button class="btn" onclick="saveDraft().then(()=>toast('Saved.'))">Save</button>
        <button class="btn primary" onclick="publish()">${l.publishedAt ? 'Publish changes' : 'Publish'}</button>
      </span></div>

    ${l.publishedAt ? `<div class="card"><div class="row"><div><h2 style="margin:0;">It's live</h2><div class="note">${T('Code {x}', { x: '<b>' + esc(curCode) + '</b>' })}</div></div>
      <span style="margin-left:auto;" class="row">
        <button class="btn green" onclick="screensView('', '${esc(curCode)}')">📺 Put on a TV</button>
        <a class="btn" href="${esc(APP)}/screen#${esc(curCode)}" target="_blank" rel="noopener">Open screen here</a>
        <button class="btn" onclick="copy('${esc(APP)}/screen#${esc(curCode)}')">Copy screen link</button>
        <a class="btn" href="${esc(APP)}/play#${esc(curCode)}" target="_blank" rel="noopener">📱 Try it on this device</a>
      </span></div>
      <div class="row" style="margin-top:12px;">
        <button class="btn sm" onclick="restartLoop()">↺ Restart from the top</button>
        <button class="btn sm" onclick="playersView()">👥 Players & moderation</button>
        <button class="btn sm danger" onclick="resetBoard()">Clear the leaderboard</button>
      </div></div>` : ''}

    <div class="card"><h2>Basics</h2>
      <div class="cols">
        <div><label class="f">Loop name</label><input value="${esc(cur.name || '')}" oninput="cur.name=this.value"></div>
        <div><label class="f">Title shown on screen</label><input value="${esc(cur.brand.title || '')}" placeholder="e.g. The Crown & Anchor Quiz Loop" oninput="cur.brand.title=this.value"></div>
        <div><label class="f">Logo (https image link)</label><input value="${esc(cur.brand.logo || '')}" placeholder="https://…/logo.png" oninput="cur.brand.logo=this.value"></div>
        <div><label class="f">Accent colour</label><input type="color" value="${esc(cur.brand.accent || '#6c63ff')}" oninput="cur.brand.accent=this.value"></div>
        <div><label class="f">Questions are written in</label><select onchange="cur.lang=this.value">${LANG_OPTS(cur.lang || 'en')}</select></div>
        <div><label class="f">TV screen language</label><select onchange="cur.screenLang=this.value"><option value="auto" ${!cur.screenLang || cur.screenLang === 'auto' ? 'selected' : ''}>Automatic (the TV's own language)</option>${LANG_OPTS(cur.screenLang)}</select></div>
      </div>
      <label class="row" style="margin-top:12px;font-size:14px;"><input type="checkbox" ${cur.autoTranslate !== false ? 'checked' : ''} onchange="cur.autoTranslate=this.checked"> Translate questions for players automatically</label>
      <p class="note" style="margin-top:4px;">Each player sees the game in their phone's language. Questions are translated by AI when you publish, and labelled “Auto-translated” so players know. Answers and scores are the same in every language.</p></div>

    <div class="card"><h2>Timing</h2>
      <div class="cols3">
        <div><label class="f">Seconds to answer</label><input type="number" min="5" max="120" value="${tm.question ?? 20}" oninput="cur.timing.question=+this.value"></div>
        <div><label class="f">Seconds showing the answer</label><input type="number" min="3" max="60" value="${tm.reveal ?? 7}" oninput="cur.timing.reveal=+this.value"></div>
        <div><label class="f">Seconds per sponsor card</label><input type="number" min="3" max="120" value="${tm.ad ?? 10}" oninput="cur.timing.ad=+this.value"></div>

function adHtml(it, si, ii) {

function addSet() { cur.sets.push({ id: 's' + uid6(), title: T('Round {n}', { n: cur.sets.length + 1 }), items: [] }); editorView(); }
function delSet(si) { if (confirm(T('Delete this round and its questions?'))) { cur.sets.splice(si, 1); editorView(); } }
function moveSet(si, d) { const j = si + d; if (j < 0 || j >= cur.sets.length) return; [cur.sets[si], cur.sets[j]] = [cur.sets[j], cur.sets[si]]; editorView(); }
function setTeamNames(v) { cur.extras.teamNames = String(v || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean).slice(0, 12); }
function atSlideLimit() { const p = planOf(); if (slideCount(cur) < p.slides) return false; limitNote(T('{plan} includes {n} slides (questions and cards) per loop.', { plan: p.name, n: p.slides })); return true; }
function addQ(si) { if (atSlideLimit()) return; cur.sets[si].items.push({ id: 'i' + uid6(), type: 'q', text: '', options: ['', ''], correct: 0 }); editorView(); }
function addAd(si, sponsored) { if (atSlideLimit()) return; cur.sets[si].items.push({ id: 'i' + uid6(), type: 'ad', sponsored: sponsored !== false, headline: '', body: '', img: '', link: '' }); editorView(); }
function setOptImg(si, ii, oi, v) { const it = cur.sets[si].items[ii]; it.optImgs = it.optImgs || []; it.optImgs[oi] = v; }
function delItem(si, ii) { cur.sets[si].items.splice(ii, 1); editorView(); }
function moveItem(si, ii, d) { const a = cur.sets[si].items, j = ii + d; if (j < 0 || j >= a.length) return; [a[ii], a[j]] = [a[j], a[ii]]; editorView(); }
function addOpt(si, ii) { cur.sets[si].items[ii].options.push(''); editorView(); }
function delOpt(si, ii, oi) { const it = cur.sets[si].items[ii]; it.options.splice(oi, 1); if (it.optImgs) it.optImgs.splice(oi, 1); if (it.correct === oi) it.correct = 0; else if (it.correct > oi) it.correct--; editorView(); }

async function saveDraft() {
  if (!curCode) return;
  await db.ref('users/' + user.uid + '/loops/' + curCode).update({ name: cur.name || 'Untitled loop', def: cur, updatedAt: Date.now() });
}

async function publish() {
  const norm = E.normalizeLoop(cur);
  if (!norm.sets.length) { toast('Add at least one question with two or more options first.'); return; }
  const miss = complianceGaps(norm);
  if (miss.length) { modal(`<h2>Before this goes on a public screen</h2><p class="note" style="margin-bottom:10px;">Fill these in under “Rules &amp; compliance” or on the card:</p><ul style="margin:0 0 14px 18px;line-height:1.7;">${miss.map(m => '<li>' + esc(m) + '</li>').join('')}</ul><button class="btn" onclick="closeModal()">OK</button>`); return; }
  const plan = planOf(), lim = plan.slides, n = slideCount(norm);
  if (n > lim) { limitNote(T('This loop has {n} slides; {plan} includes {lim} per loop. Remove {x}, or upgrade.', { n, plan: plan.name, lim, x: n - lim })); return; }
  const skipped = countQs(cur) - countQs(norm);
  await saveDraft();
  const prev = (await db.ref('loops/' + curCode).get()).val();
  norm.epoch = (prev && prev.def && prev.def.epoch) || Date.now();   // keep the clock running across edits
  const rec = { ownerUid: user.uid, def: norm, banned: (prev && prev.banned) || null, updatedAt: Date.now(),
                cap: plan.players || null };
  const upd = {};
  if (prev) rec.slot = prev.slot || null;
  else {
    /* A first publish takes one of the plan's loop slots; the rules refuse a slot number
       beyond the plan, so this limit holds even if this page is bypassed. */
    const used = (await db.ref('loop_slots/' + user.uid).get()).val() || {};
    let slot = 0; while (used[slot] !== undefined) slot++;
    if (slot >= plan.loops) { limitNote(T('{plan} includes {n} published loop(s). Delete one you no longer use, or upgrade for more.', { plan: plan.name, n: plan.loops })); return; }
    rec.slot = String(slot);
    upd['loop_slots/' + user.uid + '/' + slot] = curCode;
  }
  upd['loops/' + curCode] = rec;
  upd['users/' + user.uid + '/loops/' + curCode + '/publishedAt'] = Date.now();
  try { await db.ref().update(upd); }
  catch (e) {
    /* Only while the database rules are older than this page (they are published by hand):
       the old rules know nothing of plan slots, so write the loop the old way. Once the new
       rules are live this path is refused too, so it can never get round a limit. */
    try {
      const legacy = Object.assign({}, rec); delete legacy.slot; if (!legacy.cap) delete legacy.cap;
      await db.ref('loops/' + curCode).set(legacy);
      await db.ref('users/' + user.uid + '/loops/' + curCode + '/publishedAt').set(Date.now());
    } catch (e2) { toast('Could not publish. Check your plan’s limits, then try again.'); return; }
  }
  toast(skipped > 0 ? T('Published. {n} unfinished question(s) were left out — each needs text and two options.', { n: skipped }) : 'Published — screens update within seconds.');
  editorView();
  translateLoop(curCode, norm);
}
/* Ask the server to translate this loop's questions for players in other languages.
   Runs after publishing and never blocks it: until translations arrive, everyone sees
   the original text. */
async function translateLoop(code, norm) {
  if (norm.autoTranslate === false) { db.ref('loop_i18n/' + code).remove().catch(() => {}); return; }
  try {
    const tok = await user.getIdToken();
    const r = await fetch('/api/loop-translate', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok }, body: JSON.stringify({ code }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) toast('Translations for players are ready.');
  } catch (e) {}
}

/* Delete a loop everywhere: the draft, the public loop, its scores and answers, its
   translations, its plan slot — and any TVs showing it go back to their pairing code. */
async function deleteLoop() {
  const code = curCode;
  if (!code || !confirm(T('Delete this loop? Its questions, scores and screen links are removed for good.'))) return;
  const upd = {};
  upd['users/' + user.uid + '/loops/' + code] = null;
  const pub = (await db.ref('loops/' + code).get()).val();
  if (pub && pub.ownerUid === user.uid) {
    upd['loops/' + code] = null;
    upd['loop_answers/' + code] = null;
    upd['loop_scores/' + code] = null;
    upd['loop_i18n/' + code] = null;
    upd['loop_react/' + code] = null;
    if (pub.slot != null) upd['loop_slots/' + user.uid + '/' + pub.slot] = null;
  }
  Object.entries(myTvs).forEach(([id, tv]) => {
    if (!tv || tv.loop !== code) return;
    upd['tv_devices/' + id] = null; upd['users/' + user.uid + '/tvs/' + id] = null;
    if (tv.slot != null) upd['tv_slots/' + user.uid + '/' + tv.slot] = null;
  });
  try { await db.ref().update(upd); cur = null; toast('Loop deleted.'); listView(); }
  catch (e) { toast('Could not delete that loop — try again.'); }
}
// What must be in place before a loop can be shown publicly.
function complianceGaps(L) {
  const c = L.compliance, out = [];
  if (!c.organiser) out.push(T('Organiser — the business running this loop.'));
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.contact)) out.push(T('A contact email players can reach you on.'));
  if ((c.prize || L.reward) && !c.rulesUrl) out.push(T('An official rules link (https) — you’ve offered a prize.'));
  L.sets.forEach(s => s.items.forEach(it => { if (it.type === 'ad' && it.sponsored && !it.sponsor) out.push(T('Who the ad “{x}” is from (sponsor name).', { x: it.headline || T('untitled') })); }));
  return out;
}
async function restartLoop() {
  const s = await db.ref('loops/' + curCode + '/def').get(); if (!s.exists()) return;
  await db.ref('loops/' + curCode + '/def/epoch').set(Date.now()); toast('Restarted from the first question.');
}
async function resetBoard() {
  if (!confirm(T('Clear every score and answer for this loop? This cannot be undone.'))) return;
  await Promise.all([db.ref('loop_scores/' + curCode).remove(), db.ref('loop_answers/' + curCode).remove()]);
  toast('Leaderboard cleared.');
}
function copy(txt) { (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Copied.')).catch(() => prompt(T('Copy this link:'), txt)); }

// ── SCREENS (TV pairing) ─────────────────────────────────────────────────────
/* A TV opens pollslide.com/tv, which shows a 6-letter code and a QR for loop#pair=CODE.
 * Pairing = look the code up in tv_pair/<CODE> (the TV wrote it, with its device id), then
 * write tv_devices/<device> { ownerUid, loop, name } — the TV is listening there and starts
 * playing. The rules only let that first write happen while the TV's code is live, and only
 * for a loop the signed-in user owns. users/<uid>/tvs mirrors it so the list is ours to read. */
let onScreens = false;
const TS = () => firebase.database.ServerValue.TIMESTAMP;
function publishedLoops() { return Object.entries(myLoops).filter(([, l]) => l.publishedAt); }
function loopOptions(sel) {
  return publishedLoops().map(([c, l]) => `<option value="${esc(c)}" data-noi18n ${c === sel ? 'selected' : ''}>${esc(l.name || 'Untitled loop')} (${esc(c)})</option>`).join('');
}
function screensView(pairCode, loopCode) {
  onScreens = true; cur = null; curCode = null;
  if (pairCode !== undefined) screensView._code = pairCode || '';
  if (loopCode !== undefined) screensView._loop = loopCode || '';
  const tvs = Object.entries(myTvs).filter(([, tv]) => tv && typeof tv === 'object').sort((a, b) => (a[1].pairedAt || 0) - (b[1].pairedAt || 0));
  const pub = publishedLoops(), p = planOf();
  const full = tvs.length >= p.screens;
  root(`<div class="row" style="margin-bottom:18px;"><button class="btn" onclick="listView()">← Loops</button>
      <div><h1 style="margin:0;">Screens</h1><p class="sub">${esc(p.screens === Infinity ? T('TVs showing your loops · {n} on {plan}', { n: tvs.length, plan: p.name }) : T('TVs showing your loops · {n} of {max} on {plan}', { n: tvs.length, max: p.screens, plan: p.name }))}</p></div></div>

    <div class="card"><h2>➕ Add a screen</h2>
      <ol class="sub" style="margin:0 0 14px 18px;line-height:1.7;">
        <li>On the TV's web browser, go to <b>pollslide.com/tv</b></li>
        <li>Type the 6-letter code the TV shows — or just scan the QR on the TV with your phone</li>

async function pairScreen() {
  const code = ($('pc').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const loop = $('pl').value;
  const name = ($('pn').value || '').trim().slice(0, 40) || 'TV ' + (Object.keys(myTvs).length + 1);
  if (code.length !== 6) { toast('The code on the TV has 6 letters and numbers.'); return; }
  if (!loop) { toast('Pick a loop to play.'); return; }
  const p = planOf();
  if (Object.keys(myTvs).length >= p.screens) { limitNote(T('{plan} includes {n} screen(s).', { plan: p.name, n: p.screens })); return; }
  const btn = $('pairBtn'); if (btn) { btn.disabled = true; btn.textContent = T('Pairing…'); }
  try {
    const v = (await db.ref('tv_pair/' + code).get()).val();
    if (!v || !v.device || !(v.createdAt > Date.now() - 15 * 60000)) {
      toast('No TV is showing that code right now. Check the code on the TV — it changes every 10 minutes.');
      if (btn) { btn.disabled = false; btn.textContent = T('Pair'); }
      return;
    }
    const id = String(v.device);
    /* Each paired TV takes one of the plan's screen slots; the rules refuse a slot number
       beyond the plan, so the screen limit holds even if this page is bypassed. */
    const used = (await db.ref('tv_slots/' + user.uid).get()).val() || {};
    let slot = 0; while (used[slot] !== undefined) slot++;
    if (slot >= p.screens) { limitNote(T('{plan} includes {n} screen(s).', { plan: p.name, n: p.screens })); if (btn) { btn.disabled = false; btn.textContent = T('Pair'); } return; }
    const upd = {};
    upd['tv_slots/' + user.uid + '/' + slot] = id;
    upd['tv_devices/' + id] = { ownerUid: user.uid, loop, name, pair: code, slot: String(slot), pairedAt: TS() };
    upd['users/' + user.uid + '/tvs/' + id] = { loop, name, slot: String(slot), pairedAt: TS() };
    upd['tv_pair/' + code] = null;
    try { await db.ref().update(upd); }
    catch (e) {
      // Same bridge as publish(): rules older than this page have no tv_slots yet.
      delete upd['tv_slots/' + user.uid + '/' + slot];
      delete upd['tv_devices/' + id].slot; delete upd['users/' + user.uid + '/tvs/' + id].slot;
      await db.ref().update(upd);
    }
    screensView._code = ''; screensView._loop = '';
    toast('Paired — the TV is starting now.');
    screensView();
  } catch (e) {
    toast('Could not pair that TV. Ask it for a new code (it refreshes on its own) and try again.');
    if (btn) { btn.disabled = false; btn.textContent = T('Pair'); }
  }
}
async function setTvLoop(id, loop) {
  try {
    await db.ref().update({ ['tv_devices/' + id + '/loop']: loop, ['users/' + user.uid + '/tvs/' + id + '/loop']: loop });
    toast('Switched — the TV changes within seconds.');
  } catch (e) { toast('Could not switch that screen.'); screensView(); }
}
async function renameTv(id) {
  const n = prompt(T('Name this screen'), (myTvs[id] && myTvs[id].name) || '');
  if (n == null) return;
  const name = n.trim().slice(0, 40) || 'TV';
  try { await db.ref().update({ ['tv_devices/' + id + '/name']: name, ['users/' + user.uid + '/tvs/' + id + '/name']: name }); }
  catch (e) { toast('Could not rename that screen.'); }
}
async function unpairTv(id) {
  if (!confirm(T('Unpair this screen? It goes back to showing a pairing code.'))) return;
  const upd = { ['tv_devices/' + id]: null, ['users/' + user.uid + '/tvs/' + id]: null };
  const slot = myTvs[id] && myTvs[id].slot;
  if (slot != null) upd['tv_slots/' + user.uid + '/' + slot] = null;
  try { await db.ref().update(upd); toast('Unpaired.'); }
  catch (e) { toast('Could not unpair that screen.'); }
}

// ── Emoji picker — inserts at the caret of the field next to the button ─────
const EMOJI = '😀 😂 🤣 😎 🤩 🥳 😱 🤔 🙌 👏 🔥 ⚡ 🎉 🎯 🏆 🥇 🍺 🍷 🍹 🍕 🍔 🌮 🍟 🍩 ⚽ 🏀 🏈 ⚾ 🎾 🏒 🎬 🎵 🎸 🎮 🎲 🧠 📚 🌍 🗽 🚀 ❤️ ⭐ ✅ ❌ 💰 🎁 🐶 🐱 🦁 🐸'.split(' ');
let _emoTarget = null;
function emojiFor(btn) {
  const pal = document.getElementById('emoPal');
  if (pal) { pal.remove(); if (_emoTarget === btn) { _emoTarget = null; return; } }
  _emoTarget = btn;
  const field = btn.previousElementSibling;
  const p = document.createElement('div'); p.id = 'emoPal';
  EMOJI.forEach(e => { const b = document.createElement('button'); b.type = 'button'; b.textContent = e;
    b.onclick = () => { const m = field.dataset.caret !== undefined ? +field.dataset.caret : field.value.length;
      const a = Math.min(m, field.value.length), z = a; field.dataset.caret = a + e.length;
      field.value = field.value.slice(0, a) + e + field.value.slice(z); field.dispatchEvent(new Event('input'));
      field.focus(); try { field.setSelectionRange(a + e.length, a + e.length); } catch (x) {} };
    p.appendChild(b); });
  document.body.appendChild(p);
  const r = btn.getBoundingClientRect();
  p.style.top = Math.min(window.innerHeight - p.offsetHeight - 8, r.bottom + 6) + 'px';

}
// Remember where the cursor was in each field, so an emoji goes there (or at the end).
['keyup', 'click', 'select'].forEach(ev => document.addEventListener(ev, e => {
  const f = e.target; if (f && f.tagName === 'INPUT' && f.type === 'text' || f && f.tagName === 'INPUT' && !f.type) f.dataset.caret = f.selectionStart;
}, true));
document.addEventListener('click', e => { const p = document.getElementById('emoPal'); if (p && !p.contains(e.target) && !e.target.classList.contains('emo')) { p.remove(); _emoTarget = null; } });

function modal(h) { closeModal(); const m = document.createElement('div'); m.className = 'modal'; m.id = 'mdl'; m.innerHTML = `<div class="card">${h}</div>`; m.onclick = e => { if (e.target === m) closeModal(); }; document.body.appendChild(m); }

// ── POLLY, GIFS, UPLOADS — the same services the rest of PollSlide uses ─────
/* Nothing here is LoopSlide-specific on the server: /api/polly, /api/polly-image and
   /api/gif-search are called exactly as presenter.html calls them, so the monthly Polly
   allowance, the GIF safety filter and the rate limits are the ones already in force.
   Anything Polly writes or draws is marked `ai`, which puts the "AI-generated" label on
   the TV and the phones. */
async function authHeaders() { const tok = await user.getIdToken().catch(() => null); return Object.assign({ 'Content-Type': 'application/json' }, tok ? { Authorization: 'Bearer ' + tok } : {}); }
async function readJson(r) { const t = await r.text(); try { return JSON.parse(t); } catch (e) { return {}; } }

function pollyView() {
  const room = planOf().slides - slideCount(cur);
  if (room <= 0) { atSlideLimit(); return; }
  const n = Math.min(5, room);
  modal(`<h2>✨ Draft a round with Polly</h2>
    <p class="note" style="margin-bottom:10px;">Describe a topic and Polly writes the round for you — questions with emojis, fun-fact cards and, if you like, a picture for each question. You can edit everything before you publish. Everything Polly makes is labelled “AI-generated” on screen.</p>
    <label class="f">Topic</label><input id="pyTopic" placeholder="e.g. 90s movies, football legends, local history" maxlength="200">
    <div class="cols"><div><label class="f">Kind of questions</label><select id="pyKind"><option value="quiz">Trivia — with a right answer</option><option value="survey">Opinion poll — no right answer</option></select></div>
      <div><label class="f">How many</label><input id="pyN" type="number" min="1" max="${room}" value="${n}"></div></div>
    <label class="row" style="margin-top:12px;font-size:14px;"><input type="checkbox" id="pyFacts" checked> Add a “💡 Did you know?” card after every few questions</label>
    <label class="row" style="margin-top:8px;font-size:14px;"><input type="checkbox" id="pyPics"> Add a Polly picture to each question</label>
    <p class="note" style="margin:2px 0 0 24px;">Each picture uses one Polly credit from your plan.</p>
    <div class="row" style="margin-top:14px;"><button class="btn primary" id="pyGo" onclick="pollyGo()">✨ Draft questions</button><button class="btn" onclick="closeModal()">Cancel</button></div>
    <p class="note" id="pySt" style="margin-top:8px;"></p>`);
  setTimeout(() => { const t = $('pyTopic'); if (t) t.focus(); }, 30);
}
async function pollyGo() {
  const topic = ($('pyTopic').value || '').trim();
  if (!topic) { $('pySt').textContent = T('Type a topic first.'); return; }
  const kind = $('pyKind').value === 'survey' ? 'survey' : 'quiz';
  const room = planOf().slides - slideCount(cur);
  const count = Math.max(1, Math.min(room, parseInt($('pyN').value, 10) || 5, 20));
  const go = $('pyGo'); go.disabled = true; go.textContent = T('Polly is writing…');
  try {
    const avoid = cur.sets.flatMap(s => s.items.filter(i => i.type !== 'ad' && i.text).map(i => ({ text: i.text, answers: i.options })));
    const r = await fetch('/api/polly', { method: 'POST', headers: await authHeaders(),
      body: JSON.stringify({ topic, type: kind, count, avoid: avoid.slice(0, 50), language: cur.lang || 'en', audience: 'people in a bar or at an event, playing on their phones' }) });
    const d = await readJson(r);
    if (r.status === 429 || d.overLimit) { closeModal(); limitNote(d.error || T('You’ve used this month’s Polly allowance.')); return; }
    if (!r.ok || !Array.isArray(d.questions) || !d.questions.length) throw new Error(d.error || 'no questions');
    const items = d.questions.slice(0, room).map(q => {
      const opts = (q.options || []).map(o => String(o || '').slice(0, 80)).filter(Boolean).slice(0, 6);
      const c = kind === 'quiz' && Array.isArray(q.correctAnswers) && q.correctAnswers.length ? Number(q.correctAnswers[0]) : null;
      const text = (q.emoji && !String(q.text).includes(q.emoji) ? q.emoji + ' ' : '') + String(q.text || '');
      return { id: 'i' + uid6(), type: 'q', text: text.slice(0, 200), options: opts, correct: Number.isInteger(c) && c < opts.length ? c : null, ai: true };
    }).filter(it => it.text && it.options.length >= 2);
    if (!items.length) throw new Error('no usable questions');
    const wantFacts = $('pyFacts') && $('pyFacts').checked, wantPics = $('pyPics') && $('pyPics').checked;
    /* Fun-fact cards from Polly's own explanations: one after every third question, only
       while the plan has room — cards count as slides like any other. */
    let round = items;
    if (wantFacts && kind === 'quiz') {
      const facts = d.questions.map(q => String(q.explanation || '').trim());
      let left = room - items.length; round = [];
      items.forEach((it, i) => {
        round.push(it);
        if ((i + 1) % 3 === 0 && left > 0 && facts[i]) {
          round.push({ id: 'i' + uid6(), type: 'ad', sponsored: false, headline: T('💡 Did you know?'), body: facts[i].slice(0, 240), img: '', link: '', ai: true });
          left--;
        }
      });
    }
    const set = { id: 's' + uid6(), title: topic.slice(0, 60), items: round };
    cur.sets.push(set);
    // A brand-new loop takes its name from the topic, so it isn't "New loop" on the TV.
    if (!cur.name || cur.name === T('New loop') || cur.name === 'New loop') cur.name = topic.slice(0, 60);
    if (!cur.brand.title) cur.brand.title = topic.slice(0, 60);
    closeModal(); editorView();
    toast(T('Polly drafted {n} question(s). Check them before you publish.', { n: items.length }));
    if (wantPics) pollyPictures(set);
  } catch (e) {
    go.disabled = false; go.textContent = T('✨ Draft questions');
    $('pySt').textContent = T('Polly couldn’t write those just now. Try again, or rephrase the topic.');
  }
}

/* A picture for each question in a Polly round, one at a time. Stops politely when the
   plan's Polly allowance runs out — every picture is one Polly use, counted by the server. */
async function pollyPictures(set) {
  const qs = set.items.filter(it => it.type === 'q' && !it.img);
  let made = 0;
  for (const it of qs) {
    toast(T('Polly is drawing {n} of {m}…', { n: made + 1, m: qs.length }));
    try {
      const prompt = it.text + ' — clean modern vector illustration, flat bold shapes, vibrant colors. The main subject is large, centered, and fills most of the frame. Simple uncluttered background, no text, no watermark, high quality';
      const r = await fetch('/api/polly-image', { method: 'POST', headers: await authHeaders(), body: JSON.stringify({ prompt, size: '1536x1024', style: 'illustration' }) });
      const d = await readJson(r);
      if (r.status === 429 || d.overLimit) { toast(T('Polly’s allowance ran out after {n} picture(s).', { n: made })); break; }
      if (!r.ok || !d.image) continue;
      const blob = await (await fetch(d.image)).blob();
      const ext = ((blob.type.split('/')[1] || 'png').split('+')[0]);
      const snap = await storage.ref(`users/${user.uid}/images/polly_${Date.now()}_${uid6()}.${ext}`).put(blob);
      it.img = await snap.ref.getDownloadURL(); it.ai = true; made++;
      if (cur && cur.sets.includes(set)) editorView();
    } catch (e) {}
  }
  if (made) { await saveDraft().catch(() => {}); toast(T('Polly added {n} picture(s).', { n: made })); }
}

function setMedia(url, ai) {
  if (!_media) return;
  const it = cur.sets[_media.si].items[_media.ii];
  if (_media.field === 'img') it.img = url;
  else { const oi = +_media.field.slice(1); it.optImgs = it.optImgs || []; it.optImgs[oi] = url; }

async function gifSearch() {
  const q = ($('gq').value || '').trim(); if (!q) return;
  const box = $('gres'); box.innerHTML = `<span class="note">${esc(T('Searching…'))}</span>`;
  try {
    const r = await fetch('/api/gif-search', { method: 'POST', headers: await authHeaders(), body: JSON.stringify({ q, limit: 12 }) });
    const d = await readJson(r);
    if (!r.ok) throw new Error(d.error || 'search failed');
    const list = (d.results || []).filter(g => g && /^https:/.test(g.url));
    box.innerHTML = list.length ? '' : `<span class="note">${esc(T('No GIFs found — try other words.'))}</span>`;
    list.forEach(g => { const im = document.createElement('img'); im.src = g.still || g.url; im.alt = g.alt || ''; im.title = g.alt || ''; im.onclick = () => setMedia(g.url, false); box.appendChild(im); });
    $('gattr').textContent = d.attribution || '';
  } catch (e) { box.innerHTML = `<span class="note">${esc(T('GIF search isn’t available right now.'))}</span>`; }
}
async function pollyImage() {
  const base = ($('ip').value || '').trim(); if (!base) return;
  const style = $('ist').value;
  const MODS = { illustration: 'clean modern vector illustration, flat bold shapes, vibrant colors', realistic: 'photorealistic photograph, sharp focus, natural lighting, fine detail',
                 cartoon: 'playful cartoon, bold clean outlines, bright cheerful colors', render3d: 'detailed 3D render, isometric, soft studio lighting, glossy octane style' };
  const btn = $('ipGo'); btn.disabled = true; btn.textContent = T('Generating…');
  try {
    const prompt = base + ' — ' + (MODS[style] || MODS.illustration) + '. The main subject is large, centered, and fills most of the frame. Simple uncluttered background, no text, no watermark, high quality';
    const r = await fetch('/api/polly-image', { method: 'POST', headers: await authHeaders(), body: JSON.stringify({ prompt, size: '1536x1024', style }) });
    const d = await readJson(r);
    if (r.status === 429 || d.overLimit) { closeModal(); limitNote(d.error || T('You’ve used this month’s Polly allowance.')); return; }
    if (!r.ok || !d.image) throw new Error(d.error || 'no image');
    const blob = await (await fetch(d.image)).blob();
    const ext = ((blob.type.split('/')[1] || 'png').split('+')[0]);
    const snap = await storage.ref(`users/${user.uid}/images/polly_${Date.now()}_${uid6()}.${ext}`).put(blob);
    setMedia(await snap.ref.getDownloadURL(), true);

  } catch (e) { btn.disabled = false; btn.textContent = T('Generate'); toast('Couldn’t generate that image — try again.'); }
}
function mediaUpload() {
  const inp = document.createElement('input'); inp.type = 'file';
  inp.accept = 'image/png,image/jpeg,image/gif,image/webp,video/mp4,video/webm,video/quicktime';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const isVideo = f.type.startsWith('video/'), maxMB = isVideo ? 20 : 8;
    if (f.size > maxMB * 1024 * 1024) { toast(T('That file is too big — {n} MB maximum.', { n: maxMB })); return; }
    // Same 30-second video cap as the rest of PollSlide.
    if (isVideo) {
      const secs = await new Promise(res => { const v = document.createElement('video'); v.preload = 'metadata';
        v.onloadedmetadata = () => { URL.revokeObjectURL(v.src); res(v.duration); }; v.onerror = () => res(0); v.src = URL.createObjectURL(f); });
      if (secs > 30.5) { toast('Videos can be up to 30 seconds long.'); return; }
    }
    toast('Uploading…');
    try {
      const safe = f.name.replace(/[^a-zA-Z0-9._-]/g, '_').slice(-60);
      const snap = await storage.ref(`users/${user.uid}/${isVideo ? 'videos' : 'images'}/${Date.now()}_${safe}`).put(f);
      setMedia(await snap.ref.getDownloadURL(), false);
      toast('Uploaded.');
    } catch (e) { toast('Upload failed — try again.'); }
  };
  inp.click();
}

// ── IMPORT / EXPORT — the bridge to the rest of PollSlide ──────────────────
/* A PollSlide deck → a LoopSlide round.
   multiple choice (single or multi) → question; the first correct option is the answer
   study flashcard → question: the card's back is the right answer, other cards' backs
                     are the wrong ones (so a study set becomes a quiz round)
   rating / free text / word cloud / NPS / ranking → skipped (they have no options to tap) */
function deckToRound(deck) {
  const qs = Array.isArray(deck.questions) ? deck.questions : Object.values(deck.questions || {});
  const backs = qs.filter(q => q && q.type === 'flashcard' && q.back).map(q => String(q.back));
  const items = []; let skipped = 0;
  qs.forEach(q => {
    if (!q) return;
    if (q.type === 'flashcard') {
      if (!q.front || !q.back) { skipped++; return; }
      const wrong = backs.filter(b => b !== q.back).sort(() => Math.random() - .5).slice(0, 3);
      if (!wrong.length) { skipped++; return; }
      const options = [String(q.back)].concat(wrong).sort(() => Math.random() - .5);
      items.push({ id: 'i' + uid6(), type: 'q', text: String(q.front), options, correct: options.indexOf(String(q.back)), ai: !!q.aiGenerated });
      return;
    }
    if (q.type !== 'multiple_choice' && q.type !== 'multiple_choice_multi') { skipped++; return; }
    const raw = (q.options || []).map(o => typeof o === 'object' && o ? { t: String(o.text || '').trim(), i: /^https:/.test(o.img || '') ? o.img : '' } : { t: String(o || '').trim(), i: '' })
      .filter(o => o.t || o.i).slice(0, 6);
    const options = raw.map(o => o.t), optImgs = raw.map(o => o.i);
    if (!q.text || options.length < 2) { skipped++; return; }
    const ca = Array.isArray(q.correctAnswer) ? q.correctAnswer[0] : q.correctAnswer;
    const c = ca === null || ca === undefined || ca === '' ? null : Number(ca);
    items.push({ id: 'i' + uid6(), type: 'q', ai: !!(q.aiGenerated || q.aiImage), text: String(q.text), options, optImgs, correct: Number.isInteger(c) && c < options.length ? c : null,
                 img: q.image && /^https:/.test(q.image) ? q.image : '' });
  });
  return { round: { id: 's' + uid6(), title: deck.name || 'Imported round', items }, skipped };
}

async function importView() {
  const s = await db.ref('users/' + user.uid + '/presentations').get();
  const decks = Object.entries(s.val() || {}).filter(([, d]) => d && !d.archived)
    .sort((a, b) => (b[1].lastOpenedAt || b[1].createdAt || 0) - (a[1].lastOpenedAt || a[1].createdAt || 0));
  modal(`<h2>Import a deck from PollSlide</h2>
    <p class="note" style="margin-bottom:10px;">It becomes a new round in this loop. Your original deck isn't changed. Multiple-choice questions and study cards come across; open-text, rating and word-cloud questions are skipped because there's nothing to tap on a screen.</p>
    ${decks.length ? decks.map(([id, d]) => `<div class="deck" onclick="doImport('${esc(id)}')"><span style="font-size:22px;">${PRODUCT_ICON[d.productType] || '🗳️'}</span>
      <div style="flex:1;"><b data-noi18n>${esc(d.name || 'Untitled')}</b><div class="note">${esc(PRODUCT_NAME[d.productType] || 'PollSlide')} · ${esc(T('{n} questions', { n: (Array.isArray(d.questions) ? d.questions : Object.values(d.questions || {})).length }))}</div></div><span class="note">Import →</span></div>`).join('')
      : '<p class="sub">You have no decks yet.</p>'}
    <div class="row" style="margin-top:12px;"><button class="btn" onclick="closeModal()">Cancel</button></div>`);
}
async function doImport(id) {
  const s = await db.ref('users/' + user.uid + '/presentations/' + id).get();
  const { round, skipped } = deckToRound(s.val() || {});
  closeModal();
  if (!round.items.length) { toast('Nothing to import — that deck has no multiple-choice questions or study cards.'); return; }
  cur.sets.push(round); editorView();
  toast(skipped ? T('Imported {n} question(s), skipped {x} that can’t be tapped on a screen.', { n: round.items.length, x: skipped }) : T('Imported {n} question(s).', { n: round.items.length }));
}

/* A LoopSlide round → a new PollSlide deck in the product of your choice. */
function exportView(si) {
  modal(`<h2>${esc(T('Send “{x}” to PollSlide', { x: cur.sets[si].title || T('this round') }))}</h2>
    <p class="note" style="margin-bottom:10px;">A new deck is created in your library. Sponsor cards stay in LoopSlide.</p>
    ${['quiz','poll','survey','study'].map(p => `<div class="deck" onclick="doExport(${si},'${p}')"><span style="font-size:22px;">${PRODUCT_ICON[p]}</span><b style="flex:1;">${PRODUCT_NAME[p]}</b><span class="note">Create deck →</span></div>`).join('')}
    <div class="row" style="margin-top:12px;"><button class="btn" onclick="closeModal()">Cancel</button></div>`);
}
async function doExport(si, product) {
  const set = cur.sets[si];
  const qs = (set.items || []).filter(it => it.type !== 'ad' && it.text && (it.options || []).filter(Boolean).length >= 2);
  let questions;
  if (product === 'study') {
    questions = qs.filter(q => q.correct !== null && q.correct !== undefined)
      .map(q => ({ id: 'qz' + Date.now().toString(36) + uid6(), type: 'flashcard', front: q.text, back: q.options[q.correct] }));
  } else {
    questions = qs.map(q => ({ id: 'qz' + Date.now().toString(36) + uid6(), text: q.text, type: 'multiple_choice',
      options: q.options.map((ot, i) => ({ text: ot || '', img: (q.optImgs && q.optImgs[i]) || '' })).filter(o => o.text || o.img),
      correctAnswer: q.correct === null || q.correct === undefined ? null : q.correct,
      image: q.img || '', ...(q.ai ? { aiGenerated: true } : {}), timer: 0, displayMode: 'bars', revealDelay: 30,
      postReveal: { enabled: false, type: 'leaderboard', explainerText: '', advanceDelay: 'manual' } }));
  }
  if (!questions.length) { toast(product === 'study' ? 'Nothing to send — this round has no finished questions with a right answer.' : 'Nothing to send — this round has no finished questions.'); return; }
  const id = 'pres_' + Date.now();
  await db.ref('users/' + user.uid + '/presentations/' + id).set({
    id, name: (set.title || 'LoopSlide round'), sessionCode: E.genCode(), createdAt: Date.now(), lastOpenedAt: Date.now(),
    productType: product, questions });
  closeModal();
  toast(T('Created “{x}” in {p} with {n} question(s).', { x: set.title || 'LoopSlide round', p: PRODUCT_NAME[product], n: questions.length }));
}

function exportFile() {
  const blob = new Blob([JSON.stringify({ format: 'loopslide', version: 1, loop: cur }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = (cur.name || 'loop').replace(/[^\w-]+/g, '-').slice(0, 40) + '.loopslide.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importFile() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const j = JSON.parse(r.result);
        const sets = j && j.format === 'loopslide' && j.loop ? j.loop.sets : (j && j.questions ? [deckToRound(j).round] : null);
        if (!Array.isArray(sets) || !sets.length) throw new Error('bad');
        sets.forEach(s => { s.id = 's' + uid6(); (s.items || []).forEach(it => { it.id = 'i' + uid6(); }); cur.sets.push(s); });
        draftShape(cur); editorView(); toast(T('Imported {n} round(s).', { n: sets.length }));
      } catch (e) { toast('That file isn’t a LoopSlide export or a PollSlide deck.'); }
    };
    r.readAsText(f);
  };
  inp.click();
}
</script>
