<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PollSlide LIVE — results on your slide</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/errors.js"></script>
<script src="/qid.js"></script>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#ffffff; --ink:#12121f; --muted:#6b6b85;
    --accent:#6c63ff; --accent2:#ff6584; --ok:#1fa971; --line:rgba(0,0,0,.10);
    --track:rgba(0,0,0,.07); --ctlbg:rgba(255,255,255,.92);
  }
  /* Slides are as often dark as light, and white-on-dark-deck looked like a mistake.
     Chosen by the presenter, not sniffed: nothing here can see the slide behind it. */
  body.dark{
    --bg:#0d0d18; --ink:#f4f4fc; --muted:#9aa0bd;
    --ok:#43e97b; --line:rgba(255,255,255,.14);
    --track:rgba(255,255,255,.10); --ctlbg:rgba(30,30,48,.92);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'DM Sans',system-ui,sans-serif; background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; overflow:hidden;
    /* Sits ON a slide, which is usually light. Deliberately NOT the dark task-pane
       palette — dark-on-white here would fight most decks. */
  }
  .wrap{height:100%;display:flex;flex-direction:column;padding:3.5% 4%}
  /* cqw/cqh need a container to resolve against; without this they silently fall back
     to the viewport, which only worked by accident because this page IS the iframe. */
  html,body{container-type:size;container-name:slidebox}
  /* One knob the presenter controls, multiplying every clamp() below. The object can be
     resized on the slide, but "make the text bigger in the same box" is a different wish
     and there was no way to express it. */
  :root{--scale:1}
  .hidden{display:none!important}

  /* Everything scales off cqw/cqh so one layout survives the presenter dragging the
     object from a narrow right-hand bar to full slide width. */
  .q{font-family:'Syne',sans-serif;font-weight:800;line-height:1.2;
     font-size:calc((clamp(13px,4.4cqw,34px)) * var(--scale));margin-bottom:.5em;flex-shrink:0}
  .meta{display:flex;align-items:center;gap:.6em;font-size:calc((clamp(9px,2.1cqw,15px)) * var(--scale));
        color:var(--muted);margin-bottom:.7em;flex-shrink:0}
  .dot{width:.55em;height:.55em;border-radius:100px;background:var(--ok);flex-shrink:0}
  .rows{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.5em;min-height:0}
  .row{display:flex;flex-direction:column;gap:.22em}
  .rowtop{display:flex;justify-content:space-between;gap:.6em;
          font-size:calc((clamp(10px,2.5cqw,19px)) * var(--scale));font-weight:600}
  .rowtop .n{color:var(--muted);font-weight:500;flex-shrink:0}
  .bar{height:calc(clamp(7px,1.9cqh,20px) * var(--scale));background:var(--track);border-radius:100px;overflow:hidden}
  .fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--accent),#a78bfa);
        width:0;transition:width .45s cubic-bezier(.22,1,.36,1)}
  .row.correct .fill{background:linear-gradient(90deg,var(--ok),#5fe0a6)}
  .row.dim{opacity:.32}
  .tag{font-size:.8em;font-weight:700;color:var(--ok)}
  .free{border:1px solid var(--line);border-radius:9px;padding:.5em .65em;
        font-size:calc((clamp(10px,2.4cqw,18px)) * var(--scale));line-height:1.35}
  .free .who{color:var(--muted);font-size:.82em;margin-left:.5em}
  .cloud{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
        gap:.25em .6em;line-height:1.15;padding:.3em 0}
  .cw{font-family:'Syne',sans-serif;font-weight:800;display:inline-block;
        font-size:calc(1em * var(--scale))}
  .pr-kicker{font-family:'Syne',sans-serif;font-weight:800;letter-spacing:.07em;color:#8b84ff;
        font-size:calc(clamp(9px,2cqw,14px) * var(--scale));margin-bottom:.5em}
  .pr-row{display:flex;align-items:center;gap:.5em;padding:.32em 0;border-bottom:1px solid var(--line);
        font-size:calc(clamp(10px,2.3cqw,17px) * var(--scale))}
  .pr-rank{width:1.6em;text-align:center;flex-shrink:0}
  .pr-who{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pr-time{color:var(--muted);font-size:.8em}
  .pr-fast{color:#f7b731;flex-shrink:0}
  .pr-card{background:rgba(108,99,255,.10);border:1px solid rgba(108,99,255,.32);
        border-radius:.7em;padding:.9em 1em}
  .pr-body{line-height:1.55;font-size:calc(clamp(10px,2.4cqw,18px) * var(--scale))}
  .pr-score{text-align:center}
  .pr-pct{font-family:'Syne',sans-serif;font-weight:900;line-height:1;
        font-size:calc(clamp(30px,11cqw,84px) * var(--scale))}
  .pr-sub{color:var(--muted);font-size:calc(clamp(9px,2cqw,14px) * var(--scale))}
  .pr-emoji{font-size:calc(clamp(16px,4cqw,30px) * var(--scale));margin-top:.35em}
  .pr-label{font-family:'Syne',sans-serif;font-weight:800;
        font-size:calc(clamp(11px,2.7cqw,20px) * var(--scale))}
  .pr-podium{display:flex;align-items:flex-end;gap:.5em;justify-content:center;height:58%}
  .pr-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:.15em;height:100%;justify-content:flex-end}
  .pr-medal{font-size:calc(clamp(13px,3.2cqw,26px) * var(--scale))}
  .pr-name{font-weight:700;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;
        white-space:nowrap;font-size:calc(clamp(9px,2cqw,15px) * var(--scale))}
  .pr-bar{width:100%;border-radius:.3em .3em 0 0;transition:height .6s cubic-bezier(.22,1,.36,1)}
  .avg{font-family:'Syne',sans-serif;font-weight:800;margin-bottom:.4em;
        font-size:calc(clamp(12px,3cqw,22px) * var(--scale))}
  /* Was a full-width banner above each row, which pushed the answers off a short box
     and buried the text. A thumbnail next to the letter keeps the list scannable. */
  .lbl{display:flex;align-items:center;gap:.5em;min-width:0}
  .thumb{width:calc(2.1em * var(--scale));height:calc(2.1em * var(--scale));
        border-radius:.35em;object-fit:cover;flex-shrink:0;background:var(--track);display:block}
  .rowtop{align-items:center}
  /* The button and the footer hint both want the bottom-right corner. The button wins
     while it is showing — it is the only thing on this slide anyone needs to click. */
  body.revealing .foot span:last-child{visibility:hidden}
  .reveal{position:absolute;bottom:.6em;right:.6em;z-index:6;cursor:pointer;
        font-family:'Syne',sans-serif;font-weight:700;border:none;border-radius:8px;
        background:var(--accent);color:#fff;padding:.5em .9em;
        font-size:calc(clamp(10px,2.1cqw,15px) * var(--scale))}
  .ctl{position:absolute;top:.5em;right:.5em;z-index:5;display:flex;gap:.3em}
  .ctl button{font-family:'Syne',sans-serif;font-weight:700;border:1px solid var(--line);
        background:var(--ctlbg);border-radius:7px;cursor:pointer;color:var(--ink);
        padding:.3em .55em;font-size:clamp(9px,1.9cqw,12px)}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:.6em;
        font-size:calc((clamp(8px,1.9cqw,13px)) * var(--scale));color:var(--muted);flex-shrink:0;padding-top:.5em}
  .brand{display:flex;align-items:center;gap:.4em;font-weight:600}

  /* Bind / empty states — edit mode only, never shown while presenting */
  .pad{height:100%;display:flex;flex-direction:column;justify-content:center;
       gap:.7em;text-align:center;padding:4%}
  .pad h2{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(14px,4cqw,26px)}
  .pad p{font-size:clamp(10px,2.3cqw,15px);color:var(--muted);line-height:1.5}
  .btn{font-family:'Syne',sans-serif;font-weight:700;border:none;border-radius:9px;
       padding:.7em 1.1em;font-size:clamp(10px,2.3cqw,15px);cursor:pointer;
       background:var(--accent);color:#fff}
  .btn.ghost{background:var(--track);color:var(--ink)}
  .list{overflow-y:auto;text-align:left;display:flex;flex-direction:column;gap:.4em;max-height:62%}
  .item{border:1px solid var(--line);border-radius:10px;padding:.6em .7em;cursor:pointer;
        font-size:clamp(10px,2.2cqw,15px)}
  .item:hover{border-color:var(--accent);background:rgba(108,99,255,.12)}
  .item .sub{color:var(--muted);font-size:.85em;margin-top:.15em}
  .field{display:flex;flex-direction:column;gap:.3em;text-align:left}
  .field input{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:.6em .7em;
               font-size:clamp(10px,2.2cqw,15px);font-family:inherit}
  .err{color:var(--accent2);font-size:clamp(9px,2cqw,13px);min-height:1.2em}
  /* Account links (Microsoft policy 1100.5.7.1: sign in, sign up AND sign out). */
  .pad a, .acct button{color:var(--accent);font-weight:700;text-decoration:underline;cursor:pointer}
  .acct{font-size:clamp(9px,2cqw,13px);color:var(--muted);display:flex;flex-wrap:wrap;
        justify-content:center;align-items:center;gap:.25em .6em}
  .acct button{background:none;border:none;padding:0;font:inherit}
  /* A new answer should be felt from the back of the room, not just tallied.
     Same restraint as the rest: one short cue, then still. */
  @keyframes psPop{0%{transform:scale(1)}38%{transform:scale(1.13)}100%{transform:scale(1)}}
  @keyframes psGlow{0%{box-shadow:0 0 0 0 rgba(31,169,113,.45)}100%{box-shadow:0 0 0 .8em rgba(31,169,113,0)}}
  .count.pop{display:inline-block;animation:psPop .5s cubic-bezier(.22,1,.36,1)}
  .row.correct .bar{animation:psGlow .9s ease-out}
  .row{transition:opacity .45s ease,filter .45s ease}
  #psConfetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999}
  @media (prefers-reduced-motion: reduce){
    .fill{transition:none}
    .count.pop,.row.correct .bar{animation:none}
    .row{transition:none}
  }
</style>

let LANG = 'en';
function detectLang(){
  let l = '';
  try { l = (Office && Office.context && Office.context.displayLanguage) || ''; } catch(e){}
  if (!l) l = (navigator.language || 'en');
  l = String(l).slice(0, 2).toLowerCase();
  LANG = L10N[l] ? l : 'en';
  try { document.documentElement.lang = LANG; } catch(e){}
}
/* One-or-many: French counts 0 as singular (« 0 réponse »); the others, only 1. */
function one(n){ return LANG === 'fr' ? n < 2 : n === 1; }
function tr(s, v){
  const t = (LANG !== 'en' && L10N[LANG] && L10N[LANG][s]) || s;
  return v ? t.replace(/\{(\w+)\}/g, (m, k) => (v[k] != null ? v[k] : m)) : t;
}

let db, auth, bound = null, listener = null, presentations = {};
/* Display prefs live WITH the binding in per-instance settings, so two objects on two
   slides can be sized differently and both survive reopening the deck. */
let SCALE = 1, SHOW_MEDIA = true, DARK = false;
let _tick = null, _launchedAt = 0, _revealSecs = 0, _answerAt = 0, _prTimer = null;
/* The qid this page-load has already announced as live, the detach handle for the phase
   listener, and the detach handle for the live-question publisher's visibility hook.
   All exist to stop a re-entry of goLive from trampling a run already under way. */
let _announced = null, _phaseOff = null, _pubStop = null;
/* The presenter's "hide results until reveal" choice. It is published on
   currentQuestion ONLY (presenter.html:5928) — qstate never carries it — so the
   guarded currentQuestion watcher below is the only way this slide can honour it.
   Without it the companion hid the distribution and the slide on the wall did not,
   which shows the room the answer early. */
let _hideResults = false;
/* The qid _hideResults was learned for, so returning to a slide does not forget it.
   Staleness is handled by only ever learning it from a CHANGE (see the watcher), not by
   any freshness test on launchedAt: presenter.html deliberately keeps launchedAt STABLE
   across a session, so "recent timestamp" does not mean "someone is driving". */
let _hideFor = null;

function applyPrefs(){
  document.documentElement.style.setProperty('--scale', String(SCALE));
  document.body.classList.toggle('dark', !!DARK);
}
function savePrefs(){
  if (!bound) return;
  bound.scale = SCALE; bound.media = SHOW_MEDIA; bound.dark = DARK;
  cacheBinding(bound);
}
function loadPrefs(b){
  SCALE = (b && typeof b.scale === 'number') ? b.scale : 1;
  SHOW_MEDIA = (b && typeof b.media === 'boolean') ? b.media : true;
  DARK = !!(b && b.dark);
  applyPrefs();
}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ── Binding: which question does THIS embedded instance show? ───────────────
   Office document settings are documented as per-instance for content add-ins
   ("available only to the instance of the content or task pane add-in that
   created it"), which is exactly what we need — slide 3 and slide 7 each keep
   their own question.

   BUT settings.get is reported to return null in PowerPoint on the WEB while in
   presentation mode (OfficeDev/office-js#3406, closed "not planned"). Losing the
   binding at exactly the moment you present would make this product pointless,
   so the binding is resolved through a chain and cached the moment we see it:

     1. document settings            — the real store, and the only PER-INSTANCE one
     2. the slide's notes marker      — belongs to THIS slide (<!-- pollslide:CODE/idx -->),
                                        written by the task pane's Insert QR
     3. localStorage, partition-keyed — a last-resort guess, shared by every object

   Anything we successfully resolve is written back to layers 1 and 2, so a single
   visit in edit mode arms presentation mode even if settings go dark there. */
const LS_KEY = () => 'psliveBind_' + (Office?.context?.partitionKey || 'default');

function cacheBinding(b){
  try { localStorage.setItem(LS_KEY(), JSON.stringify(b)); } catch(e){}
  try {
    Office.context.document.settings.set('psliveBinding', b);
    Office.context.document.settings.saveAsync();
  } catch(e){}
}

function readSettingsBinding(){
  try {
    const v = Office.context.document.settings.get('psliveBinding');
    if (v && v.code && v.qid) return v;
  } catch(e){}
  return null;
}
function readCachedBinding(){
  try {
    const v = JSON.parse(localStorage.getItem(LS_KEY())||'null');
    if (v && v.code && v.qid) return v;
  } catch(e){}
  return null;
}
function readNotesBinding(){
  return new Promise(resolve => {
    try {
      PowerPoint.run(async ctx => {
        const slides = ctx.presentation.getSelectedSlides();
        slides.load('items'); await ctx.sync();
        if (!slides.items.length) return resolve(null);
        const body = slides.items[0].getNotesPage().body;
        body.load('text'); await ctx.sync();
        const m = (body.text||'').match(/<!--\s*pollslide:([^/\s>]+)\/(\d+)\s*-->/i);
        resolve(m ? { code:m[1], qIdx:parseInt(m[2],10), qid:null, fromNotes:true } : null);
      }).catch(()=>resolve(null));
    } catch(e){ resolve(null); }
  });
}

/* WHICH binding applies depends on the mode, and conflating the two made a freshly
   inserted object silently adopt the previous one's question instead of asking.

   Only document settings are PER-INSTANCE. The localStorage cache is keyed by
   partitionKey, and the notes marker belongs to the SLIDE — both are shared, so
   treating them as "this instance is already bound" meant every new object inherited
   whatever was bound last. They are fallbacks for a specific failure, not evidence of
   a binding.

   edit  → settings only. No settings means this object is new: ask.
   read  → settings, then the fallbacks, because settings.get is reported to return
           null in PowerPoint on the web while presenting (office-js#3406) and showing
           the right question beats showing nothing when nobody can click.

   The notes marker is tried BEFORE localStorage. Both are fallbacks, but the marker
   belongs to one slide while localStorage holds whatever was bound last ANYWHERE — so
   with settings dark (web, presenting: the exact case this chain exists for) the cache
   made every object on every slide show the SAME question. Order only matters when
   settings are null, so this cannot change desktop behaviour, where step 1 always wins. */
async function resolveBinding(view){
  const s = readSettingsBinding();
  if (s) { cacheBinding(s); return s; }
  if (view !== 'read') return null;          // editing: never guess, show the picker

  const n = await readNotesBinding();
  if (n && n.code && n.qIdx != null) {
    /* The notes marker carries a LINK NUMBER (qid.js "home" — the task pane writes
       homeOf), not a bucket id. Turn it into the question's current position through
       quiz_builder/$code/homes, exactly as phones and the companion do (no map → the
       number is the position, as before; -1 → that question was deleted: don't guess).
       Then resolve the bucket the way every other surface does. */
    try {
      let homes = null;
      try { const h = await db.ref('quiz_builder/'+n.code+'/homes').get(); homes = h.exists() ? h.val() : null; } catch(e){}
      const pos = PSQid.resolve(homes, n.qIdx);
      if (pos >= 0) {
        const snap = await db.ref('quiz_builder/'+n.code+'/questions/'+pos).get();
        const q = snap.exists() ? snap.val() : null;
        if (q) return { code:n.code, qIdx:pos, qid:PSQid.bucket(q,pos,n.code), text:q.text||'', q };
      }
    } catch(e){}
  }

  const c = readCachedBinding();
  if (c) return c;                           // deliberately not re-cached: it is a guess
  return null;
}

/* ── Confetti ────────────────────────────────────────────────────────────────
   Ported from presenter.html so the slide and the presenter's own screen
   celebrate identically. Canvas is sized to the EMBEDDED OBJECT, not the window:
   this add-in is a box on a slide, and a fixed full-window canvas would be
   clipped to that box anyway. Honours prefers-reduced-motion, like everywhere. */
let _cvs, _ctx, _raf;
function fireConfetti(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (!_cvs){
    _cvs = document.createElement('canvas');
    _cvs.id = 'psConfetti';
    document.body.appendChild(_cvs);
    _ctx = _cvs.getContext('2d');
  }
  const W = _cvs.width = _cvs.clientWidth || window.innerWidth;
  const H = _cvs.height = _cvs.clientHeight || window.innerHeight;
  const colors = ['#6c63ff','#ff6584','#43e97b','#f7b731','#4facfe','#a78bfa'];
  const parts = [];
  /* Scaled to the box: a narrow right-hand bar gets a proportionate handful,
     a full-width object gets the full burst. */
  const count = Math.max(40, Math.min(150, Math.floor(W/5)));
  for (let i=0;i<count;i++) parts.push({
    x: Math.random()*W, y: -15 - Math.random()*H*0.3,
    vx: (Math.random()-0.5)*5, vy: 2.4 + Math.random()*4,
    sz: 4 + Math.random()*6, rot: Math.random()*Math.PI*2,
    vr: (Math.random()-0.5)*0.3, color: colors[(Math.random()*colors.length)|0], life: 1
  });
  const start = performance.now(), dur = 2400;
  cancelAnimationFrame(_raf);
  const tick = (now) => {
    const el = now - start;
    _ctx.clearRect(0,0,W,H);
    let alive = false;
    for (const p of parts){
      p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.rot += p.vr;
      if (el > dur-650) p.life = Math.max(0,(dur-el)/650);
      if (p.y < H+25 && p.life > 0) alive = true;
      _ctx.save(); _ctx.globalAlpha = p.life;
      _ctx.translate(p.x,p.y); _ctx.rotate(p.rot);
      _ctx.fillStyle = p.color;
      _ctx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*0.6);
      _ctx.restore();
    }
    if (el < dur && alive) _raf = requestAnimationFrame(tick);
    else _ctx.clearRect(0,0,W,H);
  };
  _raf = requestAnimationFrame(tick);
}

/* ── Countdown ───────────────────────────────────────────────────────────────
   There was no countdown here at all — the pane only learned of a reveal after the
   fact, so the slide sat still while the presenter's own screen ticked down.

   It is DERIVED, never stored: qstate/<qid>/launchedAt is when the question went
   live and q.revealDelay is its length, which is the same arithmetic presenter.html
   does. Deriving it means a phone joining late shows the right number instead of
   restarting the clock, and there is no second source of truth to drift. */
/* Measured from the FIRST ANSWER of this run, not from launch — the same rule
   powerpoint.html uses ("responses.length > 0 && !revealArmed && !revealed").

   Counting from launchedAt was wrong twice over: the clock ran down while the room was
   still reading the question, and a launchedAt left in the database by an earlier run
   was already expired, so re-presenting the deck revealed the answer the instant the
   slide appeared. _answerAt is deliberately LOCAL and starts at 0 every run. */
function secsLeft(){
  if (!_answerAt || !_revealSecs || _revealSecs < 0) return null;
  const left = _revealSecs - Math.floor((Date.now() - _answerAt) / 1000);
  return left > 0 ? left : 0;
}
function startTick(redraw, onExpire){
  clearInterval(_tick);
  if (secsLeft() === null) return;          // manual-reveal question: no clock, no expiry
  _tick = setInterval(() => {
    const el = document.getElementById('cd');
    const n = secsLeft();
    if (n === null || n <= 0){
      clearInterval(_tick); _tick = null;
      if (el) el.textContent = '';
      /* The clock used to just stop. Nothing ever performed the reveal, so the slide
         counted down to zero and then sat there: no answer shown, no confetti. */
      onExpire && onExpire();
      return;
    }
    if (el) el.textContent = n + 's';
    else redraw && redraw();
  }, 1000);
}

/* ── Live results ───────────────────────────────────────────────────────────── */
let _lastTotal = 0, _celebrated = false;

/* Answer/option shapes are NOT what they look like, and getting them wrong renders
   "[object Object]" on a slide in front of a room. Mirrored from powerpoint.html:
     • q.options[i] is an OBJECT — the label is .text, not the item itself
     • q.correctAnswer may be a single index OR an array (multi-select), and may be
       absent/empty, which must read as "no correct answer" rather than index 0
     • r.answer is a JSON string holding an index or an array of indices
     • a question with no options (open text, word cloud, rating) has no bars at all
       and must fall back to listing what people actually wrote */
const isVideoUrl = (u) => {
  if (!u) return false;
  const x = String(u).split('?')[0].toLowerCase();
  return x.endsWith('.mp4')||x.endsWith('.webm')||x.endsWith('.mov')||x.endsWith('.m4v')||x.includes('/video/');
};
/* Option art is a URL on `img`; `imgGif` is Giphy METADATA (alt/id/source), not a URL —
   rendering imgGif as a src would give a broken image on every slide. Video branch and
   the onerror hide are lifted from presenter.html so a dead Giphy link collapses the
   frame instead of leaving a torn icon in front of the room. */
const optMedia = (o) => {
  const u = o && typeof o === 'object' ? o.img : null;
  if (!u || !SHOW_MEDIA) return '';
  const alt = esc((o.imgGif && o.imgGif.alt) || '');
  /* A dead link removes ITSELF here, not its parent — the parent now holds the answer
     text, and hiding that would blank the option entirely. */
  return isVideoUrl(u)
    ? `<video class="thumb" src="${esc(u)}" autoplay loop muted playsinline onerror="this.remove()"></video>`
    : `<img class="thumb" src="${esc(u)}" alt="${alt}" onerror="this.remove()">`;
};
const optLabel = (o) => (o && typeof o === 'object') ? (o.text || o.label || '') : String(o == null ? '' : o);

function safeAnswer(a){
  try { const v = JSON.parse(a); return Array.isArray(v) ? v.join(', ') : String(v); }
  catch(e){ return String(a == null ? '' : a); }
}

/* Free text with displayMode 'word_cloud', and ratings, were falling through to a
   plain list of raw answers — readable, but not what the presenter chose. Ported from
   presenter.html (buildWordCloud / the rating branch) so the slide and the presenter's
   own screen agree. Nothing in presenter.html, answer.html or present.html is touched:
   this only teaches the new object to draw what they already draw. */
const STOP_WORDS = new Set(['the','a','an','and','or','but','in','on','at','to','for','of','with','is','are','was','were','be','been','have','has','had','it','i','you','we','they','he','she','that','this','what','how','why','when','do','did','not','no','yes','my','your','their','our','its','as','by','from','up','so','if','me','him','her','us','them','about','into','out','than','then','now']);
const CLOUD_PALETTE = ['#6c63ff','#ff6584','#43e97b','#f7b731','#4facfe','#a78bfa','#f093fb','#43cfcf'];

function wordCloudHTML(responses){
  const freq = {};
  responses.forEach(r => {
    let a = r && r.answer;
    try { const v = JSON.parse(a); if (typeof v === 'string') a = v; } catch(e){}
    if (!a || a === '__none__') return;
    String(a).split(/\s+/).forEach(w => {
      const clean = w.toLowerCase().replace(/[^\p{L}\p{N}']/gu,'');
      if (clean.length > 2 && !STOP_WORDS.has(clean)) freq[clean] = (freq[clean]||0)+1;
    });
  });
  const words = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,40).map(([t,c])=>({t,c}));
  if (!words.length) return '<p style="color:var(--muted)">' + tr('Waiting for answers…') + '</p>';
  const max = Math.max(...words.map(w=>w.c), 1);
  /* Deterministic scatter: Math.random() would reshuffle the whole cloud on every
     incoming answer, which on a projector reads as the slide glitching. */
  return `<div class="cloud">` + words.map((w,i)=>{
    const size = 0.75 + (w.c/max) * 1.9;
    const rot  = ((i * 37) % 15) - 7;
    return `<span class="cw" style="font-size:${size}em;color:${CLOUD_PALETTE[i % CLOUD_PALETTE.length]};transform:rotate(${rot}deg)" title="${w.c}">${esc(w.t)}</span>`;
  }).join('') + `</div>`;
}

function ratingHTML(q, responses){
  const max = Number(q.ratingMax) || 5;
  const counts = {}; for (let i=1;i<=max;i++) counts[i]=0;
  let n = 0;
  responses.forEach(r => {
    try { const v = JSON.parse(r.answer); if (v && counts[v] !== undefined){ counts[v]++; n++; } } catch(e){}
  });
  const avg = n ? (Object.entries(counts).reduce((s,[k,v])=>s+(Number(k)*v),0)/n).toFixed(1) : '—';
  const rows = Object.entries(counts).map(([val,c])=>{
    const pct = n ? Math.round(c/n*100) : 0;
    return `<div class="row">
      <div class="rowtop"><span class="lbl"><span>★ ${val}</span></span><span class="n">${c} · ${pct}%</span></div>
      <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
  return `<div class="avg">${tr('Average {n}', { n: avg })}</div>${rows}`;
}

/* Post-reveal — the screen after the answer: leaderboard, podium, scorecard or an
   explainer card. Ported from companion.html's buildPostRevealContent, which is the
   right reference: the companion is also a remote page following ONE question's
   qstate node, which is exactly this object's shape.

   Honoured whenever phase is 'post_reveal', without re-checking postReveal.enabled —
   nothing enters that phase unless it was enabled, and re-gating it here is what made
   post-reveal silently not appear on the companion (fixed there in v65). */
const MEDALS = ['\u{1F947}','\u{1F948}','\u{1F949}'];

function scoreOf(r){
  return r.isCorrect === true ? 1
       : typeof r.isCorrect === 'number' ? r.isCorrect
       : r.isCorrect === false ? -1 : 0;
}
function rankResponses(resps){
  return [...resps].sort((a,b)=>{
    const sa = a.isCorrect===true?1:(typeof a.isCorrect==='number'?a.isCorrect:0);
    const sb = b.isCorrect===true?1:(typeof b.isCorrect==='number'?b.isCorrect:0);
    if (sb!==sa) return sb-sa;
    return (a.elapsed||999999)-(b.elapsed||999999);
  });
}

function postRevealHTML(q, resps){
  const type = (q.postReveal && q.postReveal.type) || 'leaderboard';
  const total = resps.length;
  const sorted = rankResponses(resps);

  if (type === 'explainer'){
    const text = (q.postReveal && q.postReveal.explainerText) || '';
    return `<div class="pr-card">
      <div class="pr-kicker">${tr('💡 DID YOU KNOW?')}</div>
      <div class="pr-body">${esc(text) || '<em style="color:var(--muted)">' + tr('No explainer text set.') + '</em>'}</div></div>`;
  }

  if (type === 'scorecard'){
    const totalScore = resps.reduce((sum,r)=> sum + (r.isCorrect===true?1:(typeof r.isCorrect==='number'&&r.isCorrect>0?r.isCorrect:0)), 0);
    const pct = total>0 ? Math.round(totalScore/total*100) : 0;
    const full = resps.filter(r=>r.isCorrect===true).length;
    const [emoji,label,col] = pct>=80?['\u{1F389}',tr('Fantastic!'),'#1fa971']
                            : pct>=60?['\u{1F44F}',tr('Nice work!'),'#6c63ff']
                            : pct>=40?['\u{1F4AA}',tr('Keep going!'),'#f7b731']
                            : ['\u{1F914}',tr('Tough one!'),'#ff6584'];
    return `<div class="pr-score">
      <div class="pr-pct" style="color:${col}">${pct}%</div>
      <div class="pr-sub">${tr('avg score · {n} fully correct / {t}', { n: full, t: total })}</div>
      <div class="pr-emoji">${emoji}</div>
      <div class="pr-label" style="color:${col}">${label}</div>
      <div class="bar" style="margin-top:.8em"><div class="fill" style="width:${pct}%;background:${col}"></div></div>
    </div>`;
  }

  if (type === 'podium'){
    const top3 = sorted.slice(0,3);
    const order = [1,0,2];                       // rendered left→right: 2nd, 1st, 3rd
    /* Indexed by RANK, so 1st is tallest. companion.html has ['60px','90px','44px']
       against the same rank index, which gives SECOND place the tallest podium — a
       faithful port reproduced it here and the screenshot made it obvious. Left the
       companion alone (it ships to the Mac app); flagged for Rod instead. */
    const h = ['100%','62%','44%'];
    const cols = ['#ff6584','#6c63ff','#f7b731'];
    const cells = order.map(i => {
      const r = top3[i];
      if (!r) return `<div class="pr-col"></div>`;
      return `<div class="pr-col">
        <div class="pr-medal">${MEDALS[i]}</div>
        <div class="pr-name">${esc(r.name && r.name.trim() ? r.name : tr('Player {n}', { n: i+1 }))}</div>
        ${r.elapsed?`<div class="pr-time">${(r.elapsed/1000).toFixed(1)}s</div>`:''}
        <div class="pr-bar" style="height:${h[i]};background:${cols[i]}"></div>
      </div>`;
    }).join('');
    return `<div class="pr-kicker">${tr('✦ TOP 3')}</div><div class="pr-podium">${cells}</div>`
      + (sorted.length>3?`<div class="pr-sub" style="margin-top:.5em">${tr('+ {n} more', { n: sorted.length-3 })}</div>`:'');
  }

  // leaderboard (default)
  const fastest = sorted.findIndex(r => r.isCorrect === true);
  const rows = sorted.slice(0,8).map((r,rank)=>{
    const sc = scoreOf(r);
    const col = sc===1?'var(--ok)':sc===-1?'var(--accent2)':sc!==0?'#f7b731':'var(--muted)';
    const txt = sc===1?'\u2713':sc===-1?'\u2717':(sc>0&&sc<1)?Math.round(sc*100)+'%':'\u00b7';
    return `<div class="pr-row">
      <span class="pr-rank">${rank<3?MEDALS[rank]:'#'+(rank+1)}</span>
      <span class="pr-who">${esc(r.name && r.name.trim() ? r.name : tr('Player {n}', { n: rank+1 }))}${
        r.elapsed?`<span class="pr-time"> ${(r.elapsed/1000).toFixed(1)}s</span>`:''}</span>
      ${rank===fastest && r.isCorrect===true ? '<span class="pr-fast">\u26A1</span>' : ''}
      <span style="color:${col}">${txt}</span></div>`;
  }).join('') || '<p style="color:var(--muted)">' + tr('No responses.') + '</p>';
  return `<div class="pr-kicker">${tr('✦ LEADERBOARD')}</div>${rows}`
    + (sorted.length>8?`<div class="pr-sub" style="margin-top:.4em">${tr('+ {n} more', { n: sorted.length-8 })}</div>`:'');
}

function renderResults(q, responses, revealed, post){
  const total = responses.length;
  const grew  = total > _lastTotal;
  _lastTotal  = total;

  const left = revealed ? null : secsLeft();
  const waiting = !revealed && !_answerAt && _revealSecs >= 0 && total === 0;
  const head = `<div class="q">${esc(q?.text||'')}</div>
    <div class="meta"><span class="dot"></span><span class="count ${grew?'pop':''}">${total}</span>&nbsp;${tr(one(total)?'response':'responses')}`
    + (revealed ? tr(' · answer revealed')
               /* `left > 0`, not `!== null`: at zero the tick blanks the span and a bare
                  "reveals in" was left dangling on the slide. */
               : left > 0 ? tr(' · reveals in {x}', { x: `<span id="cd">${left}s</span>` })
               : waiting ? tr(' · waiting for the first answer')
               : '')
    + `</div>`;
  const foot = `<div class="foot"><span class="brand">PollSlide</span><span>${tr('Scan the QR to answer')}</span></div>`;

  /* Hide-until-reveal: the presenter chose to keep the distribution hidden while people
     answer. Show the count, never the split — then fall through to the full results once
     they reveal. Mirrors companion.html so both surfaces hide the same thing. */
  /* Only a CHOICE question has anything to hide. presenter.html:6316, companion.html:587
     and live.html:723 all mark non-quiz questions revealed on arrival, so this branch can
     never fire for them there — but this slide starts every type unrevealed, so without
     the type test a word cloud, free-text or rating slide went blank on the wall while
     every other surface showed it. Worse, the presenter never publishes a reveal for
     non-quiz, so nothing would ever have un-hidden it. */
  const _hideable = q && (q.type === 'multiple_choice' || q.type === 'multiple_choice_multi');
  if (_hideResults && _hideable && !revealed && !post){
    $('root').innerHTML = head
      + `<div class="rows"><p style="text-align:center;color:var(--muted);padding:.6em 0">`
      + tr('🙈 Results hidden until reveal') + `</p></div>` + foot;
    return;
  }

  if (post){
    $('root').innerHTML = head + `<div class="rows">${postRevealHTML(q, responses)}</div>` + foot;
    return;
  }

  const isChoice = q && q.options && (q.type === 'multiple_choice' || q.type === 'multiple_choice_multi');

  if (!isChoice){
    let inner;
    if (q && q.type === 'rating') inner = ratingHTML(q, responses);
    else if (q && q.displayMode === 'word_cloud') inner = wordCloudHTML(responses);
    else inner = responses.slice(-12).map(r =>
      `<div class="free">${esc(safeAnswer(r.answer))}${r.name?`<span class="who">— ${esc(r.name)}</span>`:''}</div>`).join('')
      || '<p style="color:var(--muted)">' + tr('Waiting for answers…') + '</p>';
    $('root').innerHTML = head + `<div class="rows">${inner}</div>` + foot;
    return;
  }

  const opts = q.options || [];
  const _ca  = q.correctAnswer;
  const hasC = _ca !== undefined && _ca !== null && _ca !== '' && !(Array.isArray(_ca) && _ca.length === 0);
  const correct = hasC ? (Array.isArray(_ca) ? _ca : [_ca]).map(Number) : [];

  const counts = opts.map(() => 0);
  responses.forEach(r => {
    try {
      const a = JSON.parse(r.answer);
      (Array.isArray(a) ? a : [a]).forEach(v => { const n = Number(v); if (counts[n] != null) counts[n]++; });
    } catch(e){}
  });

  const denom = total || 1;
  const rows = opts.map((o,i)=>{
    const pct  = Math.round(counts[i]/denom*100);
    const isC  = revealed && correct.includes(i);
    const dim  = revealed && hasC && !correct.includes(i);
    return `<div class="row ${isC?'correct':''} ${dim?'dim':''}">
      <div class="rowtop">
        <span class="lbl">${optMedia(o)}<span>${LETTERS[i]}. ${esc(optLabel(o))}${isC?' <span class="tag">✓</span>':''}</span></span>
        <span class="n">${counts[i]} · ${pct}%</span>
      </div>
      <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');

  $('root').innerHTML = head + `<div class="rows">${rows}</div>` + foot;

  requestAnimationFrame(()=>{
    document.querySelectorAll('.fill').forEach(el=>{
      const w = el.dataset.w || el.style.width;
      el.dataset.w = w; el.style.width = '0%';
      requestAnimationFrame(()=>{ el.style.width = w; });
    });
  });
  if (revealed && !_celebrated && total > 0){ _celebrated = true; fireConfetti(); }
  if (!revealed) _celebrated = false;
}

async function goLive(b, editing){
  if (listener) { listener(); listener = null; }
  loadPrefs(b);
  /* The edit controls live on <body>, outside #root, so a repaint never clears them. On
     the desktop apps the SAME frame goes from editing into the slide show, and without
     this the A−/A+/Change-question bar stayed on the wall. (On the web a slide show is a
     fresh frame that never had the bar, so this is a no-op there.) */
  if (!editing) document.getElementById('psCtl')?.remove();
  /* ALWAYS refetch. The binding carries a snapshot of the question taken when it was
     chosen, and using it meant the slide froze at that moment: edit the wording, change
     revealDelay, or switch post-reveal on, and the slide kept showing the old copy
     forever. That is why post-reveal "never showed" — the cached question still had
     postReveal.enabled false from before it was turned on. The snapshot is now only a
     fallback for when the deck cannot be read. */
  let q = null, gone = false;
  try {
    const s = await db.ref('quiz_builder/'+b.code+'/questions/'+b.qIdx).get();
    q = s.exists() ? s.val() : null;
  } catch(e){}
  /* FOLLOW A MOVED QUESTION (A1, 2026-10-06). The binding remembers the question's
     position (qIdx) AND its identity (qid, the response bucket). After the presenter
     moves or deletes questions, the question now at that position is a different one —
     and this slide showed ITS text and options over the original question's answers.
     So when they disagree, find the question by its id and update the binding; nothing
     changes for a deck that was never reordered (the ids match and no extra read is
     made). Question deleted from the deck → say so instead of showing a stranger. Deck
     unreadable or gone → the snapshot taken when the question was chosen (right
     question, right answers), exactly as before. */
  if (b.qid && PSQid.bucket(q, b.qIdx, b.code) !== b.qid) {
    let all;
    try { const s = await db.ref('quiz_builder/'+b.code+'/questions').get(); all = s.exists() ? s.val() : null; }
    catch(e){ all = undefined; }
    if (all == null) q = null;           // can't read the deck, or it is gone → the snapshot, as before
    else {
      let at = -1;
      if (all && typeof all === 'object')
        for (const k of Object.keys(all)) {
          const i = Number(k);
          if (i >= 0 && all[k] && PSQid.bucket(all[k], i, b.code) === b.qid) { at = i; break; }
        }
      if (at >= 0) {
        q = all[at];
        b = Object.assign({}, b, { qIdx: at, text: q.text || '', q });
        bound = b; cacheBinding(b);                        // remember the new position
      } else { q = null; gone = true; }
    }
  }
  if (!q && !gone) q = b.q;
  if (!q) { $('root').innerHTML = `<div class="pad"><h2>${tr('Question not found')}</h2><p>${tr('Open this slide in editing view and pick the question again.')}</p></div>`; return; }

  const qid = b.qid || PSQid.bucket(q, b.qIdx, b.code);

  /* EVERY TIME this object goes live it starts a fresh run, and a fresh run is never
     revealed. Reading phase from the database and trusting it meant the reveal was
     STICKY: once a question had been revealed, that value sat in qstate forever, so the
     next time the deck was presented the slide came up with the answer already showing
     and no Reveal button — nothing could put it back. Presenting is not resuming. */
  let revealed = false, post = false;
  _answerAt = 0;
  _launchedAt = Date.now();
  /* Module-scope, so it must be cleared when the QUESTION changes — otherwise the next
     question inherits the last one's setting. But goLive also re-enters on every
     ActiveViewChanged, and clearing it there would forget the presenter's choice and flash
     the distribution onto the wall until the next publish, so the same question keeps it. */
  if (_hideFor !== qid) { _hideResults = false; _hideFor = null; }
  /* -1 means "presenter reveals manually" — no clock to show. */
  _revealSecs = (q && q.revealDelay !== undefined) ? Number(q.revealDelay) : 30;

  clearInterval(_tick); _tick = null;

  const ref = db.ref('sessions/'+b.code+'/responses/'+qid);
  let latest = [];

  const paint = () => {
    renderResults(q, latest, revealed, post);
    if (editing) addControls(paint);
    /* Remove it on a reveal that happened ANYWHERE — the timer here, this button, or
       the presenter's own screen. Leaving a live "Reveal now" on a slide showing the
       answer is worse than never offering one. */
    if (revealed){ document.getElementById('psReveal')?.remove(); document.body.classList.remove('revealing'); }
    else addRevealButton(doReveal);
    /* Once revealed, the same corner offers the next step — but only when the deck
       actually asked for one. */
    if (revealed && !post && q.postReveal && q.postReveal.enabled) addPostRevealButton(doPostReveal);
    startTick(paint, doReveal);
  };

  /* Publishing the reveal is what lets the companion and a second object follow, so
     it is attempted first — but a failure must not stop THIS slide from revealing: the
     room is looking at it. Hence write-then-render, not write-and-then-hope.

     The word is 'revealed', not 'reveal'. presenter.html:6559 writes 'revealed' and
     companion.html:478/538 tests for it; this file invented 'reveal' and so spoke to
     nobody — a presenter-side reveal never reached the slide, and a slide-side reveal
     never reached the companion. The phones are NOT in this list: answer.html reads
     currentQuestion only and never looks at qstate at all. */
  async function doReveal(){
    if (revealed) return;
    revealed = true;
    try { await ensureWriteAuth(); await db.ref('sessions/'+b.code+'/qstate/'+qid+'/phase').set('revealed'); }
    catch(e){ console.warn('reveal not published (showing it locally anyway)', e); }
    paint();
    armPostReveal();
  }

  /* Move to the screen after the answer. In a deck driven only by these objects there
     is no presenter to advance the phase, so this object does it — and publishes, so
     phones and the companion follow. */
  async function doPostReveal(){
    if (post) return;
    post = true;
    clearTimeout(_prTimer); _prTimer = null;
    document.getElementById('psPost')?.remove();
    try { await ensureWriteAuth(); await db.ref('sessions/'+b.code+'/qstate/'+qid).update({ phase:'post_reveal', postRevealAt:null }); }
    catch(e){ console.warn('post-reveal not published (showing it locally anyway)', e); }
    paint();
  }

  /* advanceDelay is either a number of seconds or 'manual'. Manual means the button
     stays and nothing happens until someone presses it. */
  function armPostReveal(){
    const pr = q.postReveal;
    if (!pr || !pr.enabled || post) return;
    const d = Number(pr.advanceDelay);
    if (!isFinite(d) || d <= 0) return;                       // 'manual'
    clearTimeout(_prTimer);
    _prTimer = setTimeout(doPostReveal, d * 1000);
    ensureWriteAuth().then(() => db.ref('sessions/'+b.code+'/qstate/'+qid)
      .update({ postRevealAt: Date.now() + d*1000 })).catch(()=>{});
  }

  const fn = ref.on('value', snap => {
    latest = snap.exists() ? Object.values(snap.val()) : [];
    /* The clock starts when the room starts answering, not when the slide appears.
       Armed once per run; a later answer must not restart it. */
    if (latest.length > 0 && !_answerAt && !revealed) _answerAt = Date.now();
    paint();
  });
  listener = () => { ref.off('value', fn); if (_phaseOff){ _phaseOff(); _phaseOff = null; }
                     if (_pubStop){ _pubStop(); _pubStop = null; }
                     clearInterval(_tick); _tick = null; clearTimeout(_prTimer); _prTimer = null; };

  /* Follow a reveal triggered anywhere else, so this slide and the presenter's own
     screen land on the answer at the same moment. */
  /* Following an external reveal is right — the presenter's own screen, the companion,
     another surface — but `.on('value')` fires IMMEDIATELY with whatever is already
     stored, and what is already stored is usually the previous run's 'reveal'. Honour
     changes, never that first echo, or a fresh run reveals itself on load. */
  let _echo = true;
  try {
    const phRef = db.ref('sessions/'+b.code+'/qstate/'+qid+'/phase');
    const phFn = phRef.on('value', s => {
      const ph = s.exists() ? s.val() : null;
      if (_echo){ _echo = false; return; }
      if (ph === 'post_reveal' && !post){ revealed = true; post = true; clearTimeout(_prTimer); paint(); return; }
      /* Read both spellings. 'revealed' is the real one; 'reveal' is what this file used
         to write, so it is still sitting in sessions that ran the old build. */
      if ((ph === 'revealed' || ph === 'reveal') && !revealed){ revealed = true; paint(); armPostReveal(); }
    });
    /* This listener used to be attached and never detached. Every re-entry of goLive left
       the previous closure alive, still holding the dead run's question and results: it
       repainted over the live one, re-armed its timer, and could re-fire the reveal write
       and cancel the current run's post-reveal by overwriting the shared _prTimer.
       The handle is assigned HERE, before the second watcher is built, so that if
       attaching that one throws, this one is still detachable instead of leaking. */
    const offPh = () => phRef.off('value', phFn);
    _phaseOff = offPh;

    /* Follow the controller too — presenter.html, the task pane, whatever is driving.
       qstate stays primary because it is per-question; currentQuestion is applied only
       when it is actually about this question, so the presenter moving to another
       question can never bleed into this slide. Same guard companion.html uses in
       QR-targeted mode (companion.html:461).

       id wins when it is there. Matching on index as an OR — the way companion.html
       does it — means a published id that DISAGREES with ours still matches because the
       positions line up, and after a reorder those are different questions. Index is
       only consulted when the controller published no id at all. */
    const isThisQ = cq => !!cq && (cq.id ? cq.id === qid
                                         : (cq.qIndex != null && cq.qIndex === b.qIdx));
    const cqRef = db.ref('sessions/'+b.code+'/currentQuestion');
    /* `.on('value')` fires straight away with whatever is STORED, and nothing ever clears
       currentQuestion — last session's final question is still sitting in it, usually
       revealed. Honouring that opened the slide with the answer already showing and the
       Reveal button gone. So the first emission changes nothing: only a CHANGE, which is
       a controller actually doing something, is followed. */
    let _cqEcho = true;
    const cqFn = cqRef.on('value', s2 => {
      const cq = s2.exists() ? s2.val() : null;
      if (!isThisQ(cq)) return;                 // a different question — not ours to follow
      /* The stored snapshot is skipped for EVERYTHING, hideResults included. An earlier
         version exempted it, reasoning that hiding fails safe — but nothing clears
         currentQuestion, so a morning session that hid results and never revealed left the
         wall showing "results hidden" all afternoon with no controller alive to undo it.
         Learning only from a change means: a controller that is driving publishes on every
         launch and every toggle, so we hide; no controller means no preference to honour,
         which is exactly what this slide did before it followed anything. */
      if (_cqEcho){ _cqEcho = false; return; }
      if (cq.hideResults !== undefined){
        const h = !!cq.hideResults;
        if (h !== _hideResults){ _hideResults = h; _hideFor = qid; paint(); }
      }
      const ph = cq.phase || 'live';
      if (ph === 'post_reveal' && !post){ revealed = true; post = true; clearTimeout(_prTimer); paint(); return; }
      if ((ph === 'revealed' || ph === 'reveal') && !revealed){ revealed = true; paint(); armPostReveal(); }
    });
    const offCq = () => cqRef.off('value', cqFn);
    _phaseOff = () => { offPh(); offCq(); };   // widen now that both are attached
  } catch(e){}

  paint();
  if (!editing) publishLiveQuestion(b, q, qid);
}

/* PUBLISH THE LIVE QUESTION — this is what makes phones FOLLOW the slide.
   ---------------------------------------------------------------------------
   answer.html follows sessions/<code>/currentQuestion: it reads qIndex to advance the
   phone and takes .id as the response bucket. Nothing else publishes it while presenting
   from PowerPoint (the task pane's publish fires on selection changes in EDIT view, not
   during a running slide show), so when this object stopped writing it, phones stopped
   advancing to the next question and their answers landed in the previous question's
   bucket. Restoring this write is the whole fix for "phones don't follow / Q2 never
   registers" in PowerPoint.

   The hazard is that a deck holds one of these frames PER SLIDE, all alive at once. The
   v244 version reclaimed the session every 2.5s whenever the frame "looked visible" — but
   in PowerPoint every frame looks visible, so all of them reclaimed forever and the phone
   cycled between questions, destroying answers. This version cannot do that:

     • last-writer-wins by launchedAt, enforced by a transaction — a background frame
       (older launchedAt) can NEVER overwrite the slide shown more recently. There is no
       reclaim war because an older claim is simply refused.
     • the re-claim is an EVENT (visibilitychange), fired once per transition, not a poll.
       The slide you navigate TO becomes visible, re-stamps a newer launchedAt, and wins.

   phase/reveal still travels on qstate, which the companion reads in QR-targeted mode;
   the visibility re-claim touches only the follow pointer, so it never un-reveals a slide
   you navigate back to. */
function publishLiveQuestion(b, q, qid){
  const meRef = db.ref('sessions/'+b.code+'/currentQuestion');
  const build = () => ({
    id: qid, qIndex: b.qIdx, index: (b.qIdx || 0) + 1, home: PSQid.homeOf(q, b.qIdx),
    text: q.text || '', type: q.type || 'multiple_choice',
    options: q.options || null,
    correctAnswer: (q.correctAnswer !== undefined && q.correctAnswer !== null) ? q.correctAnswer : null,
    ratingMax: q.ratingMax || null, ratingLabels: q.ratingLabels || null,
    image: q.image || null,
    revealDelay: q.revealDelay !== undefined ? q.revealDelay : 30,
    displayMode: q.displayMode || 'bars',
    postReveal: q.postReveal || null,
    phase: 'live', status: 'active', launchedAt: _launchedAt
  });
  const claim = () => {
    const p = build();
    ensureWriteAuth().then(() => meRef.transaction(cur => {
      if (cur && Number(cur.launchedAt) > p.launchedAt) return;   // a newer frame owns it — do not steal
      return p;
    })).catch(err => console.warn('PollSlide LIVE: live question not published', err && (err.code || err.message)));
  };

  // First sight of this question: publish the follow pointer, and stamp qstate live to
  // clear any stale 'revealed' an earlier run left in this node. Once per question.
  if (_announced !== qid) {
    _announced = qid;
    claim();
    ensureWriteAuth().then(() => db.ref('sessions/'+b.code+'/qstate/'+qid)
      .update({ phase:'live', launchedAt: _launchedAt })).catch(()=>{});
  }

  // Re-arm the visibility re-claim each goLive, detaching the previous handler first so a
  // re-entry can never leak a listener.
  if (_pubStop) { _pubStop(); _pubStop = null; }
  const onVis = () => {
    if (document.visibilityState === 'visible') { _launchedAt = Date.now(); claim(); }
  };
  document.addEventListener('visibilitychange', onVis);
  _pubStop = () => document.removeEventListener('visibilitychange', onVis);
}

/* This object publishes sessions/<code>/currentQuestion via publishLiveQuestion() above.
   It USED to refuse to (see that function's note for the history and why the old
   reclaim-loop version was dangerous); the current transaction + event approach makes
   publishing safe, and publishing is required for phones to follow the slide. */

/* Not every presenter wants a timer. Without this the only way to reveal was to wait
   out a countdown that, on a manual-reveal question, never even starts. */
function addRevealButton(onClick){
  if (document.getElementById('psReveal')) return;
  const b = document.createElement('button');
  b.id = 'psReveal'; b.className = 'reveal';
  b.textContent = tr('Reveal now');
  b.onclick = () => { b.remove(); document.body.classList.remove('revealing'); onClick(); };
  document.body.appendChild(b);
  document.body.classList.add('revealing');
}

function addPostRevealButton(onClick){
  if (document.getElementById('psPost')) return;
  const b = document.createElement('button');
  b.id = 'psPost'; b.className = 'reveal';
  b.textContent = tr('Show more →');
  b.onclick = () => { b.remove(); document.body.classList.remove('revealing'); onClick(); };
  document.body.appendChild(b);
  document.body.classList.add('revealing');
}

/* Editing only. A show has nobody to click these and they would just be clutter on
   the slide, so they are never rendered in read view.
   (Lost once to a careless region replace — the tests caught it. Keep it above the
   edit-mode section, below the reveal button.) */
function addControls(redraw){
  if (document.getElementById('psCtl')) return;
  const bar = document.createElement('div');
  bar.className = 'ctl'; bar.id = 'psCtl';
  bar.innerHTML =
    `<button id="cSm" title="${tr('Smaller text')}">A&minus;</button>` +
    `<button id="cLg" title="${tr('Bigger text')}">A+</button>` +
    `<button id="cMed" title="${tr('Show or hide option images')}">${SHOW_MEDIA?'\u{1F5BC}':'\u{1F6AB}'}</button>` +
    `<button id="cDk" title="${tr('Light or dark')}">${DARK?'\u2600':'\u{1F319}'}</button>` +
    `<button id="cRe">${tr('Change question')}</button>` +
    `<button id="cSo"${signedIn() ? '' : ' style="display:none"'}>${tr('Sign out')}</button>`;
  document.body.appendChild(bar);
  document.getElementById('cSo').onclick = signOut;
  const bump = (d) => {
    SCALE = Math.min(1.8, Math.max(0.6, Math.round((SCALE + d) * 20) / 20));
    applyPrefs(); savePrefs();
  };
  document.getElementById('cSm').onclick = () => bump(-0.1);
  document.getElementById('cLg').onclick = () => bump(+0.1);
  document.getElementById('cMed').onclick = () => {
    SHOW_MEDIA = !SHOW_MEDIA; savePrefs();
    document.getElementById('cMed').textContent = SHOW_MEDIA ? '\u{1F5BC}' : '\u{1F6AB}';
    if (typeof redraw === 'function') redraw();
  };
  document.getElementById('cDk').onclick = () => {
    DARK = !DARK; applyPrefs(); savePrefs();
    document.getElementById('cDk').textContent = DARK ? '\u2600' : '\u{1F319}';
  };
  document.getElementById('cRe').onclick = () => {
    bar.remove();
    document.getElementById('psReveal')?.remove();
    if (listener) { listener(); listener = null; }
    if (signedIn()) showPicker(); else showSignIn();
  };
}

/* ── Edit mode: bind this instance ───────────────────────────────────────────── */
function showSignIn(msg){
  $('root').innerHTML = `<div class="pad">
    <h2>${tr('Put live results on this slide')}</h2>
    <p>${tr('Sign in with your PollSlide account to choose which question this slide shows.')}</p>
    <div class="field"><input id="em" type="email" placeholder="${tr('you@example.com')}" autocomplete="email"></div>
    <div class="field"><input id="pw" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <div class="err" id="er">${esc(msg||'')}</div>
    <button class="btn" id="si">${tr('Sign in')}</button>
    <p>${tr('No account?')} <a href="${SIGNUP_URL}" target="_blank" rel="noopener" id="su">${tr('Create a free account')}</a> ${tr('— no enterprise purchase or admin setup needed.')}</p>
  </div>`;
  _onSignIn = true;
  $('su').onclick = (e) => { e.preventDefault(); openExternal(SIGNUP_URL); };
  $('si').onclick = async () => {
    $('er').textContent='';
    try { await auth.signInWithEmailAndPassword($('em').value.trim(), $('pw').value); }
    catch(e){ $('er').textContent = tr('Could not sign in. Check your details.'); return; }
    /* A slide that already had a question boots without the auth listener below, so
       nothing used to move on from here after signing in (reached via "Change question"
       while signed out). Move on unless the listener already did. */
    if (_onSignIn) showPicker();
  };
}

/* Sign-up and sign-out (Microsoft policy 1100.5.7.1, 2026-10-06). Sign-up opens the
   PollSlide sign-up form in the browser; sign-out is offered wherever you are signed in
   while editing — never during a slide show, which shows results only. Signing out does
   not unlink the slide: its question keeps showing when presented. */
const SIGNUP_URL = 'https://app.pollslide.com/presenter?signup=1';

/* WHO MAY WRITE (2026-10-06). The database accepts the live pointer (currentQuestion) and
   qstate only from a signed-in session ("auth != null"). This add-in used to rely on the
   PowerPoint user being signed in — true until Sign out existed. Signed out, every slide's
   publish was refused silently and phones stopped following. Now, when nobody is signed in
   and something must be written, it signs in ANONYMOUSLY — exactly what companion.html does.
   An anonymous session is never treated as "signed in" on screen: signedIn() is false, so
   the sign-in screen, "Signed in as…" and Sign out all behave as signed out. */
function signedIn(){ const u = auth && auth.currentUser; return !!(u && !u.isAnonymous); }
let _anonP = null;
function ensureWriteAuth(){
  try { if (auth && auth.currentUser) return Promise.resolve(true); } catch(e){ return Promise.resolve(false); }
  if (!_anonP) {
    let signin;
    try { signin = auth.signInAnonymously(); } catch(e){ return Promise.resolve(false); }
    _anonP = Promise.race([
      Promise.resolve(signin).then(() => true, err => { console.warn('PollSlide LIVE: anonymous sign-in failed — phones cannot follow', err && err.code); return false; }),
      new Promise(r => setTimeout(() => r(false), 5000)),       // never hang a publish
    ]).finally(() => { _anonP = null; });
  }
  return _anonP;
}
let _onSignIn = false;
function openExternal(url){
  try {
    if (Office.context.requirements && Office.context.requirements.isSetSupported('OpenBrowserWindowApi', '1.1')) {
      Office.context.ui.openBrowserWindow(url); return;
    }
  } catch(e){}
  try { window.open(url, '_blank', 'noopener'); } catch(e){}
}
function acctLine(){
  const u = auth && auth.currentUser;
  if (!signedIn()) return '';
  return `<div class="acct"><span>${esc(tr('Signed in as {email}', { email: u.email || '' }))}</span><button id="so">${tr('Sign out')}</button></div>`;
}
function wireSignOut(){ const b = $('so'); if (b) b.onclick = signOut; }
async function signOut(){
  document.getElementById('psCtl')?.remove();
  document.getElementById('psReveal')?.remove();
  if (listener) { listener(); listener = null; }
  try { await auth.signOut(); } catch(e){}
  showSignIn();
}

/* Decks live at users/<uid>/presentations — the same read powerpoint.html does.
   The first version of this queried quiz_builder by an "owner" field, which is not
   how this database is shaped: it returned nothing and the picker just said "No
   presentations found". The session code is a FIELD on the record (p.sessionCode),
   not the key, and the title field is `name`, not `title`. */
async function showPicker(){
  _onSignIn = false;
  $('root').innerHTML = `<div class="pad"><p>${tr('Loading your presentations…')}</p></div>`;
  let list = {};
  try {
    const s = await db.ref('users/'+auth.currentUser.uid+'/presentations').get();
    list = s.exists()? s.val() : {};
  } catch(e){}
  presentations = list;
  const pres = Object.entries(list)
    .map(([id,p]) => ({ ...p, id }))
    .sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  const items = pres.map(p=>{
    const qs = Array.isArray(p.questions)? p.questions : Object.values(p.questions||{});
    return `<div class="item" data-id="${esc(p.id)}"><div>${esc(p.name||tr('Untitled'))}</div>
      <div class="sub">${tr(one(qs.length)?'{n} question':'{n} questions', { n: qs.length })} · ${esc(p.sessionCode||'—')}</div></div>`;
  }).join('');
  $('root').innerHTML = `<div class="pad"><h2>${tr('Which presentation?')}</h2>
    <div class="list">${items || '<p>' + tr('No presentations on this account yet. Create one at app.pollslide.com/presenter, then click this box again.') + '</p>'}</div>${acctLine()}</div>`;
  wireSignOut();
  document.querySelectorAll('.item').forEach(el =>
    el.onclick = () => showQuestions(el.dataset.id));
}

function showQuestions(id){
  const p = presentations[id] || {};
  const code = p.sessionCode;
  const qs = Array.isArray(p.questions)? p.questions : Object.values(p.questions||{});
  if (!code){
    $('root').innerHTML = `<div class="pad"><h2>${tr('That presentation has no session code')}</h2>
      <p>${tr('Open it once in PollSlide, then come back.')}</p></div>`;
    return;
  }
  const items = qs.map((q,i)=>`<div class="item" data-i="${i}">
      <div>Q${i+1}. ${esc(q.text||tr('Untitled'))}</div>
      <div class="sub">${esc(tr((q.type||'').replace(/_/g,' ')))}</div></div>`).join('');
  $('root').innerHTML = `<div class="pad"><h2>${tr('Which question?')}</h2>
    <div class="list">${items||'<p>' + tr('This presentation has no questions.') + '</p>'}</div>
    <button class="btn ghost" id="bk">${tr('← Presentations')}</button>${acctLine()}</div>`;
  $('bk').onclick = showPicker;
  wireSignOut();
  document.querySelectorAll('.item').forEach(el => el.onclick = () => {
    const i = Number(el.dataset.i), q = qs[i];
    const b = { code, qIdx:i, qid:PSQid.bucket(q,i,code), text:q.text||'', q };
    bound = b; cacheBinding(b);
    goLive(b, true);
  });
}

/* ── Boot ────────────────────────────────────────────────────────────────────
   On the web, Slide Show is treated as a NEW SESSION and ActiveViewChanged never
   fires — so the view must be fetched on load, not just listened for. */
function getView(){
  return new Promise(resolve => {
    try {
      Office.context.document.getActiveViewAsync(r =>
        resolve(r.status === Office.AsyncResultStatus.Succeeded ? r.value : 'edit'));
    } catch(e){ resolve('edit'); }
  });
}

Office.onReady(async () => {
  detectLang();
  try { const ld = document.querySelector('#root'); if (ld && /Loading…/.test(ld.textContent)) ld.innerHTML = ld.innerHTML.replace('Loading…', tr('Loading…')); } catch(e){}
  try { firebase.initializeApp(FB_CONFIG); } catch(e){}
  db = firebase.database(); auth = firebase.auth();

  const view = await getView();
  bound = await resolveBinding(view);

  if (view === 'read') {
    // Presenting. Show results or say plainly why we can't — never a sign-in box.
    if (bound) goLive(bound);
    else $('root').innerHTML = `<div class="pad"><h2>${tr('Not linked to a question')}</h2>
      <p>${tr('Leave the slide show, click this box, and choose a question.')}</p></div>`;
    return;
  }

  /* Desktop PowerPoint (Windows and Mac) keeps this frame alive when the presenter starts
     the slide show, and tells us only through ActiveViewChanged. This handler used to be
     attached BELOW the early return for an already-bound slide — i.e. for every deck
     opened after the question was chosen — so on desktop those slides never went live:
     the edit bar stayed on the wall and currentQuestion was never published, so phones
     did not follow. It is attached first now, for every edit-view start.
     On the web a slide show is a new frame that boots straight into the 'read' branch
     above and never reaches this, so the web path is unchanged. */
  try {
    Office.context.document.addHandlerAsync(Office.EventType.ActiveViewChanged, async () => {
      const v = await getView();
      if (v === 'read') {
        if (bound) goLive(bound);
        else $('root').innerHTML = `<div class="pad"><h2>${tr('Not linked to a question')}</h2>
      <p>${tr('Leave the slide show, click this box, and choose a question.')}</p></div>`;
      } else {
        /* Back to editing. Forget the announcement so the NEXT slide show publishes the
           follow pointer again (publishLiveQuestion claims once per question), and give
           the presenter the edit controls back. */
        _announced = null;
        if (bound) goLive(bound, true);
        else if (signedIn()) showPicker(); else showSignIn();
      }
    });
  } catch(e){}

  auth.onAuthStateChanged(u => { const so = document.getElementById('cSo'); if (so) so.style.display = (u && !u.isAnonymous) ? '' : 'none'; });
  if (bound) { goLive(bound, true); return; }   // true = editing, offer a way to change it
  auth.onAuthStateChanged(u => { if (u && !u.isAnonymous) showPicker(); else showSignIn(); });
});
</script>
