<title>Setup Guide — PollSlide</title>
<meta name="description" content="Get started with PollSlide: build a live poll, present it over Keynote, and let your audience answer by scanning a QR code.">
<!-- The setup guide lives at pollslide.com/setup (single canonical copy). This
     app-origin URL used to hold a near-duplicate; it now redirects there so the
     two never drift. Every in-app "Setup guide" link already points to the
     canonical page. -->
<link rel="canonical" href="https://pollslide.com/setup">
<meta http-equiv="refresh" content="0; url=https://pollslide.com/setup">
<script>location.replace('https://pollslide.com/setup' + (location.hash || ''));</script>
<style>
  html,body{height:100%;margin:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#07070f;color:#f4f4fc;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
  a{color:#6c63ff;font-weight:600;}
</style>
</head>
<body>
  <div>
    <p>Taking you to the PollSlide setup guide…</p>
    <p>If nothing happens, <a href="https://pollslide.com/setup">open the setup guide</a>.</p>
  </div>
</body>
