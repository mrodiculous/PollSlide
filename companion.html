<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PollSlide Companion</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07070f;
    --surface: #10101a;
    --surface2: #18182a;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f4f4fc;
    --muted: #9090b8;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --accent3: #43e97b;
    --accent4: #f7b731;
    --bar-bg: rgba(255,255,255,0.04);
  }
  /* Light mode — applied by toggling html.light */
  html.light {
    --bg: #f2f2fa;
    --surface: #ffffff;
    --surface2: #e8e8f5;
    --border: rgba(0,0,0,0.09);
    --border2: rgba(0,0,0,0.15);
    --text: #1a1a2e;
    --muted: #5a5a7e;
    --bar-bg: rgba(0,0,0,0.04);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
  }

  /* Header */
  .hd {
    display:flex; align-items:center; gap:8px;
    padding:12px 16px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    flex-shrink:0;
    -webkit-app-region:drag;  /* lets you drag the window by the header */
  }
  .logo-dot { width:9px; height:9px; border-radius:50%; background:var(--accent); }
  .logo-txt { font-family:'Syne',sans-serif; font-weight:800; font-size:15px; }
  .live-pill {
    margin-left:auto;
    font-size:10px; font-weight:700;
    color:var(--accent3);
    background:rgba(67,233,123,0.15);
    padding:3px 9px; border-radius:100px;
    -webkit-app-region:no-drag;
  }

  /* View toggle */
  .toggle-bar {
    display:flex; gap:5px; padding:8px 12px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    flex-shrink:0;
    flex-wrap:wrap;
  }
  .toggle-btn {
    font-family:'Syne',sans-serif; font-weight:700; font-size:11px;
    color:var(--muted);
    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:7px;
    padding:5px 10px;
    cursor:pointer;
  }
  .toggle-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* Body scroll area — responsive: side-by-side when wide, stacked when narrow */
  .body { flex:1; overflow-y:auto; padding:16px; }
  .panes { display:flex; gap:18px; align-items:flex-start; }
  .panes.stacked { flex-direction:column; }
  .pane-q { flex:1; min-width:0; }
  .pane-r { flex:1; min-width:0; }
  .panes.stacked .pane-q, .panes.stacked .pane-r { width:100%; }


  /* Question */
  .q-text { font-family:'Syne',sans-serif; font-size:18px; font-weight:800; line-height:1.35; margin-bottom:4px; }

  /* Reveal bar */
  .reveal-bar {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:8px 0; margin-bottom:10px;
    font-size:12px; color:var(--muted);
    border-bottom:1px solid var(--border);
  }
  .reveal-strong { color:var(--accent4); font-weight:700; }

  /* Result bars — PollSlide Neon Glass */
  .resp-big { font-family:'Syne',sans-serif; font-weight:800; font-size:24px; margin-bottom:14px; }
  .resp-big span { font-size:13px; color:var(--muted); font-weight:600; }
  .bar-wrap {
    margin-bottom:8px; background:var(--bar-bg);
    border-radius:12px; padding:9px 12px;
    position:relative; overflow:hidden;
    border:1.5px solid transparent; transition:border-color 0.4s,box-shadow 0.4s;
  }
  .bar-glow { position:absolute;bottom:0;left:0;height:2px;transition:width .45s ease;border-radius:0 2px 0 0; }
  .bar-fill-bg { position:absolute;inset:0;opacity:0.10;transition:width .45s ease;pointer-events:none; }
  .bar-inner { display:flex;align-items:center;gap:8px;position:relative; }
  .bar-letter { width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:11px;font-weight:900;flex-shrink:0; }
  .bar-opt-img { height:28px;width:auto;border-radius:5px;object-fit:cover;flex-shrink:0; }
  .bar-opt-text { flex:1;font-size:13px;line-height:1.3; }
  .bar-opt-count { font-family:'Syne',sans-serif;font-weight:900;font-size:14px;flex-shrink:0; }

  /* Word cloud */
  .word-cloud { display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:center;padding:12px 4px; }
  .word-cloud span { font-family:'Syne',sans-serif;font-weight:800;border-radius:6px;padding:3px 6px;cursor:default;display:inline-block;transform-origin:center center; }

  /* Media — auto-fit natural size, no height cap */
  .q-media { width:100%;height:auto;max-height:none;object-fit:contain;border-radius:10px;margin-bottom:12px;display:block;background:transparent; }

  /* Leaderboard rows */
  .p-row { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .p-rank { width:26px; text-align:center; }
  .p-name { flex:1; }
  .p-score { font-family:'Syne',sans-serif; font-weight:700; }

  /* Waiting state */
  .waiting { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:12px; color:var(--muted); text-align:center; padding:24px; }
  .waiting-icon { font-size:30px; opacity:0.6; }

  .txt-resp { background:var(--surface2); border:1px solid var(--border); border-radius:9px; padding:10px 12px; margin-bottom:8px; font-size:13px; }
  .txt-resp .from { color:var(--muted); font-size:11px; margin-top:4px; }

  /* QR pane — shown so the audience can scan to answer */
  .qr-pane {
    display:flex; align-items:center; gap:14px;
    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    margin-bottom:16px;
  }
  .qr-box { background:#ffffff; padding:8px; border-radius:10px; flex-shrink:0; line-height:0; }
  .qr-box img, .qr-box canvas { display:block; }
  .qr-info h3 { font-family:'Syne',sans-serif; font-size:14px; font-weight:800; margin-bottom:4px; }
  .qr-info p { font-size:12px; color:var(--muted); line-height:1.4; }
  .qr-collapsed { cursor:pointer; }
  @keyframes fadeInScale { from { opacity:0; transform:scale(0.96); } to { opacity:1; transform:scale(1); } }
  @keyframes podiumRise { from { height:0; opacity:0; } to { opacity:1; } }
  @keyframes barGrow { from { width:0; } }
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<body>

<div class="hd">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="22" height="22" style="flex-shrink:0;"><rect width="100" height="100" rx="22" fill="#0d0d18"/><rect x="18" y="58" width="16" height="24" rx="4" fill="#ff6584"/><rect x="42" y="42" width="16" height="40" rx="4" fill="#f7b731"/><rect x="66" y="22" width="16" height="60" rx="4" fill="#6c63ff"/><polygon points="72,32 72,40 78,36" fill="rgba(255,255,255,0.8)"/></svg>
  <span class="logo-txt">PollSlide</span>
  <span class="live-pill" id="livePill" style="display:none;">LIVE</span>
  <span class="live-pill" id="progressPill" style="display:none;color:var(--muted);background:var(--surface2);"></span>
</div>

<div class="toggle-bar" id="toggleBar" style="display:none;">
  <button class="toggle-btn active" data-mode="bars"        onclick="setMode('bars')">Bars</button>
  <button class="toggle-btn"        data-mode="column"      onclick="setMode('column')">Column</button>
  <button class="toggle-btn"        data-mode="word_cloud"  onclick="setMode('word_cloud')">Word Cloud</button>
  <button class="toggle-btn"        data-mode="donut"       onclick="setMode('donut')">Donut</button>
  <button class="toggle-btn"        data-mode="pie"         onclick="setMode('pie')">Pie</button>
  <button class="toggle-btn"        data-mode="number"      onclick="setMode('number')">Numbers</button>
  <button class="toggle-btn"        data-mode="leaderboard" onclick="setMode('leaderboard')">Leaderboard</button>
  <div style="flex:1;"></div>
  <button class="toggle-btn" id="mediaToggleBtn" onclick="toggleMedia()" title="Show/hide question image or video">🖼 Media</button>
  <button class="toggle-btn" id="revealBtn" onclick="forceReveal()" title="Reveal the correct answer now">Reveal</button>
  <button class="toggle-btn" id="themeBtn" onclick="toggleTheme()" title="Switch light / dark mode" style="font-size:14px;padding:4px 8px;">☀️</button>
</div>

<div class="body" id="body">
  <div class="waiting">
    <div class="waiting-icon">⏳</div>
    <div id="waitMsg">Connecting…</div>
  </div>
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBPncI0e-LlIgLvTcq76O1Kdq2jXJ6DiME",
  authDomain: "echonest-live-survey.firebaseapp.com",
  databaseURL: "https://echonest-live-survey-default-rtdb.firebaseio.com",
  projectId: "echonest-live-survey",
  storageBucket: "echonest-live-survey.firebasestorage.app",
  messagingSenderId: "285529140046",
  appId: "1:285529140046:web:983c1ee8000a2ca8f80c1f",
  measurementId: "G-NWQY4YLNRC"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

const letters = ['A','B','C','D','E','F'];
const BASE_URL = "https://app.pollslide.com/answer";

// ── Parse the hash: companion#<userId>  OR  companion#<userId>/<sessionCode>/<qIndex> ──
// The extended form is sent by the Mac app when it decodes a QR on the slide,
// so the companion shows EXACTLY the question that QR points to.
function parseHash() {
  const raw = (location.hash || '').replace(/^#/, '').trim();
  const parts = raw.split('/');
  return {
    userId: parts[0] || '',
    targetSession: parts[1] || null,
    targetQIndex: (parts.length > 2 && parts[2] !== '') ? parseInt(parts[2], 10) : null
  };
}

let { userId, targetSession, targetQIndex } = parseHash();

// ── State ──
let sessionCode = null;
let curQ = null;
let responses = [];
let viewMode = 'bars';
let revealed = false;
let revealArmed = false;
let revealTimer = null;
let revealRemaining = 0;
let revealSeconds = 30;
let curQId = null;
let liveStartedAt = 0;
let showQR = false;
let showMedia = false; // media OFF by default in the poll window (results are the focus)
let presentPhase = 'live'; // 'live' | 'revealed' | 'post_reveal' — mirrors presenter's Firebase phase
let macLinkRef = null;
let liveQRef = null;
let phaseRef = null;  // watches this question's qstate/<qId> in QR-targeted mode
let phaseRef2 = null; // fallback: watches shared currentQuestion (older presenters)
let _recentResponses = []; // timestamps of recent responses for velocity calc
let _prTicker = null;      // 1s interval driving the visual post-reveal countdown badge

// Seconds until post-reveal fires, synced to the presenter's published postRevealAt.
// Returns null when no countdown should show (not enabled, already in post-reveal, or
// no target time set yet). One source of truth for the badge + the ticker.
function postRevealRemaining() {
  if (!curQ || !curQ.postReveal || !curQ.postReveal.enabled) return null;
  if (presentPhase === 'post_reveal') return null;
  const at = curQ.postRevealAt;
  if (!at) return null;
  return Math.max(0, Math.ceil((at - Date.now()) / 1000));
}

// Start/stop the 1s ticker that keeps the countdown badge live between renders.
function syncPostRevealTicker() {
  const active = postRevealRemaining() !== null;
  if (active && !_prTicker) {
    _prTicker = setInterval(() => {
      const rem = postRevealRemaining();
      if (rem === null) { clearInterval(_prTicker); _prTicker = null; return; }
      const el = document.getElementById('prCount');
      if (el) el.textContent = rem + 's';
    }, 1000);
  } else if (!active && _prTicker) {
    clearInterval(_prTicker); _prTicker = null;
  }
}

// View toggle
function toggleMedia() {
  showMedia = !showMedia;
  const btn = document.getElementById('mediaToggleBtn');
  if (btn) { btn.classList.toggle('active', showMedia); }
  renderAll();
}

function forceReveal() {
  if (!revealed) {
    revealed = true;
    if (revealTimer) { clearInterval(revealTimer); revealTimer = null; }
    fireConfetti();
    renderAll();
  }
  const btn = document.getElementById('revealBtn');
  if (btn) { btn.classList.add('active'); btn.style.color = 'var(--accent3)'; }
}

function setMode(m) {
  viewMode = m;
  document.querySelectorAll('.toggle-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === m);
  });
  renderResults();
}

function isVideoUrl(url) {
  if (!url) return false;
  const u = url.split('?')[0].toLowerCase();
  return u.endsWith('.mp4')||u.endsWith('.webm')||u.endsWith('.mov')||u.endsWith('.m4v')||u.includes('/video/');
}
function mediaTag(url, opts) {
  if (!url || !url.trim()) return '';
  if (isVideoUrl(url)) {
    opts = opts || {loop:true,autoplay:true,muted:true,controls:false};
    let a = 'playsinline ';
    if (opts.loop) a += 'loop ';
    if (opts.muted||opts.autoplay) a += 'muted ';
    if (opts.autoplay) a += 'autoplay ';
    if (opts.controls) a += 'controls ';
    return `<video class="q-media" src="${url}" ${a} onloadedmetadata="requestFitToContent()"></video>`;
  }
  // onload fires once natural dimensions are known — retriggers fit so window
  // grows to show the full image height, not just the pre-load placeholder size
  return `<img class="q-media" src="${url}" onload="requestFitToContent()" onerror="this.style.display='none'">`;
}

function showWaiting(msg) {
  document.getElementById('livePill').style.display = 'none';
  document.getElementById('toggleBar').style.display = 'none';
  document.getElementById('body').innerHTML =
    `<div class="waiting"><div class="waiting-icon">⏳</div><div>${msg}</div></div>`;
}

// ── Boot ──
function boot() {
  if (!userId) { showWaiting('No account linked. Re-pair the Mac app.'); return; }
  if (targetSession && targetQIndex !== null) {
    // QR-driven mode: show exactly the question the scanned QR points to
    showTargetedQuestion(targetSession, targetQIndex);
  } else {
    // Fallback: follow the account's active session via mac_link
    watchMacLink();
  }
}
boot();

// ── LIGHT / DARK THEME ───────────────────────────────────────────────────────
let _theme = localStorage.getItem('ql_companion_theme') || 'dark';
function applyTheme() {
  document.documentElement.classList.toggle('light', _theme === 'light');
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = _theme === 'light' ? '🌙' : '☀️';
}
function toggleTheme() {
  _theme = _theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('ql_companion_theme', _theme);
  applyTheme();
}
applyTheme(); // apply saved preference on load

// Show a specific question directly from quiz_builder — guarantees it matches the QR.
function showTargetedQuestion(session, qIdx) {
  sessionCode = session;
  // Detach any prior watchers
  if (liveQRef) { liveQRef.off(); liveQRef = null; }
  if (macLinkRef) { macLinkRef.off(); macLinkRef = null; }
  if (phaseRef) { phaseRef.off(); phaseRef = null; }
  if (phaseRef2) { phaseRef2.off(); phaseRef2 = null; }

  db.ref(`quiz_builder/${session}/questions`).get().then(snap => {
    const questions = snap.exists() ? snap.val() : [];
    const q = Array.isArray(questions) ? questions[qIdx] : null;
    if (!q || !q.text) { showWaiting('Question not found for this slide.'); return; }
    const qId = `q${qIdx}_stable_${session}`; // always use stable QID — matches presenter's stableQId
    const qObj = Object.assign({}, q, { id: qId, qIndex: qIdx });
    if (curQId !== qId) {
      curQId = qId;
      resetReveal(qObj);
      viewMode = qObj.displayMode || 'bars';
      presentPhase = 'live';
      liveStartedAt = q.launchedAt || 0;
      watchResponses(qId);
    }
    curQ = qObj;
    renderAll();

    // Phase comes from THIS question's own state node (qstate/<qId>) when available —
    // the per-question source that works for every slide in a deck, independent of
    // which question is "current" in the presenter. We ALSO watch the shared
    // currentQuestion and fall back to it when qstate is absent (older presenter code
    // that only writes currentQuestion), but only if currentQuestion is actually THIS
    // question (id or index match) so a different current question can't bleed in.
    let _stQ = null, _stCur = null;
    function applyTargetedState() {
      let src = _stQ;
      if (!src && _stCur && ((_stCur.id && _stCur.id === curQId) ||
                             (_stCur.qIndex != null && curQ && _stCur.qIndex === curQ.qIndex))) {
        src = _stCur;
      }
      if (!src) return; // nothing applicable yet → stay on live results
      const newPhase = src.phase || 'live';
      const oldPrAt = (curQ && curQ.postRevealAt) || null;
      const newPrAt = src.postRevealAt || null;
      if (curQ) {
        curQ = Object.assign({}, curQ, { phase: newPhase, postRevealAt: newPrAt });
        if (src.postReveal) curQ.postReveal = src.postReveal;
      }
      if (newPhase !== presentPhase || newPrAt !== oldPrAt) {
        presentPhase = newPhase;
        if (presentPhase === 'revealed' || presentPhase === 'post_reveal') {
          if (!revealed) { revealed = true; if (revealTimer) { clearInterval(revealTimer); revealTimer = null; } }
        }
        renderAll();
      }
    }
    phaseRef = db.ref(`sessions/${session}/qstate/${qId}`);
    phaseRef.on('value', s => { _stQ = s.val(); applyTargetedState(); });
    phaseRef2 = db.ref(`sessions/${session}/currentQuestion`);
    phaseRef2.on('value', s => { _stCur = s.val(); applyTargetedState(); });
  }).catch(() => showWaiting('Could not load this question.'));
}

function watchMacLink() {
  showWaiting('Waiting for your presentation…');
  macLinkRef = db.ref(`mac_link/${userId}`);
  macLinkRef.on('value', snap => {
    const data = snap.val();
    if (!data || !data.sessionCode) {
      showWaiting('Open a presentation on pollslide.com to begin.');
      return;
    }
    if (sessionCode !== data.sessionCode) {
      sessionCode = data.sessionCode;
      watchLiveQuestion();
    }
  });
}

function watchLiveQuestion() {
  if (liveQRef) { liveQRef.off(); liveQRef = null; }
  if (phaseRef) { phaseRef.off(); phaseRef = null; }
  if (phaseRef2) { phaseRef2.off(); phaseRef2 = null; }
  liveQRef = db.ref(`sessions/${sessionCode}/currentQuestion`);
  liveQRef.on('value', snap => {
    const q = snap.val();
    if (!q || !q.text) {
      curQ = null;
      showWaiting('Waiting for a question to go live…');
      return;
    }
    if (curQId !== q.id) {
      curQId = q.id;
      resetReveal(q);
      showMedia = false; // reset media to OFF for each new question
      viewMode = q.displayMode || 'bars';
      presentPhase = q.phase || 'live';
      liveStartedAt = q.launchedAt || Date.now();
      watchResponses(q.id);
    } else {
      // Same question — just track the latest phase. curQ is replaced with the full
      // currentQuestion snapshot below (it already carries phase + postReveal), so no
      // separate merge is needed here.
      presentPhase = q.phase || 'live';
    }
    // Sync local revealed flag from presenter's phase — critical for
    // correct-answer highlighting, medals, and insight chip
    if (presentPhase === 'revealed' || presentPhase === 'post_reveal') {
      if (!revealed) { revealed = true; if (revealTimer) { clearInterval(revealTimer); revealTimer = null; } }
    }
    curQ = q;
    renderAll();
  });

  // NOTE: phaseRef removed from watchLiveQuestion — liveQRef already watches
  // the same path (sessions/${sessionCode}/currentQuestion) and handles ALL
  // phase transitions correctly. A second listener on the same path created a
  // race condition: whichever fired second saw newPhase===presentPhase (already
  // updated by the first) and skipped renderAll(), which caused Q2+ post-reveal
  // to be silently dropped. Single listener = no race. phaseRef is still used
  // in showTargetedQuestion (QR mode) where liveQRef is not active.
}

function watchResponses(qId) {
  // Detach previous
  if (window._respRef) window._respRef.off();
  window._respRef = db.ref(`sessions/${sessionCode}/responses/${qId}`);
  window._respRef.on('value', snap => {
    const all = snap.exists() ? Object.values(snap.val()) : [];
    // Only use responses from the current live session — ignore stale data
    // left over in Firebase from a previous run of this same question.
    const newResponses = all.filter(r => (r.submittedAt||0) >= liveStartedAt);
    // Track timestamps for velocity indicator (Feature 5)
    const newCount = newResponses.length;
    if (newCount > responses.length) {
      for (let i = responses.length; i < newCount; i++) {
        _recentResponses.push(Date.now());
      }
    }
    responses = newResponses;
    if (responses.length > 0 && !revealArmed && !revealed) beginRevealCountdown();
    renderAll();
  });
}

// ── Reveal logic (mirrors presenter) ──
function resetReveal(q) {
  revealed = false; revealArmed = false;
  if (revealTimer) { clearInterval(revealTimer); revealTimer = null; }
  _recentResponses = [];
  const d = q.revealDelay;
  revealSeconds = (d === 'manual' || d === -1) ? -1 : ((d === undefined || d === null) ? 30 : +d);
  // Quiz = choice type. These wait for reveal. Only free_text/rating show immediately.
  const isQuiz = (q.type === 'multiple_choice' || q.type === 'multiple_choice_multi');
  if (!isQuiz) revealed = true; // opinion polls always "revealed"
}
function beginRevealCountdown() {
  if (revealArmed || revealed) return;
  if (revealSeconds === -1) { revealArmed = true; renderAll(); return; } // manual only
  revealArmed = true;
  revealRemaining = revealSeconds;
  renderAll();
  revealTimer = setInterval(() => {
    revealRemaining--;
    const el = document.getElementById('revealCount');
    if (el) el.textContent = Math.max(0, revealRemaining) + 's';
    if (revealRemaining <= 0) { revealed = true; clearInterval(revealTimer); revealTimer = null; fireConfetti(); renderAll(); }
  }, 1000);
}

// ── Rendering ──
function renderAll() {
  if (!curQ) return;
  document.getElementById('livePill').style.display = '';
  const progPill = document.getElementById('progressPill');
  if (progPill) {
    if (curQ.index && curQ.total) {
      progPill.textContent = `Q${curQ.index} / ${curQ.total}`;
      progPill.style.display = '';
    } else {
      progPill.style.display = 'none';
    }
  }
  const rBtn = document.getElementById('revealBtn');
  if (rBtn) { rBtn.classList.toggle('active', revealed); }
  const mBtn = document.getElementById('mediaToggleBtn');
  if (mBtn) { mBtn.classList.toggle('active', showMedia); }
  const isChoice = curQ.type !== 'free_text' && curQ.type !== 'rating';
  const isFreeText = curQ.type === 'free_text';
  const hasImage = !!(curQ.image && curQ.image.trim());

  // Always show the toggle bar when live so Media button is always reachable
  document.getElementById('toggleBar').style.display = 'flex';

  // Show/hide mode buttons and sync active highlight to current viewMode
  document.querySelectorAll('.toggle-btn[data-mode]').forEach(btn => {
    const m = btn.dataset.mode;
    let show = false;
    if (m === 'bars' || m === 'column' || m === 'donut' || m === 'pie' || m === 'number' || m === 'leaderboard') show = isChoice;
    if (m === 'word_cloud') show = isChoice || isFreeText;
    btn.style.display = show ? '' : 'none';
    btn.classList.toggle('active', m === viewMode);
  });

  // If current mode is invalid for this type, reset to bars/bubbles
  if (!isChoice && viewMode !== 'word_cloud') viewMode = 'bars';

  const media = (showMedia && hasImage) ? mediaTag(curQ.image, curQ.videoOpts) : '';
  let revealBar = '';
  const isQuiz = (curQ.type === 'multiple_choice' || curQ.type === 'multiple_choice_multi');
  const prRem = postRevealRemaining(); // synced to presenter; null when no countdown should show
  const prBadge = `<div class="reveal-bar"><span style="color:#a78bfa;font-weight:700;">✦ Post-reveal in <strong class="reveal-strong" id="prCount">${prRem}s</strong></span></div>`;
  if (isQuiz && !revealed) {
    revealBar = revealArmed
      ? (revealSeconds === -1
          ? `<div class="reveal-bar"><span>Manual reveal</span></div>`
          : `<div class="reveal-bar"><span>Reveal in <strong class="reveal-strong" id="revealCount">${revealRemaining}s</strong></span></div>`)
      : (revealSeconds === -1
          ? `<div class="reveal-bar"><span>Manual reveal</span></div>`
          : `<div class="reveal-bar"><span>⏳ Reveal starts on first answer</span></div>`);
  } else if (isQuiz && revealed) {
    // Once revealed, show the post-reveal countdown if one is running, else "revealed".
    revealBar = (prRem !== null)
      ? prBadge
      : `<div class="reveal-bar"><span style="color:var(--accent3);font-weight:600;">✓ Answer revealed</span></div>`;
  } else if (!isQuiz && prRem !== null) {
    // Opinion polls (word cloud / rating) are always "revealed" — show the countdown.
    revealBar = prBadge;
  }

  // QR pane — links to this specific question so the audience can scan & answer
  const qIdx = (curQ.qIndex !== undefined && curQ.qIndex !== null) ? curQ.qIndex : 0;
  const answerUrl = `${BASE_URL}#${sessionCode}/${qIdx}`;
  const qrPane = showQR
    ? `<div class="qr-pane">
         <div class="qr-box" id="qrBox"></div>
         <div class="qr-info">
           <h3>Scan to answer</h3>
           <p>Point your phone camera here to join this question.</p>
         </div>
       </div>`
    : '';

  // Responsive: side-by-side when the window is wide, stacked when narrow
  const wide = window.innerWidth >= 620;

  document.getElementById('body').innerHTML = `
    <div class="panes ${wide ? '' : 'stacked'}">
      <div class="pane-q">
        ${media}
        <div class="q-text">${escapeHtml(curQ.text)}</div>
        ${qrPane}
      </div>
      <div class="pane-r">
        ${revealBar}
        <div id="resultsArea"></div>
      </div>
    </div>`;

  // Draw the QR (after the element exists)
  if (showQR) {
    const box = document.getElementById('qrBox');
    if (box && window.QRCode) {
      box.innerHTML = '';
      new QRCode(box, { text: answerUrl, width: 96, height: 96, colorDark:'#0b0b15', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M });
    }
  }

  renderResults();
  syncPostRevealTicker(); // keep the post-reveal countdown badge ticking between renders

  // Fit after full render — catches layout from toggle bar, reveal bar, QR pane
  requestFitToContent();
}

// Re-render on resize so the layout switches between side-by-side and stacked.
// Guard: ignore resize events that our OWN fit-request caused, to avoid a
// grow → resize → re-measure → grow feedback loop.
let _resizeT = null;
let _suppressResizeUntil = 0;
let _lastDPR = window.devicePixelRatio;
window.addEventListener('resize', () => {
  // When the window moves to a different display (Retina ↔ 1×), devicePixelRatio
  // changes. Clear the cached height so the next requestFitToContent() always
  // sends a fresh message regardless of the 8px threshold.
  if (window.devicePixelRatio !== _lastDPR) {
    _lastDPR = window.devicePixelRatio;
    _lastRequestedH = 0;
  }
  if (Date.now() < _suppressResizeUntil) return; // our own fit caused this
  clearTimeout(_resizeT);
  _resizeT = setTimeout(() => { if (curQ) renderAll(); }, 200);
});

// ── AUTO-FIT: report the content's natural height to the Mac app so the
// window grows/shrinks to show everything without scrolling.
// Uses scrollHeight (full content height regardless of clipping) so the
// window expands even when content is taller than the current window.
let _lastRequestedH = 0;
let _fitRAF = null;
function requestFitToContent() {
  // Debounce into next animation frame so layout is complete
  cancelAnimationFrame(_fitRAF);
  _fitRAF = requestAnimationFrame(() => {
    try {
      const header = document.querySelector('.hd');
      const toggle = document.getElementById('toggleBar');
      const panes  = document.querySelector('.panes');
      if (!panes) return;

      const headH = (header ? header.offsetHeight : 0)
                  + (toggle && toggle.style.display !== 'none' ? toggle.offsetHeight : 0);

      // Use body.scrollHeight so padding is included automatically.
      // Add 24px as a small visual border so content never presses the window edge.
      const bodyEl = document.querySelector('.body');
      const contentH = (bodyEl ? bodyEl.scrollHeight : panes.scrollHeight) + 24;
      let desiredH = Math.round(headH + contentH);
      // Min 280px so the window is never uselessly tiny.
      // No hard upper cap — Swift clamps to the screen's visible frame.
      desiredH = Math.max(280, desiredH);

      // Only send if meaningfully different — prevents jitter
      if (Math.abs(desiredH - _lastRequestedH) < 6) return;
      _lastRequestedH = desiredH;

      // Suppress the resize echo that our own fit request causes
      _suppressResizeUntil = Date.now() + 700;
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.fit) {
        window.webkit.messageHandlers.fit.postMessage({ height: desiredH });
      }
    } catch(e) {}
  });
}

// ── CONFETTI: celebratory burst across the window on answer reveal ──
let _confettiCanvas = null, _confettiCtx = null, _confettiParticles = [], _confettiRAF = null;
function fireConfetti() {
  if (!_confettiCanvas) {
    _confettiCanvas = document.createElement('canvas');
    _confettiCanvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999;';
    document.body.appendChild(_confettiCanvas);
    _confettiCtx = _confettiCanvas.getContext('2d');
  }
  const W = _confettiCanvas.width = window.innerWidth;
  const H = _confettiCanvas.height = window.innerHeight;
  const colors = ['#6c63ff','#ff6584','#43e97b','#f7b731','#4facfe','#a78bfa','#ffffff'];
  _confettiParticles = [];
  const count = Math.min(160, Math.floor(W / 4));
  for (let i = 0; i < count; i++) {
    _confettiParticles.push({
      x: Math.random() * W,
      y: -20 - Math.random() * H * 0.3,
      vx: (Math.random() - 0.5) * 6,
      vy: 3 + Math.random() * 5,
      sz: 5 + Math.random() * 7,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.3,
      color: colors[Math.floor(Math.random() * colors.length)],
      life: 1
    });
  }
  const start = performance.now();
  const dur = 2600;
  cancelAnimationFrame(_confettiRAF);
  const tick = (now) => {
    const elapsed = now - start;
    _confettiCtx.clearRect(0, 0, W, H);
    let alive = false;
    for (const p of _confettiParticles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.rot += p.vr;
      if (elapsed > dur - 700) p.life = Math.max(0, (dur - elapsed) / 700);
      if (p.y < H + 30 && p.life > 0) alive = true;
      _confettiCtx.save();
      _confettiCtx.globalAlpha = p.life;
      _confettiCtx.translate(p.x, p.y);
      _confettiCtx.rotate(p.rot);
      _confettiCtx.fillStyle = p.color;
      _confettiCtx.fillRect(-p.sz/2, -p.sz/2, p.sz, p.sz * 0.6);
      _confettiCtx.restore();
    }
    if (elapsed < dur && alive) { _confettiRAF = requestAnimationFrame(tick); }
    else { _confettiCtx.clearRect(0, 0, W, H); }
  };
  _confettiRAF = requestAnimationFrame(tick);
}

function toggleQR() { /* QR display removed from companion */ }

const PS_COLORS = ['#6c63ff','#ff6584','#38d9f5','#f7b731','#a78bfa','#43e97b'];
const STOP_WORDS = new Set(['a','an','the','and','or','but','in','on','at','to','for','of','with','by','from','is','it','its','was','are','were','be','been','being','have','has','had','do','does','did','will','would','could','should','may','might','this','that','these','those','i','we','you','he','she','they','my','our','your','his','her','their','not','no','so','if','as','up','out','about','into','than','then','when','where','who','what','how','all','any','each','other','more','also','just','can','get']);

// ── POST-REVEAL CONTENT ───────────────────────────────────────────────────────
function buildPostRevealContent(q, resps) {
  const type = q.postReveal?.type || 'leaderboard';
  const total = resps.length;
  const sorted = [...resps].sort((a,b) => {
    const sa = a.isCorrect===true?1:(typeof a.isCorrect==='number'?a.isCorrect:0);
    const sb = b.isCorrect===true?1:(typeof b.isCorrect==='number'?b.isCorrect:0);
    if (sb!==sa) return sb-sa;
    return (a.elapsed||999999)-(b.elapsed||999999);
  });
  const medals = ['🥇','🥈','🥉'];

  if (type === 'leaderboard') {
    const fastestIdx = sorted.findIndex(r => r.isCorrect === true);
    const rows = sorted.map((r,rank) => {
      const speed = r.elapsed ? `<span style="font-size:10px;color:var(--muted);margin-left:5px;">${(r.elapsed/1000).toFixed(1)}s</span>` : '';
      const _psc = r.isCorrect===true?1:(typeof r.isCorrect==='number'?r.isCorrect:r.isCorrect===false?-1:null);
      const _pCol = _psc===1?'#43e97b':_psc===-1?'#ff6584':_psc!==null?'#f7b731':'var(--muted)';
      const _pTxt = _psc===1?'✓':_psc===-1?'✗':_psc!==null?Math.round(_psc*100)+'%':'·';
      const score = `<span style="color:${_pCol};font-size:13px;">${_pTxt}</span>`;
      const isFastest = rank === fastestIdx && r.isCorrect === true;
      const fastBadge = isFastest ? `<span style="font-size:11px;background:#f7b73122;border:1px solid #f7b731;border-radius:6px;padding:1px 6px;color:#f7b731;flex-shrink:0;">⚡ Fastest</span>` : '';
      return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);">
        <span style="width:22px;text-align:center;font-size:12px;">${rank<3?medals[rank]:'#'+(rank+1)}</span>
        <span style="flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(r.name && r.name.trim() ? r.name : 'Player '+(rank+1))}${speed}</span>
        ${fastBadge}${score}</div>`;
    }).join('') || '<div style="color:var(--muted);font-size:13px;">No responses yet.</div>';
    return `<div style="font-size:11px;font-weight:700;color:#a78bfa;letter-spacing:.06em;margin-bottom:8px;">✦ LEADERBOARD</div>${rows}`;
  }

  if (type === 'podium') {
    const top3 = sorted.slice(0,3);
    const order = [1,0,2];
    const heights = ['60px','90px','44px'];
    const cols = ['#ff6584','#6c63ff','#f7b731'];
    const cols2 = ['#ff658488','#6c63ff88','#f7b73188'];
    const podiums = order.map(i => {
      const r = top3[i];
      if (!r) return `<div style="flex:1;"></div>`;
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;">
        <div style="font-size:18px;">${medals[i]}</div>
        <div style="font-size:11px;font-weight:700;color:var(--text);text-align:center;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(r.name && r.name.trim() ? r.name : 'Player '+(i+1))}</div>
        ${r.elapsed?`<div style="font-size:9px;color:var(--muted);">${(r.elapsed/1000).toFixed(1)}s</div>`:''}
        <div style="width:100%;height:${heights[i]};background:${cols[i]};border-radius:6px 6px 0 0;box-shadow:0 0 14px ${cols2[i]};animation:podiumRise 0.6s ${0.1*i}s ease both;"></div>
      </div>`;
    });
    return `<div style="font-size:11px;font-weight:700;color:#a78bfa;letter-spacing:.06em;margin-bottom:10px;">✦ TOP 3</div>
      <div style="display:flex;align-items:flex-end;gap:6px;justify-content:center;padding:0 4px;">${podiums.join('')}</div>
      ${sorted.length>3?`<div style="margin-top:10px;font-size:11px;color:var(--muted);text-align:center;">+ ${sorted.length-3} more</div>`:''}`;
  }

  if (type === 'scorecard') {
    // Average score across all respondents — accounts for partial credit (0<isCorrect<1)
    const totalScore = resps.reduce((sum,r)=>sum+(r.isCorrect===true?1:typeof r.isCorrect==='number'&&r.isCorrect>0?r.isCorrect:0),0);
    const pct = total>0 ? Math.round(totalScore/total*100) : 0;
    const fullCorrect = resps.filter(r=>r.isCorrect===true).length;
    const [emoji, label, col] = pct>=80?['🎉','Fantastic!','#43e97b']:pct>=60?['👏','Nice work!','#6c63ff']:pct>=40?['💪','Keep going!','#f7b731']:['🤔','Tough one!','#ff6584'];
    return `<div style="text-align:center;padding:4px 0;">
      <div style="font-size:48px;font-weight:900;color:${col};text-shadow:0 0 24px ${col}88;line-height:1;">${pct}%</div>
      <div style="font-size:12px;color:var(--muted);margin-top:2px;">avg score · ${fullCorrect} fully correct / ${total}</div>
      <div style="margin-top:12px;font-size:18px;">${emoji}</div>
      <div style="font-size:14px;font-weight:700;color:${col};margin-top:2px;">${label}</div>
      <div style="height:5px;background:var(--border2);border-radius:3px;margin-top:14px;overflow:hidden;">
        <div style="height:100%;--target-w:${pct}%;width:var(--target-w);background:${col};box-shadow:0 0 8px ${col};border-radius:3px;animation:barGrow 1s .3s ease both;"></div>
      </div></div>`;
  }

  if (type === 'explainer') {
    const text = q.postReveal?.explainerText || '';
    return `<div style="background:rgba(108,99,255,0.1);border:1px solid rgba(108,99,255,0.3);border-radius:10px;padding:14px 16px;">
      <div style="font-size:11px;font-weight:700;color:#a78bfa;letter-spacing:.06em;margin-bottom:8px;">💡 DID YOU KNOW?</div>
      <div style="font-size:13px;line-height:1.6;color:var(--text);">${escapeHtml(text)||'<em style="color:var(--muted)">No explainer text set.</em>'}</div></div>`;
  }
  return '';
}

// Shared donut / pie builder — mirrors the same function in presenter.html. A lone
// 100% segment is drawn as a <circle> (SVG can't arc a full circle), and BOTH charts
// use one 0–42 viewBox so the geometry can't drift off-canvas. (The old pie used
// cx=50,r=45 inside a 0–42 box, so it rendered almost entirely outside the frame.)
function donutPieChartHTML(mode, counts, total, correct, revealed, opts) {
  opts = opts || {};
  const palette = opts.palette || PS_COLORS;
  const options = opts.options || (curQ && curQ.options) || [];
  const sizePx  = opts.size || 150;
  const r0 = mode === 'donut' ? 15 : 18;
  const sw = mode === 'donut' ? 9  : 0;
  const cx = 21, cy = 21;
  const colOf = i => (revealed && correct.includes(i)) ? '#43e97b' : palette[i % palette.length];
  const withVotes = counts.filter(c => c.count > 0);
  let segs = '';
  if (withVotes.length === 1) {
    const { i } = withVotes[0];
    segs = mode === 'donut'
      ? `<circle cx="${cx}" cy="${cy}" r="${r0}" fill="none" stroke="${colOf(i)}" stroke-width="${sw}"/>`
      : `<circle cx="${cx}" cy="${cy}" r="${r0}" fill="${colOf(i)}"/>`;
  } else if (withVotes.length > 1) {
    let cum = 0;
    segs = withVotes.map(({ i, count }) => {
      const frac = total > 0 ? count / total : 0;
      const start = cum; cum += frac;
      const a0 = start * 2 * Math.PI - Math.PI / 2;
      const a1 = cum   * 2 * Math.PI - Math.PI / 2;
      const large = frac > 0.5 ? 1 : 0;
      const x0 = cx + r0 * Math.cos(a0), y0 = cy + r0 * Math.sin(a0);
      const x1 = cx + r0 * Math.cos(a1), y1 = cy + r0 * Math.sin(a1);
      return mode === 'donut'
        ? `<path d="M ${x0.toFixed(3)} ${y0.toFixed(3)} A ${r0} ${r0} 0 ${large} 1 ${x1.toFixed(3)} ${y1.toFixed(3)}" fill="none" stroke="${colOf(i)}" stroke-width="${sw}" stroke-linecap="butt"/>`
        : `<path d="M ${cx} ${cy} L ${x0.toFixed(3)} ${y0.toFixed(3)} A ${r0} ${r0} 0 ${large} 1 ${x1.toFixed(3)} ${y1.toFixed(3)} Z" fill="${colOf(i)}"/>`;
    }).join('');
  } else {
    segs = mode === 'donut'
      ? `<circle cx="${cx}" cy="${cy}" r="${r0}" fill="none" stroke="var(--bar-bg)" stroke-width="${sw}"/>`
      : `<circle cx="${cx}" cy="${cy}" r="${r0}" style="fill:var(--bar-bg)"/>`;
  }
  const legend = counts.map(({ i, count }) => `
    <div style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px;">
      <span style="width:10px;height:10px;border-radius:${mode==='donut'?'50%':'2px'};background:${colOf(i)};box-shadow:0 0 6px ${colOf(i)};flex-shrink:0;"></span>
      <span style="flex:1;">${letters[i]}. ${escapeHtml((options[i]||{}).text||'')}</span>
      <span style="font-family:'Syne',sans-serif;font-weight:700;">${total>0?Math.round(count/total*100):0}%</span>
    </div>`).join('');
  return `<div style="display:flex;justify-content:center;margin-bottom:14px;">
    <svg viewBox="0 0 42 42" style="width:${sizePx}px;height:${sizePx}px;filter:drop-shadow(0 0 6px rgba(108,99,255,0.3));">${segs}</svg></div>${legend}`;
}

function renderResults() {
  const area = document.getElementById('resultsArea');
  if (!area || !curQ) return;

  // Post-reveal phase: replace chart with post-reveal content.
  // The presenter ONLY moves currentQuestion to phase:'post_reveal' when post-reveal
  // is enabled (the timer/button don't exist otherwise), so we honor that decision
  // unconditionally — never gating on postReveal.enabled surviving the data round-trip.
  // This mirrors present mode, which simply checks its local postRevealPhase flag.
  const inPostReveal = presentPhase === 'post_reveal' || curQ?.phase === 'post_reveal';
  if (inPostReveal) {
    const pr = (curQ.postReveal && typeof curQ.postReveal === 'object') ? curQ.postReveal : { type: 'leaderboard' };
    const label = {leaderboard:'Leaderboard',podium:'Podium',scorecard:'Score Card',explainer:'Explainer'}[pr.type] || 'Post-Reveal';
    const qForPR = Object.assign({}, curQ, { postReveal: pr });
    area.innerHTML = `<div style="animation:fadeInScale .4s ease;" class="resp-big">${responses.length} <span>responses · ${label}</span></div>${buildPostRevealContent(qForPR, responses)}`;
    requestFitToContent();
    return;
  }

  const total = responses.length;
  const isChoice = curQ.type === 'multiple_choice' || curQ.type === 'multiple_choice_multi';
  const waiting = '<div style="color:var(--muted);font-size:13px;padding:8px 0;">Waiting for responses…</div>';

  // ── Free text ──────────────────────────────────────────────────────────────
  if (curQ.type === 'free_text') {
    if (viewMode === 'word_cloud' && total > 0) {
      const wc = buildWordCloud(responses.map(r => safeAnswer(r.answer)).join(' '));
      area.innerHTML = `<div class="resp-big">${total} <span>response${total!==1?'s':''}</span></div>${wc}`;
    } else {
      area.innerHTML = `<div class="resp-big">${total} <span>response${total!==1?'s':''}</span></div>` +
        (total===0 ? waiting : responses.map(r =>
          `<div class="txt-resp">${escapeHtml(safeAnswer(r.answer))}<div class="from">— ${escapeHtml(r.name && r.name.trim() ? r.name : 'Anonymous')}</div></div>`
        ).join(''));
    }
    requestFitToContent(); return;
  }

  // ── Rating ─────────────────────────────────────────────────────────────────
  if (curQ.type === 'rating') {
    const max = curQ.ratingMax || 5;
    const counts = {};
    for (let i=1;i<=max;i++) counts[i]=0;
    responses.forEach(r=>{ try{const v=JSON.parse(r.answer);if(v)counts[v]=(counts[v]||0)+1;}catch(e){} });
    const avg = total>0 ? (Object.entries(counts).reduce((s,[k,v])=>s+(+k*v),0)/total).toFixed(1) : '—';
    area.innerHTML = `<div class="resp-big">${total} <span>responses · avg ${avg} ★</span></div>` +
      Object.entries(counts).map(([val,cnt])=>{
        const p = total>0?Math.round(cnt/total*100):0;
        return `<div class="bar-wrap" style="border-color:#f7b73144;box-shadow:0 0 10px #f7b73118;">
          <div class="bar-fill-bg" style="background:#f7b731;width:${p}%;"></div>
          <div class="bar-glow" style="background:#f7b731;box-shadow:0 0 8px #f7b731;width:${p}%;"></div>
          <div class="bar-inner">
            <span class="bar-letter" style="background:#f7b73122;border:1.5px solid #f7b731;color:#f7b731;box-shadow:0 0 6px #f7b73166;">★${val}</span>
            <span class="bar-opt-text"></span>
            <span class="bar-opt-count" style="color:#f7b731;">${cnt}</span>
          </div>
        </div>`;
      }).join('');
    requestFitToContent(); return;
  }

  if (!isChoice) { requestFitToContent(); return; }

  // ── Choice: counts ─────────────────────────────────────────────────────────
  const _ca = curQ.correctAnswer;
  const hasC = _ca !== undefined && _ca !== null && _ca !== '' && !(Array.isArray(_ca)&&_ca.length===0);
  const correct = hasC ? (Array.isArray(_ca)?_ca:[_ca]).map(Number) : [];
  const counts = (curQ.options||[]).map((_,i)=>({i,count:0}));
  responses.forEach(r=>{ try{const a=JSON.parse(r.answer);(Array.isArray(a)?a:[a]).forEach(v=>{if(counts[v])counts[v].count++;});}catch(e){} });
  const pct = c => total>0?Math.round(c/total*100):0;

  let inner = '';

  // ── Word Cloud ─────────────────────────────────────────────────────────────
  if (viewMode === 'word_cloud') {
    const wordCounts = {};
    (curQ.options||[]).forEach((opt,i) => { wordCounts[opt.text||('Option '+(i+1))] = 0; });
    responses.forEach(r=>{ try{const a=JSON.parse(r.answer);(Array.isArray(a)?a:[a]).forEach(v=>{
      const t=(curQ.options[v]||{}).text||''; if(t) wordCounts[t]=(wordCounts[t]||0)+1;
    });}catch(e){} });
    const words = Object.entries(wordCounts).filter(([,c])=>c>0).sort((a,b)=>b[1]-a[1]);
    if (!words.length) {
      area.innerHTML = `<div class="resp-big">${total} <span>response${total!==1?'s':''}</span></div>${waiting}`;
    } else {
      const max=words[0][1], min=words[words.length-1][1];
      inner = `<div class="word-cloud">${words.map(([w,c],idx)=>{
        const sz = max===min ? 20 : Math.round(12+(c-min)/(max-min)*26);
        const col = PS_COLORS[idx % PS_COLORS.length];
        const rot = (Math.random()*8-4).toFixed(1);
        return `<span style="font-size:${sz}px;color:${col};transform:rotate(${rot}deg);" title="${c}">${escapeHtml(w)}</span>`;
      }).join('')}</div>`;
      area.innerHTML = `<div class="resp-big">${total} <span>response${total!==1?'s':''}</span></div>${inner}`;
    }
    requestFitToContent(); return;
  }

  // ── Leaderboard ────────────────────────────────────────────────────────────
  if (viewMode === 'leaderboard') {
    const sorted = [...responses].sort((a,b)=>{
      const sa=a.isCorrect===true?1:(typeof a.isCorrect==='number'?a.isCorrect:0);
      const sb=b.isCorrect===true?1:(typeof b.isCorrect==='number'?b.isCorrect:0);
      if(sb!==sa) return sb-sa;
      return (a.elapsed||999999)-(b.elapsed||999999);
    });
    const medals=['🥇','🥈','🥉'];
    inner = sorted.map((r,rank)=>{
      const _ls=r.isCorrect===true?1:(typeof r.isCorrect==='number'?r.isCorrect:r.isCorrect===false?-1:null);
      const _lc=_ls===1?'var(--accent3)':_ls===-1?'var(--accent2)':_ls!==null?'#f7b731':'var(--muted)';
      const _lt=_ls===1?'✓':_ls===-1?'✗':_ls!==null?Math.round(_ls*100)+'%':'·';
      const score = revealed
        ? `<span class="p-score" style="color:${_lc}">${_lt}</span>`
        : `<span class="p-score" style="color:var(--accent3)">●</span>`;
      const speed = (revealed&&r.elapsed)?`<span style="font-size:10px;color:var(--muted);margin-left:6px;">${(r.elapsed/1000).toFixed(1)}s</span>`:'';
      return `<div class="p-row"><span class="p-rank">${revealed?(rank<3?medals[rank]:'#'+(rank+1)):'•'}</span><span class="p-name">${escapeHtml(r.name && r.name.trim() ? r.name : 'Player '+(rank+1))}${speed}</span>${score}</div>`;
    }).join('') || waiting;

  // ── Numbers ────────────────────────────────────────────────────────────────
  } else if (viewMode === 'number') {
    inner = counts.map(({i,count})=>{
      const color = (revealed&&correct.includes(i)) ? '#43e97b' : PS_COLORS[i%PS_COLORS.length];
      return `<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
        <div style="font-family:'Syne',sans-serif;font-weight:900;font-size:28px;color:${color};min-width:48px;text-shadow:0 0 12px ${color}88;">${count}</div>
        <div><div style="font-size:13px;font-weight:600;">${letters[i]}. ${escapeHtml((curQ.options[i]||{}).text||'')}</div>
        <div style="font-size:11px;color:var(--muted);">${pct(count)}%</div></div>
      </div>`;
    }).join('');

  // ── Donut ──────────────────────────────────────────────────────────────────
  } else if (viewMode === 'donut') {
    inner = donutPieChartHTML('donut', counts, total, correct, revealed, { palette: PS_COLORS, options: curQ.options });

  // ── Column chart (vertical bars) ──────────────────────────────────────────
  } else if (viewMode === 'column') {
    const maxCount = Math.max(...counts.map(c=>c.count), 1);
    // Three separate rows so bars always share a common baseline regardless of text length
    const letterRow = counts.map(({i})=>{
      const showCorrect = revealed && correct.includes(i);
      const color = showCorrect ? '#43e97b' : PS_COLORS[i%PS_COLORS.length];
      return `<div style="flex:1;min-width:0;display:flex;justify-content:center;">
        <div style="width:22px;height:22px;border-radius:50%;background:${color}22;border:1.5px solid ${color};color:${color};font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 6px ${color}55;">${letters[i]}</div>
      </div>`;
    }).join('');
    const barRow = counts.map(({i,count})=>{
      const showCorrect = revealed && correct.includes(i);
      const color = showCorrect ? '#43e97b' : PS_COLORS[i%PS_COLORS.length];
      const heightPct = Math.round(count/maxCount*100);
      return `<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;">
        <div style="font-size:11px;color:${color};font-weight:700;margin-bottom:3px;">${count}</div>
        <div style="width:85%;height:${heightPct}%;min-height:4px;background:linear-gradient(180deg,${color}ff,${color}99);border-radius:6px 6px 0 0;box-shadow:0 0 12px ${color}88;"></div>
      </div>`;
    }).join('');
    const textRow = counts.map(({i})=>{
      const opt = curQ.options[i] || {};
      return `<div style="flex:1;min-width:0;font-size:9px;color:var(--muted);text-align:center;padding:4px 2px;word-break:break-word;line-height:1.3;">${escapeHtml(opt.text||'')}</div>`;
    }).join('');
    inner = `<div style="display:flex;flex-direction:column;gap:0;">
      <div style="display:flex;gap:4px;padding:0 2px;margin-bottom:4px;">${letterRow}</div>
      <div style="display:flex;align-items:flex-end;gap:4px;height:110px;padding:0 2px;border-bottom:1px solid var(--border);">${barRow}</div>
      <div style="display:flex;gap:4px;padding:0 2px;margin-top:4px;">${textRow}</div>
    </div>`;

  // ── Pie chart ──────────────────────────────────────────────────────────────
  } else if (viewMode === 'pie') {
    inner = donutPieChartHTML('pie', counts, total, correct, revealed, { palette: PS_COLORS, options: curQ.options });

  // ── Neon Glass Bars (default) ──────────────────────────────────────────────
  } else {
    inner = counts.map(({i,count})=>{
      const opt = curQ.options[i] || {};
      const showCorrect = revealed && correct.includes(i);
      const isWrong    = revealed && correct.length > 0 && !showCorrect;
      const color = showCorrect ? '#43e97b' : PS_COLORS[i%PS_COLORS.length];
      const p = pct(count);
      const imgHtml = opt.img ? `<img src="${escapeHtml(opt.img)}" class="bar-opt-img" onerror="this.style.display='none'">` : '';

      // Correct: bright full-border glow + stronger fill + "✓ Correct" pill
      // Wrong after reveal: visually dimmed so correct answer stands out clearly
      const wrapStyle = showCorrect
        ? `border-color:#43e97bcc;box-shadow:0 0 22px #43e97b55,inset 0 0 40px #43e97b0a;background:rgba(67,233,123,0.09);`
        : isWrong
        ? `border-color:${color}18;box-shadow:none;opacity:0.38;`
        : `border-color:${color}44;box-shadow:0 0 12px ${color}18;`;
      const fillOpacity = showCorrect ? '0.22' : '0.10';
      const glowExtra  = showCorrect ? `height:4px;box-shadow:0 0 14px #43e97b,0 0 28px #43e97b66;` : '';
      const letterStyle = showCorrect
        ? `background:#43e97b33;border:2px solid #43e97b;color:#43e97b;box-shadow:0 0 14px #43e97b99;font-size:13px;`
        : `background:${color}22;border:1.5px solid ${color};color:${color};box-shadow:0 0 6px ${color}55;`;
      const correctPill = showCorrect
        ? `<span style="font-size:11px;font-weight:800;color:#43e97b;background:rgba(67,233,123,0.18);border:1px solid #43e97b77;padding:2px 9px;border-radius:100px;white-space:nowrap;flex-shrink:0;">✓ Correct</span>`
        : '';

      return `<div class="bar-wrap" style="${wrapStyle}">
        <div class="bar-fill-bg" style="background:${color};width:${p}%;opacity:${fillOpacity};"></div>
        <div class="bar-glow" style="background:${color};box-shadow:0 0 8px ${color};width:${p}%;${glowExtra}"></div>
        <div class="bar-inner">
          <span class="bar-letter" style="${letterStyle}">${letters[i]}</span>
          ${imgHtml}
          <span class="bar-opt-text">${escapeHtml(opt.text||'')}</span>
          ${correctPill}
          <span class="bar-opt-count" style="color:${color};text-shadow:0 0 8px ${color}88;">${count}</span>
        </div>
      </div>`;
    }).join('');
  }

  // Feature 5 — Response velocity indicator (only when live, not revealed)
  let velChip = '';
  if (!revealed) {
    const now = Date.now();
    _recentResponses = _recentResponses.filter(t => now - t < 10000);
    const velocity = _recentResponses.length;
    velChip = velocity >= 3 ? `<div style="font-size:11px;color:#f7b731;margin-bottom:8px;">🔥 ${velocity} responses in 10s</div>` : '';
  }

  // Feature 1 — Smart insight chip after reveal (choice questions with correct answer)
  let insightChip = '';
  if (revealed && correct.length > 0 && total > 0 && presentPhase !== 'post_reveal') {
    // Count PARTICIPANTS who got it fully right (isCorrect === true) — never option picks.
    // On a multi-select with 2 correct answers, picking only 1 earns partial credit
    // (0 < isCorrect < 1), which is NOT "got it right". Summing option-pick counts used
    // to mark those partial answers as correct — the bug this fixes.
    const fullyCorrect = responses.filter(r => r.isCorrect === true).length;
    const pctVal = Math.round(fullyCorrect / total * 100);
    const [emoji, msg, col] = pctVal >= 80 ? ['🎉','Most got it right!','#43e97b'] : pctVal >= 50 ? ['👏','Over half correct!','#6c63ff'] : pctVal >= 25 ? ['🤔','Tricky one!','#f7b731'] : ['😅','Tough crowd!','#ff6584'];
    insightChip = `<div style="display:flex;align-items:center;gap:7px;background:${col}18;border:1px solid ${col}44;border-radius:10px;padding:7px 12px;margin-bottom:12px;font-size:12px;font-weight:700;color:${col};">${emoji} ${msg} <span style="margin-left:auto;font-family:Syne,sans-serif;font-size:13px;">${pctVal}% correct</span></div>`;
  }

  area.innerHTML = `<div class="resp-big">${total} <span>response${total!==1?'s':''}</span></div>${velChip}${insightChip}${inner||waiting}`;
  requestFitToContent();
}

function buildWordCloud(text) {
  const wordCounts = {};
  text.toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/).forEach(w=>{
    if (w.length > 2 && !STOP_WORDS.has(w)) wordCounts[w]=(wordCounts[w]||0)+1;
  });
  const words = Object.entries(wordCounts).filter(([,c])=>c>0).sort((a,b)=>b[1]-a[1]).slice(0,40);
  if (!words.length) return '<div style="color:var(--muted);font-size:13px;">Waiting for responses…</div>';
  const max=words[0][1], min=words[words.length-1][1];
  return `<div class="word-cloud">${words.map(([w,c],i)=>{
    const sz = max===min ? 20 : Math.round(12+(c-min)/(max-min)*26);
    const col = PS_COLORS[i%PS_COLORS.length];
    const rot = (Math.random()*8-4).toFixed(1);
    return `<span style="font-size:${sz}px;color:${col};transform:rotate(${rot}deg);" title="${c}">${escapeHtml(w)}</span>`;
  }).join('')}</div>`;
}

function safeAnswer(a) {
  if (a === '__none__') return 'No answer';
  try { const v = JSON.parse(a); return typeof v === 'string' ? v : a; } catch(e) { return a; }
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// React instantly when the Mac app updates the hash (new QR detected)
window.addEventListener('hashchange', () => {
  const next = parseHash();
  if (next.userId !== userId) { userId = next.userId; location.reload(); return; }
  targetSession = next.targetSession;
  targetQIndex = next.targetQIndex;
  if (targetSession && targetQIndex !== null) {
    showTargetedQuestion(targetSession, targetQIndex);
  } else {
    watchMacLink();
  }
});
</script>
