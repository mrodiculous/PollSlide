<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PollSlide — Reports</title>
<!--
  PollSlide Reports — dedicated, filterable metrics page (/report).

  WHAT: per-presentation, per-question, and per-respondent metrics — who answered,
  what they answered, accuracy, timing — across LIVE sessions and dated ARCHIVES.

  DESIGN / SCALABILITY:
   • Everything is flattened into one records[] array (one row per answer). Filters
     and all three views are simple array ops over it → cheap to extend.
   • Pulls live `sessions/$code/responses` AND `users/$uid/archives` (dated), so
     date filtering and post-reset history both work. Reuses the exact data shapes
     from presenter.html (verified).
   • Harness-testable: window.__REPORT_FIXTURE injects {presentations,live,archives}
     so views/filters run without Firebase.
-->
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/errors.js?v=1"></script>
<script src="/qid.js?v=1"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
  :root{ --bg:#07070f; --surface:#13131f; --surface2:#1a1a2c; --surface3:#22223a;
    --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.14);
    --accent:#6c63ff; --accent2:#ff6584; --accent3:#43e97b; --accent4:#f7b731;
    --text:#f4f4fc; --muted:#9090b8; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1200px;margin:0 auto;padding:18px;}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .logo{font-family:'Syne';font-weight:800;font-size:19px;display:flex;align-items:center;gap:8px;flex:1;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:9px;font-family:'Syne';font-weight:700;font-size:12px;border:none;cursor:pointer;}
  .btn-primary{background:var(--accent);color:#fff;} .btn-ghost{background:var(--surface2);border:1px solid var(--border2);color:var(--text);}
  .btn:disabled{opacity:.4;cursor:default;}
  select,input{background:var(--surface2);color:var(--text);border:1px solid var(--border2);border-radius:8px;padding:8px 10px;font-size:13px;font-family:'DM Sans';}
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px;}
  .fld{display:flex;flex-direction:column;gap:4px;}
  .fld label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .stat{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:12px 16px;min-width:120px;}
  .stat .v{font-family:'Syne';font-weight:800;font-size:24px;}
  .stat .l{font-size:11px;color:var(--muted);margin-top:2px;}
  .tabs{display:flex;gap:6px;margin-bottom:12px;}
  .tab{padding:8px 14px;border-radius:9px;background:var(--surface2);border:1px solid var(--border2);cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);}
  .tab.active{color:var(--text);border-color:var(--accent);background:rgba(108,99,255,.1);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
  .card h3{font-family:'Syne';font-size:14px;margin-bottom:8px;}
  .bar{margin-bottom:8px;} .bar-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;}
  .bar-track{height:8px;background:var(--surface2);border-radius:100px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--accent),#a78bfa);}
  .bar-fill.correct{background:linear-gradient(90deg,var(--accent3),#6effb0);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--border);}
  th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;}
  tr:hover td{background:var(--surface2);}
  .pill{font-size:10px;font-weight:700;padding:1px 7px;border-radius:100px;}
  .pill.ok{background:rgba(67,233,123,.16);color:var(--accent3);} .pill.no{background:rgba(255,101,132,.16);color:var(--accent2);}
  .muted{color:var(--muted);} .empty{color:var(--muted);text-align:center;padding:36px;}
  .overlay{position:fixed;inset:0;background:rgba(7,7,15,.92);z-index:1500;display:flex;align-items:center;justify-content:center;}
  @media print{ .filters,.tabs,.topbar .btn,#authOverlay{display:none!important;} body{background:#fff;color:#000;} }
  /* Accessibility (WCAG 2.1 AA): keyboard focus visibility + reduced motion */
  :focus-visible { outline:3px solid var(--accent,#6c63ff); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important; }
  }
</style>

<div class="wrap">
  <div class="topbar">
    <div class="logo">
      <svg viewBox="0 0 100 100" width="24" height="24" style="border-radius:7px;"><rect width="100" height="100" rx="22" fill="#0d0d18"/><rect x="18" y="58" width="16" height="24" rx="4" fill="#ff6584"/><rect x="42" y="42" width="16" height="40" rx="4" fill="#f7b731"/><rect x="66" y="22" width="16" height="60" rx="4" fill="#6c63ff"/></svg>
      PollSlide Reports
    </div>
    <span id="acct" class="muted" style="font-size:12px;"></span>

  <div class="card" style="width:min(380px,92vw);">
    <h3>Sign in to PollSlide</h3>

<script>
/* ─── Firebase (same project + paths as presenter.html) ──────────────────────── */
const FB_CONFIG = { apiKey:"AIzaSyBPncI0e-LlIgLvTcq76O1Kdq2jXJ6DiME", authDomain:"echonest-live-survey.firebaseapp.com",
  databaseURL:"https://echonest-live-survey-default-rtdb.firebaseio.com", projectId:"echonest-live-survey",
  storageBucket:"echonest-live-survey.firebasestorage.app", messagingSenderId:"285529140046", appId:"1:285529140046:web:983c1ee8000a2ca8f80c1f" };
let fbAuth=null, fbDb=null, userId=null;
let RECORDS = [];           // one row per answer (flattened — see buildRecords)
let PRES = {};              // presId -> { name, questions[] } (for the question filter)
let view = 'summary';

function qArr(q){ return Array.isArray(q)?q.filter(Boolean):(q&&typeof q==='object'?Object.values(q).filter(Boolean):[]); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function el(id){ return document.getElementById(id); }

// Decode a raw answer into human text using the question's options.
function answerText(q, raw){
  if (raw === '__none__' || raw == null) return '—';
  try { const p = JSON.parse(raw);
    if (Array.isArray(p)) return p.map(i => (q.options && q.options[i] && q.options[i].text) || i).join(', ');
    if (typeof p === 'number') return (q.options && q.options[p] && q.options[p].text) || String(p);
    return String(p);
  } catch(e){ return String(raw); }
}

/* ─── Flatten everything into records[] (one row per answer) ───────────────────
   record = { presId, presName, date(ms|null), source, qIdx, qText, qType, options,
              correctAnswer, pid, name, answer, isCorrect, elapsed } */
function pushDataset(out, presId, presName, source, date, questions, responses){
  // responses is { bucketKey: { pid: resp } }. Legacy buckets encode the question's
  // original index (`q<idx>_stable_<code>`); buckets for questions created after
  // stable ids shipped do not. Match by the question's own bucket first and only fall
  // back to parsing an index out of the key — see qid.js.
  // Map each question to its bucket by its OWN id (bucket = `<id>_<sessionCode>`),
  // so a question created after stable ids shipped is still found. The old code
  // required the key to encode an index and returned early otherwise — which would
  // have dropped those responses from every report without a word.
  const _qs = qArr(questions);
  const _byId = {};
  _qs.forEach((q, i) => { if (q && q.id) _byId[q.id] = i; });
  Object.entries(responses||{}).forEach(([qId, byPid]) => {
    let qIdx = null;
    for (const id in _byId) { if (qId.indexOf(id + '_') === 0) { qIdx = _byId[id]; break; } }
    if (qIdx === null) { const m = /^q(\d+)_stable_/.exec(qId); if (m) qIdx = +m[1]; }
    if (qIdx === null) return;
    const q = _qs[qIdx] || { text:'', type:'', options:null, correctAnswer:null };
    Object.entries(byPid||{}).forEach(([pid, r]) => {
      out.push({ presId, presName, source, date: r.submittedAt || date || null,
        qIdx, qText:q.text||'', qType:q.type||'', options:q.options||null, correctAnswer:(q.correctAnswer!=null?q.correctAnswer:null),
        pid: r.participantId || pid, name: r.name || 'Anonymous', team: r.team || null, wager: r.wager || null, answer: r.answer, isCorrect: r.isCorrect, elapsed: r.elapsed||0,
        // Present only when the teacher turned screen-leaving on for that deck.
        // undefined must stay distinguishable from 0 — "not watched" is not the same
        // claim as "watched and never left", and blurring the two would let a teacher
        // accuse someone on the strength of a missing field.
        leftScreen: r.leftScreen, awayMs: r.awayMs });
    });
  });
}

async function loadAll(){
  el('loadingMsg').textContent = 'Loading…';
  const out = []; PRES = {};
  const fx = window.__REPORT_FIXTURE;
  if (fx){
    (fx.presentations||[]).forEach(p => { PRES[p.id]={name:p.name,questions:qArr(p.questions)};
      pushDataset(out, p.id, p.name, 'live', null, p.questions, (fx.live&&fx.live[p.id])||{}); });
    Object.entries(fx.archives||{}).forEach(([presId, byTs]) => Object.entries(byTs).forEach(([ts,a]) => {
      if(!PRES[presId]) PRES[presId]={name:a.name,questions:qArr(a.questions)};
      pushDataset(out, presId, a.name, 'archive', a.archivedAt||+ts, a.questions, a.responses); }));
  } else {
    // Presentations + their live responses
    let presList = {};
    try { const s = await fbDb.ref('users/'+userId+'/presentations').get(); presList = s.exists()?(s.val()||{}):{}; } catch(e){}
    for (const p of Object.values(presList)){
      PRES[p.id] = { name:p.name||'Untitled', questions:qArr(p.questions), sessionCode:p.sessionCode||null };
      if (!p.sessionCode) continue;
      let live = {}; try { const s = await fbDb.ref('sessions/'+p.sessionCode+'/responses').get(); live = s.exists()?(s.val()||{}):{}; } catch(e){}
      pushDataset(out, p.id, p.name||'Untitled', 'live', null, p.questions, live);
    }
    // Dated archives
    let arch = {}; try { const s = await fbDb.ref('users/'+userId+'/archives').get(); arch = s.exists()?(s.val()||{}):{}; } catch(e){}
    Object.entries(arch).forEach(([presId, byTs]) => Object.entries(byTs).forEach(([ts,a]) => {
      if(!PRES[presId]) PRES[presId]={name:a.name||'Untitled',questions:qArr(a.questions)};
      pushDataset(out, presId, a.name||'Untitled', 'archive', a.archivedAt||+ts, a.questions, a.responses||{}); }));
  }
  RECORDS = out;
  populateFilters();
  // Deep-link: /report?pres=<presId> preselects that presentation (from the builder).
  const pre = new URLSearchParams(location.search).get('pres');
  if (pre && PRES[pre]) { el('fPres').value = pre; onPresChange(); }
  el('csvBtn').disabled = RECORDS.length===0;
  const _rb = el('recapBtn'); if (_rb) _rb.disabled = RECORDS.length===0;
  render();
}

function populateFilters(){
  const sel = el('fPres'); const cur = sel.value;
  const presIds = [...new Set(RECORDS.map(r=>r.presId))];
  sel.innerHTML = '<option value="">All presentations</option>' +
    presIds.map(id=>`<option value="${esc(id)}">${esc((PRES[id]&&PRES[id].name)||id)}</option>`).join('');
  if (presIds.includes(cur)) sel.value = cur;
  onPresChange(true);
}
function onPresChange(keep){
  const presId = el('fPres').value; const qsel = el('fQ');
  let opts = '<option value="">All questions</option>';
  if (presId && PRES[presId]) opts += PRES[presId].questions.map((q,i)=>`<option value="${i}">Q${i+1}: ${esc(String(q.text||q.front||'Untitled').slice(0,50))}</option>`).join('');
  qsel.innerHTML = opts;
  if (!keep) render(); else render();
}

/* ─── Filtering ────────────────────────────────────────────────────────────── */
function filtered(){
  const presId=el('fPres').value, q=el('fQ').value, resp=el('fResp').value.trim().toLowerCase(),
        from=el('fFrom').value?new Date(el('fFrom').value).getTime():null,
        to=el('fTo').value?new Date(el('fTo').value).getTime()+86400000:null, src=el('fSrc').value;
  return RECORDS.filter(r=>{
    if (presId && r.presId!==presId) return false;
    if (q!=='' && String(r.qIdx)!==q) return false;
    if (resp && !(r.name||'').toLowerCase().includes(resp)) return false;
    if (src && r.source!==src) return false;
    if (from && (!r.date || r.date<from)) return false;
    if (to && (!r.date || r.date>=to)) return false;
    return true;
  });
}

/* ─── Views ────────────────────────────────────────────────────────────────── */
function setView(v){ view=v; ['summary','question','respondent'].forEach(t=>el('tab-'+t).classList.toggle('active',t===v)); render(); }
function render(){
  if (!userId && !window.__REPORT_FIXTURE){ return; }
  const data = filtered();
  renderStats(data);
  el('content').innerHTML = data.length===0 ? '<div class="empty">No responses match these filters.</div>'
    : view==='summary' ? renderSummary(data) : view==='question' ? renderByQuestion(data) : renderByRespondent(data);
}
function renderStats(data){
  const people = new Set(data.map(r=>r.pid)).size;
  const graded = data.filter(r=>r.isCorrect===true||r.isCorrect===false);
  const acc = graded.length ? Math.round(data.filter(r=>r.isCorrect===true).length/graded.length*100)+'%' : '—';
  const times = data.filter(r=>r.elapsed>0).map(r=>r.elapsed);
  const avg = times.length ? (times.reduce((a,b)=>a+b,0)/times.length/1000).toFixed(1)+'s' : '—';
  const engagement = people ? (data.length/people).toFixed(1) : '—';
  const stat=(v,l)=>`<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  el('stats').innerHTML = stat(people,'Respondents')+stat(data.length,'Responses')+stat(new Set(data.map(r=>r.presId+'/'+r.qIdx)).size,'Questions')+stat(engagement,'Answers/person')+stat(acc,'Accuracy')+stat(avg,'Avg time');
}
function renderSummary(data){
  const byPres = {};
  data.forEach(r=>{ (byPres[r.presId]=byPres[r.presId]||{name:r.presName,recs:[]}).recs.push(r); });
  return Object.values(byPres).map(p=>{
    const people=new Set(p.recs.map(r=>r.pid)).size;
    const graded=p.recs.filter(r=>r.isCorrect===true||r.isCorrect===false);
    const acc=graded.length?Math.round(p.recs.filter(r=>r.isCorrect===true).length/graded.length*100)+'%':'—';
    const qn=new Set(p.recs.map(r=>r.qIdx)).size;
    return `<div class="card"><h3>${esc(p.name)}</h3>
      <div class="muted" style="font-size:12px;">${people} respondents · ${p.recs.length} responses · ${qn} questions · accuracy ${acc}</div></div>`;
  }).join('');
}
function renderByQuestion(data){
  const groups={};
  data.forEach(r=>{ const k=r.presId+'/'+r.qIdx; (groups[k]=groups[k]||{r0:r,recs:[]}).recs.push(r); });
  return Object.values(groups).sort((a,b)=>a.r0.qIdx-b.r0.qIdx).map((g,gi)=>{
    const q=g.r0; const total=g.recs.length;
    let body='';
    // Free-text / word-cloud questions: offer AI Insights (themes + mood) over the answers.
    let insightsUI='';
    if (q.type==='free_text' || !(q.options && q.options.length)){
      const texts=g.recs.map(r=>answerText(q,r.answer)).filter(a=>a && a!=='—');
      if (texts.length>=2){
        window._reportIns=window._reportIns||{};
        window._reportIns[gi]={question:q.qText||'', texts, language:'en'};
        insightsUI=`<button onclick="reportInsights(${gi})" style="display:inline-flex;align-items:center;gap:6px;margin:10px 0 2px;padding:7px 13px;background:linear-gradient(120deg,#6c63ff,#a78bfa);border:none;color:#fff;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;">✨ AI Insights</button><div id="ri_${gi}"></div>`;
      }
    }
    if (q.options && q.options.length){
      const counts=q.options.map(()=>0);
      g.recs.forEach(r=>{ try{ const a=JSON.parse(r.answer); (Array.isArray(a)?a:[a]).forEach(v=>{ if(counts[v]!=null)counts[v]++; }); }catch(e){} });
      const correct=(q.correctAnswer!=null)?(Array.isArray(q.correctAnswer)?q.correctAnswer.map(Number):[Number(q.correctAnswer)]):[];
      body=q.options.map((o,i)=>{ const pct=total?Math.round(counts[i]/total*100):0; const c=correct.includes(i);
        return `<div class="bar"><div class="bar-top"><span>${'ABCDEFGH'[i]}. ${esc(o.text||'')}${c?' ✓':''}</span><span>${counts[i]} (${pct}%)</span></div>
          <div class="bar-track"><div class="bar-fill ${c?'correct':''}" style="width:${pct}%"></div></div></div>`; }).join('');
    }
    const rows=g.recs.slice(0,200).map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(answerText(q,r.answer))}</td>
      <td>${r.isCorrect===true?'<span class="pill ok">✓</span>':r.isCorrect===false?'<span class="pill no">✗</span>':'<span class="muted">·</span>'}</td>
      <td class="muted">${r.elapsed?(r.elapsed/1000).toFixed(1)+'s':'—'}</td>
      <td class="muted">${r.date?new Date(r.date).toLocaleDateString():'—'}</td></tr>`).join('');
    return `<div class="card"><h3>Q${q.qIdx+1}: ${esc(q.qText||'Untitled')} <span class="muted" style="font-weight:400;font-size:12px;">· ${esc(q.presName)} · ${total} responses</span></h3>
      ${body}
      ${insightsUI}
      <table style="margin-top:10px;"><thead><tr><th>Who</th><th>Answered</th><th>Correct</th><th>Time</th><th>Date</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join('');
}

// ===== PS_GAME_MODES_START (kept VERBATIM in live.html — edit both together) =====
// Game modes change ONLY how points are counted and shown. Answering, reveal, timers,
// translation, team play, reports and CSV are all untouched, so any mode works with any
// deck and switching mode never risks the core session.
const GAME_MODES = {
  classic:  { icon:'🎯', name:'Classic',     blurb:'One point per correct answer. You reveal when you\'re ready.',            bestFor:'Any audience — the way it works today' },
  speed:    { icon:'⚡', name:'Speed round', blurb:'Answer faster, score more — up to double points for the quickest.',       bestFor:'Parties and pub quizzes; lifts a flat room' },
  streak:   { icon:'🔥', name:'Streak',      blurb:'Answers in a row build a multiplier up to 3×. One miss resets it.',      bestFor:'Classrooms and training — rewards consistency' },
  survival: { icon:'💀', name:'Survival',    blurb:'One wrong answer and you\'re out. Last one standing wins.',              bestFor:'High drama on the big screen; great final round' },
  wager:    { icon:'🎲', name:'Wager',       blurb:'Bet 1×, 2× or 3× before answering. Get it wrong and it costs you.',      bestFor:'Pub-quiz joker rounds and comeback moments' },
};
const SPEED_WINDOW_MS = 20000;              // answer inside this window to earn a speed bonus
const STREAK_STEP = 0.5, STREAK_MAX = 3;    // 1×, 1.5×, 2×, 2.5×, capped at 3×
const WAGER_CHOICES = [1, 2, 3];

function psModeOk(m) { return Object.prototype.hasOwnProperty.call(GAME_MODES, m) ? m : 'classic'; }
// Credit for one response: 1 for correct, a fraction for partial (multi-select), else 0.
function psBasePoints(r) {
  if (!r) return 0;
  if (r.isCorrect === true) return 1;
  if (typeof r.isCorrect === 'number' && r.isCorrect > 0) return r.isCorrect;
  return 0;
}
// 0..1, linear on how quickly they answered. Unanswered/missing time earns nothing.
function psSpeedBonus(r) {
  const ms = (r && r.elapsed) || 0;
  if (ms <= 0) return 0;
  return Math.max(0, Math.min(1, 1 - ms / SPEED_WINDOW_MS));
}
function psWagerOf(r) {
  const w = parseInt(r && r.wager, 10);
  return (w >= 1 && w <= 3) ? w : 1;   // no wager recorded = risk-free 1×
}

// THE scoring function. Walks every question IN ORDER (streak and survival depend on
// sequence) and returns one row per person. Pure — no DOM, no Firebase — so the presenter,
// the big screen and the recap all derive identical numbers from the same raw responses.
function psStandings(mode, questions, all, code) {
  mode = psModeOk(mode);
  const qs = Array.isArray(questions) ? questions : [];
  const people = {};
  const rowFor = (pid) => people[pid] || (people[pid] = {
    pid, name: 'Anonymous', team: null, score: 0, correct: 0, answered: 0, elapsed: 0,
    streak: 0, bestStreak: 0, alive: true, outAt: null,
  });

  qs.forEach((q, i) => {
    const bucket = (all || {})[PSQid.bucket(q, i, code)] || {};
    Object.entries(bucket).forEach(([pid, r]) => {
      const p = rowFor(pid);
      if (r && r.name) p.name = r.name;
      if (r && r.team) p.team = r.team;
      p.answered += 1;
      p.elapsed += (r && r.elapsed) || 0;
      const base = psBasePoints(r);
      const fullyRight = base >= 1;
      p.correct += base;

      if (mode === 'speed') {
        p.score += base > 0 ? base * (1 + psSpeedBonus(r)) : 0;
      } else if (mode === 'streak') {
        if (fullyRight) {
          p.streak += 1;
          if (p.streak > p.bestStreak) p.bestStreak = p.streak;
          p.score += Math.min(1 + (p.streak - 1) * STREAK_STEP, STREAK_MAX);
        } else {
          p.streak = 0;
          p.score += base;                       // partial credit still counts, flat
        }
      } else if (mode === 'survival') {
        if (!p.alive) return;                    // already knocked out — later answers don't score
        if (fullyRight) p.score += 1;
        else { p.alive = false; p.outAt = i + 1; }
      } else if (mode === 'wager') {
        const w = psWagerOf(r);
        p.score += fullyRight ? base * w : -(w - 1);
        if (p.score < 0) p.score = 0;            // a bad round can't put you in debt
      } else {
        p.score += base;                         // classic
      }
    });
  });

  const rows = Object.values(people);
  // Survival ranks survivors first, then whoever lasted longest. Everything else is
  // score-first with the faster player ahead on a tie.
  rows.sort(mode === 'survival'
    ? (a, b) => (Number(b.alive) - Number(a.alive)) || (b.score - a.score) || (a.elapsed - b.elapsed)
    : (a, b) => (b.score - a.score) || (a.elapsed - b.elapsed));
  return rows;
}

// The moment the room reacts to. Given THIS question's responses, returns the headline
// to slam on screen at reveal — fastest finger, who got knocked out, who bet big and won.
// Returns null for classic (and whenever there's nothing worth shouting about), so the
// classic reveal is completely unchanged. Data only — each screen renders it its own way.
function psModeHeadline(mode, responses) {
  mode = psModeOk(mode);
  if (mode === 'classic') return null;
  const rs = (responses || []).filter(Boolean);
  if (!rs.length) return null;
  const right = rs.filter(r => r.isCorrect === true);

  if (mode === 'speed') {
    const f = right.slice().sort((a, b) => (a.elapsed || 9e9) - (b.elapsed || 9e9))[0];
    if (!f || !f.elapsed) return null;
    return { icon: '⚡', label: 'FASTEST FINGER', name: f.name || 'Player', extra: (f.elapsed / 1000).toFixed(1) + 's', tone: '#38d9f5' };
  }
  if (mode === 'survival') {
    const out = rs.filter(r => r.isCorrect === false).length;
    return { icon: '💀', label: out ? 'KNOCKED OUT' : 'EVERYONE SURVIVES',
             name: out ? (out + (out === 1 ? ' player out' : ' players out')) : 'Nobody went home',
             extra: right.length + ' still standing', tone: '#ff6584' };
  }
  if (mode === 'wager') {
    const bold = right.slice().sort((a, b) => (psWagerOf(b) - psWagerOf(a)) || ((a.elapsed || 0) - (b.elapsed || 0)))[0];
    if (!bold) return { icon: '🎲', label: 'THE HOUSE WINS', name: 'Nobody got it', extra: 'big bets lost', tone: '#a78bfa' };
    const w = psWagerOf(bold);
    return { icon: '🎲', label: w > 1 ? 'BIGGEST CALL' : 'PLAYED IT SAFE', name: bold.name || 'Player',
             extra: w + '× and nailed it', tone: '#a78bfa' };
  }
  if (mode === 'streak') {
    if (!right.length) return { icon: '💔', label: 'STREAKS BROKEN', name: 'Everyone resets', extra: '', tone: '#f7b731' };
    return { icon: '🔥', label: 'STILL ON A ROLL', name: right.length + (right.length === 1 ? ' player' : ' players'), extra: 'kept the streak alive', tone: '#f7b731' };
  }
  return null;
}

// Escalating heat, because a number alone doesn't feel like anything. 3 in a row earns a
// flame, 5 earns two, 7+ earns "ON FIRE" — the visible momentum that makes a streak worth
// protecting (and makes losing it hurt, which is the point).
function psStreakFlair(streak) {
  if (streak >= 7) return '🔥🔥🔥';
  if (streak >= 5) return '🔥🔥';
  if (streak >= 3) return '🔥';
  return '';
}
// Short label for one person's score in a given mode (used on every leaderboard).
function psScoreLabel(mode, p) {
  mode = psModeOk(mode);
  const n = Math.round((p.score || 0) * 10) / 10;
  if (mode === 'survival') return p.alive ? '✅ ' + n : '💀 out';
  if (mode === 'streak' && p.streak > 1) return n + ' ' + (psStreakFlair(p.streak) || '🔥') + p.streak;
  return String(n);
}
// Rank movement between two standings snapshots — the "you just passed three people"
// signal. Social comparison is the strongest engagement lever there is, and it costs
// nothing but remembering last round's order.
function psRankDeltas(prevOrder, rows) {
  const prev = {}; (prevOrder || []).forEach((pid, i) => { prev[pid] = i; });
  return rows.map((p, i) => {
    const was = prev[p.pid];
    return Object.assign({}, p, { delta: (was === undefined) ? null : (was - i) });
  });
}
function psDeltaBadge(delta) {
  if (delta === null || delta === 0) return '';
  return delta > 0
    ? `<span style="color:#43e97b;font-size:10.5px;font-weight:800;margin-left:5px;">▲${delta}</span>`
    : `<span style="color:#ff6584;font-size:10.5px;font-weight:800;margin-left:5px;">▼${Math.abs(delta)}</span>`;
}
// ===== PS_GAME_MODES_END =====

/* ─── 🎁 SHAREABLE SESSION RECAP ─────────────────────────────────────────────
   Turns one session's data into a public page the presenter can send to everyone who
   took part: winner (or winning team), the question that fooled the room, per-question
   highlights, and an optional AI summary of the written answers.
   Design notes:
   • Built from the CURRENTLY FILTERED records, so "which session" is the filter you
     already set — no second concept to learn.
   • Works with NO AI. The summary is a bonus; if Polly is unreachable the recap still
     publishes with every stat intact (see the try/catch around /api/insights).
   • Stored at recaps/<id> with an unguessable id: public READ, owner-only WRITE.
   • Names shown are the display names people already chose for the live session.       */
async function makeRecap(){
  const data = filtered();
  if (!data.length) { alert('No responses in the current filter — pick a presentation first.'); return; }
  const presIds = [...new Set(data.map(r=>r.presId))];
  if (presIds.length > 1) { alert('Choose ONE presentation in the filter above, then build the recap.'); return; }

  const btn = el('recapBtn'); const old = btn.textContent;
  btn.disabled = true; btn.textContent = '🎁 Building…';
  try {
    const presId = presIds[0];
    const title  = (PRES[presId] && PRES[presId].name) || data[0].presName || 'PollSlide session';

    // Score it the way the session was actually RUN. We rebuild the raw
    // sessions/<code>/responses shape from the flattened records and hand it to the very
    // same psStandings() the presenter and big screen use, so a recap can never disagree
    // with what the room saw on the night.
    const code = (PRES[presId] && PRES[presId].sessionCode) || 'x';
    let gameMode = 'classic';
    if (PRES[presId] && PRES[presId].sessionCode) {
      try { const gs = await fbDb.ref('sessions/'+PRES[presId].sessionCode+'/meta/gameMode').get();
            if (gs.exists() && gs.val()) gameMode = psModeOk(String(gs.val())); } catch(e){}
    }
    // This is a synthetic round-trip: flattened records are rebuilt into the raw
    // responses shape purely so psStandings() can score them exactly as the room saw
    // it. The bucket names only have to agree between the two halves — so derive them
    // from the SAME placeholder question objects psStandings will be handed, and they
    // agree by construction rather than by coincidence.
    const maxQ = data.reduce((m,r)=>Math.max(m, r.qIdx), -1);
    const orderedQs = Array.from({length:maxQ+1},()=>({}));
    const rebuilt = {};
    data.forEach(r=>{
      const key = PSQid.bucket(orderedQs[r.qIdx], r.qIdx, code);
      (rebuilt[key] = rebuilt[key] || {})[r.pid] = {
        name:r.name, team:r.team||null, isCorrect:r.isCorrect, elapsed:r.elapsed||0, wager:r.wager||null };
    });
    const people = psStandings(gameMode, orderedQs, rebuilt, code);
    const graded = data.filter(r=>r.isCorrect===true||r.isCorrect===false).length > 0;
    // psStandings already ranks for the mode (survival puts survivors first), so keep
    // its order rather than re-sorting on raw score.
    const leaderboard = people.slice(0,10)
      .map(p=>({ name:p.name, score:Math.round(p.score*10)/10,
                 alive:(gameMode==='survival') ? !!p.alive : null,
                 streak:(gameMode==='streak') ? (p.bestStreak||0) : null }));
    let teams = null;
    if (people.some(p=>p.team)) {
      const g = {};
      people.forEach(p=>{ if(!p.team) return; (g[p.team] = g[p.team] || { name:p.team, n:0, sum:0 }); g[p.team].n++; g[p.team].sum += p.score; });
      teams = Object.values(g).map(t=>({ name:t.name, n:t.n, score:Math.round(t.sum/t.n*10)/10 }))
        .sort((a,b)=>b.score-a.score).slice(0,10);
    }

    // Per-question stats → also finds the toughest question (the crowd-pleaser stat).
    const qGroups = {};
    data.forEach(r=>{ const k=r.qIdx; (qGroups[k] = qGroups[k] || { qIdx:r.qIdx, qText:r.qText, type:r.qType, options:r.options, recs:[] }).recs.push(r); });
    const questions = Object.values(qGroups).sort((a,b)=>a.qIdx-b.qIdx).map(g=>{
      const gradedRecs = g.recs.filter(r=>r.isCorrect===true||r.isCorrect===false);
      const pct = gradedRecs.length ? Math.round(g.recs.filter(r=>r.isCorrect===true).length/gradedRecs.length*100) : null;
      let top = '';
      if (g.options && g.options.length) {
        const counts = g.options.map(()=>0);
        g.recs.forEach(r=>{ try{ const a=JSON.parse(r.answer); (Array.isArray(a)?a:[a]).forEach(v=>{ if(counts[v]!=null)counts[v]++; }); }catch(e){} });
        const bi = counts.indexOf(Math.max(...counts));
        if (bi>=0 && g.options[bi]) top = g.options[bi].text || '';
      }
      return { idx:g.qIdx, text:g.qText||('Question '+(g.qIdx+1)), n:g.recs.length, correctPct:pct, topAnswer:top };
    });
    const scored = questions.filter(q=>q.correctPct!==null);
    const toughest = scored.length ? scored.slice().sort((a,b)=>a.correctPct-b.correctPct)[0] : null;

    // Optional AI flavour — a one-line summary of the written answers. Best-effort ONLY:
    // any failure (including Polly being offline) leaves summary null and the recap
    // publishes regardless. The recap is never blocked on AI.
    let summary = null;
    try {
      const texts = data.filter(r=>{
        const g = qGroups[r.qIdx];
        return g && (!g.options || !g.options.length);
      }).map(r=>answerText({type:'free_text'}, r.answer)).filter(a=>a && a!=='—').slice(0,120);
      if (texts.length >= 3) {
        const token = (fbAuth && fbAuth.currentUser) ? await fbAuth.currentUser.getIdToken().catch(()=>null) : null;
        const rr = await fetch('/api/insights', { method:'POST',
          headers:Object.assign({'Content-Type':'application/json'}, token?{'Authorization':'Bearer '+token}:{}),
          body: JSON.stringify({ question:'Overall session feedback', texts, language:'en' }) });
        const jj = await rr.json().catch(()=>null);
        if (rr.ok && jj && jj.summary) summary = String(jj.summary).slice(0,400);
      }
    } catch(e) { /* recap works fine without AI */ }

    const rid = 'r' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
    const payload = {
      owner: userId, title, at: Date.now(),
      respondents: people.length, responses: data.length,
      graded, leaderboard, teams, questions, toughest, summary, gameMode,
    };
    await fbDb.ref('recaps/'+rid).set(payload);
    const url = location.origin + '/recap#' + rid;
    showRecapDone(url);
  } catch(e) {
    alert('Could not build the recap: ' + (e && e.message ? e.message : e));
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}
function showRecapDone(url){
  let m = el('recapModal');
  if (!m) { m = document.createElement('div'); m.id='recapModal'; m.className='overlay'; m.onclick=e=>{ if(e.target===m) m.style.display='none'; }; document.body.appendChild(m); }
  m.innerHTML = `<div class="card" style="width:min(520px,92vw);">
    <h3>🎁 Recap ready to share</h3>
    <p class="muted" style="font-size:12.5px;line-height:1.6;margin-bottom:10px;">Send this link to everyone who took part. Anyone with the link can view it — no sign-in needed.</p>
    <input id="recapUrl" readonly value="${esc(url)}" style="width:100%;margin-bottom:9px;font-size:12.5px;">
    <div style="display:flex;gap:8px;">
      <button class="btn btn-primary" style="flex:1;" onclick="copyRecap()">📋 Copy link</button>
      <a class="btn btn-ghost" style="flex:1;text-align:center;text-decoration:none;" href="${esc(url)}" target="_blank">Open recap ↗</a>
    </div>
    <button class="btn btn-ghost" style="width:100%;margin-top:9px;" onclick="document.getElementById('recapModal').style.display='none'">Close</button>
  </div>`;
  m.style.display = 'flex';
}
function copyRecap(){
  const i = el('recapUrl'); if(!i) return;
  i.select();
  navigator.clipboard.writeText(i.value).then(()=>{ const b=event.target; const o=b.textContent; b.textContent='✓ Copied'; setTimeout(()=>b.textContent=o,1600); }).catch(()=>{});
}

/* ─── ✨ AI INSIGHTS in the report — themes + mood over a question's free-text answers ── */
async function reportInsights(gi){
  const d=(window._reportIns||{})[gi]; if(!d) return;
  const box=el('ri_'+gi); if(!box) return;
  box.innerHTML='<div class="muted" style="padding:8px 0;">✨ Polly is reading the responses…</div>';
  try{
    const token = (fbAuth && fbAuth.currentUser) ? await fbAuth.currentUser.getIdToken().catch(()=>null) : null;
    const r=await fetch('/api/insights',{ method:'POST',
      headers:Object.assign({'Content-Type':'application/json'}, token?{'Authorization':'Bearer '+token}:{}),
      body:JSON.stringify(d) });
    const j=await r.json().catch(()=>({error:'Bad response from server.'}));
    if(!r.ok||j.error){ box.innerHTML=`<div style="color:#ff6584;font-size:13px;padding:8px 0;">${esc(j.error||('HTTP '+r.status))}</div>`; return; }
    box.innerHTML=renderReportInsights(j);
  }catch(e){ box.innerHTML='<div style="color:#ff6584;font-size:13px;padding:8px 0;">Could not reach the insights service.</div>'; }
}
function renderReportInsights(d){
  const sent=d.sentiment||{positive:0,neutral:0,negative:0};
  const sc={positive:'#43e97b',neutral:'#f7b731',negative:'#ff6584'};
  const bar=`<div style="display:flex;height:9px;border-radius:100px;overflow:hidden;margin:8px 0 4px;background:rgba(255,255,255,.08);">
      <div style="width:${sent.positive}%;background:${sc.positive}"></div><div style="width:${sent.neutral}%;background:${sc.neutral}"></div><div style="width:${sent.negative}%;background:${sc.negative}"></div></div>
    <div style="font-size:11.5px;" class="muted">🟢 ${sent.positive}% positive · 🟡 ${sent.neutral}% neutral · 🔴 ${sent.negative}% negative</div>`;
  const themes=(d.themes||[]).map(t=>`<div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);">
      <span style="font-size:13px;"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${sc[t.sentiment]||sc.neutral};margin-right:7px;"></span><b>${esc(t.label)}</b>${t.example?` <span class="muted" style="font-style:italic;">— “${esc(t.example)}”</span>`:''}</span>
      <b style="color:#8b84ff;">${t.count}</b></div>`).join('') || '<div class="muted" style="font-size:12px;">No clear themes found.</div>';
  return `<div style="border:1px solid rgba(108,99,255,.35);background:rgba(108,99,255,.06);border-radius:10px;padding:13px 15px;margin:6px 0 2px;">
    <div style="font-weight:700;margin-bottom:6px;">✨ AI Insights <span class="muted" style="font-weight:400;font-size:11.5px;">· ${d.count} responses${d.source==='local'?' · private AI':''}</span></div>
    ${d.summary?`<div style="font-size:13.5px;line-height:1.5;margin-bottom:8px;">${esc(d.summary)}</div>`:''}
    ${bar}
    <div style="margin-top:10px;">${themes}</div>
  </div>`;
}
function renderByRespondent(data){
  const people={};
  data.forEach(r=>{ (people[r.pid]=people[r.pid]||{name:r.name,recs:[]}).recs.push(r); });
  return Object.values(people).sort((a,b)=>b.recs.length-a.recs.length).map(p=>{
    const graded=p.recs.filter(r=>r.isCorrect===true||r.isCorrect===false);
    const score=graded.length?Math.round(p.recs.filter(r=>r.isCorrect===true).length/graded.length*100)+'%':'—';
    const rows=p.recs.map(r=>`<tr><td class="muted">${esc(r.presName)}</td><td>Q${r.qIdx+1}: ${esc(String(r.qText).slice(0,40))}</td>
      <td>${esc(answerText(r,r.answer))}</td>
      <td>${r.isCorrect===true?'<span class="pill ok">✓</span>':r.isCorrect===false?'<span class="pill no">✗</span>':'<span class="muted">·</span>'}</td></tr>`).join('');
    return `<div class="card"><h3>${esc(p.name)} <span class="muted" style="font-weight:400;font-size:12px;">· ${p.recs.length} answers · score ${score}</span></h3>
      <table><thead><tr><th>Presentation</th><th>Question</th><th>Answer</th><th>Correct</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join('');
}

/* ─── CSV export of the current filtered view ─────────────────────────────────── */
function exportCSV(){
  const data=filtered(); if(!data.length) return;
  const head=['Presentation','Question #','Question','Type','Respondent','Answer','Correct','Time (ms)','Date','Source'];
  const rows=data.map(r=>[r.presName,'Q'+(r.qIdx+1),r.qText,r.qType,r.name,answerText(r,r.answer),
    r.isCorrect===true?'Yes':r.isCorrect===false?'No':'',r.elapsed||'',r.date?new Date(r.date).toLocaleString():'',r.source]);
  const csv=[head,...rows].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='pollslide-report-'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
}

/* ─── Auth ─────────────────────────────────────────────────────────────────── */
function initFirebase(){
  if (fbDb || typeof firebase==='undefined') return;
  firebase.initializeApp(FB_CONFIG); fbAuth=firebase.auth(); fbDb=firebase.database();
  fbAuth.onAuthStateChanged(u=>{
    userId = u?u.uid:null;
    el('signOutBtn').style.display = u?'':'none';
    el('acct').textContent = u?(u.email||''):'';
    el('authOverlay').style.display = u?'none':'flex';
    if (u){ loadAll(); } else { el('loadingMsg').textContent='Sign in to load your reports.'; }
  });
}
function ppSignIn(){ const e=el('authEmail').value.trim(),p=el('authPass').value; el('authErr').textContent='';
  if(!e||!p){ el('authErr').textContent='Email and password required.'; return; }
  fbAuth.signInWithEmailAndPassword(e,p).catch(x=>{ el('authErr').textContent=x.message; }); }
function ppSignOut(){ if(fbAuth)fbAuth.signOut(); RECORDS=[]; render(); }

function boot(){
  if (window.__REPORT_FIXTURE){ loadAll(); return; }   // harness/demo mode
  initFirebase();
}
document.addEventListener('DOMContentLoaded', boot);
</script>
