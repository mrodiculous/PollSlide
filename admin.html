<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<style>
:root{--bg:#07070f;--bg2:#0d0d18;--surface:#13131f;--surface2:#1a1a2c;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);--accent:#6c63ff;--accent2:#ff6584;--accent3:#43e97b;--accent4:#f7b731;--text:#f4f4fc;--muted:#9090b8;--r:12px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
.hidden{display:none!important;}
a{color:var(--accent);text-decoration:none;}

/* AUTH */
#authGate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000;}
.auth-box{background:var(--surface);border:1px solid var(--border2);border-radius:18px;padding:36px;width:360px;text-align:center;}
.auth-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;margin-bottom:4px;display:flex;align-items:center;justify-content:center;gap:9px;}
.auth-logo-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);}
.auth-badge{font-size:10px;font-weight:700;background:rgba(108,99,255,.2);color:var(--accent);padding:2px 7px;border-radius:100px;}
.auth-box p{color:var(--muted);font-size:13px;margin:6px 0 22px;}
.field{margin-bottom:12px;text-align:left;}
.field label{display:block;font-size:11px;font-weight:600;margin-bottom:4px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.field input{width:100%;padding:10px 12px;background:var(--surface2);border:1px solid var(--border2);border-radius:9px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;}
.field input:focus{border-color:var(--accent);}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:9px;font-family:'Syne',sans-serif;font-weight:700;font-size:12px;border:none;cursor:pointer;transition:opacity .15s;white-space:nowrap;}
.btn:hover{opacity:.85;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-full{width:100%;padding:12px;font-size:14px;}
.btn-sm{padding:5px 11px;font-size:11px;}
.btn-xs{padding:4px 9px;font-size:10px;border-radius:6px;}
.btn-ghost{background:var(--surface2);border:1px solid var(--border2);color:var(--text);}
.btn-green{background:rgba(67,233,123,.15);border:1px solid rgba(67,233,123,.3);color:var(--accent3);}
.btn-amber{background:rgba(247,183,49,.15);border:1px solid rgba(247,183,49,.3);color:var(--accent4);}
.btn-red{background:rgba(255,101,132,.15);border:1px solid rgba(255,101,132,.3);color:var(--accent2);}
.btn-purple{background:rgba(108,99,255,.15);border:1px solid rgba(108,99,255,.3);color:var(--accent);}
.err{color:var(--accent2);font-size:12px;margin-top:8px;}

/* LAYOUT */
#app{display:flex;min-height:100vh;}
.sidebar{width:200px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px 0;}
.s-logo{display:flex;align-items:center;gap:8px;padding:4px 14px 16px;font-family:'Syne',sans-serif;font-weight:800;font-size:15px;}
.s-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);}
.s-badge{font-size:8px;font-weight:700;background:rgba(108,99,255,.2);color:var(--accent);padding:2px 5px;border-radius:100px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--muted);transition:background .1s,color .1s;position:relative;}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.active{background:rgba(108,99,255,.12);color:var(--accent);}
.nav-item svg{width:15px;height:15px;flex-shrink:0;}
.nav-badge{position:absolute;right:12px;background:var(--accent2);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:100px;min-width:16px;text-align:center;}
.nav-sep{height:1px;background:var(--border);margin:6px 0;}
.nav-section{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:8px 14px 4px;}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:54px;border-bottom:1px solid var(--border);flex-shrink:0;gap:12px;}
.topbar-title{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;}
.topbar-right{display:flex;align-items:center;gap:8px;}
#adminEmailDisplay{font-size:11px;color:var(--muted);}
.content{flex:1;overflow-y:auto;padding:18px;}

/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px;}
.stat{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);padding:14px 16px;}
.stat-val{font-family:'Syne',sans-serif;font-weight:800;font-size:26px;line-height:1;}
.stat-label{font-size:11px;color:var(--muted);margin-top:3px;}
.stat-sub{font-size:10px;color:var(--accent3);margin-top:2px;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);overflow:hidden;margin-bottom:14px;}
.card-hd{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.card-hd h2{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;}
.card-hd-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
input[type=email],input[type=text],input[type=search],input[type=password],textarea,select{padding:8px 11px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;}
input:focus,textarea:focus,select:focus{border-color:var(--accent);}
textarea{resize:vertical;min-height:72px;width:100%;}
select{width:100%;}
.search-input{width:190px;}
table{width:100%;border-collapse:collapse;}
th{padding:9px 14px;text-align:left;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);}
td{padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.clickable:hover td{background:rgba(255,255,255,.02);cursor:pointer;}
.pill{display:inline-flex;padding:2px 8px;border-radius:100px;font-size:10px;font-weight:700;}
.pill-free{background:rgba(144,144,184,.15);color:var(--muted);}
.pill-pro{background:rgba(108,99,255,.18);color:var(--accent);}
.pill-team{background:rgba(67,233,123,.14);color:var(--accent3);}
.pill-white{background:rgba(247,183,49,.15);color:var(--accent4);}
.pill-open{background:rgba(255,101,132,.15);color:var(--accent2);}
.pill-resolved{background:rgba(67,233,123,.14);color:var(--accent3);}
.pill-info{background:rgba(108,99,255,.15);color:var(--accent);}
.pill-danger{background:rgba(255,101,132,.15);color:var(--accent2);}
.pill-warn{background:rgba(247,183,49,.14);color:var(--accent4);}
.link-action{color:var(--accent);cursor:pointer;font-size:12px;font-weight:600;}
.link-action:hover{text-decoration:underline;}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}
.loader{text-align:center;padding:32px;color:var(--muted);font-size:13px;}

/* DETAIL PANEL */
#detailPanel{position:fixed;top:0;right:0;width:400px;height:100vh;background:var(--surface);border-left:1px solid var(--border2);z-index:500;overflow-y:auto;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;}
#detailPanel.open{transform:translateX(0);}
.dp-hd{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.dp-hd h2{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;}
.close-x{background:var(--surface2);border:1px solid var(--border2);border-radius:7px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:14px;}
.dp-body{padding:16px;overflow-y:auto;flex:1;}
.dp-sec{margin-bottom:18px;}
.dp-sec h3{font-family:'Syne',sans-serif;font-weight:700;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;}
.dp-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--border);}
.dp-row:last-child{border-bottom:none;}
.dp-row .lbl{color:var(--muted);}
.tier-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.action-col{display:flex;flex-direction:column;gap:6px;}
.note-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;}
.note-text{font-size:12px;line-height:1.5;}
.note-meta{font-size:10px;color:var(--muted);margin-top:3px;}

/* CONFIRM MODAL */
#confirmModal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;}
.confirm-box{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:26px;max-width:360px;width:100%;}
.confirm-box h3{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;margin-bottom:7px;}
.confirm-box p{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:20px;}
.confirm-btns{display:flex;gap:9px;justify-content:flex-end;}

/* QUICK ACTIONS (Legal promises) */
.qa-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px;padding:14px;}
.qa-btn{background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:12px;cursor:pointer;transition:border-color .15s,background .15s;text-align:left;}
.qa-btn:hover{border-color:var(--accent);background:rgba(108,99,255,.08);}
.qa-btn-icon{font-size:18px;margin-bottom:6px;}
.qa-btn-title{font-family:'Syne',sans-serif;font-weight:700;font-size:12px;margin-bottom:2px;line-height:1.3;}
.qa-btn-desc{font-size:11px;color:var(--muted);line-height:1.4;}

/* FLOW BUILDER */
.flow-list{padding:14px;display:flex;flex-direction:column;gap:10px;}
.flow-item{background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.flow-info h4{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;margin-bottom:3px;}
.flow-info p{font-size:12px;color:var(--muted);}
.flow-actions{display:flex;gap:7px;flex-shrink:0;}
.flow-trigger{font-size:10px;font-weight:600;color:var(--accent4);background:rgba(247,183,49,.12);padding:2px 7px;border-radius:100px;margin-top:4px;display:inline-block;}

/* AI QUOTA */
.quota-bar-wrap{margin:5px 0 14px;}
.quota-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
.quota-bar{height:7px;background:var(--surface2);border-radius:100px;overflow:hidden;}
.quota-fill{height:100%;border-radius:100px;transition:width .4s;}

/* TOAST */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:10px 18px;font-size:13px;font-weight:500;transition:transform .25s;z-index:9999;white-space:nowrap;pointer-events:none;}
#toast.show{transform:translateX(-50%) translateY(0);}
#toast.success{border-color:rgba(67,233,123,.4);color:var(--accent3);}
#toast.danger{border-color:rgba(255,101,132,.4);color:var(--accent2);}
#toast.info{border-color:rgba(108,99,255,.4);color:var(--accent);}
</style>

  if(user&&ADMIN_EMAILS.includes(user.email)){
    currentAdminUid=user.uid; currentAdminEmail=user.email;
    document.getElementById('authGate').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('adminEmailDisplay').textContent=user.email;
    await loadAllUsers(); watchOpenTickets(); showPage('dashboard');
  }else if(user){auth.signOut();document.getElementById('authErr').textContent='Not authorised.';}
});

function adminSignIn(){
  const email=document.getElementById('adminEmail').value.trim();
  const pass=document.getElementById('adminPass').value;
  document.getElementById('authErr').textContent='';
  if(!ADMIN_EMAILS.includes(email)){document.getElementById('authErr').textContent='Not authorised.';return;}
  auth.signInWithEmailAndPassword(email,pass).catch(e=>{document.getElementById('authErr').textContent=e.message;});
}
function adminSignOut(){auth.signOut().then(()=>{document.getElementById('authGate').classList.remove('hidden');document.getElementById('app').classList.add('hidden');allUsers={};})}

// ─── LOAD USERS ───────────────────────────────────────────────────────────────
// Reads from BOTH admin/users_index AND users node and merges them.
// This ensures pre-existing accounts (created before index was deployed) still show.
// Also re-indexes any missing users on every load.
async function loadAllUsers(){
  allUsers = {};
  try {
    // Read index (fast, admin-only)
    const idxSnap = await db.ref('admin/users_index').get();
    if (idxSnap.exists()) allUsers = idxSnap.val() || {};
  } catch(e) { console.warn('Index read failed:', e.message); }

  try {
    // Also read users node directly (catches accounts created before index existed)
    const usersSnap = await db.ref('users').get();
    if (usersSnap.exists()) {
      const usersData = usersSnap.val();
      const missing = [];
      Object.entries(usersData).forEach(([uid, u]) => {
        if (!allUsers[uid]) {
          // User exists in DB but not in index — add them
          allUsers[uid] = u;
          missing.push(uid);
        } else {
          // Merge any fields that index might not have (e.g. presentations)
          allUsers[uid] = Object.assign({}, u, allUsers[uid]);
        }
      });

      // Back-fill the index for any missing users (fire-and-forget)
      if (missing.length > 0) {
        const updates = {};
        missing.forEach(uid => { updates['admin/users_index/' + uid] = allUsers[uid]; });
        db.ref('/').update(updates).catch(() => {});
        console.log('Back-filled ' + missing.length + ' user(s) into admin index:', missing);
      }
    }
  } catch(e) {
    console.warn('Users node read failed:', e.message);
    if (!Object.keys(allUsers).length) {
      toast('Could not load users — check Firebase rules.', 'danger');
    }
  }
}

// ─── TIER OVERRIDE ────────────────────────────────────────────────────────────
async function setTier(uid,tier){
  try{
    const prev=allUsers[uid].tier||'free';
    const email=allUsers[uid].email||'';
    await db.ref(`users/${uid}/tier`).set(tier);
    await db.ref(`admin/users_index/${uid}/tier`).set(tier);
    allUsers[uid].tier=tier;
    // Admin tier changes bypass Stripe, so the webhook never emails the user —
    // send the upgrade/downgrade notice ourselves (best-effort).
    let emailed=false;
    if(email && tier!==prev){
      const rank={free:0,pro:1,team_small:2,team_large:3};
      const isDown=(rank[tier]??0)<(rank[prev]??0);
      const nice=(TIER_CONFIG[tier]||{}).name||tier, niceOld=(TIER_CONFIG[prev]||{}).name||prev;
      // The endpoint verifies our token's email is in ADMIN_EMAILS before
      // allowing arbitrary recipients.
      auth.currentUser.getIdToken().then(t=>fetch('/api/send-email',{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},
        body:JSON.stringify(isDown?{type:'downgrade',to:email,data:{oldPlan:niceOld,plan:nice}}
                                  :{type:'upgrade',  to:email,data:{plan:nice}})})).catch(()=>{});
      emailed=true;
    }
    toast('Plan set to '+tier+(emailed?' · user emailed':''),'success');renderDetailBody(uid);renderPage();
  }catch(e){toast('Failed: '+e.message,'danger');}
}

// ─── PASSWORD RESET ───────────────────────────────────────────────────────────
function sendPasswordReset(email){
  if(!email){toast('No email on this account.','danger');return;}
  auth.sendPasswordResetEmail(email).then(()=>toast('Password reset sent to '+email,'success')).catch(e=>toast(e.message,'danger'));
}

// ─── SESSION RESET ────────────────────────────────────────────────────────────
function resetSessions(uid){
  showConfirm('Reset all tallies?','This clears all response data for this user. Questions stay live.',async()=>{
    const pres=allUsers[uid]?.presentations||{};
    await Promise.all(Object.values(pres).filter(p=>p.sessionCode).map(p=>db.ref(`sessions/${p.sessionCode}/responses`).remove()));
    toast('Tallies reset.','success');
  });
}

// ─── AI QUOTA RESET ───────────────────────────────────────────────────────────
async function resetAIQuota(uid){
  // The counter is locked from client writes (tamper-proof), so reset via the admin endpoint.
  try{
    const tok = await auth.currentUser.getIdToken();
    const r = await fetch('/api/admin-quota', { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+tok }, body: JSON.stringify({ uid, action:'reset' }) });
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error || ('HTTP '+r.status));
    if(allUsers[uid]) allUsers[uid].aiUsedThisMonth=0;
    toast('AI quota reset.','success'); renderDetailBody(uid);
  }catch(e){ toast('Reset failed: '+e.message,'danger'); }
}

// ─── FLAG ─────────────────────────────────────────────────────────────────────
async function toggleFlag(uid){
  const isFlagged=allUsers[uid]?.flagged;
  if(isFlagged){
    await db.ref(`admin/flags/${uid}`).remove();
    await db.ref(`admin/users_index/${uid}/flagged`).remove();
    delete allUsers[uid].flagged;toast('Flag removed.','success');
  }else{
    const reason=prompt('Reason for flagging (logged internally):');if(!reason)return;
    await db.ref(`admin/flags/${uid}`).set({reason,flaggedAt:Date.now(),flaggedBy:currentAdminEmail});
    await db.ref(`admin/users_index/${uid}/flagged`).set(true);
    allUsers[uid].flagged=true;toast('Account flagged.','success');
  }
  renderDetailBody(uid);renderPage();
}

// ─── DELETE ACCOUNT ───────────────────────────────────────────────────────────
function confirmDeleteAccount(uid){
  const email=allUsers[uid]?.email||uid;
  showConfirm('Delete account permanently?','Permanently deletes all data for '+email+'. This uses the server-side API to also remove the Firebase Auth user — no manual console step needed.',async()=>{
    toast('Deleting account…','info');
    try {
      // Admin signs in as themselves — get their ID token for API auth
      const adminToken = await auth.currentUser.getIdToken(true);
      const r = await fetch('/api/delete-account', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + adminToken },
        body: JSON.stringify({ uid }),
      });
      const result = await r.json();
      if (result.success || (result.results && result.results.auth)) {
        delete allUsers[uid]; closeDetail();
        toast('Account fully deleted (Auth + database). ✓','success'); renderPage();
      } else {
        const detail = result.errors ? result.errors.join(', ') : JSON.stringify(result);
        toast('Delete failed: ' + detail,'danger');
      }
    } catch(e) {
      // Fallback: delete from database only (Auth entry stays — flag for manual cleanup)
      await db.ref('users/' + uid).remove().catch(()=>{});
      await db.ref('admin/users_index/' + uid).remove().catch(()=>{});
      await db.ref('admin/deleted_accounts/' + uid).set({email,deletedAt:Date.now(),deletedBy:currentAdminEmail,authNotDeleted:true}).catch(()=>{});
      delete allUsers[uid]; closeDetail();
      toast('DB deleted. API unavailable — remove Auth user manually in Firebase console.','info'); renderPage();
    }
  });
}

async function loadNotes(uid){

async function addNote(uid){
  const text=document.getElementById('newNote')?.value?.trim();if(!text)return;
  await db.ref(`admin/notes/${uid}/${Date.now()}`).set({text,at:Date.now(),by:currentAdminEmail});
  document.getElementById('newNote').value='';loadNotes(uid);toast('Note saved.','success');
}

// ─── TICKETS ──────────────────────────────────────────────────────────────────
function watchOpenTickets(){
  // Read all tickets and filter client-side to avoid indexOn requirements
  db.ref('admin/tickets').on('value', snap => {
    openTicketCount = 0;
    if (snap.exists()) {
      Object.values(snap.val()).forEach(t => { if (t.status === 'open' || !t.status) openTicketCount++; });
    }
    const badge = document.getElementById('ticketBadge');
    if (badge) {
      if (openTicketCount > 0) { badge.textContent = openTicketCount; badge.classList.remove('hidden'); }
      else badge.classList.add('hidden');
    }
    if (currentPage === 'tickets' || currentPage === 'dashboard') renderPage();
  });
}
async function renderTickets(){
  document.getElementById('content').innerHTML='<div class="loader">Loading tickets…</div>';
  try{
    // Simple get — filter and sort client-side to avoid Firebase index requirements
    const snap=await db.ref('admin/tickets').get();
    const tickets=snap.exists()?Object.entries(snap.val()).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0)):[];
    const open=tickets.filter(([,t])=>t.status==='open');
    const done=tickets.filter(([,t])=>t.status!=='open');
    document.getElementById('content').innerHTML=`
    <div class="card">
      <div class="card-hd"><h2>Open (${open.length})</h2></div>
      ${open.length?open.map(([id,t])=>`<div style="padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;" onclick="openTicket('${id}')">
        <div style="display:flex;justify-content:space-between;"><span style="font-weight:500;font-size:13px;">${t.subject||'(no subject)'}</span><span class="pill pill-open">open</span></div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px;">${(allUsers[t.uid]||{}).email||t.email||'Unknown'} · ${t.createdAt?timeAgo(t.createdAt):'—'}</div>
      </div>`).join(''):'<div class="empty">No open tickets 🎉</div>'}
    </div>
    <div class="card">
      <div class="card-hd"><h2>Resolved (${done.length})</h2></div>
      ${done.length?done.slice(0,20).map(([id,t])=>`<div style="padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;" onclick="openTicket('${id}')">
        <div style="display:flex;justify-content:space-between;"><span style="font-weight:500;font-size:13px;color:var(--muted);">${t.subject||'(no subject)'}</span><span class="pill pill-resolved">resolved</span></div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px;">${(allUsers[t.uid]||{}).email||'—'}</div>
      </div>`).join(''):'<div class="empty">None resolved yet.</div>'}
    </div>`;
  }catch(e){document.getElementById('content').innerHTML='<div class="empty" style="color:var(--accent2);">Could not load tickets.</div>';}
}
function openTicket(id){
  db.ref(`admin/tickets/${id}`).get().then(snap=>{
    if(!snap.exists())return;const t=snap.val();
    const userEmail=(allUsers[t.uid]||{}).email||t.email||t.uid||'Unknown';
    document.getElementById('dpTitle').textContent=t.subject||'Ticket';
    document.getElementById('dpBody').innerHTML=`
    <div class="dp-sec"><h3>Details</h3>
      <div class="dp-row"><span class="lbl">From</span><span>${userEmail}</span></div>
      <div class="dp-row"><span class="lbl">Status</span><span class="pill ${t.status==='resolved'?'pill-resolved':'pill-open'}">${t.status||'open'}</span></div>
      <div class="dp-row"><span class="lbl">Submitted</span><span>${t.createdAt?new Date(t.createdAt).toLocaleString():'—'}</span></div>

async function replyTicket(ticketId,uid){
  const text=document.getElementById('ticketReply')?.value?.trim();if(!text){toast('Write a reply first.','danger');return;}
  const msgId='msg_'+Date.now();
  const replyTs = Date.now();
  // 1. Log in admin messages
  await db.ref(`admin/messages/${msgId}`).set({uid,text,type:'info',sentAt:replyTs,sentBy:currentAdminEmail,ticketId});
  // 2. Write to user inbox (shows as notification)
  if(uid) await db.ref(`users/${uid}/inbox/${msgId}`).set({text,type:'info',sentAt:replyTs,read:false,ticketId});
  // 3. Write reply to both admin ticket AND user ticket (so Support Chat thread shows it)
  const replyData = {text, at:replyTs, from:'admin', by:currentAdminEmail};
  await db.ref(`admin/tickets/${ticketId}/replies/${replyTs}`).set(replyData);
  if(uid) await db.ref(`users/${uid}/tickets/${ticketId}/replies/${replyTs}`).set(replyData);
  // 4. Mark ticket as replied
  await db.ref(`admin/tickets/${ticketId}/replied`).set(true);
  document.getElementById('ticketReply').value='';toast('Reply sent.','success');
}
async function resolveTicket(id){await db.ref(`admin/tickets/${id}/status`).set('resolved');closeDetail();toast('Resolved.','success');}

async function fireFlow(flowId){
  const f=FLOW_TEMPLATES.find(f=>f.id===flowId);if(!f)return;
  const msg=localStorage.getItem('ps_flow_'+flowId)||f.message;
  const recip=document.getElementById('flowRecip')?.value;if(!recip)return;
  let targets=[];
  if(recip==='__all__')targets=Object.keys(allUsers);
  else if(recip==='__free__')targets=Object.entries(allUsers).filter(([,u])=>!u.tier||u.tier==='free').map(([uid])=>uid);
  else if(recip==='__pro__')targets=Object.entries(allUsers).filter(([,u])=>u.tier==='pro').map(([uid])=>uid);
  else if(recip==='__team__')targets=Object.entries(allUsers).filter(([,u])=>u.tier==='team').map(([uid])=>uid);
  else targets=[recip];
  showConfirm(`Send "${f.title}" to ${targets.length} user${targets.length!==1?'s':''}?`,'This will send a notification in the app.',async()=>{
    for(const uid of targets)await doSendMsg(uid,msg,f.type||'info');
    closeDetail();toast(`Sent to ${targets.length} user${targets.length!==1?'s':''}.`,'success');
  });
}

// Live provider health — calls the secret-free /api/ai-status endpoint.
async function loadAIStatus(){
  const el=document.getElementById('aiStatus'); if(!el) return;
  el.innerHTML='<div class="loader">Checking providers…</div>';
  let s;
  try { const r=await fetch('/api/ai-status'); s=await r.json(); if(!s||!s.text) throw new Error('bad'); }
  catch(e){ el.innerHTML='<p style="color:var(--accent2);font-size:13px;">Could not reach <code>/api/ai-status</code>. Deploy the latest build, then click Refresh.</p>'; return; }
  const pill=(bg,fg,txt)=>`<span style="display:inline-block;padding:2px 9px;border-radius:100px;font-size:11px;font-weight:600;background:${bg};color:${fg};">${txt}</span>`;
  const stat=(p)=>{
    if(!p.configured) return pill('rgba(148,163,184,.15)','#94a3b8','not set');
    if(p.reachable===undefined) return pill('rgba(34,197,94,.15)','#22c55e','configured');
    return p.reachable
      ? pill('rgba(34,197,94,.15)','#22c55e','● awake'+(p.ms?(' '+p.ms+'ms'):''))
      : pill('rgba(239,68,68,.15)','#ef4444','● '+(p.error==='timeout'?'asleep (timeout)':'unreachable'));
  };
  const row=(name,p,desc)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);">
    <div style="min-width:0;"><strong style="color:var(--text);">${name}</strong> <span style="color:var(--muted);font-size:12px;">${desc}${p.model?(' · '+p.model):''}</span>${p.warning?`<div style="color:#ef4444;font-size:11px;margin-top:2px;">⚠️ ${p.warning}</div>`:''}</div>${stat(p)}</div>`;
  const grp=(emoji,title,chain,rows)=>`<div style="margin-bottom:14px;">
    <div style="font-weight:600;color:var(--text);margin-bottom:2px;">${emoji} ${title} <span style="color:var(--muted);font-size:12px;font-weight:400;">(${chain})</span></div>${rows}</div>`;
  el.innerHTML=
    grp('📝','Polly text + live translation','local → OpenAI',
      row('Local LLM (your Mac)',s.text.local,'tries first')+row('OpenAI',s.text.openai,'fallback'))+
    grp('🧠','AI summaries + grading','local → OpenAI',
      row('Local LLM (your Mac)',s.summaries.local,'tries first')+row('OpenAI',s.summaries.openai,'fallback'))+
    grp('🖼️','Question images','local → fal.ai → OpenAI',
      row('Local FLUX (your Mac)',s.images.local,'tries first')+row('fal.ai FLUX',s.images.fal,'cheap cloud')+row('OpenAI gpt-image-1',s.images.openai,'last resort'))+
    `<p style="margin-top:4px;font-size:12px;color:var(--muted);">Cloudflare Access lock: <strong style="color:${s.cfAccess?'#22c55e':'#ef4444'};">${s.cfAccess?'on':'off'}</strong> · checked ${new Date(s.checkedAt).toLocaleTimeString()}</p>`;
}

// Force a full scan of the users node and re-populate the admin index.
// Use this whenever a new account doesn't show up in the admin panel.
async function syncAllUsers() {
  toast('Scanning all Firebase users…', 'info');
  try {
    const snap = await db.ref('users').get();
    if (!snap.exists()) { toast('No users found in database.', 'danger'); return; }
    const updates = {};
    let count = 0;
    Object.entries(snap.val()).forEach(([uid, u]) => {
      updates['admin/users_index/' + uid] = u;
      allUsers[uid] = u;
      count++;
    });
    await db.ref('/').update(updates);
    toast('Synced ' + count + ' user(s) to admin index. ✓', 'success');
    renderPage();
  } catch(e) {
    toast('Sync failed: ' + e.message, 'danger');
  }
}

function renderSecurity(){
  document.getElementById('content').innerHTML=`
  <div class="card"><div class="card-hd"><h2>Security scan</h2><button class="btn btn-sm btn-ghost" onclick="renderSecurity()">▶ Run again</button></div><div id="secBody" style="padding:14px 18px;color:var(--muted);font-size:13px;">Running checks and safe auto-fixes…</div></div>
  <div class="card"><div class="card-hd"><h2>Scan history</h2></div><div id="secLog" style="padding:14px 18px;color:var(--muted);font-size:13px;">Loading…</div></div>`;
  runSecurityScan();loadSecurityLog();
}
async function runSecurityScan(){
  const el=document.getElementById('secBody');
  try{
    const t=await auth.currentUser.getIdToken();
    const r=await fetch('/api/security-status',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t}});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||('HTTP '+r.status));
    const sevPill=s=>`<span class="pill ${s==='high'?'pill-danger':s==='warn'?'pill-pro':'pill-free'}">${s}</span>`;
    el.innerHTML=
      `<div style="margin-bottom:12px;font-weight:600;color:${d.ok?'var(--accent3)':'var(--accent2)'};">${d.ok?'✓ No high-severity issues':'✗ High-severity issues need attention'}</div>`
      +(d.fixed&&d.fixed.length?`<div style="margin-bottom:12px;"><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent3);margin-bottom:6px;">Auto-fixed this run</div>${d.fixed.map(f=>`<div style="font-size:12.5px;padding:4px 0;">🔧 ${esc(f)}</div>`).join('')}</div>`:'<div style="margin-bottom:12px;font-size:12.5px;">Nothing needed auto-fixing this run.</div>')
      +(d.issues&&d.issues.length?`<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px;">Needs a human</div>`+d.issues.map(i=>`<div style="padding:8px 0;border-top:1px solid var(--border);font-size:12.5px;">${sevPill(i.sev)} ${esc(i.what)}<div style="color:var(--muted);margin-top:2px;">→ ${esc(i.fix)}</div></div>`).join(''):'<div style="font-size:12.5px;">No open issues. 🎉</div>');
  }catch(e){el.innerHTML='Scan failed: '+esc(e.message)+'<br><span style="font-size:12px;">The /api/security-status endpoint must be deployed and you must be signed in as an admin.</span>';}
}
async function loadSecurityLog(){
  const el=document.getElementById('secLog');
  try{
    const snap=await db.ref('admin/security_log').orderByKey().limitToLast(20).get();
    const rows=[];snap.forEach(s=>{rows.push(s.val());});rows.reverse();
    if(!rows.length){el.textContent='No previous scans.';return;}
    el.style.padding='0';
    el.innerHTML='<table><thead><tr><th>When</th><th>By</th><th>High</th><th>Warn</th><th>Auto-fixed</th></tr></thead><tbody>'+rows.map(x=>
      `<tr><td>${timeAgo(x.t)}</td><td>${esc(x.by)}</td><td>${x.high||0}</td><td>${x.warn||0}</td><td style="font-size:12px;white-space:normal;">${x.fixed?esc(x.fixed.join(' · ')):'—'}</td></tr>`).join('')+'</tbody></table>';
  }catch(e){el.textContent='Could not read scan history: '+e.message;}
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function timeAgo(ts){const s=Math.floor((Date.now()-ts)/1000);if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';if(s<604800)return Math.floor(s/86400)+'d ago';return new Date(ts).toLocaleDateString();}
let _tt;
function toast(msg,type){const el=document.getElementById('toast');el.textContent=msg;el.className='show '+(type||'');clearTimeout(_tt);_tt=setTimeout(()=>{el.className='';},3400);}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDetail();hideConfirm();}});

async function loadWhiteEnquiriesAlways(){const el=document.getElementById('whiteEnquiries');if(el)await loadWhiteEnquiries();}
</script>
</body>
</html>
